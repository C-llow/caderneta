function verFoto(e, id){
  const x = e.fotos.find(f=>f.id===id); if(!x) return;
  const t = e.tratamentos.find(y=>y.id===x.tratId);
  const q = (e.sessoesFoto||[]).find(y=>y.id===x.sessaoId);
  const etq = etiquetaTexto(e, x);
  const d = document.createElement("div");
  d.className="lightbox";
  const chip = 'background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)';
  d.innerHTML = '<div class="linha" style="justify-content:space-between">'
    + '<span class="pill" style="'+chip+'">'+dataBr(x.data)+'</span>'
    + '<button class="b b-s" data-acao="fechar-foto" style="'+chip+'">Fechar</button></div>'
    /* Foto que ainda não desceu abre com um pixel transparente em vez de um
       ícone de imagem quebrada; imagemComEtiqueta troca assim que ela chega. */
    + '<img src="'+(x.media||x.thumb
        ||"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7")
    + '" alt="'+esc(etq||"Foto do ensaio")+'">'
    + '<div class="lightbox-info">'
    + (t?'<span class="pill" style="'+chip+'">T'+t.num+' — '+esc(t.nome)+(x.bloco?' · Bloco '+esc(x.bloco):'')+'</span>':'')
    + (q?'<span class="pill" style="'+chip+'">'+esc(q.titulo||"Quadro")+'</span>':'')
    + (etq?'<div style="flex-basis:100%;font-size:.95rem;font-family:Calibri,Carlito,'
          + '\'Segoe UI\',Roboto,sans-serif">'+esc(etq)+'</div>':'')
    + (x.link?'<a href="'+esc(x.link)+'" target="_blank" rel="noopener" style="color:#95C061;font-size:.85rem">Abrir arquivo original &#8599;</a>':'')
    + '<button class="b b-s" data-acao="salvar-foto" data-id="'+x.id+'" style="'+chip+'">'
    + '&#11015; Salvar no celular</button>'
    + '<div style="flex-basis:100%;font-size:.76rem;color:#8E9880">A etiqueta sai impressa '
    + 'junto. Segurar a foto também funciona.</div>'
    + (PERSIST.leitura?'':'<button class="b b-s b-perigo" data-acao="del-foto" data-id="'+x.id+'" style="margin-left:auto;background:transparent">Excluir foto</button>')
    + '</div>';
  d.addEventListener("click", ev=>{ if(ev.target===d) d.remove(); });
  document.body.appendChild(d);
  /* Troca pela versão com a etiqueta queimada assim que ela fica pronta: a foto
     limpa aparece na hora e o usuário não espera o canvas para ver o que abriu. */
  const alvo = d.querySelector("img");
  imagemComEtiqueta(e, x).then(u=>{ if(alvo.isConnected) alvo.src = u; }).catch(()=>{});
}

async function exportarPlanilha(e, ids){
  const avs = e.avaliacoes.filter(a=>ids.includes(a.id));
  const cab = ["Tratamento","Bloco"]
    .concat(avs.map(a=>a.nome + (a.unidade ? " ("+a.unidade+")" : "")));
  const linhas = [];
  e.tratamentos.forEach(t=>{
    for(let b=0;b<e.nRep;b++){
      const l = [String(t.num), String.fromCharCode(97+b)];
      avs.forEach(a=>{
        const v = a.dados[t.id+"|"+b];
        // vírgula decimal: é o que o Excel em português entende como número
        l.push(v==null || v==="" ? "" : String(v).replace(".",","));
      });
      linhas.push(l);
    }
  });
  const tudo = [cab].concat(linhas);
  /* ';' e BOM porque é assim que o Excel em português abre o arquivo já em
     colunas; sem o BOM os acentos chegam quebrados. */
  const csv = "﻿" + tudo.map(l=>l.map(c=>
    /[;"\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c).join(";")).join("\r\n");
  const tsv = tudo.map(l=>l.join("\t")).join("\n");
  const nome = (e.nome.replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").toLowerCase()
                || "ensaio")+".csv";
  try{
    const arq = new File([csv], nome, {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq]});
      return;
    }
  }catch(err){ if(err && err.name === "AbortError") return; }
  try{
    // colado no Excel, o TAB já separa as colunas sem passar por importação
    await navigator.clipboard.writeText(tsv);
    toast(linhas.length+" linhas copiadas — cole direto no Excel");
    return;
  }catch(err){}
  abrirModal('<h2>Dados para a planilha</h2>'
    + '<p style="font-size:.85rem;color:var(--muted);margin-bottom:10px">'
    + 'Toque em <b>Selecionar tudo</b>, copie e cole no Excel — as colunas se separam sozinhas.</p>'
    + '<textarea id="txt-export" class="mono" readonly rows="14" style="width:100%;font-size:.75rem;'
    + 'border:1px solid var(--line-2);border-radius:8px;padding:10px">'+esc(tsv)+'</textarea>'
    + '<div class="linha" style="justify-content:flex-end;margin-top:12px">'
    + '<button class="b" data-acao="selecionar-export">Selecionar tudo</button>'
    + '<button class="b b-p" data-acao="fechar">Fechar</button></div>');
}

/* --------- EXPORTAR --------- */
async function exportar(e){
  let txt = "RELATÓRIO DE ENSAIO — "+e.nome+"\n";
  txt += "=".repeat(60)+"\n\n";
  txt += "Cultura: "+e.cultura+"\nCultivar: "+e.cultivar+"\nLocal: "+e.local+"\nSafra: "+e.safra+"\n";
  txt += "Delineamento: "+((DELINS[e.delineamento]||{}).nome||e.delineamento)
       + " — "+e.tratamentos.length+" tratamentos × "+e.nRep+" repetições\n";
  txt += "Comparação de médias: "+((TESTES[e.teste]||TESTES.tukey).nome)
       + " a "+alfaTexto(alfaDe(e))+"\n";
  txt += "Área da parcela: "+(e.areaParcela!=null?fmt(e.areaParcela,2)+" m²":"—")+"\n";
  txt += "Vazão de calda: "+(e.vazao||"—")+"\n";
  txt += "Plantio: "+dataBr(e.dataPlantio)+"\nResponsável: "+e.responsavel+"\n\n";
  txt += "PROTOCOLO\n"+"-".repeat(60)+"\n";
  txt += "Objetivo:\n"+(e.protocolo.objetivo||"—")+"\n\nMetodologia:\n"+(e.protocolo.metodologia||"—")
       + "\n\nObservações:\n"+(e.protocolo.observacoes||"—")+"\n";
  (e.protocolo.anotacoes||[]).forEach(a=>{
    if(!a.titulo && !a.texto) return;
    txt += "\n"+(a.titulo||"Anotação")+":\n"+(a.texto||"—")+"\n";
  });
  txt += "\n";
  const fatExp = ehFatorial(e);
  if(e.fatores.length){
    txt += "ESQUEMA FATORIAL\n"+"-".repeat(60)+"\n";
    e.fatores.forEach(f=>{
      txt += (f.nome||"Fator")+": "+(f.niveis||[]).map(n=>n.nome||"?").join(", ")+"\n";
    });
    if(fatExp) txt += "Arranjo "+fatExp.map(f=>f.niveis.length).join(" × ")
      + " — a análise separa os efeitos principais e a interação.\n";
    txt += "\n";
  }
  if(e.croqui && Object.keys(e.croqui).length){
    txt += "CROQUI DE CAMPO\n"+"-".repeat(60)+"\n";
    txt += "Parcela\t"
         + Array.from({length:e.nRep},(_,b)=>"Bloco "+String.fromCharCode(65+b)).join("\t")+"\n";
    for(let p=e.tratamentos.length-1;p>=0;p--){
      const linha=[];
      for(let b=0;b<e.nRep;b++){
        const v = e.croqui[b+"|"+p];
        linha.push(v ? v+String.fromCharCode(65+b) : "—");
      }
      txt += (p+1)+"\t"+linha.join("\t")+"\n";
    }
    txt += "\n";
  }
  if((e.aplicacoes||[]).length){
    txt += "APLICAÇÕES\n"+"-".repeat(60)+"\n";
    e.aplicacoes.forEach(a=>{
      if(!a.rotulo) return;
      txt += a.rotulo+"\t"+(a.estadio||"—")+"\t"+(a.data?dataBr(a.data):"—")
           + (a.obs?"\t"+a.obs:"")+"\n";
    });
    txt += "\n";
  }
  txt += "PROTOCOLO — TRATAMENTOS\n"+"-".repeat(60)+"\n";
  txt += "Nº\tTratamento\t"+(e.fatores.length?"Fatores\t":"")
       + "Produto\tDose\tUnidade\tAplicação\n";
  e.tratamentos.forEach(t=>{
    const prods = (t.produtos||[]).filter(p=>p.nome||p.dose);
    if(!prods.length){
      txt += t.num+"\t"+t.nome+"\t"+(e.fatores.length?fatorTexto(e,t)+"\t":"")+"—\t—\t—\t—\n";
      return;
    }
    prods.forEach((p,i)=>{
      txt += (i===0 ? t.num+"\t"+t.nome+"\t"+(e.fatores.length?fatorTexto(e,t)+"\t":"")
                    : "\t\t"+(e.fatores.length?"\t":""))
           + (p.nome||"—")+"\t"+(p.dose||"—")+"\t"+(p.unidade||"—")+"\t"+(p.aplicacao||"—")+"\n";
    });
  });

  e.avaliacoes.forEach(av=>{
    txt += "\n\nAVALIAÇÃO: "+av.nome+"\n"+"-".repeat(60)+"\n";
    txt += "Data: "+dataBr(av.data)+(av.dae?" | "+av.dae+" DAE":"")+(av.unidade?" | unidade: "+av.unidade:"")+"\n\n";
    txt += "Dados por parcela:\nTratamento\t"+Array.from({length:e.nRep},(_,i)=>"Bloco "+(i+1)).join("\t")+"\tMédia\n";
    const matriz = matrizDe(e,av);
    e.tratamentos.forEach((t,ti)=>{
      const vals = matriz[ti].filter(v=>v!=null);
      const m = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      txt += t.num+". "+t.nome+"\t"+matriz[ti].map(v=>v==null?"":fmt(v)).join("\t")+"\t"+fmt(m)+"\n";
    });
    const r = anova(matriz, e.tratamentos.length, e.nRep, e.delineamento, ehFatorial(e), e.tratamentos, e.teste, croquiDe(e,av), alfaDe(e), e.controle);
    if(r.ok){
      txt += "\nQuadro da análise de variância:\nFV\tGL\tSQ\tQM\tF\tp-valor\n";
      r.fonte.forEach(f=>{
        txt += f.nome+"\t"+f.gl+"\t"+fmt(f.sq,4)+"\t"+(f.qm!=null?fmt(f.qm,4):"")+"\t"
             + (f.f!=null?fmt(f.f,3):"")+"\t"+(f.p!=null?fmt(f.p,4):"")+"\n";
      });
      const nomeTeste = (TESTES[r.teste]||TESTES.tukey).nome;
      txt += "\nCV (%): "+fmt(r.cv,2)
           + (r.cvA!=null ? " (parcela: "+fmt(r.cvA,2)+")" : "")
           + "\nMédia geral: "+fmt(r.media)+"\n"
           + (r.dms!=null ? "DMS "+nomeTeste+" 5%: "+fmt(r.dms)+"\n" : "")
           + (r.critNome ? r.critNome+": "+fmt(r.critValor,3)+"\n" : "");
      if(r.fatorial){
        const inter = r.fatorial.pInt!=null && r.fatorial.pInt<0.05;
        txt += "\nInteração "+(inter?"SIGNIFICATIVA":"não significativa")
             + " — "+(inter ? "interpretar as combinações, não as médias isoladas de cada fator."
                            : "os fatores podem ser interpretados separadamente.")+"\n";
        r.fatorial.medias.forEach(fm=>{
          txt += "\nMédias de "+fm.fator+" ("+nomeTeste+" "+alfaTexto(r.alfa)
               + (fm.dms!=null ? ", DMS "+fmt(fm.dms) : "")+"):\nNível\tMédia\tGrupo\n";
          fm.linhas.forEach(x=>{ txt += (x.nome||"?")+"\t"+fmt(x.media)+"\t"+(x.letra||"")+"\n"; });
        });
      }
      if(r.dunnett){
        const c = e.tratamentos[r.dunnett.iCtrl];
        txt += "\nTeste de Dunnett ("+alfaTexto(r.alfa)+") — testemunha: "+c.num+". "+c.nome+"\n"
             + "Tratamento\tMédia\tDif. p/ testemunha\tDunnett\n";
        const ordD = TELA.ordem === "media"
          ? r.dunnett.linhas.slice().sort((a,b)=>b.media-a.media)
          : r.dunnett.linhas.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num);
        ordD.forEach(x=>{
          const t = e.tratamentos[x.i], ctrl = x.i===r.dunnett.iCtrl;
          txt += t.num+". "+t.nome+"\t"+fmt(x.media)+"\t"
               + (ctrl ? "—" : (x.dif>0?"+":"")+fmt(x.dif))+"\t"
               + (ctrl ? "(testemunha)" : (x.difere?"*":"ns"))+"\n";
        });
        txt += "\n* difere da testemunha · ns não difere. Dunnett não compara os "
             + "tratamentos entre si.\n";
        if(av.obs) txt += "\nObservações: "+av.obs+"\n";
        return;
      }
      txt += "\nMédias e teste de "+nomeTeste+" ("+alfaTexto(r.alfa)+"):\nTratamento\tMédia\tGrupo\n";
      const ordExp = TELA.ordem === "media"
        ? r.medias.slice().sort((a,b)=>b.media-a.media)
        : r.medias.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num);
      ordExp.forEach(m=>{
        txt += e.tratamentos[m.i].num+". "+e.tratamentos[m.i].nome+"\t"+fmt(m.media)+"\t"+m.letra+"\n";
      });
      txt += "\nMédias seguidas da mesma letra não diferem entre si pelo teste de "
           + nomeTeste+" a "+alfaTexto(r.alfa)+".\n";
    } else {
      txt += "\n[análise não realizada: malha de dados incompleta]\n";
    }
    if(av.obs) txt += "\nObservações: "+av.obs+"\n";
  });
  if(e.fotos.length){
    /* Agrupado por quadro e tratamento — a mesma ordem em que as fotos serão
       montadas na prancha do relatório. A etiqueta vai pronta, como legenda. */
    txt += "\n\nREGISTRO FOTOGRÁFICO ("+e.fotos.length+" fotos)\n"+"-".repeat(60)+"\n";
    const quadros = (e.sessoesFoto||[]).concat([{id:"", titulo:"Sem quadro", data:""}]);
    quadros.forEach(q=>{
      const fs = e.fotos.filter(x=>(x.sessaoId||"")===q.id);
      if(!fs.length) return;
      txt += "\n"+(q.titulo||"Sem título")+(q.data?" — "+dataBr(q.data):"")
           + " ("+fs.length+" foto"+(fs.length===1?"":"s")+")\n";
      const ordem = e.tratamentos.map(t=>t.id).concat([""]);
      ordem.forEach(tid=>{
        const doTrat = fs.filter(x=>(x.tratId||"")===tid
          || (!tid && x.tratId && !e.tratamentos.some(t=>t.id===x.tratId)));
        if(!doTrat.length) return;
        const t = e.tratamentos.find(y=>y.id===tid);
        txt += "  "+(t ? t.num+". "+t.nome : "sem tratamento")+"\n";
        doTrat.forEach((x,i)=>{
          txt += "    "+(i+1)+". "+(etiquetaTexto(e,x)||dataBr(x.data))
               + (x.link?" | "+x.link:"")+(x.soMini?" [só miniatura]":"")+"\n";
        });
      });
    });
  }

  const nomeArq = e.nome.replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").toLowerCase()+".txt";
  let dl = null;
  /* O download de arquivo está desligado de propósito: enquanto o app o oferece,
     a plataforma proíbe compartilhar o link — e a equipe precisa mais do acesso
     do que do .txt. Fica a tentativa: se um dia voltar, o botão volta sozinho. */
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(err){}
  if(dl){
    try{
      await dl.save({filename:nomeArq, data:txt});
      toast("Arquivo gerado"); return;
    }catch(err){ /* recusado ou indisponível: cai para a cópia */ }
  }
  try{
    await navigator.clipboard.writeText(txt);
    toast("Copiado — é só colar no chat com o Claude");
  }catch(err){
    /* Sem área de transferência (acontece em alguns navegadores de celular):
       mostra o texto com um botão que seleciona tudo, porque selecionar à mão
       num campo de 16 linhas no telefone é inviável. */
    abrirModal('<h2>Dados do ensaio</h2><p style="font-size:.85rem;color:var(--muted);margin-bottom:10px">'
      + 'Toque em <b>Selecionar tudo</b> e depois em Copiar.</p>'
      + '<textarea id="txt-export" class="mono" readonly rows="16" style="width:100%;font-size:.75rem;'
      + 'border:1px solid var(--line-2);border-radius:8px;padding:10px">'+esc(txt)+'</textarea>'
      + '<div class="linha" style="justify-content:flex-end;margin-top:12px">'
      + '<button class="b" data-acao="selecionar-export">Selecionar tudo</button>'
      + '<button class="b b-p" data-acao="fechar">Fechar</button></div>');
  }
}

/* ============================ EVENTOS ============================ */
document.addEventListener("click", async ev=>{
  const el = ev.target.closest("[data-acao]");
  if(!el) return;
  const a = el.dataset.acao, id = el.dataset.id, e = exp();

  if(a==="home"){ TELA={nome:"home",expId:null,aba:"protocolo",avId:null}; render(); }
  else if(a==="tela-sync"){ TELA={nome:"sync"}; render(); }
  else if(a==="sincronizar"){ sincronizar(false); }
  else if(a==="backup-dados"){
    if(PERSIST.pend) await salvar();      // o backup leva o que já está gravado
    await fazerBackup(false);
  }
  else if(a==="backup-completo"){
    if(PERSIST.pend) await salvar();
    await fazerBackup(true);
  }
  else if(a==="restaurar"){
    const ent = document.createElement("input");
    ent.type = "file"; ent.accept = ".zip,application/zip";
    ent.addEventListener("change", async ()=>{
      const arq = (ent.files||[])[0];
      if(arq) await restaurarBackup(arq);
    });
    ent.click();
  }
  /* Grava o que estiver pendente antes de recarregar: a atualização troca o
     programa, e não pode levar junto o que ainda não foi para o disco. */
  else if(a==="buscar-atualizacao"){
    if(!navigator.onLine){ toast("Precisa de internet para buscar"); return; }
    if(PERSIST.pend) await salvar();
    toast("Procurando versão nova…");
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }catch(err){}
    location.reload();
  }
  else if(a==="instalar"){
    if(!CONVITE_INSTALAR){ toast("Use o menu do navegador: Instalar app"); return; }
    CONVITE_INSTALAR.prompt();
    const r = await CONVITE_INSTALAR.userChoice.catch(()=>null);
    CONVITE_INSTALAR = null; render();
    if(r && r.outcome === "accepted") toast("Instalado — abra pelo ícone daqui em diante");
  }
  else if(a==="editar-obs"){
    TELA.editObs = id; render();
    const t = document.querySelector('[data-k="obs.'+id+'"]');
    if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
  else if(a==="obs-pronto"){ TELA.editObs = null; render(); }
  else if(a==="marcar-etq"){
    const alvo = ST.experimentos.find(x=>x.id===id);
    if(alvo) modalEtiquetas(alvo);
  }
  else if(a==="editar-etqs"){ modalEditarEtiquetas(); }
  else if(a==="ver-etq"){ TELA.etq = (TELA.etq===id ? "" : id); render(); }
  else if(a==="outro-projeto"){ TELA.outroProjeto = !TELA.outroProjeto; render(); }
  else if(a==="trocar-conta"){ TELA.trocarConta = !TELA.trocarConta; render(); }
  else if(a==="sync-entrar"){
    /* Os campos de endereço e chave só existem quando "outro projeto" está
       aberto; fora disso valem os embutidos. */
    const cu = document.getElementById("sync-url");
    const cc = document.getElementById("sync-chave");
    const url = ((cu && cu.value) || SUPA_URL).trim();
    const chave = ((cc && cc.value) || SUPA_CHAVE).trim();
    const email = (document.getElementById("sync-email").value||"").trim();
    const senha = document.getElementById("sync-senha").value||"";
    if(!email || !senha){ toast("Preencha o e-mail e a senha"); return; }
    if(!url || !chave){ toast("Falta o endereço ou a chave do projeto"); return; }
    if(!navigator.onLine){ toast("Precisa de internet para entrar na primeira vez"); return; }
    el.disabled = true; toast("Entrando…");
    try{
      await syncEntrar(url, chave, email, senha);
      marcarSujo(); await salvar();
      SYNC.erro = null;
      TELA.trocarConta = false; TELA.outroProjeto = false;
      render();
      await sincronizar(false);
    }catch(err){
      SYNC.erro = String((err && err.message) || err).slice(0,140);
      render(); toast(SYNC.erro);
    }
  }
  else if(a==="sync-sair"){
    if(!await confirmar("Desconectar deste aparelho? Os ensaios continuam gravados aqui — "
      + "só param de ir e vir da equipe.", "Desconectar")) return;
    delete ST.sync; SYNC = {rodando:false, quando:null, erro:null};
    marcarSujo(); render();
  }
  else if(a==="abrir-exp"){ TELA={nome:"exp",expId:id,aba:"protocolo",avId:null}; render(); }
  else if(a==="aba"){ TELA.aba=el.dataset.aba; render(); }
  else if(a==="novo-exp"){ modalExperimento(null); }
  else if(a==="editar-exp"){ modalExperimento(e); }
  else if(a==="fechar"){ fecharModal(); }
  else if(a==="selecionar-export"){
    const t = document.getElementById("txt-export");
    if(t){ t.focus(); t.select(); t.setSelectionRange(0, t.value.length); }
  }
  else if(a==="fechar-foto"){ const lb=el.closest(".lightbox"); if(lb) lb.remove(); }
  else if(a==="del-exp"){
    if(await confirmar("Excluir \""+e.nome+"\" e tudo que está dentro dele? Isso não tem volta"
      + (syncPronto() ? " — e o ensaio sai também dos outros aparelhos." : "."))){
      const idExcluido = e.id;
      apagarBytesFotos((e.fotos||[]).map(f=>f.id));
      ST.experimentos = ST.experimentos.filter(x=>x.id!==idExcluido);
      marcarSujo(); fecharModal(); TELA={nome:"home",expId:null,aba:"protocolo",avId:null}; render();
      /* Marca a exclusão no servidor em vez de apagar a linha: sem esse rastro, o
         próximo aparelho a sincronizar traria o ensaio de volta como novidade. */
      if(syncPronto() && navigator.onLine){
        supa("/rest/v1/experimentos", {
          method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
          body: JSON.stringify([{id:idExcluido, dados:{}, removido:true,
                                 atualizado:new Date().toISOString()}])
        }).catch(()=>{ SYNC.erro = "A exclusão ainda não chegou à equipe"; atualizarStatus(); });
      }
    }
  }
  else if(a==="add-trat"){
    const n = e.tratamentos.length+1;
    e.tratamentos.push({id:uid(), num:n, nome:"Tratamento "+n,
      produtos:[{id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}], niveis:{}});
    marcarSujo(); render();
  }
  else if(a==="add-prod"){
    const t = e.tratamentos.find(x=>x.id===id);
    if(t){ t.produtos.push({id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}); marcarSujo(); render(); }
  }
  else if(a==="del-prod"){
    const t = e.tratamentos.find(x=>x.id===id);
    if(t){
      const p = (t.produtos||[]).find(x=>x.id===el.dataset.prod);
      /* Linha em branco sai sem cerimônia: perguntar por algo vazio treina a
         pessoa a confirmar no automático, e aí a pergunta deixa de proteger. */
      const temConteudo = p && (p.nome || p.dose || p.unidade);
      if(temConteudo && !await confirmar(
          "Excluir o produto “"+(p.nome||"sem nome")+"” do tratamento "+(t.num||"")+"?")) return;
      t.produtos = t.produtos.filter(p=>p.id!==el.dataset.prod);
      if(!t.produtos.length) t.produtos.push({id:uid(), nome:"", dose:"", unidade:"", aplicacao:""});
      marcarSujo(); render();
    }
  }
  else if(a==="add-fator"){
    const L = String.fromCharCode(65+e.fatores.length);
    e.fatores.push({id:uid(), nome:"Fator "+L,
      niveis:[{id:uid(), nome:""},{id:uid(), nome:""}]});
    marcarSujo(); render();
  }
  else if(a==="del-fator"){
    if(!await confirmar("Remover este fator? Os níveis marcados nos tratamentos são perdidos.")) return;
    e.fatores = e.fatores.filter(f=>f.id!==id);
    e.tratamentos.forEach(t=>{ delete t.niveis[id]; });
    marcarSujo(); render();
  }
  else if(a==="add-nivel"){
    const f = e.fatores.find(x=>x.id===id);
    if(f){ f.niveis.push({id:uid(), nome:""}); marcarSujo(); render(); }
  }
  else if(a==="del-nivel"){
    const f = e.fatores.find(x=>x.id===id);
    if(f){
      const nv = el.dataset.nivel;
      const nivel = (f.niveis||[]).find(n=>n.id===nv);
      /* Apagar um nível desmonta as combinações que o usam — por isso a
         pergunta diz de quantos tratamentos ele sai, e não só "tem certeza?". */
      const usos = e.tratamentos.filter(t=>t.niveis && t.niveis[id]===nv).length;
      if((nivel && nivel.nome || usos) && !await confirmar(
          "Excluir o nível “"+((nivel&&nivel.nome)||"sem nome")+"” de "+esc(f.nome)+"?"
          + (usos ? " Ele sai de "+usos+" tratamento(s)." : ""))) return;
      f.niveis = f.niveis.filter(n=>n.id!==nv);
      e.tratamentos.forEach(t=>{ if(t.niveis[id]===nv) delete t.niveis[id]; });
      marcarSujo(); render();
    }
  }
  else if(a==="gerar-trat"){
    const f = e.fatores.filter(x=>(x.niveis||[]).length>=2);
    const combos = f.reduce((a,x)=>a*x.niveis.length, 1);
    if(!await confirmar("Substituir os "+e.tratamentos.length+" tratamentos atuais pelas "+combos
      + " combinações dos fatores? Os dados já lançados nas avaliações são apagados.")) return;
    let lista = [{}];
    f.forEach(x=>{
      const nova = [];
      lista.forEach(c=>x.niveis.forEach(nv=>{ const o={...c}; o[x.id]=nv.id; nova.push(o); }));
      lista = nova;
    });
    e.tratamentos = lista.map((niveis,i)=>({
      id:uid(), num:i+1, niveis,
      nome: f.map(x=>(x.niveis.find(n=>n.id===niveis[x.id])||{}).nome||"?").join(" × "),
      produtos:[{id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}]
    }));
    e.avaliacoes.forEach(av=>{ av.dados = {}; });
    marcarSujo(); render(); toast(combos+" tratamentos gerados");
  }
  else if(a==="sortear-croqui" || a==="sequencial-croqui"){
    if(!e.tratamentos.length){ toast("Cadastre os tratamentos primeiro"); return; }
    if(e.croqui && Object.keys(e.croqui).length
       && !await confirmar("Substituir o croqui atual?", "Substituir")) return;
    const nums = e.tratamentos.map(t=>String(t.num));
    e.croqui = {};
    for(let b=0;b<e.nRep;b++){
      const ordem = nums.slice();
      if(a==="sortear-croqui"){                       // Fisher-Yates dentro do bloco
        for(let i=ordem.length-1;i>0;i--){
          const j = Math.floor(Math.random()*(i+1));
          [ordem[i],ordem[j]] = [ordem[j],ordem[i]];
        }
      }
      ordem.forEach((v,p)=>{ e.croqui[b+"|"+p] = v; });
    }
    marcarSujo(); render();
    toast(a==="sortear-croqui" ? "Croqui sorteado por bloco" : "Croqui em ordem");
  }
  else if(a==="salvar-modelo"){
    if(!e.croqui || !Object.keys(e.croqui).length){ toast("Preencha o croqui primeiro"); return; }
    const nome = await pedirTexto("Salvar modelo de croqui",
      "Um nome que você reconheça depois — por exemplo \"10T escadinha\".",
      "Nome do modelo", e.tratamentos.length+"T × "+e.nRep+" blocos");
    if(nome==null || !nome.trim()) return;
    ST.modelos.push({id:uid(), nome:nome.trim(), nT:e.tratamentos.length, nRep:e.nRep,
                     croqui:JSON.parse(JSON.stringify(e.croqui))});
    marcarGerais(); render(); toast("Modelo salvo");
  }
  else if(a==="usar-modelo"){
    const m = (ST.modelos||[]).find(x=>x.id===id); if(!m) return;
    if(m.nT!==e.tratamentos.length || m.nRep!==e.nRep){
      toast("Este modelo é de "+m.nT+"T × "+m.nRep+" blocos"); return;
    }
    if(e.croqui && Object.keys(e.croqui).length
       && !await confirmar("Substituir o croqui atual pelo modelo \""+esc(m.nome)+"\"?", "Substituir")) return;
    e.croqui = JSON.parse(JSON.stringify(m.croqui));
    marcarSujo(); render(); toast("Modelo aplicado");
  }
  else if(a==="del-modelo"){
    const m = (ST.modelos||[]).find(x=>x.id===id); if(!m) return;
    if(!await confirmar("Apagar o modelo \""+esc(m.nome)+"\"? Os croquis já aplicados continuam.",
      "Apagar modelo")) return;
    ST.modelos = ST.modelos.filter(x=>x.id!==id); marcarGerais(); render();
  }
  else if(a==="novo-grupo"){
    const nome = await pedirTexto("Novo grupo",
      "Uma pasta para organizar os ensaios — safra, cliente, cultura, local.",
      "Nome do grupo", "Safra 25/26");
    if(nome==null || !nome.trim()) return;
    const g = {id:uid(), nome:nome.trim()};
    ST.grupos.push(g); TELA.grupo = g.id; marcarGerais(); render(); toast("Grupo criado");
  }
  else if(a==="ver-grupo"){ TELA.grupo = id; TELA.busca=""; render(); }
  else if(a==="del-grupo"){
    const g = ST.grupos.find(x=>x.id===id); if(!g) return;
    const n = ST.experimentos.filter(x=>x.grupoId===id).length;
    if(!await confirmar("Apagar o grupo <b>"+esc(g.nome)+"</b>?"
      + (n ? " Os "+n+" ensaios dele <b>não</b> são apagados — ficam sem grupo." : ""),
      "Apagar grupo")) return;
    ST.grupos = ST.grupos.filter(x=>x.id!==id);
    ST.experimentos.forEach(x=>{ if(x.grupoId===id) x.grupoId=""; });
    if(TELA.grupo===id) TELA.grupo="";
    marcarGerais(); render();
  }
  else if(a==="limpar-busca"){ TELA.busca=""; render(); }
  else if(a==="set-esquema"){
    const modo = el.dataset.modo;
    if(modo === e.esquema) return;
    if(modo==="simples" && e.fatores.length){
      if(!await confirmar("Voltar para tratamentos simples? Os <b>"+e.fatores.length+"</b> fator(es) "
        + "e os níveis marcados nos tratamentos são apagados. Os tratamentos, as avaliações e os "
        + "dados continuam como estão.", "Voltar para simples")) return;
      e.fatores.forEach(f=>{ e.tratamentos.forEach(t=>{ delete t.niveis[f.id]; }); });
      e.fatores = [];
    }
    /* Entrar em fatorial sem nenhum fator deixaria a seção vazia; o primeiro já
       vem pronto com dois níveis, que é o mínimo de um fator. */
    if(modo==="fatorial" && !e.fatores.length){
      e.fatores.push({id:uid(), nome:"Fator A",
        niveis:[{id:uid(), nome:""},{id:uid(), nome:""}]});
    }
    e.esquema = modo; marcarSujo(); render();
  }
  else if(a==="travar-aplic"){
    if(!e.aplicacoes.length){ toast("Escreva ao menos uma aplicação"); return; }
    const sem = e.aplicacoes.filter(x=>!x.estadio || !x.estadio.trim()).length;
    if(sem && !await confirmar("<b>"+sem+"</b> aplicação(ões) sem estádio. Salvar assim mesmo?",
      "Salvar assim")) return;
    e.aplicTravado = true; marcarSujo(); render(); toast("Aplicações salvas");
  }
  else if(a==="destravar-aplic"){
    if(!await confirmar("Liberar as aplicações para edição? Um toque acidental pode alterar "
      + "o estádio de uma aplicação já conferida.", "Liberar edição")) return;
    e.aplicTravado = false; marcarSujo(); render();
  }
  else if(a==="add-aplicacao"){
    const usados = (e.aplicacoes||[]).map(x=>x.rotulo);
    let L = "A";
    for(let i=0;i<26;i++){ const c=String.fromCharCode(65+i); if(!usados.includes(c)){ L=c; break; } }
    const nova = {id:uid(), rotulo:L, estadio:"", data:"", obs:""};
    e.aplicacoes.push(nova);
    marcarSujo(); render();
    // cursor já no estádio da aplicação recém-criada: é o campo que se vai preencher
    const campo = document.querySelector('[data-campo="'+CSS.escape("aplic."+nova.id+".estadio")+'"]');
    if(campo) campo.focus();
  }
  else if(a==="del-aplicacao"){
    const ap = e.aplicacoes.find(x=>x.id===id); if(!ap) return;
    const usando = e.tratamentos.filter(t=>(t.produtos||[])
      .some(p=>p.aplicacao && p.aplicacao.includes(ap.rotulo))).length;
    if(!await confirmar("Remover a aplicação <b>"+esc(ap.rotulo)+"</b>?"
      + (usando ? " Ela está marcada em "+usando+" tratamento(s) — a marca continua lá, "
                + "mas fica sem estádio definido." : ""), "Remover")) return;
    e.aplicacoes = e.aplicacoes.filter(x=>x.id!==id);
    marcarSujo(); render();
  }
  else if(a==="travar-croqui"){
    const c = conferirCroqui(e);
    if(c.vazio){ toast("Preencha o croqui primeiro"); return; }
    if(c.aviso && !await confirmar("O croqui tem pendências:<br><br>"+c.aviso
      + "<br><br>Salvar assim mesmo?", "Salvar assim")) return;
    e.croquiTravado = true; marcarSujo(); render(); toast("Croqui salvo");
  }
  else if(a==="destravar-croqui"){
    if(!await confirmar("Liberar o croqui para edição?", "Liberar edição")) return;
    e.croquiTravado = false; marcarSujo(); render();
  }
  else if(a==="travar-av"){
    const av = e.avaliacoes.find(x=>x.id===id); if(!av) return;
    const m = matrizDe(e,av);
    let faltam = 0; m.forEach(l=>l.forEach(v=>{ if(v==null) faltam++; }));
    if(faltam && !await confirmar("Faltam <b>"+faltam+"</b> parcelas nesta avaliação. "
      + "Salvar assim mesmo? A análise só roda com a malha completa.", "Salvar assim")) return;
    av.travada = true; marcarSujo(); render(); toast("Avaliação salva");
  }
  else if(a==="destravar-av"){
    const av = e.avaliacoes.find(x=>x.id===id); if(!av) return;
    if(!await confirmar("Liberar esta avaliação para edição? Um toque acidental pode "
      + "alterar um dado já conferido.", "Liberar edição")) return;
    av.travada = false; marcarSujo(); render();
  }
  else if(a==="travar-trat"){
    const faltando = e.tratamentos.filter(t=>!t.nome || !t.nome.trim()).length;
    if(faltando){ toast(faltando+" tratamento(s) sem descrição"); return; }
    e.travado = true; marcarSujo(); render(); toast("Tratamentos salvos");
  }
  else if(a==="destravar-trat"){
    if(!await confirmar("Liberar a tabela para edição? Um toque acidental pode alterar "
      + "uma informação do protocolo.", "Liberar edição")) return;
    e.travado = false; marcarSujo(); render();
  }
  else if(a==="limpar-croqui"){
    if(!await confirmar("Apagar o croqui de campo? Os dados das avaliações não são afetados.",
      "Apagar croqui")) return;
    delete e.croqui; marcarSujo(); render();
  }
  else if(a==="add-nota"){
    e.protocolo.anotacoes.push({id:uid(), titulo:"", texto:""});
    marcarSujo(); render();
  }
  else if(a==="del-nota"){
    if(!await confirmar("Remover esta anotação?")) return;
    e.protocolo.anotacoes = e.protocolo.anotacoes.filter(x=>x.id!==id);
    marcarSujo(); render();
  }
  else if(a==="del-trat"){
    if(!await confirmar("Remover este tratamento? Os dados lançados para ele em todas as avaliações também saem.")) return;
    e.tratamentos = e.tratamentos.filter(t=>t.id!==id);
    e.tratamentos.forEach((t,i)=>t.num=i+1);
    e.avaliacoes.forEach(av=>{ Object.keys(av.dados).forEach(k=>{ if(k.indexOf(id+"|")===0) delete av.dados[k]; }); });
    marcarSujo(); render();
  }
  else if(a==="nova-av"){ modalAvaliacao(e); }
  else if(a==="sel-av"){ TELA.avId=id; render(); }
  else if(a==="del-av"){
    const av = e.avaliacoes.find(x=>x.id===id);
    if(!await confirmar("Excluir a avaliação \""+av.nome+"\" e seus dados?")) return;
    e.avaliacoes = e.avaliacoes.filter(x=>x.id!==id); TELA.avId=null; marcarSujo(); render();
  }
  else if(a==="novo-quadro"){
    const titulo = await pedirTexto("Novo quadro de fotos",
      "O nome da avaliação que você vai fotografar hoje.",
      "Título", "Avaliação de altura — 45 DAE");
    if(titulo==null || !titulo.trim()) return;
    const q = {id:uid(), titulo:titulo.trim(), data:hoje(), criado:hoje()};
    e.sessoesFoto.push(q); TELA.quadro = q.id;
    marcarSujo(); render(); toast("Quadro criado");
  }
  else if(a==="abrir-quadro"){ TELA.quadro = id; TELA.filtro = {}; TELA.tratAberto = null; render(); }
  else if(a==="abrir-trat"){ TELA.tratAberto = TELA.tratAberto===id ? null : id; TELA.etiqueta = null; render(); }
  else if(a==="voltar-quadros"){ TELA.quadro = null; TELA.etiqueta = null; render(); }
  else if(a==="del-quadro"){
    const q = e.sessoesFoto.find(x=>x.id===id); if(!q) return;
    const n = e.fotos.filter(f=>f.sessaoId===id).length;
    if(!await confirmar("Excluir o quadro <b>"+esc(q.titulo||"sem título")+"</b>?"
      + (n ? " As <b>"+n+"</b> fotos dele também saem — isso não tem volta."
           : " Ele está vazio."), "Excluir quadro")) return;
    e.sessoesFoto = e.sessoesFoto.filter(x=>x.id!==id);
    apagarBytesFotos(e.fotos.filter(f=>f.sessaoId===id).map(f=>f.id));
    e.fotos = e.fotos.filter(f=>f.sessaoId!==id);
    if(TELA.quadro===id) TELA.quadro = null;
    marcarSujo(); render();
  }
  /* Toca no tratamento e a câmera abre já sabendo onde a foto vai cair — é o
     que evita etiquetar depois, de memória, com a parcela já para trás. */
  else if(a==="foto-trat" || a==="galeria-trat"){
    const alvoTrat = id==="__extra" ? "" : id;
    /* Oito é o que cabe numa prancha de relatório sem virar álbum, e é o teto que
       mantém a safra inteira dentro do espaço do app. */
    const jaTem = e.fotos.filter(f=>f.sessaoId===TELA.quadro
      && (f.tratId||"")===alvoTrat).length;
    if(jaTem >= FOTOS_POR_TRAT){
      toast("Já são "+FOTOS_POR_TRAT+" fotos aqui — apague uma antes");
      return;
    }
    FOTO_ALVO = {quadroId: TELA.quadro, tratId: alvoTrat};
    CAMERA_ABERTA = true;     // vale para as duas: o app sai de vista nos dois casos
    document.getElementById(a==="galeria-trat" ? "entrada-galeria" : "entrada-foto").click();
  }
  else if(a==="editar-etiqueta"){ TELA.etiqueta = TELA.etiqueta===id ? null : id; render(); }
  else if(a==="etiq-parte"){
    const f = e.fotos.find(x=>x.id===id); if(!f) return;
    if(!f.etiq) f.etiq = {};
    const parte = el.dataset.parte;
    f.etiq[parte] = !f.etiq[parte];
    marcarSujo(); render();
  }
  else if(a==="ver-foto"){ verFoto(e,id); }
  else if(a==="salvar-foto"){
    const f = e.fotos.find(x=>x.id===id);
    if(f) salvarNoCelular(e, f);
  }
  else if(a==="del-foto"){
    if(!await confirmar("Excluir esta foto?")) return;
    const morta = e.fotos.find(f=>f.id===id);
    if(morta && morta.remota) enfileirarExclusaoFoto(e.id, morta.id);
    e.fotos = e.fotos.filter(f=>f.id!==id);
    apagarBytesFotos([id]);
    const lb=el.closest(".lightbox"); if(lb) lb.remove();
    marcarSujo(); render();
  }
  else if(a==="limpar-filtro"){ TELA.filtro={}; render(); }
  else if(a==="exportar"){ exportar(e); }
  else if(a==="exportar-planilha"){ modalPlanilha(e); }
  else if(a==="liberar"){
    if(!await confirmar("Descartar a versão ampliada das fotos? As miniaturas, as etiquetas e os links "
      + "do arquivo original continuam. Isso não tem volta.")) return;
    const n = await liberarEspaco(); render(); toast(n+" foto"+(n===1?"":"s")+" reduzida"+(n===1?"":"s"));
  }
});

document.addEventListener("change", ev=>{
  const el = ev.target;
  if(el.dataset.acao==="filtro"){
    TELA.filtro = TELA.filtro||{};
    TELA.filtro[el.dataset.campo] = el.value;
    render(); return;
  }
  if(el.dataset.acao==="set-teste"){
    const e = exp(); if(!e) return;
    e.teste = el.value; marcarSujo(); render(); return;
  }
  if(el.dataset.acao==="set-alfa"){
    const e = exp(); if(!e) return;
    e.alfa = Number(el.value); marcarSujo(); render(); return;
  }
  if(el.dataset.acao==="set-controle"){
    const e = exp(); if(!e) return;
    e.controle = Number(el.value); marcarSujo(); render(); return;
  }
  if(el.dataset.acao==="set-ordem"){ TELA.ordem = el.value; render(); return; }
  if(el.dataset.acao==="set-coluna"){
    const e = exp(); if(!e) return;
    const av = e.avaliacoes.find(x=>x.id===el.dataset.av); if(!av) return;
    if(!av.croqui) av.croqui = {};
    if(el.value === "") delete av.croqui[el.dataset.k]; else av.croqui[el.dataset.k] = el.value;
    marcarSujo(); render(); return;
  }
  if(el.dataset.acao==="mover-grupo"){
    const ex = ST.experimentos.find(x=>x.id===el.dataset.id);
    if(ex){
      ex.grupoId = el.value;
      const g = ST.grupos.find(x=>x.id===el.value);
      marcarSujo(); render();
      toast(g ? "Movido para "+g.nome : "Removido do grupo");
    }
    return;
  }
  if(el.dataset.acao==="set-aplicacao"){
    const e = exp(); if(!e) return;
    const t = e.tratamentos.find(x=>x.id===el.dataset.id);
    const p = t && (t.produtos||[]).find(x=>x.id===el.dataset.prod);
    if(p){ p.aplicacao = el.value; marcarSujo(); }
    return;
  }
  if(el.dataset.acao==="set-unidade"){
    const e = exp(); if(!e) return;
    const t = e.tratamentos.find(x=>x.id===el.dataset.id);
    const p = t && (t.produtos||[]).find(x=>x.id===el.dataset.prod);
    if(!p) return;
    const todos = e.tratamentos.reduce((a,x)=>a.concat(x.produtos||[]), []);
    /* Um ensaio quase sempre corre inteiro na mesma unidade. Na PRIMEIRA que
       você escolher, ela se repete nos demais produtos e poupa a digitação.
       Depois disso, mexer numa muda só aquela: se outra já tem unidade, quem
       escolheu foi você, e sobrescrever seria apagar decisão sua. */
    const primeira = el.value && todos.every(x => x === p || !x.unidade);
    p.unidade = el.value;
    let repetidas = 0;
    if(primeira) todos.forEach(x=>{ if(x !== p && !x.unidade){ x.unidade = el.value; repetidas++; } });
    marcarSujo();
    if(repetidas){
      render();
      toast(el.value+" aplicada aos "+(repetidas+1)+" produtos — dá para mudar qualquer uma");
    }
    return;
  }
  if(el.dataset.acao==="set-nivel"){
    const e = exp(); if(!e) return;
    const t = e.tratamentos.find(x=>x.id===el.dataset.id);
    if(t){
      if(el.value) t.niveis[el.dataset.fator] = el.value;
      else delete t.niveis[el.dataset.fator];
      marcarSujo(); render();
    }
  }
});

document.addEventListener("input", ev=>{
  const el = ev.target, campo = el.dataset.campo;
  if(!campo) return;
  if(campo === "busca"){                       // filtro da tela inicial, não é dado do ensaio
    TELA.busca = el.value;
    const pos = el.selectionStart;
    render();
    const novo = document.querySelector('[data-campo="busca"]');
    if(novo){ novo.focus(); try{ novo.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  const e = exp(); if(!e) return;
  const p = campo.split(".");
  if(p[0]==="protocolo"){ e.protocolo[p[1]] = el.value; }
  else if(p[0]==="trat"){
    const t = e.tratamentos.find(x=>x.id===p[1]); if(t) t[p[2]] = el.value;
  }
  else if(p[0]==="prod"){
    const t = e.tratamentos.find(x=>x.id===p[1]);
    const pr = t && t.produtos.find(x=>x.id===p[2]);
    if(pr) pr[p[3]] = el.value;
  }
  else if(p[0]==="fator"){
    const f = e.fatores.find(x=>x.id===p[1]); if(f) f.nome = el.value;
  }
  else if(p[0]==="nivel"){
    const f = e.fatores.find(x=>x.id===p[1]);
    const nv = f && f.niveis.find(x=>x.id===p[2]);
    if(nv) nv.nome = el.value;
  }
  else if(p[0]==="nota"){
    const a = e.protocolo.anotacoes.find(x=>x.id===p[1]); if(a) a[p[2]] = el.value;
  }
  else if(p[0]==="aplic"){
    const ap = e.aplicacoes.find(x=>x.id===p[1]);
    if(ap) ap[p[2]] = el.value;
  }
  else if(p[0]==="quadro"){
    const q = e.sessoesFoto.find(x=>x.id===p[1]); if(q) q[p[2]] = el.value;
  }
  else if(p[0]==="foto"){
    const f = e.fotos.find(x=>x.id===p[1]); if(f) f[p[2]] = el.value;
  }
  else if(p[0]==="etiq"){
    const f = e.fotos.find(x=>x.id===p[1]);
    if(f){
      if(!f.etiq) f.etiq = {};
      f.etiq[p[2]] = el.value;
      // a etiqueta acima do campo acompanha a digitação, sem redesenhar a grade
      const cartao = el.closest(".foto-cartao");
      const alvo = cartao && cartao.querySelector(".foto-etiq");
      if(alvo) alvo.textContent = etiquetaTexto(e, f) || "sem etiqueta";
    }
  }
  else if(p[0]==="croq"){
    if(!e.croqui) e.croqui = {};
    const k = campo.slice(5);
    if(el.value==="") delete e.croqui[k]; else e.croqui[k] = el.value.trim();
    // recolore a célula na hora, sem redesenhar a tabela inteira
    const ok = e.tratamentos.some(t=>String(t.num)===el.value.trim());
    el.style.color = (el.value && !ok) ? "var(--erro)" : "";
    el.style.fontWeight = (el.value && !ok) ? "600" : "";
  }
  else if(p[0]==="dado"){
    const av = e.avaliacoes.find(x=>x.id===p[1]); if(!av) return;
    const k = campo.slice(("dado."+p[1]+".").length);
    if(el.value==="") delete av.dados[k]; else av.dados[k] = el.value;
    const tr = el.closest("tr");                       // média da linha, sem redesenhar a malha
    if(tr){
      const vals = [...tr.querySelectorAll("input")].map(i=>num(i.value)).filter(v=>v!=null);
      const cel = tr.querySelector("td.media");
      if(cel) cel.textContent = vals.length ? fmt(vals.reduce((a,b)=>a+b,0)/vals.length) : "—";
    }
  }
  else if(p[0]==="obs"){
    const av = e.avaliacoes.find(x=>x.id===p[1]); if(av) av.obs = el.value;
  }
  marcarSujo();
});

// navegação por teclado na malha de dados
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"){ fecharModal(); const lb=document.querySelector(".lightbox"); if(lb) lb.remove(); return; }
  // o cartão do ensaio é uma div com role=button: Enter/Espaço precisam abri-lo
  if((ev.key==="Enter" || ev.key===" ") && ev.target.classList
     && (ev.target.classList.contains("exp-abrir") || ev.target.classList.contains("trat-abrir"))){
    ev.preventDefault(); ev.target.click(); return;
  }
  const el = ev.target;
  if(!el.dataset || !el.dataset.campo || el.dataset.campo.indexOf("dado.")!==0) return;
  const td = el.closest("td"), tr = el.closest("tr");
  let alvo = null;
  if(ev.key==="Enter" || ev.key==="ArrowDown"){
    const i = [...tr.parentNode.children].indexOf(tr), c = [...tr.children].indexOf(td);
    const prox = tr.parentNode.children[i+1];
    if(prox && prox.children[c]) alvo = prox.children[c].querySelector("input");
  } else if(ev.key==="ArrowUp"){
    const i = [...tr.parentNode.children].indexOf(tr), c = [...tr.children].indexOf(td);
    const ant = tr.parentNode.children[i-1];
    if(ant && ant.children[c]) alvo = ant.children[c].querySelector("input");
  }
  if(alvo){ ev.preventDefault(); alvo.focus(); alvo.select(); }
});

// captura de foto
const entrada = document.createElement("input");
/* `capture` abre a câmera direto, sem passar por seletor.
   Já esteve fora daqui: no Chrome, sem `capture` o Android pergunta a origem e
   quem fotografa é o app de câmera de verdade, que grava a foto no telefone.
   Só que dentro do APK (WebView) essa pergunta não existe — o sistema vai
   direto ao seletor de arquivos, e o botão da câmera acabava abrindo a galeria.
   Entre "abre a câmera" e "grava na galeria sozinho", o primeiro é o que serve
   no campo; para o segundo há o botão "Salvar no celular" em cada foto, que
   ainda por cima salva com a etiqueta impressa. */
entrada.type="file"; entrada.accept="image/*";
/* setAttribute, e não `entrada.capture = ...`: a propriedade só existe onde o
   navegador implementa a captura de mídia, então no desktop a atribuição é
   engolida em silêncio e o atributo nunca chega ao HTML — que é justamente o
   que o Android lê. */
entrada.setAttribute("capture", "environment");
entrada.id="entrada-foto"; entrada.className="sr";
document.body.appendChild(entrada);
/* A câmera pode ser cancelada sem produzir arquivo — aí nenhum "change" chega.
   Destravar o salvamento pouco depois de a página voltar cobre esse caso sem
   depender de um evento que talvez nunca venha. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && CAMERA_ABERTA){
    setTimeout(()=>{ CAMERA_ABERTA = false; }, 4000);
  }
});
/* Segunda entrada, só para a galeria: `multiple` porque escolher da galeria é
   quase sempre escolher várias de uma vez — quem já fotografou pelo app da
   câmera volta aqui e traz o lote inteiro da parcela. */
const galeria = document.createElement("input");
galeria.type="file"; galeria.accept="image/*"; galeria.multiple=true;
galeria.id="entrada-galeria"; galeria.className="sr";
document.body.appendChild(galeria);

entrada.addEventListener("change", ()=>{
  const lista = [...(entrada.files||[])]; entrada.value="";
  guardarFotos(lista);
});
galeria.addEventListener("change", ()=>{
  const lista = [...(galeria.files||[])]; galeria.value="";
  guardarFotos(lista);
});

async function guardarFotos(arquivos){
  if(!arquivos.length){ limparAlvoFoto(); return; }
  const e = exp(); if(!e){ limparAlvoFoto(); return; }
  /* Veio de um tratamento dentro de um quadro: não há o que perguntar — a foto
     já sabe onde mora, e a etiqueta se monta sozinha. Editar vem depois, com a
     foto na tela, e não de pé no meio da lavoura. */
  if(!FOTO_ALVO){
    limparAlvoFoto();
    toast("Abra um quadro e toque no tratamento para fotografar");
    return;
  }
  const alvo = FOTO_ALVO;
  const q = e.sessoesFoto.find(x=>x.id===alvo.quadroId);
  const t = e.tratamentos.find(x=>x.id===alvo.tratId);
  const cabem = FOTOS_POR_TRAT - e.fotos.filter(f=>f.sessaoId===alvo.quadroId
    && (f.tratId||"")===(alvo.tratId||"")).length;
  const usar = arquivos.slice(0, Math.max(0, cabem));
  if(!usar.length){ limparAlvoFoto(); toast("Já são "+FOTOS_POR_TRAT+" fotos aqui"); return; }
  toast(usar.length>1 ? "Processando "+usar.length+" fotos…" : "Processando a foto…");
  let guardadas = 0, miniaturas = 0, soNaMemoria = 0;
  for(const arq of usar){
    let nova;
    try{
      const media = await comprimir(arq, FOTO_MAX, FOTO_Q);
      const thumb = await comprimir(arq, THUMB_MAX, THUMB_Q);
      nova = {
        id:uid(), quando:new Date().toISOString(), data:(q && q.data) || hoje(),
        sessaoId:alvo.quadroId||"", tratId:alvo.tratId||"", bloco:"", avId:"", link:"",
        thumb:thumb, etiq:{trat:true, prod:false, aval:true, data:true, texto:""}
      };
      if(guardarVersaoLeitura()) nova.media = media; else miniaturas++;
    }catch(err){ continue; /* uma imagem ilegível não derruba o lote */ }
    /* A imagem vai para a gaveta ANTES de a foto ser marcada `local`. Se a
       gaveta recusar (sem espaço), a foto entra assim mesmo, carregando a
       imagem dentro do caderno como na versão antiga — nada se perde, só pesa. */
    try{ await gravarBytesFoto(nova.id, nova.media, nova.thumb); nova.local = true; }
    catch(err){ soNaMemoria++; }
    e.fotos.push(nova); guardadas++;
  }
  limparAlvoFoto();
  if(!guardadas){ toast("Não consegui ler essa imagem"); return; }
  TELA.tratAberto = alvo.tratId || "__extra";   // abre o bloco que acabou de receber
  marcarSujo(); render();
  // depois do marcarSujo, que zera o erro — senão o aviso sumiria antes de aparecer
  if(soNaMemoria){
    PERSIST.erro = "Pouco espaço no aparelho: "+soNaMemoria
      + " foto(s) guardadas do jeito antigo. Libere espaço e faça um backup.";
    atualizarStatus();
  }
  medirUso();
  const onde = t ? "T"+t.num : "Fotos extras";
  const sobra = arquivos.length - usar.length;
  toast(guardadas+(guardadas===1?" foto em ":" fotos em ")+onde
    + (miniaturas ? " (só miniatura: pouco espaço)" : "")
    + (sobra ? " · "+sobra+" ficaram de fora pelo limite de "+FOTOS_POR_TRAT : ""));
}
// destrava o salvamento e esquece o alvo, aconteça o que acontecer
function limparAlvoFoto(){ FOTO_ALVO = null; CAMERA_ABERTA = false; }

/* Sem aviso de "tem certeza que quer sair": aqui a gravação é local e instantânea,
   então não há nada pendente que se perca ao fechar. */

/* ============================ INÍCIO ============================ */
/* O app se instala no aparelho: o service worker guarda a página, e a partir daí
   abrir não depende mais de sinal. O `?v=` muda a cada versão publicada para o
   navegador buscar a nova em vez de servir a velha para sempre. */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
/* O Chrome avisa quando o app pode ser instalado; guardamos o convite para
   oferecê-lo num botão nosso, em vez de depender do menu escondido do navegador. */
let CONVITE_INSTALAR = null;
window.addEventListener("beforeinstallprompt", ev=>{
  ev.preventDefault(); CONVITE_INSTALAR = ev; atualizarStatus();
  const b = document.querySelector('[data-acao="instalar"]');
  if(b) render();
});
window.addEventListener("appinstalled", ()=>{ CONVITE_INSTALAR = null; render(); });

(async function inicio(){
  /* Pede ao navegador que não descarte estes dados quando o aparelho ficar sem
     espaço. Sem isso, o Android pode limpar o caderno para liberar memória. */
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
  try{
    const guardado = await lerLocal();
    /* Aparelho novo começa vazio e recebe o caderno da equipe ao entrar com a
       conta. Até a versão 12 havia aqui uma "semente" com os ensaios de teste
       de agosto — 60% do tamanho do app, e aparecia em todo aparelho novo, até
       no dos colegas. Ela está guardada em dados-semente-agosto.json. */
    if(guardado && Array.isArray(guardado.experimentos)) ST = guardado;
  }catch(e){
    PERSIST.erro = "Não consegui ler os dados gravados neste aparelho.";
  }
  migrar();
  /* Primeira abertura desta versão: as imagens saem de dentro do caderno e vão
     para a gaveta própria. Roda ANTES da primeira tela de propósito — se a
     pessoa pudesse editar durante a migração, o retrato do caderno que ela
     grava no fim sobrescreveria a edição. Se falhar, nada muda: as fotos seguem
     dentro do caderno como na versão antiga, e a próxima abertura tenta de novo. */
  const pesadas = (ST.experimentos||[]).reduce((a,e)=>
    a + (e.fotos||[]).filter(f=>!f.local && (f.media||f.thumb)).length, 0);
  if(pesadas){
    app.innerHTML = '<div class="wrap" style="padding-top:60px;text-align:center;color:var(--muted)">'
      + 'Organizando '+pesadas+' foto'+(pesadas===1?'':'s')+' deste aparelho…<br>'
      + '<span style="font-size:.85rem">Só acontece uma vez.</span></div>';
    try{ await migrarBytesParaGaveta(); }
    catch(e){ /* segue do jeito antigo; tenta de novo na próxima abertura */ }
  }
  render();
  medirUso();
  // se já há sessão e sinal, busca o que os outros lançaram enquanto isso
  if(syncPronto() && navigator.onLine) sincronizar(true);
})();
</script>
