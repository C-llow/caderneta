        x.mo = so/rr;
      });
      if(opc.tipos && opc.tipos[f.id]==="quant" && fatorQuantitativo(f)){
        const noOrdem = f.niveis.map(nv=>m.linhas.find(x=>x.nome===nv.nome)).filter(Boolean);
        m.reg = regressaoPolinomial(noOrdem.map(x=>valorNivel(x.nome)), noOrdem.map(x=>x.media), rr, qe, ge, sqf, alfa);
      }
    });
    /* Desdobramento na subdividida (SISVAR, "variância complexa"): o fator da
       SUBPARCELA dentro de cada nível da parcela usa o Erro(b); o da PARCELA
       dentro de cada nível da subparcela usa [QMa + (b−1)·QMb]/b, com os graus de
       liberdade de Satterthwaite. */
    const vc = (split.qmErroA + (split.b-1)*split.qmErroB)/split.b;
    const glVc = Math.pow(split.qmErroA + (split.b-1)*split.qmErroB, 2)
      / (Math.pow(split.qmErroA,2)/split.glErroA + Math.pow((split.b-1)*split.qmErroB,2)/split.glErroB);
    const erroSplit = i => i===0 ? {qm:vc, gl:glVc, nome:"Variância complexa (Satterthwaite)"}
                                 : {qm:split.qmErroB, gl:split.glErroB, nome:"Erro (b)"};
    const desdS = desdobramento(fat, trats, somaT, opc.somaO, nRep, erroSplit, teste, alfa, opc.tipos);
    // letras dos tratamentos: Erro(b), com os GL do Erro(b) — mesma regra de sempre
    /* Dunnett aqui compararia com a testemunha contra o Erro(b); o app não o
       implementa na subdividida, e a regra comum (Tukey) assume, com o nome dela. */
    const rS = letrasDoTeste(ord, teste, split.qmErroB, split.glErroB, nRep, alfa);
    const letrasS = new Array(nTrat).fill("");
    ord.forEach((o,k)=>{ letrasS[o.i] = rS.letras[k]; });
    const dmsS = rS.dms, critS = {n:rS.critNome, v:rS.critValor};
    return {
      ok:true, delin, N, media, glRes:split.glErroB, teste, alfa,
      critNome:critS.n, critValor:critS.v,
      cv: media!==0 ? 100*Math.sqrt(split.qmErroB)/Math.abs(media) : null,
      cvA: media!==0 ? 100*Math.sqrt(split.qmErroA)/Math.abs(media) : null,
      dms: dmsS, testeNome: rS.nome,
      fatorial: {linhas:[], medias:[mA,mB], glInt, pInt:rI.p, desd:desdS},
      pressupostos,
      split:true,
      fonte:[
        {nome:"Blocos", gl:glBloco, sq:sqBloco, qm:qmBloco},
        {nome:split.fA.nome||"Fator A (parcela)", gl:split.glA, sq:split.sqA, qm:qmA,
         f:rA.f, p:rA.p, destaque:true},
        {nome:"Erro (a)", gl:split.glErroA, sq:split.sqErroA, qm:split.qmErroA},
        {nome:split.fB.nome||"Fator B (subparcela)", gl:glB, sq:sqB, qm:sqB/glB,
         f:rB.f, p:rB.p, destaque:true},
        {nome:(split.fA.nome||"A")+" × "+(split.fB.nome||"B"), gl:glInt, sq:sqInt, qm:sqInt/glInt,
         f:rI.f, p:rI.p},
        {nome:"Erro (b)", gl:split.glErroB, sq:split.sqErroB, qm:split.qmErroB},
        {nome:"Total", gl:glTotal, sq:sqTotal}
      ],
      medias: medias.map(m=>({i:m.i, media:m.media, letra:letrasS[m.i]})),
      p: rB.p
    };
  }

  return {
    ok:true, delin, N, media, cv, dms, glRes, fatorial: dec, teste, testeNome, critNome, critValor, alfa, dunnett, pressupostos,
    fonte:[
      comBloco ? {nome: delin==="DQL"?"Linhas":"Blocos", gl:glBloco, sq:sqBloco, qm:qmBloco,
                  f:fBloco, p:pValorF(fBloco,glBloco,glRes)} : null,
      delin==="DQL" ? {nome:"Colunas", gl:glColuna, sq:sqColuna, qm:sqColuna/glColuna,
                       f: qmRes>0 ? (sqColuna/glColuna)/qmRes : null,
                       p: qmRes>0 ? pValorF((sqColuna/glColuna)/qmRes, glColuna, glRes) : null} : null,
      {nome:"Tratamentos", gl:glTrat, sq:sqTrat, qm:qmTrat, f:fTrat, p:pValorF(fTrat,glTrat,glRes), destaque:true},
      ...(dec ? dec.linhas : []),
      {nome:"Resíduo", gl:glRes, sq:sqRes, qm:qmRes},
      {nome:"Total", gl:glTotal, sq:sqTotal}
    ].filter(Boolean),
    medias: medias.map(m=>({i:m.i, media:m.media, letra:letras[m.i]})),
    p: pValorF(fTrat,glTrat,glRes)
  };
}
function classeCV(cv){
  if(cv==null) return {t:"—", c:""};
  if(cv<10) return {t:"baixo", c:"pill-a"};
  if(cv<20) return {t:"médio", c:""};
  if(cv<30) return {t:"alto", c:"pill-w"};
  return {t:"muito alto", c:"pill-e"};
}

/* ============================ ARMAZENAMENTO LOCAL ============================ */
/* IndexedDB, e não a página: aqui o caderno mora no aparelho. Gravar é local e
   instantâneo — não recarrega a tela, não depende de sinal, e o teto deixa de
   ser 11 MB para ser o espaço livre do celular (centenas de MB, na prática). */
/* Versão do programa, à vista na tela de sincronização. Serve para saber se os
   três aparelhos estão na mesma — sem isso, "atualizei?" vira adivinhação. */
const VERSAO_APP = "2026-09-30 · 23";

/* Duas gavetas no aparelho: `estado` guarda o caderno (texto, leve) e `fotos`
   guarda as imagens, uma por chave. Até a versão 12 as imagens moravam DENTRO
   do caderno, e cada gravação — que acontece a cada pausa na digitação —
   clonava e regravava todas elas. Medido: com mil fotos, dois segundos de tela
   congelada por gravação; com a escala de uma safra inteira, o celular fecharia
   o app por falta de memória. Foi o mesmo erro corrigido no servidor em 01/09,
   só que um andar abaixo. */
const BD_NOME = "caderneta-campo", BD_LOJA = "estado", BD_FOTOS = "fotos";
let BD = null;
function abrirBD(){
  return new Promise((ok, err)=>{
    const r = indexedDB.open(BD_NOME, 2);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      if(!db.objectStoreNames.contains(BD_LOJA))  db.createObjectStore(BD_LOJA);
      if(!db.objectStoreNames.contains(BD_FOTOS)) db.createObjectStore(BD_FOTOS);
    };
    r.onblocked = ()=>{
      try{ PERSIST.erro = "Feche as outras abas do app para concluir a atualização."; atualizarStatus(); }
      catch(e){}
    };
    r.onsuccess = ()=>{
      const db = r.result;
      // uma versão futura precisa conseguir atualizar sem esbarrar nesta aba
      db.onversionchange = ()=>{ db.close(); BD = null; };
      ok(db);
    };
    r.onerror = ()=>err(r.error);
  });
}

/* O caderno que vai para o disco. A regra que torna esta mudança segura:
   os bytes só saem do caderno para a foto marcada `local`, e ela só é marcada
   `local` DEPOIS que a gaveta confirmou a gravação. Se qualquer gravação na
   gaveta falhar, a foto continua carregando a imagem dentro do caderno, como
   na versão antiga — pesado, mas nunca perdido.
   Cópia rasa de propósito: o IndexedDB já clona o que recebe, e o
   JSON.parse(JSON.stringify()) de antes serializava tudo duas vezes. */
function cadernoSemBytes(st){
  const c = Object.assign({}, st);
  c.experimentos = (st.experimentos||[]).map(e=>{
    const ce = Object.assign({}, e);
    ce.fotos = (e.fotos||[]).map(f=>{
      if(!f.local) return f;
      const cf = Object.assign({}, f);
      delete cf.media; delete cf.thumb;
      return cf;
    });
    return ce;
  });
  return c;
}

/* --- a gaveta das fotos --- */
async function gravarBytesFoto(id, media, thumb){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const tx = BD.transaction(BD_FOTOS, "readwrite");
    const g = tx.objectStore(BD_FOTOS);
    // lê e completa: baixar a miniatura hoje e a ampliada amanhã não pode
    // apagar a que já estava
    const p = g.get(id);
    p.onsuccess = ()=>{
      const atual = p.result || {};
      g.put({ media: media !== undefined ? media : atual.media,
              thumb: thumb !== undefined ? thumb : atual.thumb }, id);
    };
    tx.oncomplete = ()=>ok();
    tx.onerror = ()=>err(tx.error);
    tx.onabort = ()=>err(tx.error);
  });
}
async function lerBytesFoto(id){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const p = BD.transaction(BD_FOTOS, "readonly").objectStore(BD_FOTOS).get(id);
    p.onsuccess = ()=>ok(p.result || null);
    p.onerror   = ()=>err(p.error);
  });
}
async function apagarBytesFotos(ids){
  if(!ids || !ids.length) return;
  if(!BD) BD = await abrirBD();
  return new Promise(ok=>{
    const tx = BD.transaction(BD_FOTOS, "readwrite");
    const g = tx.objectStore(BD_FOTOS);
    ids.forEach(id=>g.delete(id));
    tx.oncomplete = ()=>ok(); tx.onerror = ()=>ok(); tx.onabort = ()=>ok();
  });
}
async function descartarAmpliada(id){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const tx = BD.transaction(BD_FOTOS, "readwrite");
    const g = tx.objectStore(BD_FOTOS);
    const p = g.get(id);
    p.onsuccess = ()=>{ if(p.result){ g.put({thumb:p.result.thumb}, id); } };
    tx.oncomplete = ()=>ok(); tx.onerror = ()=>err(tx.error); tx.onabort = ()=>err(tx.error);
  });
}

/* --- PDFs do relatório final ---
   Moram na mesma gaveta das fotos, com chave própria ("pdf:" + id), guardados
   como arquivo inteiro (Blob). Em texto base64, como as fotos, um relatório de
   10 MB viraria 13 MB. Mesma regra das fotos: `local` só depois de gravado. */
const chavePdf = id => "pdf:" + id;
async function gravarPdf(id, blob){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const tx = BD.transaction(BD_FOTOS, "readwrite");
    tx.objectStore(BD_FOTOS).put({pdf:blob}, chavePdf(id));
    tx.oncomplete = ()=>ok(); tx.onerror = ()=>err(tx.error); tx.onabort = ()=>err(tx.error);
  });
}
async function lerPdf(id){
  const b = await lerBytesFoto(chavePdf(id));
  return b && b.pdf ? b.pdf : null;
}
function apagarPdfs(ids){ return apagarBytesFotos((ids||[]).map(chavePdf)); }

/* Uma vez só, na primeira abertura desta versão: tira as imagens de dentro do
   caderno e põe na gaveta. Tudo numa transação ÚNICA sobre as duas gavetas —
   ou as fotos entram e o caderno emagrece, ou nada muda. Não existe meio-termo
   em que o caderno perde a imagem de uma foto que não chegou à gaveta. */
async function migrarBytesParaGaveta(){
  const comBytes = [];
  (ST.experimentos||[]).forEach(e=>(e.fotos||[]).forEach(f=>{
    if(!f.local && (f.media || f.thumb)) comBytes.push(f);
  }));
  if(!comBytes.length) return 0;
  if(!BD) BD = await abrirBD();

  const ids = new Set(comBytes.map(f=>f.id));
  const soMini = new Set(comBytes.filter(f=>f.thumb && !f.media).map(f=>f.id));
  // o caderno emagrecido é montado ANTES, sem tocar no ST: se a transação
  // falhar, o que está na memória continua exatamente como estava
  const magro = cadernoSemBytes(ST);
  magro.experimentos.forEach(e=>{
    e.fotos = e.fotos.map(f=>{
      if(!ids.has(f.id)) return f;
      const cf = Object.assign({}, f);
      delete cf.media; delete cf.thumb;
      cf.local = true;
      if(soMini.has(f.id)) cf.soMini = true;
      return cf;
    });
  });
  await new Promise((ok, err)=>{
    const tx = BD.transaction([BD_LOJA, BD_FOTOS], "readwrite");
    const g = tx.objectStore(BD_FOTOS);
    comBytes.forEach(f=>g.put({media:f.media, thumb:f.thumb}, f.id));
    tx.objectStore(BD_LOJA).put(magro, "caderno");
    tx.oncomplete = ()=>ok(); tx.onerror = ()=>err(tx.error); tx.onabort = ()=>err(tx.error);
  });
  // só agora, com a gaveta confirmada, a memória também emagrece
  comBytes.forEach(f=>{
    f.local = true;
    if(soMini.has(f.id)) f.soMini = true;
    delete f.media; delete f.thumb;
  });
  return comBytes.length;
}
async function lerLocal(){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const p = BD.transaction(BD_LOJA, "readonly").objectStore(BD_LOJA).get("caderno");
    p.onsuccess = ()=>ok(p.result || null);
    p.onerror   = ()=>err(p.error);
  });
}
async function gravarLocal(dados){
  if(!BD) BD = await abrirBD();
  let magro = cadernoSemBytes(dados);
  return new Promise((ok, err)=>{
    const tx = BD.transaction(BD_LOJA, "readwrite");
    try{ tx.objectStore(BD_LOJA).put(magro, "caderno"); }
    catch(e){
      // algo não clonável escapou para o estado: o caminho antigo, por JSON, resolve
      tx.objectStore(BD_LOJA).put(JSON.parse(JSON.stringify(magro)), "caderno");
    }
    tx.oncomplete = ()=>ok();
    tx.onerror    = ()=>err(tx.error);
    tx.onabort    = ()=>err(tx.error);
  });
}

/* Quanto o app ocupa de verdade, perguntado ao navegador em segundo plano.
   Antes a barra de armazenamento serializava o estado inteiro — fotos
   incluídas — toda vez que a tela inicial era desenhada: com mil fotos, mais
   de um segundo só para pintar a barra. */
let USO = 0;
let MEDINDO_USO = false;
async function medirUso(){
  if(MEDINDO_USO) return;
  MEDINDO_USO = true;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const x = await navigator.storage.estimate();
      if(x && x.usage != null) USO = x.usage;
      if(x && x.quota) QUOTA = x.quota;
    }
  }catch(e){}
  finally{ MEDINDO_USO = false; }
}
function tamanhoEstimado(){ return USO; }
/* Quota real do aparelho, perguntada ao navegador. Enquanto a resposta não vem,
   assume-se um valor conservador para a barra não mentir para mais. */
let QUOTA = 512*1024*1024;
medirUso();
function limiteBytes(){ return QUOTA; }
/* Para arquivos (PDF): um relatório de 800 KB não pode aparecer como "1 MB" nem "0 MB". */
function tamanhoArquivo(b){
  b = Number(b)||0;
  return b < 1048576 ? Math.max(1, Math.round(b/1024))+" KB" : (b/1048576).toFixed(1).replace(".",",")+" MB";
}
function mb(b){
  return b >= 1073741824 ? (b/1073741824).toFixed(1).replace(".",",")+" GB"
                         : (b/1048576).toFixed(0)+" MB";
}
const BYTES_THUMB = 16*1024, BYTES_LEITURA = 138*1024;
/* Com o espaço do aparelho não há mais por que degradar foto: todas ficam com a
   versão ampliada. A função continua existindo porque o resto do app pergunta. */
function guardarVersaoLeitura(){ return tamanhoEstimado() < 0.9*limiteBytes(); }
function fotosQueAindaCabem(){
  const livre = Math.max(0, limiteBytes() - tamanhoEstimado());
  const n = Math.floor(livre/(BYTES_THUMB+BYTES_LEITURA));
  return {ampliadas:n, miniaturas:0, total:n};
}
/* Só conta como liberável a foto que já está no servidor. Descartar a ampliada
   de uma foto ainda não enviada apagaria a única cópia que existe no mundo —
   antes do Storage isso era inevitável; agora seria um erro. */
/* Com as imagens na gaveta não dá para medir byte a byte sem ler cada uma;
   a estimativa usa o tamanho médio medido da versão ampliada. */
function bytesLiberaveis(){
  let n = 0;
  ST.experimentos.forEach(e=>(e.fotos||[]).forEach(f=>{
    if(f.local && f.remota && !f.soMini) n++;
  }));
  return n * BYTES_LEITURA;
}
/* Descarta a ampliada da gaveta e mantém a miniatura. Não passa por
   marcarSujo de propósito: liberar espaço aqui é assunto deste aparelho, e
   carimbar o ensaio faria esta "mudança" ganhar de uma edição real de outra
   pessoa na sincronização. */
async function liberarEspaco(){
  let n = 0;
  for(const e of ST.experimentos){
    for(const f of (e.fotos||[])){
      if(!(f.local && f.remota && !f.soMini)) continue;
      try{ await descartarAmpliada(f.id); delete f.media; f.soMini = true; n++; }
      catch(err){ /* esta fica como está; as outras seguem */ }
    }
  }
  if(n) await gravarLocal(ST);
  medirUso();
  return n;
}

/* ============================ GRAVAR E SINCRONIZAR ============================ */
/* Gravar é sempre local e imediato — é o que faz o app servir no meio da lavoura
   sem sinal. Sincronizar é outra coisa, que acontece quando dá, e nunca segura
   quem está digitando. */
/* Grupos e modelos de croqui não pertencem a nenhum ensaio: viajam num documento
   à parte, com o seu próprio carimbo. */
function marcarGerais(){
  ST.atualizadoGerais = new Date().toISOString();
  marcarSujo();
}
/* `alvos`: ensaios mudados FORA da tela deles — etiqueta ou grupo trocados no
   cartão da tela inicial, PDF movido para outro ensaio. Sem carimbo, a mudança
   ficava só neste aparelho: a sincronização decide pelo carimbo, e até a v19
   só o ensaio aberto era carimbado. */
function marcarSujo(...alvos){
  PERSIST.pend = true; PERSIST.erro = null;
  PERSIST.geracao = (PERSIST.geracao||0) + 1;
  SYNC.sujo = true;
  const agora = new Date().toISOString();
  const e = exp();
  if(e) e.atualizado = agora;                      // carimbo por ensaio: é a chave da mesclagem
  alvos.forEach(x=>{ if(x) x.atualizado = agora; });
  atualizarStatus();
  clearTimeout(TIMER); TIMER = setTimeout(salvar, 600);
}
async function salvar(){
  clearTimeout(TIMER);
  if(!PERSIST.pend) return;
  /* Já gravando: não descarta o pedido — agenda de novo. Antes voltava sem
     fazer nada, e o que se digitou durante a gravação ficava só na memória. */
  if(PERSIST.salvando){ TIMER = setTimeout(salvar, 300); return; }
  PERSIST.salvando = true; atualizarStatus();
  const geracao = PERSIST.geracao;
  try{
    await gravarLocal(ST);
    /* Só está "tudo gravado" se nada mudou DURANTE a gravação. O IndexedDB tira
       a cópia no começo; uma tecla no meio fica fora dela e precisa de outra. */
    if(PERSIST.geracao === geracao) PERSIST.pend = false;
    else { clearTimeout(TIMER); TIMER = setTimeout(salvar, 300); }
    PERSIST.erro = null; PERSIST.ultimo = new Date();
  }catch(err){
    PERSIST.erro = (err && err.name === "QuotaExceededError")
      ? "Sem espaço no aparelho. Libere as versões ampliadas das fotos."
      : "Não consegui gravar no aparelho.";
  }
  PERSIST.salvando = false; atualizarStatus();
  if(PERSIST.pendSync !== false) agendarSync();
}
window.addEventListener("beforeunload", ()=>{ if(PERSIST.pend) salvar(); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden" && PERSIST.pend) salvar();
});

/* ---- Supabase, pela API REST ---- */
/* Sem biblioteca externa de propósito: um app que precisa abrir offline não pode
   depender de um arquivo que vem da internet toda vez. São três chamadas HTTP. */
/* O projeto da equipe vem embutido: quem usa o app só precisa do e-mail e da
   senha. Endereço e chave publicável NÃO são segredo — a própria Supabase
   chama esta chave de "publishable", feita para viajar dentro de aplicativos.
   O que protege os dados é a senha de cada pessoa, mais as travas do banco,
   que só liberam quem está autenticado. Deixar isto na tela era pedir que três
   pessoas copiassem à mão dois códigos longos, e errassem. */
const SUPA_URL   = "https://yobbyxtsyltlxqckrnih.supabase.co";
const SUPA_CHAVE = "sb_publishable_XIYWV-fCEDgKR1DbWxwvuQ_LbuDPPIc";

function syncConfig(){
  const c = ST.sync;
  if(!c) return null;
  /* Quem entrou antes de o projeto vir embutido guardou url e chave próprias;
     elas continuam valendo. Sem elas, usa as de fábrica. */
  if(!c.url)   c.url   = SUPA_URL;
  if(!c.chave) c.chave = SUPA_CHAVE;
  return (c.url && c.chave) ? c : null;
}
function syncPronto(){ const c = syncConfig(); return !!(c && c.token); }

/* Toda conversa com o servidor tem prazo. Sem ele, com sinal fraco na lavoura
   um pedido podia ficar pendurado por minutos — e enquanto isso nenhuma outra
   sincronização começava, porque a anterior "ainda estava rodando". O prazo
   cresce com o tamanho do que se envia: um PDF grande em 3G leva tempo mesmo. */
async function buscarComPrazo(url, opc, ms){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{ return await fetch(url, Object.assign({}, opc, {signal: ctl.signal})); }
  catch(err){
    if(err && err.name === "AbortError") throw new Error("o servidor não respondeu a tempo — sinal fraco?");
    throw err;
  }
  finally{ clearTimeout(t); }
}
function prazoPara(corpo){
  const n = corpo ? (corpo.size || corpo.length || 0) : 0;
  return 45000 + Math.round(n / 50);          // 45 s + 1 s a cada 50 KB
}
async function supa(caminho, opc){
  const c = syncConfig();
  if(!c) throw new Error("sem configuração");
  const cab = {apikey:c.chave, "Content-Type":"application/json"};
  if(c.token) cab.Authorization = "Bearer "+c.token;
  const r = await buscarComPrazo(c.url.replace(/\/+$/,"")+caminho,
    Object.assign({}, opc, {headers: Object.assign(cab, (opc||{}).headers||{})}), prazoPara((opc||{}).body));
  if(!r.ok){
    /* 401 costuma ser só o token vencido — o relógio do aparelho atrasado já
       basta para a checagem preventiva errar. Renova uma vez e repete, em vez
       de mandar o técnico refazer o login no meio da lavoura. Uma tentativa só:
       se a renovação não resolveu, o problema é outro. */
    if(r.status === 401 && !(opc||{}).__retentado && await syncRenovar()){
      return supa(caminho, Object.assign({}, opc, {__retentado:true}));
    }
    const txt = await r.text().catch(()=>"");
    const e = new Error(txt || ("HTTP "+r.status)); e.status = r.status; throw e;
  }
  /* Gravar devolve 201 com o corpo VAZIO, e `Response.json()` num corpo vazio
     estoura "Unexpected end of JSON input" — foi assim que a primeira
     sincronização de verdade falhou. Ler o texto antes de interpretar cobre
     qualquer resposta sem corpo, venha ela como 201, 204 ou outra. */
  const corpo = await r.text();
  if(!corpo) return null;
  try{ return JSON.parse(corpo); }
  catch(err){ return null; }
}

/* ---- Fotos no Storage ----
   A foto NÃO viaja dentro do ensaio. Se viajasse, cada aparelho baixaria o
   acervo inteiro a cada sincronização — inclusive os de quem nunca abre foto.
   Aqui ela sobe uma vez para o balde `fotos` e só desce quando alguém olha.
   O aparelho que tirou continua com ela inteira, offline, como sempre. */
const BALDE = "fotos";
function caminhoFoto(expId, fotoId, tipo){
  return "/storage/v1/object/"+BALDE+"/"+expId+"/"+fotoId+(tipo==="t"?"-t":"")+".jpg";
}
function dataUrlParaBlob(u){
  const [cab, b64] = String(u).split(",");
  const tipo = (cab.match(/:(.*?);/)||[])[1] || "image/jpeg";
  const bin = atob(b64);
  const n = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) n[i] = bin.charCodeAt(i);
  return new Blob([n], {type:tipo});
}
function blobParaDataUrl(b){
  return new Promise((ok,no)=>{
    const l = new FileReader();
    l.onload = ()=>ok(l.result); l.onerror = ()=>no(l.error);
    l.readAsDataURL(b);
  });
}
/* Toda conversa com o Storage passa por aqui, para ter a MESMA recuperação de
   sessão que o supa() dá ao banco. Sem isto, a hora em que o token vence é a
   hora em que as fotos param de subir — caladas, enquanto avaliações e
   protocolos continuam sincronizando normalmente e nada parece errado. */
async function supaArquivo(caminho, opc, _retentado){
  const c = syncConfig(); if(!c) throw new Error("sem configuração");
  const o = Object.assign({}, opc);
  o.headers = Object.assign({apikey:c.chave, Authorization:"Bearer "+c.token},
                            (opc||{}).headers || {});
  // download não diz o tamanho antes: prazo folgado, só para não pendurar
  const r = await buscarComPrazo(c.url + caminho, o, o.body ? prazoPara(o.body) : 180000);
  if(r.status === 401 && !_retentado && await syncRenovar())
    return supaArquivo(caminho, opc, true);
  return r;
}
async function supaSubirFoto(expId, fotoId, tipo, dataUrl){
  const r = await supaArquivo(caminhoFoto(expId, fotoId, tipo), {
    method:"POST",
    headers:{"Content-Type":"image/jpeg", "x-upsert":"true"},
    body: dataUrlParaBlob(dataUrl)
  });
  /* 409 = já existe lá. Não é erro: é a foto que subiu numa tentativa anterior
     e cujo recibo não chegou a ser gravado aqui. */
  if(!r.ok && r.status !== 409){
    const t = await r.text().catch(()=>"");
    const e = new Error(t || ("HTTP "+r.status)); e.status = r.status; throw e;
  }
  return true;
}
async function supaApagarFoto(expId, fotoId, tipo){
  const r = await supaArquivo(caminhoFoto(expId, fotoId, tipo), {method:"DELETE"});
  // 404 = já não está lá. O objetivo era esse.
  if(!r.ok && r.status !== 404) throw new Error("HTTP "+r.status);
  return true;
}
/* O PDF mora numa pasta própria, fora da pasta do ensaio: mover o relatório
   para outro ensaio muda só a ficha, sem subir o arquivo de novo. */
function caminhoPdf(id){ return "/storage/v1/object/"+BALDE+"/relatorios/"+id+".pdf"; }
async function supaSubirPdf(id, blob){
  const r = await supaArquivo(caminhoPdf(id), {
    method:"POST", headers:{"Content-Type":"application/pdf", "x-upsert":"true"}, body: blob
  });
  if(!r.ok && r.status !== 409){
    const t = await r.text().catch(()=>"");
    const e = new Error(t || ("HTTP "+r.status)); e.status = r.status; throw e;
  }
  return true;
}
async function supaBaixarPdf(id){
  if(!syncConfig()) return null;
  const r = await supaArquivo(caminhoPdf(id));
  if(!r.ok) return null;
  const b = await r.blob();
  return new Blob([b], {type:"application/pdf"});
}
async function supaApagarPdf(id){
  const r = await supaArquivo(caminhoPdf(id), {method:"DELETE"});
  if(!r.ok && r.status !== 404) throw new Error("HTTP "+r.status);
  return true;
}
function pdfPendente(r){ return !r.remota && r.local; }
/* Traz o PDF: primeiro da gaveta, depois do servidor. O que desce fica na
   gaveta, e — como nas fotos — sem marcarSujo, porque baixar não é editar. */
async function garantirPdf(r){
  try{
    if(r.local){ const b = await lerPdf(r.id); if(b) return b; }
    if(r.remota && syncPronto() && navigator.onLine){
      const b = await supaBaixarPdf(r.id);
      if(b){
        try{ await gravarPdf(r.id, b); if(!r.local){ r.local = true; await gravarLocal(ST); } }
        catch(err){ /* sem espaço: abre agora, sem guardar */ }
        return b;
      }
    }
  }catch(err){}
  return null;
}

/* Apagar a foto no aparelho não apaga o arquivo no servidor — e sem isto ele
   ficaria ocupando o balde para sempre. A ordem vai para uma fila, porque quem
   apaga uma foto costuma estar no campo, sem sinal. */
function enfileirarExclusaoFoto(expId, fotoId){
  if(!Array.isArray(ST.fotosParaApagar)) ST.fotosParaApagar = [];
  ST.fotosParaApagar.push({exp:expId, foto:fotoId});
}
function enfileirarExclusaoPdf(id){
  if(!Array.isArray(ST.fotosParaApagar)) ST.fotosParaApagar = [];
  ST.fotosParaApagar.push({pdf:id});
}
async function limparFotosApagadas(){
  const fila = Array.isArray(ST.fotosParaApagar) ? ST.fotosParaApagar : [];
  if(!fila.length) return 0;
  const sobraram = [];
  let n = 0;
  for(const item of fila){
    try{
      if(item.pdf){ await supaApagarPdf(item.pdf); n++; continue; }
      await supaApagarFoto(item.exp, item.foto, "t");
      await supaApagarFoto(item.exp, item.foto, "");
      n++;
    }catch(err){ sobraram.push(item); }   // tenta de novo no próximo sync
  }
  ST.fotosParaApagar = sobraram;
  return n;
}

async function supaBaixarFoto(expId, fotoId, tipo){
  if(!syncConfig()) return null;
  const r = await supaArquivo(caminhoFoto(expId, fotoId, tipo));
  if(!r.ok) return null;
  return blobParaDataUrl(await r.blob());
}

/* Traz a foto só quando alguém vai olhar, e guarda no aparelho para não baixar
   duas vezes. NÃO chama marcarSujo de propósito: receber uma foto não é editar
   o ensaio, e carimbar aqui faria este aparelho reenviar tudo sem motivo — e
   pior, ganhar de uma edição de verdade que outra pessoa tenha feito. */
const FOTOS_BAIXANDO = new Set();
async function garantirFoto(e, f, quero, adiarGravacao){
  const campo = (quero === "media") ? "media" : "thumb";
  if(f[campo]) return f[campo];
  const marca = f.id + "/" + campo;
  if(FOTOS_BAIXANDO.has(marca)) return null;
  FOTOS_BAIXANDO.add(marca);
  try{
    /* 1º a gaveta deste aparelho. Funciona sem sinal, e é onde está toda foto
       tirada aqui ou já vista aqui. */
    if(f.local){
      const b = await lerBytesFoto(f.id);
      if(b && b[campo]){ f[campo] = b[campo]; return b[campo]; }
    }
    /* 2º o servidor, se a foto subiu e há sinal. O que desce fica na gaveta,
       para a próxima vez não depender de sinal. */
    if(f.remota && syncPronto() && navigator.onLine){
      const u = await supaBaixarFoto(e.id, f.id, campo === "thumb" ? "t" : "");
      if(u){
        f[campo] = u;
        try{
          await gravarBytesFoto(f.id, campo==="media" ? u : undefined, campo==="thumb" ? u : undefined);
          /* `local` é assunto só deste aparelho: grava direto, sem marcarSujo,
             que carimbaria o ensaio e faria uma miniatura baixada ganhar de
             uma edição de verdade na sincronização. Num lote, quem grava é o
             carregador, uma vez no fim. */
          if(!f.local){ f.local = true; if(!adiarGravacao) await gravarLocal(ST); }
        }catch(err){ /* sem espaço na gaveta: fica só na memória nesta sessão */ }
        return u;
      }
    }
  }catch(err){ /* sem sinal ou gaveta indisponível: tenta da próxima vez */ }
  finally{ FOTOS_BAIXANDO.delete(marca); }
  return null;
}
/* Depois de desenhar a tela, preenche as miniaturas que ainda não estão aqui.
   Uma de cada vez, para não abrir vinte conexões num sinal de lavoura. */
let FILA_FOTOS = false;
async function carregarMiniaturasPendentes(){
  if(FILA_FOTOS) return;
  const e = exp(); if(!e) return;
  const alvos = [...document.querySelectorAll("[data-foto-baixar]")];
  if(!alvos.length) return;
  FILA_FOTOS = true;
  let chegaram = 0;
  try{
    for(const el of alvos){
      const f = (e.fotos||[]).find(x=>x.id === el.getAttribute("data-foto-baixar"));
      if(!f) continue;
      const u = await garantirFoto(e, f, "thumb", true);   // grava só no fim
      if(u && el.parentNode){
        chegaram++;
        const img = document.createElement("img");
        img.src = u; img.loading = "lazy";
        img.alt = el.getAttribute("data-alt") || "Foto do ensaio";
        // a capa do quadro tem medidas próprias; a grade usa as da classe
        if(el.getAttribute("data-estilo")) img.setAttribute("style", el.getAttribute("data-estilo"));
        el.parentNode.replaceChild(img, el);
      }
    }
    if(chegaram) await gravarLocal(ST);
  } finally { FILA_FOTOS = false; }
}

/* Entra com o e-mail e a senha da equipe. O que fica guardado no aparelho é o
   token de acesso e o de renovação — nunca a senha. */
async function syncEntrar(url, chave, email, senha){
  const r = await fetch(url.replace(/\/+$/,"")+"/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:chave, "Content-Type":"application/json"},
    body: JSON.stringify({email, password:senha})
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "Não consegui entrar");
  ST.sync = {url:url.replace(/\/+$/,""), chave, email,
             token:j.access_token, refresh:j.refresh_token,
             expira: Date.now() + (j.expires_in||3600)*1000};
  return true;
}
async function syncRenovar(){
  const c = syncConfig();
  if(!c || !c.refresh) return false;
  const r = await fetch(c.url+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{apikey:c.chave, "Content-Type":"application/json"},
    body: JSON.stringify({refresh_token: c.refresh})
  });
  if(!r.ok) return false;
  const j = await r.json();
  c.token = j.access_token; c.refresh = j.refresh_token || c.refresh;
  c.expira = Date.now() + (j.expires_in||3600)*1000;
  return true;
}

let TIMER_SYNC = null;
/* 30 segundos, não 4. Sincronizar 4 s depois de cada tecla fazia dez aparelhos
   conversarem com o servidor o dia inteiro à toa — e cada conversa custa tráfego
   do plano. Gravar continua instantâneo e local; só o envio é que espera. */
function agendarSync(){
  if(!syncPronto() || !navigator.onLine) return;
  clearTimeout(TIMER_SYNC);
  TIMER_SYNC = setTimeout(()=>sincronizar(true), 30000);
}
window.addEventListener("online", ()=>{ atualizarStatus(); agendarSync(); });
window.addEventListener("offline", ()=>{ atualizarStatus(); });

/* A mesclagem é por ensaio, e não pelo caderno inteiro: dois técnicos podem
   passar o dia offline em ensaios diferentes que nada se perde. Dentro de um
   mesmo ensaio vale o carimbo mais recente — dois editando o MESMO ensaio ao
   mesmo tempo é o único caso em que uma das versões cede. */
/* A cópia do ensaio que vai para o banco, sem os bytes das imagens. O que fica
   é a ficha da foto — tratamento, quadro, ordem, etiqueta —, que é o que os
   outros precisam para montar a tela. A imagem em si vem do Storage, e só se
   alguém abrir. Um ensaio com 24 fotos sai de 408 KB para menos de 2 KB. */
function semFotos(e){
  const c = JSON.parse(JSON.stringify(cadernoSemBytes({experimentos:[e]}).experimentos[0]));
  (c.fotos||[]).forEach(f=>{
    delete f.media; delete f.thumb;
    /* `local` e `soMini` descrevem ESTE aparelho. Se viajassem, o celular do
       colega acharia que tem na gaveta uma foto que nunca baixou. */
    delete f.local; delete f.soMini;
  });
  (c.relatorios||[]).forEach(r=>{ delete r.local; });   // idem para o PDF
  return c;
}
/* Foto tirada aqui que ainda não chegou ao servidor. Os bytes podem estar na
   memória ou só na gaveta — por isso a pergunta é pela marca, não pela imagem. */
function fotoPendente(f){ return !f.remota && (f.local || f.media || f.thumb); }
async function bytesParaSubir(f){
  let media = f.media, thumb = f.thumb;
  if((!media || !thumb) && f.local){
    const b = await lerBytesFoto(f.id);
    if(b){ media = media || b.media; thumb = thumb || b.thumb; }
  }
  return {media, thumb};
}
async function sincronizar(silencioso){
  if(SYNC.rodando) return;
  if(!syncPronto()){ if(!silencioso) toast("Configure a sincronização primeiro"); return; }
  if(!navigator.onLine){ if(!silencioso) toast("Sem internet agora"); return; }
  SYNC.rodando = true; SYNC.erro = null; atualizarStatus();
  const geracaoInicio = PERSIST.geracao || 0;
  try{
    const c = syncConfig();
    if(c.expira && Date.now() > c.expira - 60000) await syncRenovar();

    /* Duas etapas, para não pagar tráfego à toa. Antes cada sincronização
       baixava TODOS os ensaios inteiros, mesmo sem nada ter mudado: com 50
       ensaios de ~28 KB, 1,4 MB por rodada — uns 10 GB por mês num uso normal
       de três aparelhos, o dobro do plano gratuito.
       1ª etapa: só id, carimbo e lápide de cada ensaio (bytes, não KB).
       2ª etapa: o documento inteiro apenas dos que estão mais novos lá fora.
       A regra de decisão é a MESMA de antes — compara os mesmos carimbos —,
       só se deixou de baixar o que seria descartado. */
    /* 0. Exclusões feitas sem sinal. Antes, o aviso de exclusão era mandado
       uma vez só, na hora — e só se houvesse sinal. Excluído no campo, o
       ensaio voltava inteiro na sincronização seguinte, porque o servidor
       ainda o tinha. Agora a exclusão espera numa fila, como as fotos. */
    const lapides = Array.isArray(ST.lapides) ? ST.lapides.slice() : [];
    if(lapides.length){
      await supa("/rest/v1/experimentos", {
        method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(lapides.map(l=>({id:l.id, dados:{}, removido:true, atualizado:l.quando})))
      });
      ST.lapides = (ST.lapides||[]).filter(l=>!lapides.some(x=>x.id===l.id));
    }

    const fichas = await supa("/rest/v1/experimentos?select=id,atualizado,removido");
    const localPorId = {};
    ST.experimentos.forEach(e=>{ localPorId[e.id] = e.atualizado || ""; });
    const querDados = fichas
      .filter(r=>!r.removido && (!(r.id in localPorId) || (r.atualizado||"") > localPorId[r.id]))
      .map(r=>r.id);
    const completos = {};
    // em lotes: um endereço com centenas de ids passaria do tamanho que o servidor aceita
    for(let k = 0; k < querDados.length; k += 40){
      const lote = querDados.slice(k, k+40).map(id=>'"'+String(id).replace(/"/g,"")+'"').join(",");
      const docs = await supa("/rest/v1/experimentos?select=id,dados,atualizado,removido&id=in.("
                              + encodeURIComponent(lote) + ")");
      (docs||[]).forEach(d=>{ completos[d.id] = d; });
    }
    // a lista final tem o mesmo formato de antes; quem não mudou vem sem `dados`
    const remotos = fichas.map(r=>completos[r.id] || r);
    const porId = {}; remotos.forEach(r=>{ porId[r.id] = r; });

    // 1. o que veio de fora e está mais novo entra no lugar do local
    let baixados = 0;
    remotos.forEach(r=>{
      const i = ST.experimentos.findIndex(x=>x.id===r.id);
      const localAtual = i>=0 ? (ST.experimentos[i].atualizado||"") : "";
      if(r.removido){
        if(i>=0 && (r.atualizado||"") > localAtual){
          // as imagens dele saem da gaveta junto, senão ficariam ocupando espaço para sempre
          apagarBytesFotos((ST.experimentos[i].fotos||[]).map(f=>f.id));
          apagarPdfs((ST.experimentos[i].relatorios||[]).map(x=>x.id));
          ST.experimentos.splice(i,1); baixados++;
        }
        return;
      }
      /* Sem `dados` = não mudou, ou sumiu entre as duas etapas. Nos dois casos
         não há o que trazer, e empurrar um ensaio vazio corromperia a lista. */
      if(!r.dados) return;
      if(i<0){ ST.experimentos.push(r.dados); baixados++; }
      else if((r.atualizado||"") > localAtual){
        /* A versão de fora não traz os bytes das fotos — elas moram no Storage.
           Antes de trocar, guardo as imagens que ESTE aparelho já tem e devolvo
           depois. Sem isto, sincronizar apagaria as fotos de quem as tirou. */
        /* Junto com as imagens vão as marcas `local` e `soMini`: elas dizem
           o que está na gaveta DESTE aparelho, e a versão de fora não as traz
           (nem deve). Perder `local` aqui faria a próxima gravação devolver
           os bytes para dentro do caderno. */
        const guardadas = {};
        (ST.experimentos[i].fotos||[]).forEach(f=>{
          if(f.media || f.thumb || f.local)
            guardadas[f.id] = {media:f.media, thumb:f.thumb, local:f.local, soMini:f.soMini};
        });
        const pdfsAqui = new Set((ST.experimentos[i].relatorios||[]).filter(x=>x.local).map(x=>x.id));
        ST.experimentos[i] = r.dados;
        (ST.experimentos[i].relatorios||[]).forEach(x=>{ if(pdfsAqui.has(x.id)) x.local = true; });
        (ST.experimentos[i].fotos||[]).forEach(f=>{
          const g = guardadas[f.id];
          if(!g) return;
          if(g.media) f.media = g.media;
          if(g.thumb) f.thumb = g.thumb;
          if(g.local) f.local = true;
          if(g.soMini) f.soMini = true;
        });
        baixados++;
      }
    });

    // 2. o que é local e está mais novo sobe
    /* Também entra o ensaio que tem foto ainda não enviada, mesmo com o carimbo
       igual ao do servidor. Sem esta segunda condição, uma foto cuja subida
       falhou (sinal caiu no meio) nunca mais seria tentada: o carimbo já estaria
       em dia, o ensaio sairia desta lista, e a imagem ficaria presa no aparelho
       para sempre — visível só para quem a tirou. */
    const temFotoPendente = e => (e.fotos||[]).some(fotoPendente) || (e.relatorios||[]).some(pdfPendente);
    const subir = ST.experimentos.filter(e=>{
      const r = porId[e.id];
      return !r || (e.atualizado||"") > (r.atualizado||"") || temFotoPendente(e);
    });
    if(subir.length){
      /* As fotos vão primeiro, e por fora do documento. Só depois de a imagem
         estar guardada lá é que o ensaio a declara como `remota` — na ordem
         inversa, outro aparelho leria a referência de uma foto inexistente. */
      let enviadas = 0, falhas = 0;
      SYNC.erroFoto = null; SYNC.erroPdf = null;
      for(const e of subir){
        for(const f of (e.fotos||[])){
          if(!fotoPendente(f)) continue;
          try{
            // os bytes podem estar só na gaveta: vão da gaveta direto ao servidor
            const b = await bytesParaSubir(f);
            if(!b.media && !b.thumb) continue;
            if(b.thumb) await supaSubirFoto(e.id, f.id, "t", b.thumb);
            if(b.media) await supaSubirFoto(e.id, f.id, "",  b.media);
            f.remota = true; enviadas++;
          }catch(err){
            /* O resto do ensaio segue, e esta foto entra de novo na fila. Mas o
               motivo NÃO se perde: uma foto que não sobe calada é indistinguível
               de uma que subiu, e foi assim que a primeira falha real passou
               despercebida. Guarda-se o primeiro erro, que é o que explica. */
            falhas++;
            if(!SYNC.erroFoto)
              SYNC.erroFoto = (err && err.message) ? String(err.message).slice(0,140)
                                                   : "não consegui enviar a foto";
          }
        }
        // o PDF do relatório, pelo mesmo princípio: arquivo primeiro, ficha depois
        for(const r of (e.relatorios||[])){
          if(!pdfPendente(r)) continue;
          try{
            const b = await lerPdf(r.id);
            if(!b) continue;
            await supaSubirPdf(r.id, b);
            r.remota = true;
          }catch(err){
            SYNC.erroPdf = (err && err.message) ? String(err.message).slice(0,140) : "não consegui enviar o PDF";
          }
        }
      }
      if(enviadas) SYNC.fotosEnviadas = (SYNC.fotosEnviadas||0) + enviadas;

      await supa("/rest/v1/experimentos", {
        method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify(subir.map(e=>({
          id:e.id, dados:semFotos(e), atualizado:e.atualizado||new Date().toISOString()
        })))
      });
    }

    // 3. grupos e modelos de croqui: um documento só, carimbo mais recente vence
    const geraisR = await supa("/rest/v1/gerais?select=id,dados,atualizado&id=eq.equipe");
    const remotoG = geraisR[0];
    const meuG = ST.atualizadoGerais || "";
    if(remotoG && (remotoG.atualizado||"") > meuG){
      ST.grupos = remotoG.dados.grupos || ST.grupos;
      ST.modelos = remotoG.dados.modelos || ST.modelos;
      /* Etiquetas são da equipe, como grupos e croquis: renomear "Relatório
         pendente" num aparelho tem de valer em todos. */
      if(Array.isArray(remotoG.dados.etiquetas)) ST.etiquetas = remotoG.dados.etiquetas;
      ST.atualizadoGerais = remotoG.atualizado;
    } else if(!remotoG || meuG > (remotoG.atualizado||"")){
      const agora = new Date().toISOString();
      await supa("/rest/v1/gerais", {
        method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify([{id:"equipe", dados:{grupos:ST.grupos, modelos:ST.modelos, etiquetas:ST.etiquetas}, atualizado:agora}])
      });
      ST.atualizadoGerais = agora;
    }

    // 4. arquivos de fotos já excluídas saem do balde
    await limparFotosApagadas();

    migrar();
    SYNC.quando = new Date(); SYNC.erro = null;
    // "a enviar" some só se nada mudou enquanto sincronizava
    if((PERSIST.geracao || 0) === geracaoInicio) SYNC.sujo = false;
    PERSIST.pendSync = false;
    await gravarLocal(ST);
    PERSIST.pendSync = undefined;
    render();
    /* Foto que ficou para trás aparece SEMPRE, mesmo em sincronização
       silenciosa: é o aviso que faltava quando as fotos sumiam sem explicação. */
    const pendentes = ST.experimentos.reduce((a,e)=>
      a + (e.fotos||[]).filter(fotoPendente).length, 0);
    const pdfsPendentes = ST.experimentos.reduce((a,e)=>a + (e.relatorios||[]).filter(pdfPendente).length, 0);
    if(pendentes && SYNC.erroFoto){
      toast(pendentes+(pendentes===1?" foto não subiu":" fotos não subiram")+": "+SYNC.erroFoto);
    }
    else if(pdfsPendentes && SYNC.erroPdf){
      toast("O PDF do relatório não subiu (continua guardado aqui): "+SYNC.erroPdf);
    }
    else if(!silencioso || baixados || subir.length){
      const fs = SYNC.fotosEnviadas || 0; SYNC.fotosEnviadas = 0;
      toast(baixados||subir.length
        ? "Sincronizado — "+subir.length+" enviado(s), "+baixados+" recebido(s)"
          + (fs ? " · "+fs+(fs===1?" foto":" fotos") : "")
          + (pendentes ? " · "+pendentes+" foto(s) na fila" : "")
        : "Tudo em dia");
    }
  }catch(err){
    SYNC.erro = (err && err.status === 401) ? "Sessão expirada — entre de novo"
              : (err && err.message) ? String(err.message).slice(0,120)
              : "Falha ao sincronizar";
    if(!silencioso) toast(SYNC.erro);
  }
  SYNC.rodando = false; atualizarStatus();
}

/* ============================ ETIQUETAS ============================ */
/* Marcar o estado de um ensaio. Fica no cartão da lista de propósito: passar
   trinta ensaios para "relatório pendente" tem de ser trinta toques, não
   trinta idas e voltas para dentro de cada um. */
function modalEtiquetas(e){
  const d = document.createElement("div");
  d.className = "modal-fundo";
  const desenhar = ()=>{
    d.innerHTML = '<div class="modal"><h3>Estado — '+esc(e.nome)+'</h3>'
      + (ST.etiquetas.length
          ? '<div class="etq-lista">'
            + ST.etiquetas.map(t=>{
                const on = (e.etiquetas||[]).indexOf(t.id) >= 0;
                return '<div class="etq-linha">'
                  + '<span class="etq-check">'+(on?'&#10003;':'')+'</span>'
                  + '<button class="etq-cheia" data-t="'+t.id+'" style="background:'+esc(t.cor)+';'
                  + (on?'':'opacity:.45')+'">'+esc(t.nome)+'</button></div>';
              }).join("")
            + '</div>'
          : '<p style="color:var(--muted);font-size:.88rem">Nenhuma etiqueta ainda. '
            + 'Crie em <b>Etiquetas</b>, na tela inicial.</p>')
      + '<div class="modal-pe">'
      + '<button class="b b-s" data-acao="editar-etqs">Editar etiquetas</button>'
      + '<button class="b b-p" data-f="1">Pronto</button></div></div>';
  };
  desenhar();
  d.addEventListener("click", ev=>{
    const t = ev.target.closest("[data-t]");
    if(t){
      const i = (e.etiquetas||[]).indexOf(t.dataset.t);
      if(i >= 0) e.etiquetas.splice(i,1); else e.etiquetas.push(t.dataset.t);
      marcarSujo(e); desenhar(); render();       // `e`: aberto pela tela inicial, não é o exp()
      return;
    }
    if(ev.target.closest('[data-acao="editar-etqs"]')){ d.remove(); modalEditarEtiquetas(); return; }
    if(ev.target.closest("[data-f]") || ev.target === d) d.remove();
  });
  document.body.appendChild(d);
}

/* Editar nome e cor. A cor vem do seletor do próprio sistema — no celular abre
   a paleta nativa, que é melhor do que qualquer grade que eu desenhasse. */
function modalEditarEtiquetas(){
  const d = document.createElement("div");
  d.className = "modal-fundo";
  const desenhar = ()=>{
    d.innerHTML = '<div class="modal"><h3>Etiquetas</h3>'
      + '<p style="color:var(--muted);font-size:.85rem;margin:0 0 12px">'
      + 'O nome e a cor são seus. Elas valem para toda a equipe e chegam aos '
      + 'outros aparelhos na sincronização.</p>'
      + '<div class="etq-lista">'
      + ST.etiquetas.map(t=>
          '<div class="etq-linha">'
          + '<input type="color" data-cor="'+t.id+'" value="'+esc(t.cor)+'" aria-label="Cor">'
          + '<input data-nome="'+t.id+'" value="'+esc(t.nome)+'" placeholder="Nome do estado" '
          + 'style="flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);'
          + 'border-radius:var(--r-sm);padding:8px 10px;font-size:.88rem;min-height:38px">'
          + '<button class="b b-s" data-del="'+t.id+'" aria-label="Apagar" '
          + 'style="flex:none;min-height:34px;padding:0 9px;color:var(--erro);border-color:transparent;'
          + 'background:none;font-size:1rem">&times;</button></div>').join("")
      + '</div>'
      + '<button class="b b-s" data-nova="1" style="margin-top:10px">+ Nova etiqueta</button>'
      + '<div class="modal-pe"><button class="b b-p" data-f="1">Pronto</button></div></div>';
  };
  desenhar();
  d.addEventListener("input", ev=>{
    const c = ev.target.dataset.cor, n = ev.target.dataset.nome;
    const t = ST.etiquetas.find(x=>x.id === (c||n));
    if(!t) return;
    if(c) t.cor = ev.target.value; else t.nome = ev.target.value;
    marcarGerais(); render();          // o cartão atrás do modal acompanha
  });
  d.addEventListener("click", async ev=>{
    if(ev.target.closest("[data-nova]")){
      ST.etiquetas.push({id:uid(), nome:"Novo estado", cor:"#5E6C84"});
      marcarGerais(); desenhar(); render(); return;
    }
    const del = ev.target.closest("[data-del]");
    if(del){
      const t = ST.etiquetas.find(x=>x.id===del.dataset.del);
      const usos = ST.experimentos.filter(e=>(e.etiquetas||[]).indexOf(del.dataset.del)>=0).length;
      if(!await confirmar("Apagar “"+esc(t?t.nome:"")+"”?"
          + (usos ? " Ela sai de "+usos+" ensaio(s)." : ""))) return;
      ST.etiquetas = ST.etiquetas.filter(x=>x.id!==del.dataset.del);
      const afetados = ST.experimentos.filter(e=>(e.etiquetas||[]).indexOf(del.dataset.del)>=0);
      afetados.forEach(e=>{ e.etiquetas = e.etiquetas.filter(id=>id!==del.dataset.del); });
      marcarGerais(); marcarSujo(...afetados); desenhar(); render(); return;
    }
    if(ev.target.closest("[data-f]") || ev.target === d) d.remove();
  });
  document.body.appendChild(d);
}

/* ============================ BACKUP ============================ */
/* Sincronizar NÃO é fazer backup: se um defeito estragar os dados aqui, a
   sincronização copia o estrago para o servidor e de lá para os outros
   aparelhos, com toda a fidelidade. Réplica espalha erro; backup dá um ponto
   no tempo para voltar. É a única peça que protege disso.

   O arquivo é um ZIP comum, com as fotos como JPG de verdade em pastas com
   nome de gente. Isso é deliberado: um backup que só este app consegue ler
   vale pela metade. Assim você abre no Windows, vê as fotos, lê o JSON no
   bloco de notas — mesmo que o app, ou eu, deixemos de existir. */

/* --- escritor de ZIP, método STORE (sem compressão) ---
   Escrito à mão porque o app precisa funcionar sem internet, e não pode
   depender de uma biblioteca que venha de fora. JPEG já é comprimido, então
   guardar sem compressão custa quase nada e abre em qualquer lugar. */
const CRC_TAB = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TAB[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function montarZip(arquivos){
  const cod = new TextEncoder();
  const d = new Date();
  const hora = ((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFFFF;
  const data = (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF;

  const pedacos = [], central = [];
  let desloc = 0;
  for(const a of arquivos){
    const nome = cod.encode(a.nome);
    const dados = a.dados;
    const soma = crc32(dados);

    const lfh = new DataView(new ArrayBuffer(30));
    lfh.setUint32(0, 0x04034b50, true); lfh.setUint16(4, 20, true);
    lfh.setUint16(6, 0x0800, true);      // nomes em UTF-8
    lfh.setUint16(8, 0, true);           // STORE
    lfh.setUint16(10, hora, true); lfh.setUint16(12, data, true);
    lfh.setUint32(14, soma, true);
    lfh.setUint32(18, dados.length, true); lfh.setUint32(22, dados.length, true);
    lfh.setUint16(26, nome.length, true); lfh.setUint16(28, 0, true);
    pedacos.push(new Uint8Array(lfh.buffer), nome, dados);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, hora, true); cd.setUint16(14, data, true);
    cd.setUint32(16, soma, true);
    cd.setUint32(20, dados.length, true); cd.setUint32(24, dados.length, true);
    cd.setUint16(28, nome.length, true);
    cd.setUint32(42, desloc, true);
    central.push(new Uint8Array(cd.buffer), nome);

    desloc += 30 + nome.length + dados.length;
  }
  let tamCentral = 0;
  central.forEach(p=>{ tamCentral += p.length; });

  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true);
  fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamCentral, true); fim.setUint32(16, desloc, true);

  return new Blob(pedacos.concat(central, [new Uint8Array(fim.buffer)]),
                  {type:"application/zip"});
}

/* --- leitor de ZIP ---
   Lê pelo diretório central, que é como o formato manda. Aceita STORE (o que
   nós escrevemos) e deflate, caso alguém reempacote o arquivo por fora — para
   isso usa o DecompressionStream do próprio navegador, sem biblioteca. */
async function lerZip(blob){
  const buf = new Uint8Array(await blob.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let fim = -1;
  for(let i = buf.length - 22; i >= 0 && i > buf.length - 65558; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ fim = i; break; }
  }
  if(fim < 0) throw new Error("não parece um arquivo ZIP");
  const total = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);
  const dec = new TextDecoder();
  const saida = {};
  for(let n = 0; n < total; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(p + 10, true);
    const comp   = dv.getUint32(p + 20, true);
    const lnome  = dv.getUint16(p + 28, true);
    const lextra = dv.getUint16(p + 30, true);
    const lcom   = dv.getUint16(p + 32, true);
    const inicio = dv.getUint32(p + 42, true);
    const nome   = dec.decode(buf.subarray(p + 46, p + 46 + lnome));

    const ln = dv.getUint16(inicio + 26, true), le = dv.getUint16(inicio + 28, true);
    const ini = inicio + 30 + ln + le;
    let dados = buf.subarray(ini, ini + comp);
    if(metodo === 8){
      const fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      dados = new Uint8Array(await new Response(fluxo).arrayBuffer());
    } else if(metodo !== 0){
      throw new Error("compressão não suportada neste arquivo");
    }
    saida[nome] = dados;
    p += 46 + lnome + lextra + lcom;
  }
  return saida;
}

function nomeSeguro(t){
  return String(t||"").trim().replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ")
    .replace(/^\.+/,"").slice(0,60) || "sem-nome";
}

/* Monta o conteúdo do backup. `comFotos` é a diferença entre 1,4 MB e algumas
   centenas: os dados cabem num backup diário; as fotos, num de fim de safra. */
async function montarBackup(comFotos){
  const cod = new TextEncoder();
  const copia = JSON.parse(JSON.stringify(cadernoSemBytes(ST)));
  delete copia.sync;                     // token e e-mail não vão para o arquivo
  (copia.experimentos||[]).forEach(e=>(e.fotos||[]).forEach(f=>{
    delete f.media; delete f.thumb;
    delete f.local; delete f.soMini;     // marcas deste aparelho, sem sentido em outro
  }));
  (copia.experimentos||[]).forEach(e=>(e.relatorios||[]).forEach(r=>{ delete r.local; }));

  const arquivos = [];
  let nFotos = 0, faltaram = 0;
  if(comFotos){
    const pastasUsadas = new Set();
    for(const e of (ST.experimentos||[])){
      const ce = (copia.experimentos||[]).find(x=>x.id===e.id);
      /* Dois ensaios com o mesmo nome caíam na mesma pasta e um sobrescrevia
         as fotos do outro. A pasta ganha sufixo quando o nome já foi usado. */
      let pastaE = nomeSeguro(e.nome || e.id), k = 2;
      while(pastasUsadas.has(pastaE.toLowerCase())) pastaE = nomeSeguro(e.nome || e.id) + " " + (k++);
      pastasUsadas.add(pastaE.toLowerCase());
      const porTrat = {};
      for(const f of (e.fotos||[])){
        let dados = f.media;
        if(!dados && f.local){ const b = await lerBytesFoto(f.id); if(b) dados = b.media || b.thumb; }
        if(!dados) dados = f.thumb;
        /* Backup completo é completo: a foto que este aparelho nunca abriu vem
           do servidor direto para o arquivo, sem passar pela gaveta. */
        if(!dados && f.remota && syncPronto() && navigator.onLine){
          try{ dados = await supaBaixarFoto(e.id, f.id, ""); }catch(err){}
        }
        if(!dados){ faltaram++; continue; }
        const q = (e.sessoesFoto||[]).find(x=>x.id===f.sessaoId);
        const t = (e.tratamentos||[]).find(x=>x.id===f.tratId);
        const chave = (q?nomeSeguro(q.titulo||"quadro"):"sem-quadro") + "_" + (t?("T"+t.num):"extras");
        porTrat[chave] = (porTrat[chave]||0) + 1;
        const nome = "fotos/"+pastaE+"/"+chave+"-"+String(porTrat[chave]).padStart(2,"0")+".jpg";
        /* Cada foto diz no JSON qual arquivo é o dela. A restauração casava por
           ORDEM — gravava na ordem em que as fotos foram tiradas e lia em ordem
           alfabética de nome, então a foto do T1 podia receber a imagem do T3,
           com a etiqueta do T1. Com o nome explícito não há o que casar. */
        const cf = ce && (ce.fotos||[]).find(x=>x.id===f.id);
        if(cf) cf.arquivo = nome;
        const b = dataUrlParaBlob(dados);
        arquivos.push({nome, dados: new Uint8Array(await b.arrayBuffer())});
        nFotos++;
      }
      // o relatório final vai junto, como PDF comum, na pasta do ensaio
      for(const r of (e.relatorios||[])){
        const b = await garantirPdf(r);
        if(!b){ faltaram++; continue; }
        const nome = "relatorios/"+pastaE+"/"+nomeSeguro((r.nome||"relatorio").replace(/\.pdf$/i,""))
                   + "-" + r.id.slice(-4) + ".pdf";
        const cr = ce && (ce.relatorios||[]).find(x=>x.id===r.id);
        if(cr) cr.arquivo = nome;
        arquivos.push({nome, dados: new Uint8Array(await b.arrayBuffer())});
      }
    }
  }

  const resumo = {
    gerado: new Date().toISOString(),
    versaoApp: VERSAO_APP,
    ensaios: (ST.experimentos||[]).length,
    avaliacoes: (ST.experimentos||[]).reduce((a,e)=>a+(e.avaliacoes||[]).length,0),
    fotosNoCaderno: (ST.experimentos||[]).reduce((a,e)=>a+(e.fotos||[]).length,0),
    fotosNesteArquivo: nFotos,
    // fotos que não estavam no aparelho e não deu para buscar (sem sinal)
    fotosFaltando: faltaram,
    comFotos: !!comFotos
  };
  copia.__backup = resumo;

  arquivos.unshift({nome:"caderneta.json", dados: cod.encode(JSON.stringify(copia, null, 1))});
  arquivos.push({nome:"LEIA-ME.txt", dados: cod.encode(
      "Backup da Caderneta de Campo — Caltech R&D\r\n"
    + "==========================================\r\n\r\n"
    + "Gerado em ....... " + new Date().toLocaleString("pt-BR") + "\r\n"
    + "Versão do app ... " + VERSAO_APP + "\r\n"
    + "Ensaios ......... " + resumo.ensaios + "\r\n"
    + "Avaliações ...... " + resumo.avaliacoes + "\r\n"
    + "Fotos ........... " + nFotos + (comFotos ? "" : "  (backup só de dados)") + "\r\n\r\n"
    + "O QUE TEM AQUI\r\n"
    + "  caderneta.json   todos os ensaios, avaliações, tratamentos e croquis\r\n"
    + "  fotos/           as imagens, em pastas por ensaio (JPG comuns)\r\n\r\n"
    + "COMO RESTAURAR\r\n"
    + "  Abra o app, engrenagem, secao Backup, botao Restaurar, e escolha\r\n"
    + "  este arquivo .zip. Ele mostra o que ha dentro antes de mexer em nada.\r\n\r\n"
    + "IMPORTANTE\r\n"
    + "  Este arquivo nao depende do aplicativo. O JSON abre em qualquer editor\r\n"
    + "  de texto e as fotos sao JPG comuns, que abrem em qualquer computador.\r\n"
    + "  Guarde-o fora do celular: OneDrive, um SSD, o que voce ja usa.\r\n")});

  return {blob: montarZip(arquivos), resumo};
}

/* Salvar: no PC deixa ESCOLHER a pasta; no celular abre o compartilhamento,
   de onde dá para mandar direto ao OneDrive. Baixar é o último recurso. */
async function salvarBackup(blob, nome){
  if(window.showSaveFilePicker){
    try{
      const h = await window.showSaveFilePicker({
        suggestedName: nome,
        types:[{description:"Backup da Caderneta", accept:{"application/zip":[".zip"]}}]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      return "Backup salvo onde você escolheu";
    }catch(err){
      if(err && err.name === "AbortError") return null;   // desistiu, sem alarde
    }
  }
  const arq = new File([blob], nome, {type:"application/zip"});
  if(navigator.canShare && navigator.canShare({files:[arq]})){
    try{ await navigator.share({files:[arq], title:nome}); return "Backup enviado"; }
    catch(err){ if(err && err.name === "AbortError") return null; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 6000);
  return "Backup baixado para a pasta de downloads";
}

async function fazerBackup(comFotos){
  toast(comFotos ? "Montando o backup com as fotos — pode demorar…" : "Montando o backup…");
  try{
    const {blob, resumo} = await montarBackup(comFotos);
    const dia = new Date().toISOString().slice(0,10);
    const nome = "caderneta-" + dia + (comFotos ? "-completo" : "-dados") + ".zip";
    const msg = await salvarBackup(blob, nome);
    if(msg) toast(msg + " — " + mb(blob.size) + ", " + resumo.ensaios + " ensaios"
                  + (comFotos ? ", " + resumo.fotosNesteArquivo + " fotos" : "")
                  /* Backup incompleto que se diz completo é pior que nenhum: quem
                     confia nele descobre a falta justamente quando precisa. */
                  + (comFotos && resumo.fotosFaltando
                      ? " — " + resumo.fotosFaltando + " ficaram de fora (não estão neste aparelho e não há sinal)"
                      : ""));
  }catch(err){
    toast("Não consegui montar o backup: " + String(err && err.message || err).slice(0,90));
  }
}

/* Restaurar mostra o que há dentro ANTES de tocar em qualquer coisa. Juntar
   compara ensaio a ensaio pelo carimbo, como a sincronização; Substituir é
   para o caso feio e descarta o que estiver aqui, por isso pede confirmação. */
async function restaurarBackup(arquivo){
  let conteudo, dados;
  try{
    conteudo = await lerZip(arquivo);
    const bruto = conteudo["caderneta.json"];
    if(!bruto) throw new Error("não achei caderneta.json dentro do arquivo");
    dados = JSON.parse(new TextDecoder().decode(bruto));
    if(!Array.isArray(dados.experimentos)) throw new Error("o arquivo não tem ensaios");
  }catch(err){
    toast("Arquivo inválido: " + String(err && err.message || err).slice(0,90));
    return;
  }
  const r = dados.__backup || {};
  const quando = r.gerado ? new Date(r.gerado).toLocaleString("pt-BR") : "data desconhecida";
  const fotosNoZip = Object.keys(conteudo).filter(n=>n.indexOf("fotos/")===0).length;

  const escolha = await new Promise(ok=>{
    const d = document.createElement("div");
    d.className = "modal-fundo";
    d.innerHTML = '<div class="modal"><h3>Restaurar backup</h3>'
      + '<p style="color:var(--muted);font-size:.9rem">Este arquivo tem <b>'
      + (dados.experimentos.length)+' ensaios</b>, <b>'
      + (r.avaliacoes!=null?r.avaliacoes:"?")+' avaliações</b> e <b>'
      + fotosNoZip+' fotos</b>, de '+esc(quando)+'.</p>'
      + '<p style="color:var(--muted);font-size:.85rem"><b>Juntar</b> compara ensaio a ensaio e '
      + 'fica com a versão mais recente de cada um. <b>Substituir</b> descarta o que está '
      + 'neste aparelho e deixa exatamente o que há no arquivo.</p>'
      + '<div class="modal-pe">'
      + '<button class="b b-s" data-r="nao">Cancelar</button>'
      + '<button class="b b-perigo b-ghost" data-r="sub">Substituir tudo</button>'
      + '<button class="b b-p" data-r="jun">Juntar</button></div></div>';
    d.addEventListener("click", ev=>{
      const b = ev.target.closest("[data-r]");
      if(b){ d.remove(); ok(b.dataset.r); }
      else if(ev.target === d){ d.remove(); ok("nao"); }
    });
    document.body.appendChild(d);
  });
  if(escolha === "nao") return;
  if(escolha === "sub" && !await confirmar(
      "Substituir apaga os "+ST.experimentos.length+" ensaios deste aparelho e coloca os do arquivo no lugar. Continuar?")) return;

  /* Cada foto diz no JSON qual é o arquivo dela (`arquivo`). É por esse nome
     que a imagem volta — nunca por ordem. A versão anterior casava por ordem
     e trocava imagens entre tratamentos em silêncio. */
  let restauradas = 0, semImagem = 0;
  for(const e of dados.experimentos){
    for(const f of (e.fotos||[])){
      delete f.media; delete f.thumb; delete f.local; delete f.soMini;
      const bruto = f.arquivo && conteudo[f.arquivo];
      delete f.arquivo;
      if(!bruto){ semImagem++; continue; }
      const blob = new Blob([bruto], {type:"image/jpeg"});
      try{
        const media = await blobParaDataUrl(blob);
        // miniatura de verdade, e não a foto grande fazendo papel de miniatura
        let thumb;
        try{ thumb = await comprimir(blob, THUMB_MAX, THUMB_Q); }catch(err){ thumb = media; }
        await gravarBytesFoto(f.id, media, thumb);
        f.local = true;
        delete f.remota;      // veio de arquivo: sobe de novo, e o servidor aceita por cima
        restauradas++;
      }catch(err){
        semImagem++;          // sem espaço, ou imagem ilegível: a ficha volta, a imagem não
      }
    }
  }

  // ensaio que volta do backup deixa de estar na fila de exclusão
  if(Array.isArray(ST.lapides))
    ST.lapides = ST.lapides.filter(l=>!dados.experimentos.some(x=>x.id===l.id));

  // PDFs do relatório: voltam por nome, como as fotos
  const pdfsComArquivo = new Set();
  for(const e of dados.experimentos){
    for(const r of (e.relatorios||[])){
      delete r.local;
      const bruto = r.arquivo && conteudo[r.arquivo];
      delete r.arquivo;
      if(!bruto) continue;
      try{
        await gravarPdf(r.id, new Blob([bruto], {type:"application/pdf"}));
        r.local = true; delete r.remota; pdfsComArquivo.add(r.id);
      }catch(err){}
    }
  }

  const idsComImagem = new Set();
  dados.experimentos.forEach(e=>(e.fotos||[]).forEach(f=>{ if(f.local) idsComImagem.add(f.id); }));

  let resumoMsg;
  if(escolha === "sub"){
    // o que sai do caderno sai da gaveta também, senão fica ocupando espaço
    const novos = new Set();
    dados.experimentos.forEach(e=>(e.fotos||[]).forEach(f=>novos.add(f.id)));
    const orfas = [];
    ST.experimentos.forEach(e=>(e.fotos||[]).forEach(f=>{ if(!novos.has(f.id)) orfas.push(f.id); }));
    await apagarBytesFotos(orfas);
    const pdfsNovos = new Set();
    dados.experimentos.forEach(e=>(e.relatorios||[]).forEach(r=>pdfsNovos.add(r.id)));
    await apagarPdfs([].concat(...ST.experimentos.map(e=>(e.relatorios||[]).map(r=>r.id)))
                       .filter(id=>!pdfsNovos.has(id)));
    ST.experimentos = dados.experimentos;
    if(Array.isArray(dados.grupos))    ST.grupos    = dados.grupos;
    if(Array.isArray(dados.modelos))   ST.modelos   = dados.modelos;
    if(Array.isArray(dados.etiquetas)) ST.etiquetas = dados.etiquetas;
    resumoMsg = "Restaurado: " + ST.experimentos.length + " ensaios";
  } else {
    let novos = 0, atualizados = 0;
    dados.experimentos.forEach(v=>{
      const i = ST.experimentos.findIndex(x=>x.id===v.id);
      if(i < 0){ ST.experimentos.push(v); novos++; }
      else if((v.atualizado||"") > (ST.experimentos[i].atualizado||"")){
        ST.experimentos[i] = v; atualizados++;
      }
    });
    resumoMsg = novos + " ensaio(s) novo(s), " + atualizados + " atualizado(s)";
  }
  /* Mesmo quando a versão deste aparelho venceu, a imagem que veio do arquivo
     já está na gaveta, com o mesmo id: a foto passa a saber disso. */
  ST.experimentos.forEach(e=>(e.fotos||[]).forEach(f=>{ if(idsComImagem.has(f.id)) f.local = true; }));
  ST.experimentos.forEach(e=>(e.relatorios||[]).forEach(r=>{ if(pdfsComArquivo.has(r.id)) r.local = true; }));

  migrar(); marcarSujo(); render(); medirUso();
  toast(resumoMsg + " · " + restauradas + " foto(s) com imagem"
        + (semImagem ? " · " + semImagem + " sem imagem no arquivo" : ""));
}

/* ============================ FOTOS ============================ */
const FOTO_MAX = 1280, FOTO_Q = 0.68, THUMB_MAX = 400, THUMB_Q = 0.55;
const FOTOS_POR_TRAT = 8;      // por tratamento, em cada quadro

/* A etiqueta impressa na própria imagem — é assim que a foto sai do app e entra
   numa apresentação sem precisar de legenda à parte. Ela é queimada na hora da
   exibição, nunca gravada por cima do arquivo: corrigir o nome do tratamento
   corrige junto a imagem, e nenhuma etiqueta se acumula sobre a anterior. */
async function imagemComEtiqueta(e, f){
  const img = new Image();
  /* Foto de outro aparelho: busca a versão grande antes de queimar a etiqueta.
     Queimar sobre a miniatura sairia borrado numa apresentação. */
  // da gaveta deste aparelho, ou do servidor — garantirFoto decide a fonte
  if(!f.media) await garantirFoto(e, f, "media");
  if(!f.media && !f.thumb) await garantirFoto(e, f, "thumb");
  img.src = f.media || f.thumb;
  if(!img.src) throw new Error("imagem");
  await new Promise((ok,err)=>{ img.onload = ok; img.onerror = ()=>err(new Error("imagem")); });
  const w = img.naturalWidth || FOTO_MAX, h = img.naturalHeight || Math.round(w*0.75);
  const texto = etiquetaTexto(e, f);
  const corpo = Math.max(14, Math.round(w/38));
  const pad = Math.round(corpo*0.85), alturaLinha = Math.round(corpo*1.4);
  /* Calibri é a fonte do Office, onde estas fotos vão parar. Carlito tem as
     mesmas métricas e cobre Linux; o resto da pilha é o que existe no celular. */
  const fonte = "600 "+corpo+"px Calibri, Carlito, 'Segoe UI', Roboto, sans-serif";

  // mede em uma tela descartável: definir width/height depois apagaria o contexto
  const regua = document.createElement("canvas").getContext("2d");
  regua.font = fonte;
  const linhas = [];
  if(texto){
    let atual = "";
    texto.split(" ").forEach(p=>{
      const t = atual ? atual+" "+p : p;
      if(atual && regua.measureText(t).width > w - 2*pad){ linhas.push(atual); atual = p; }
      else atual = t;
    });
    if(atual) linhas.push(atual);
  }
  const faixa = linhas.length ? linhas.length*alturaLinha + 2*pad : 0;

  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h + faixa;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#12160D"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(img, 0, 0, w, h);
  if(linhas.length){
    cx.font = fonte; cx.textBaseline = "top"; cx.fillStyle = "#EFF1EA";
    linhas.forEach((t,i)=>{ cx.fillText(t, pad, h + pad + i*alturaLinha); });
  }
  return cv.toDataURL("image/jpeg", 0.86);
}
async function comprimir(file, maxDim, q){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const escala = Math.min(1, maxDim/Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*escala)), h = Math.max(1, Math.round(bmp.height*escala));
  const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
  const cx = cv.getContext("2d"); cx.drawImage(bmp,0,0,w,h); bmp.close && bmp.close();
  return cv.toDataURL("image/jpeg", q);
}

/* Levar a foto etiquetada para fora do app. O quadro em que o app roda bloqueia
   download iniciado pela página, então o caminho é o do próprio celular: a folha
   de compartilhamento, onde "Salvar imagem" grava na galeria. Onde ela não
   existir, sobra o toque longo na foto em tela cheia — que o navegador atende. */
async function salvarNoCelular(e, f){
  let url;
  try{ url = await imagemComEtiqueta(e, f); }
  catch(err){ toast("Não consegui montar a imagem"); return; }
  const base = (etiquetaTexto(e,f) || "foto-"+dataBr(f.data))
    .replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").slice(0,60).toLowerCase();
  try{
    const blob = await (await fetch(url)).blob();
    const arq = new File([blob], (base||"foto")+".jpg", {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq]});
      return;
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // fechou a folha; nada a dizer
  }
  if(!document.querySelector(".lightbox")) verFoto(e, f.id);
  toast("Segure a foto e escolha Salvar imagem");
}

/* Croqui do quadrado latino: coluna de cada parcela, indexada igual à malha. */
function croquiDe(e, av){
  if(e.delineamento !== "DQL") return null;
  if(!av.croqui) return null;
  return e.tratamentos.map(t=>{
    const linha=[];
    for(let b=0;b<e.nRep;b++){
      const v = av.croqui[t.id+"|"+b];
      linha.push(v==null || v==="" ? null : Number(v));
    }
    return linha;
  });
}
function matrizDe(e, av){
  return e.tratamentos.map(t=>{
    const linha=[];
    for(let b=0;b<e.nRep;b++) linha.push(num(av.dados[t.id+"|"+b]));
    return linha;
  });
}

const app = document.getElementById("app");

function render(){
  const foco = document.activeElement;
  const chaveFoco = foco && foco.dataset ? foco.dataset.k : null;
  const selIni = foco && foco.selectionStart;
  let html = "";
  if(TELA.nome==="sync") html = telaSync();
  else if(TELA.nome==="home") html = telaHome();
  else{
    const e = exp();
    if(!e){ TELA={nome:"home",expId:null,aba:"protocolo",avId:null}; return render(); }
    html = telaExperimento(e);
  }
  app.innerHTML = html;
  if(chaveFoco){
    const alvo = app.querySelector('[data-k="'+CSS.escape(chaveFoco)+'"]');
    if(alvo){ alvo.focus(); try{ alvo.setSelectionRange(selIni, selIni); }catch(err){} }
  }
  atualizarStatus();
  /* Com seis abas, no celular as últimas ficam fora da barra. A aba aberta
     é trazida para a vista — só a barra rola, a página não se mexe. */
  const barra = app.querySelector(".abas"), ativa = barra && barra.querySelector('[aria-selected="true"]');
  if(ativa){
    const ra = ativa.getBoundingClientRect(), rb = barra.getBoundingClientRect();
    if(ra.right > rb.right) barra.scrollLeft += ra.right - rb.right + 16;
    else if(ra.left < rb.left) barra.scrollLeft -= rb.left - ra.left + 16;
  }
  /* Depois da tela montada, busca as miniaturas das fotos que vieram de outro
     aparelho. Fora do caminho do desenho: a tela não espera pela rede. */
  carregarMiniaturasPendentes();
}

/* Duas informações diferentes, e a ordem importa: primeiro se o dado está seguro
   no aparelho (o que importa no campo), depois se já foi para a equipe. Estar
   sem internet não é erro — é o estado normal de quem está na lavoura. */
function statusHtml(){
  if(PERSIST.erro)     return '<span class="ponto err"></span>erro ao gravar';
  if(PERSIST.pend || PERSIST.salvando) return '<span class="ponto pend"></span>gravando';
  if(!syncConfig())    return '<span class="ponto ok"></span>no aparelho';
  if(!navigator.onLine) return '<span class="ponto"></span>offline · gravado';
  if(SYNC.rodando)     return '<span class="ponto pend"></span>sincronizando';
  if(SYNC.erro)        return '<span class="ponto err"></span>falha ao sincronizar';
  if(!syncPronto())    return '<span class="ponto pend"></span>entre na equipe';
  /* "Sincronizado" só quando é verdade. O envio espera 30 s depois de cada
     mudança, e até a v19 a barra já dizia "sincronizado" nesse intervalo —
     justo o que se confere antes de trocar de aparelho ou reinstalar. */
  const fila = pendentesDeEnvio();
  if(fila.arquivos) return '<span class="ponto pend"></span>'+fila.arquivos+' arquivo'+(fila.arquivos===1?'':'s')+' a enviar';
  if(SYNC.sujo || !SYNC.quando) return '<span class="ponto pend"></span>a enviar';
  return '<span class="ponto ok"></span>sincronizado';
}
/* O que este aparelho ainda deve ao servidor: fotos e PDFs não enviados. */
function pendentesDeEnvio(){
  let arquivos = 0;
  (ST.experimentos||[]).forEach(e=>{
    (e.fotos||[]).forEach(f=>{ if(fotoPendente(f)) arquivos++; });
    (e.relatorios||[]).forEach(r=>{ if(pdfPendente(r)) arquivos++; });
  });
  return {arquivos};
}
function atualizarStatus(){
  const el = app.querySelector(".salvo");
  if(el){ el.innerHTML = statusHtml(); el.title = PERSIST.erro || SYNC.erro || ""; }
}
