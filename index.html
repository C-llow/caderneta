<!doctype html>
<title>Caderneta de Campo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7B3C">
<meta name="description" content="Ensaios agronômicos: protocolo, croqui, avaliações, fotos por tratamento e análise estatística. Funciona sem internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192-v5.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-192-v5.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --ground:#EFF1EA; --surface:#FFFFFF; --surface-2:#E4E8DB; --surface-3:#F6F8F2;
  --ink:#191E12; --ink-2:#3E4634; --muted:#6C7460; --line:#D3D9C6; --line-2:#C0C8B0;
  --accent:#4A7328; --accent-ink:#FFFFFF; --accent-soft:#DFEBCF; --accent-line:#A8C486;
  --alerta:#9A6410; --alerta-soft:#F7E9CE; --erro:#9E3626; --erro-soft:#F7DCD6;
  --shadow:0 1px 2px rgba(25,30,18,.06),0 4px 14px rgba(25,30,18,.05);
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em; line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.serif{font-family:"Source Serif 4",Georgia,serif}

/* ---------- estrutura ---------- */
.topo{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:12px; min-height:56px;
}
.topo-tit{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.topo-tit b{font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topo-tit span{font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wrap{max-width:1080px; margin:0 auto; padding:18px 16px 96px}
.abas{
  position:sticky; top:56px; z-index:35; background:var(--ground);
  border-bottom:1px solid var(--line); display:flex; gap:2px;
  overflow-x:auto; scrollbar-width:none; padding:0 8px;
}
.abas::-webkit-scrollbar{display:none}
.aba{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 13px; font-size:.83rem; font-weight:500; color:var(--muted);
  white-space:nowrap; letter-spacing:.01em;
}
.aba[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

/* ---------- botões ---------- */
.b{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:9px 14px; border-radius:var(--r-sm); font-size:.85rem; font-weight:500;
  cursor:pointer; min-height:40px; transition:background .12s,border-color .12s;
}
.b:hover{background:var(--surface-2)}
.b:disabled{opacity:.45; cursor:not-allowed}
.b-p{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.b-p:hover{background:var(--accent); filter:brightness(1.08)}
.b-g{padding:12px 20px; min-height:48px; font-size:.92rem}
.b-s{padding:6px 10px; min-height:32px; font-size:.78rem}
.b-perigo{color:var(--erro); border-color:var(--erro)}
.b-perigo:hover{background:var(--erro-soft)}
/* Excluir precisa parecer um botão: o × sem contorno passava despercebido. */
.b-x{
  flex:none; width:36px; min-width:36px; height:36px; min-height:36px; padding:0;
  font-size:1.15rem; line-height:1; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--muted);
}
.b-x:hover{background:var(--erro-soft); border-color:var(--erro); color:var(--erro)}
.b-ghost{border-color:transparent; background:none}
.b-ghost:hover{background:var(--surface-2)}
/* Botões de ícone da barra do topo (voltar, engrenagem): 48 px de toque. */
.b-topo{flex:none; width:48px; height:48px; min-height:48px; padding:0; display:grid; place-items:center; color:var(--ink-2); border-radius:12px}
.b-topo:hover{color:var(--ink)}
.b-engr{margin-right:-6px}
.b-voltar{margin-left:-8px}

/* seletor de duas vias: mostra as duas opções e qual está valendo */
.seg{
  display:inline-flex; gap:2px; padding:2px; flex:none;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-sm);
}
.seg-b{
  border:0; background:none; color:var(--muted); font:inherit; font-size:.83rem;
  font-weight:600; padding:7px 15px; min-height:36px; border-radius:5px; cursor:pointer;
}
.seg-b:hover{color:var(--ink-2)}
.seg-b.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow)}
.seg-b:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- cartões / campos ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-p{padding:16px}
.grid{display:grid; gap:12px}
.linha{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.campo{display:flex; flex-direction:column; gap:5px}
.campo>label{font-size:.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.campo input,.campo select,.campo textarea{
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:10px 11px; font-size:.92rem; width:100%; min-height:42px;
}
.campo textarea{min-height:110px; resize:vertical; line-height:1.6}
.campo .dica{font-size:.72rem; color:var(--muted)}

.eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.vazio{text-align:center; padding:44px 22px; color:var(--muted)}
.vazio h2{color:var(--ink); margin-bottom:8px}
.vazio p{max-width:44ch; margin:0 auto 18px; font-size:.9rem}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:.72rem; font-weight:600; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line); white-space:nowrap;
}
.pill-a{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.pill-w{background:var(--alerta-soft); color:var(--alerta); border-color:var(--alerta)}
.pill-e{background:var(--erro-soft); color:var(--erro); border-color:var(--erro)}

/* ---------- lista de experimentos ---------- */
.exp-lista{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* --- grupos lado a lado, como as listas do Trello --- */
.quadros{
  display:flex; gap:12px; overflow-x:auto; overflow-y:visible;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  padding-bottom:10px; scrollbar-width:thin
}
.quadros::-webkit-scrollbar{height:7px}
.quadros::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px}
.quadro{
  /* 84% no celular deixa a coluna seguinte espiando — é o que ensina que dá
     para deslizar, sem precisar de seta nem instrução. */
  flex:0 0 min(84%, 300px); scroll-snap-align:start;
  display:flex; flex-direction:column; gap:9px
}
.quadro-cab{
  display:flex; align-items:center; gap:8px; padding:0 3px 7px;
  border-bottom:2px solid var(--line-2); position:sticky; top:0;
  background:var(--ground); z-index:1
}
.quadro-nome{
  font-family:Archivo,system-ui,sans-serif; font-weight:600; font-size:.9rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1
}
.quadro-n{
  font-size:.72rem; font-weight:600; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:99px; padding:1px 8px; flex:none
}
.quadro[data-solto] .quadro-nome{color:var(--muted); font-style:italic}
.quadro-corpo{display:flex; flex-direction:column; gap:10px}
.quadro-vazio{
  border:1px dashed var(--line-2); border-radius:var(--r); padding:18px 12px;
  text-align:center; font-size:.82rem; color:var(--muted)
}
.dica-quadros{font-size:.76rem; color:var(--muted); margin:2px 0 0; text-align:center}
@media (min-width:760px){
  .quadro{flex:0 0 300px}
  .dica-quadros{display:none}
}
.exp-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:10px; transition:border-color .12s,transform .12s;
}
.exp-card:hover{border-color:var(--accent-line)}
.exp-card h3{font-size:1rem}
/* a área de cima do cartão é o que abre o ensaio; o rodapé fica para o seletor */
.exp-abrir{cursor:pointer; display:flex; flex-direction:column; gap:2px; flex:1}
.exp-abrir:hover h3{color:var(--accent)}
.exp-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
.exp-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
/* Cartão curto: duas linhas, sem o rodapé de contagens. */
.exp-card.exp-curto{gap:8px; padding:13px 14px}
.exp-card.exp-curto h3{font-size:.97rem; line-height:1.3}
/* O seletor de grupo é a própria etiqueta: edita no lugar, sem parecer
   formulário e sem custar uma linha inteira do cartão. */
.chip-grupo{
  appearance:none; -webkit-appearance:none;
  padding:3px 22px 3px 9px; border-radius:99px;
  font:600 .72rem/1.5 inherit; font-family:inherit;
  background:var(--surface-2) no-repeat right 7px center;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-size:4px 4px,4px 4px;
  background-position:calc(100% - 11px) calc(50% + 1px),calc(100% - 7px) calc(50% + 1px);
  color:var(--muted); border:1px solid var(--line); max-width:52%;
  text-overflow:ellipsis; white-space:nowrap; cursor:pointer
}
.chip-grupo.tem{background-color:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.chip-grupo:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* --- etiquetas de estado --- */
.etq-barras{display:flex; gap:4px; margin-bottom:2px}
.etq-barra{height:6px; flex:1; max-width:44px; border-radius:99px}
.chip-etq{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2);
  font:600 .72rem/1.5 inherit; cursor:pointer; max-width:100%
}
.chip-etq:hover{border-color:var(--accent-line)}
.etq-ponto{width:8px; height:8px; border-radius:99px; flex:none}
.etq-nome{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* a etiqueta cheia, usada na lista de escolha e na tela de edição */
.etq-cheia{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:6px;
  color:#fff; font-weight:600; font-size:.85rem; border:0; cursor:pointer;
  width:100%; text-align:left; min-height:38px
}
.etq-lista{display:flex; flex-direction:column; gap:7px; margin:4px 0 2px}
.etq-linha{display:flex; align-items:center; gap:8px}
.etq-check{flex:none; width:18px; font-size:1rem; text-align:center}
input[type="color"]{
  width:42px; height:38px; padding:2px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); cursor:pointer; flex:none
}
.exp-num{display:flex; gap:16px; border-top:1px solid var(--line); padding-top:10px; margin-top:auto}
.exp-num div{display:flex; flex-direction:column}
.exp-num b{font-family:"IBM Plex Mono",monospace; font-size:1.05rem; font-weight:600; line-height:1}
.exp-num span{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px}

/* ---------- malha blocos x tratamentos ---------- */
.malha-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.malha{border-collapse:collapse; width:100%; min-width:max-content}
table.malha th,table.malha td{border:1px solid var(--line); padding:0; text-align:center}
table.malha thead th{
  background:var(--surface-2); font-size:.72rem; font-weight:600; padding:8px 10px;
  color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0;
}
table.malha tbody th{
  background:var(--surface-3); text-align:left; padding:8px 11px; font-size:.82rem;
  font-weight:500; position:sticky; left:0; z-index:2; min-width:150px; max-width:220px;
}
table.malha tbody th small{display:block; color:var(--muted); font-size:.7rem; font-weight:400}
table.malha td input{
  border:0; background:none; width:100%; min-width:74px; padding:11px 6px; text-align:center;
  font-family:"IBM Plex Mono",monospace; font-size:.92rem; font-variant-numeric:tabular-nums;
  min-height:44px;
}
table.malha td input:focus{background:var(--accent-soft); outline:2px solid var(--accent); outline-offset:-2px}
table.malha td input.invalido{color:var(--erro); font-weight:700; background:color-mix(in srgb, var(--erro) 12%, transparent)}
table.malha td.media{background:var(--surface-3); font-family:"IBM Plex Mono",monospace; font-size:.88rem; font-weight:600; padding:9px 11px}
table.malha tr.rodape th,table.malha tr.rodape td{background:var(--surface-2); font-size:.82rem; padding:8px 10px; font-family:"IBM Plex Mono",monospace}
/* No croqui a coluna "Parcela" é só um número de ordem: fica estreita, e o
   espaço que sobra vai para as colunas dos blocos, que é onde se lê o mapa. */
table.malha.croqui th:first-child{width:52px; min-width:52px; max-width:52px}
table.malha.croqui td input{min-width:0}

/* ---------- tabelas de resultado ---------- */
.tab-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.dados{border-collapse:collapse; width:100%; font-size:.85rem}
table.dados th,table.dados td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
table.dados th:first-child,table.dados td:first-child{text-align:left}
table.dados thead th{
  background:var(--surface-2); font-size:.7rem; text-transform:uppercase; letter-spacing:.05em;
  font-weight:600; color:var(--ink-2);
}
table.dados td{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
table.dados td:first-child{font-family:Archivo,sans-serif}
table.dados tbody tr:last-child td{border-bottom:0}
/* Tabela final: colunas centradas como na tabela do relatório; o cabeçalho quebra
   em linhas (nome, unidade, dias) para não esticar a tabela para os lados. */
table.tab-final th,table.tab-final td{text-align:center}
table.tab-final thead th{white-space:normal; vertical-align:bottom; text-transform:none; letter-spacing:0; font-size:.78rem}
.tf-sub{font-weight:400; color:var(--muted); font-size:.72rem}
table.tab-final tr.tf-cv td{border-top:2px solid var(--line-2); background:var(--surface-2); font-weight:600}
.letra{font-weight:700; color:var(--accent); margin-left:2px}
/* Protocolo impresso: listras alternadas por tratamento, como na caderneta.
   Tudo centralizado — é um quadro de conferência, não um texto corrido, e o
   olho desce coluna por coluna procurando o valor. */
table.protocolo-tab th,table.protocolo-tab td,
table.protocolo-tab th:first-child,table.protocolo-tab td:first-child{text-align:center}
table.protocolo-tab tbody tr.par td{background:var(--surface-3)}
table.protocolo-tab td{border-bottom:1px solid var(--line)}
table.protocolo-tab tbody tr:last-child td{border-bottom:0}

/* ---------- fotos ---------- */
.galeria{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.foto-item{
  position:relative; aspect-ratio:1; border-radius:var(--r-sm); overflow:hidden;
  border:1px solid var(--line); background:var(--surface-2); cursor:pointer; padding:0;
}
.foto-item img{width:100%; height:100%; object-fit:cover; display:block}
.foto-tag{
  position:absolute; left:0; right:0; bottom:0; padding:14px 6px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.78)); color:#fff;
  font-size:.66rem; font-weight:600; text-align:left; line-height:1.25;
  font-family:"IBM Plex Mono",monospace;
}
/* Foto com etiqueta embaixo: a etiqueta é o produto final que vai para o
   relatório, então ela ocupa espaço de verdade e não é um rodapé sobre a imagem. */
/* Linha do tratamento: a linha inteira abre e fecha, porque no campo se toca
   com o polegar e uma seta de 12px não é alvo. */
.trat-abrir{
  display:flex; align-items:center; gap:9px; flex:1; min-width:0; cursor:pointer;
  padding:4px 2px; border-radius:var(--r-sm);
}
.trat-abrir:hover h3{color:var(--accent)}
.trat-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.trat-seta{color:var(--muted); flex:none; font-size:.9rem; transition:transform .15s}
.trat-seta.on{transform:rotate(90deg); color:var(--accent)}
@media(prefers-reduced-motion:reduce){ .trat-seta{transition:none} }

.foto-grade{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.foto-cartao{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column;
}
.foto-face{
  border:0; padding:0; background:var(--surface-2); cursor:pointer; display:block;
  width:100%; aspect-ratio:4/3;
}
.foto-face img{width:100%; height:100%; object-fit:cover; display:block}
/* O lugar da foto que ainda está no servidor: ocupa o mesmo espaço da imagem,
   para a grade não pular quando ela chegar. */
.foto-nuvem{display:flex; align-items:center; justify-content:center;
  width:100%; height:100%; background:var(--surface-3); color:var(--muted);
  font-size:1.1rem; letter-spacing:.05em}
.foto-face:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
/* A etiqueta usa a mesma fonte na tela e na imagem exportada, para o que se vê
   aqui ser o que sai no arquivo. */
.foto-etiq{
  padding:8px; font-size:.78rem; line-height:1.35; color:var(--ink-2);
  font-family:Calibri,Carlito,"Segoe UI",Roboto,sans-serif; word-break:break-word;
}
.lightbox{
  position:fixed; inset:0; z-index:100; background:rgba(10,12,8,.94);
  display:flex; flex-direction:column; padding:12px;
}
.lightbox img{flex:1; min-height:0; object-fit:contain; width:100%}
.lightbox-info{color:#E9EDDF; padding:12px 4px; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}

/* ---------- diversos ---------- */
.barra{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.barra i.w{background:var(--alerta)} .barra i.e{background:var(--erro)}

<div id="app"></div>

<script>
"use strict";

/* ============================ ESTADO ============================ */
let ST = {experimentos:[], versao:1};
let TELA = {nome:"home", expId:null, aba:"protocolo", avId:null};
/* `leitura` fica falso para sempre: no app instalado quem abre é dono do caderno
   do próprio aparelho. O campo continua existindo porque a interface o consulta. */
let PERSIST = {pend:false, salvando:false, erro:null, leitura:false, ultimo:null};
let SYNC = {rodando:false, quando:null, erro:null};
let TIMER = null;
/* Para onde vai a próxima foto — preenchido antes de abrir a câmera, lido quando
   o arquivo volta. É o que liga o toque no tratamento à imagem que chega depois. */
let FOTO_ALVO = null;
/* Enquanto a câmera do celular está na frente, esta página fica em segundo plano.
   Salvar aí republica o documento e RECARREGA a view — e a foto volta para uma
   página nova, que não sabe mais de onde veio: perdia-se a primeira de cada duas.
   Com a câmera aberta, todo salvamento espera. */
let CAMERA_ABERTA = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function hoje(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dataBr(s){ if(!s) return "—"; const p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return Number.isFinite(n)?n:null; }
function fmt(n,d){ if(n==null||!Number.isFinite(n)) return "—"; return n.toLocaleString("pt-BR",{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}); }
function exp(){ return ST.experimentos.find(e=>e.id===TELA.expId) || null; }

/* Normaliza ensaios gravados por versões anteriores: um tratamento passou a ter
   vários produtos, o ensaio ganhou fatores, vazão e anotações livres. Roda na
   abertura, sem apagar nada do que já estava lá. */
/* As etiquetas dizem o ESTADO do ensaio, e é o que se quer enxergar de manhã:
   o que está atrasado, o que falta relatório, o que já colheu. Um ensaio pode
   ter mais de uma — "colheita próxima" e "relatório pendente" convivem — por
   isso é lista, e não um campo único.
   Estas seis são as que a equipe já usava no Trello, com as mesmas cores. */
const ETIQUETAS_PADRAO = [
  {id:"et-finalizado", nome:"Finalizado",         cor:"#1F845A"},
  {id:"et-andamento",  nome:"Em andamento",       cor:"#946F00"},
  {id:"et-colheita",   nome:"Colheita próxima",   cor:"#B65C02"},
  {id:"et-relatorio",  nome:"Relatório pendente", cor:"#C9372C"},
  {id:"et-perdido",    nome:"Ensaio perdido",     cor:"#803FA5"},
  {id:"et-inicio",     nome:"Pendente de início", cor:"#1D66C9"}
];
function migrar(){
  if(!Array.isArray(ST.modelos)) ST.modelos = [];   // croquis reutilizáveis
  if(!Array.isArray(ST.grupos))  ST.grupos  = [];   // pastas por safra, cliente, cultura…
  /* Só na primeira vez. Depois disso quem manda é o que o usuário editou —
     inclusive apagar todas, se for o caso. */
  if(!Array.isArray(ST.etiquetas)) ST.etiquetas = JSON.parse(JSON.stringify(ETIQUETAS_PADRAO));
  (ST.experimentos||[]).forEach(e=>{
    if(typeof e.grupoId !== "string") e.grupoId = "";
    if(!Array.isArray(e.etiquetas)) e.etiquetas = [];
    /* Nome padrão virou "T1, T2…". Só muda o que ainda está EXATAMENTE no
       padrão antigo — um nome que alguém escreveu não é tocado. */
    (e.tratamentos||[]).forEach(t=>{
      const m = /^Tratamento (\d+)$/.exec(t.nome||"");
      if(m) t.nome = "T" + m[1];
    });
    /* O protocolo passou a travar depois de salvo. Ensaio que já tem texto
       começa travado — era justamente o toque acidental que se queria evitar;
       o que está vazio começa aberto, para dar para escrever. */
    if(typeof e.protocoloTravado !== "boolean"){
      const p = e.protocolo || {};
      e.protocoloTravado = !!((p.objetivo||"").trim() || (p.metodologia||"").trim() || (p.observacoes||"").trim());
    }
    // etiqueta apagada não pode deixar referência solta no ensaio
    e.etiquetas = e.etiquetas.filter(id=>ST.etiquetas.some(x=>x.id===id));
    /* Carimbo de quando este ensaio mudou pela última vez: é por ele que a
       sincronização decide, ensaio a ensaio, qual versão é a boa. */
    if(typeof e.atualizado !== "string") e.atualizado = e.criado || "1970-01-01T00:00:00.000Z";
    if(typeof e.croquiTravado !== "boolean") e.croquiTravado = false;
    /* Aplicações: A, B, C… cada uma com o estádio em que foi feita. É o que liga
       a coluna "Aplicação" de cada produto ao momento real da pulverização. */
    if(!Array.isArray(e.aplicacoes)) e.aplicacoes = [];
    if(typeof e.aplicTravado !== "boolean") e.aplicTravado = false;
    /* Quadros de foto: cada um é uma saída a campo ("Altura de plantas — 45 DAE"),
       e dentro dele as fotos ficam agrupadas por tratamento. */
    if(!Array.isArray(e.sessoesFoto)) e.sessoesFoto = [];
    (e.fotos||[]).forEach(f=>{
      if(typeof f.sessaoId !== "string") f.sessaoId = "";
      if(!f.etiq || typeof f.etiq !== "object"){
        /* A legenda antiga vira o texto livre da etiqueta; o resto é montado
           a partir do tratamento e do quadro, e o usuário liga o que quiser. */
        f.etiq = {trat:true, prod:false, aval:true, data:true, texto:f.legenda||""};
        delete f.legenda;
      }
    });
    /* Esquema declarado pelo usuário. Em ensaios antigos ele é deduzido: quem já
       tinha fator estava em fatorial, o resto em simples. */
    if(e.esquema !== "simples" && e.esquema !== "fatorial")
      e.esquema = (e.fatores||[]).length ? "fatorial" : "simples";
    (e.avaliacoes||[]).forEach(av=>{
      if(typeof av.travada !== "boolean") av.travada = false;
    });
    if(e.vazao === undefined) e.vazao = "";
    if(e.teste === "fisher") e.teste = "t";          // renomeado
    if(!TESTES[e.teste]) e.teste = "tukey";
    if(!(e.alfa===0.01 || e.alfa===0.05 || e.alfa===0.10)) e.alfa = 0.05;
    if(typeof e.controle !== "number") e.controle = 0;
    if(typeof e.travado !== "boolean") e.travado = false;
    if(!Array.isArray(e.fatores)) e.fatores = [];
    if(!Array.isArray(e.relatorios)) e.relatorios = [];     // PDFs do relatório final
    if(typeof e.coordenadas !== "string") e.coordenadas = "";
    // observação comum a todos os tratamentos (adjuvante, volume de calda…)
    if(typeof e.obsTratamentos !== "string") e.obsTratamentos = "";
    if(typeof e.obsTratTravado !== "boolean") e.obsTratTravado = !!e.obsTratamentos.trim();
    /* Fatores também travam depois de salvos. Começa travado quem já tem fator
       completo (nome e dois níveis com nome); o resto começa aberto. */
    if(typeof e.fatoresTravado !== "boolean"){
      e.fatoresTravado = e.fatores.length>0 && e.fatores.every(f=>(f.nome||"").trim()
        && (f.niveis||[]).length>=2 && f.niveis.every(n=>(n.nome||"").trim()));
    }
    if(!e.protocolo) e.protocolo = {objetivo:"", metodologia:"", observacoes:""};
    if(!Array.isArray(e.protocolo.anotacoes)) e.protocolo.anotacoes = [];
    (e.tratamentos||[]).forEach(t=>{
      if(!Array.isArray(t.produtos)){
        t.produtos = (t.produto || t.dose)
          ? [{id:uid(), nome:t.produto||"", dose:t.dose||"", unidade:"", aplicacao:""}]
          : [{id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}];
        delete t.produto; delete t.dose; delete t.unidade;
      }
      t.produtos.forEach(p=>{
        if(typeof p.unidade   !== "string") p.unidade   = "";
        if(typeof p.aplicacao !== "string") p.aplicacao = "";
      });
      if(!t.niveis || typeof t.niveis !== "object") t.niveis = {};
    });
  });
}
/* Texto de uma linha só com todos os produtos do tratamento, para as tabelas
   e para a exportação. */
function doseTexto(t){
  return (t.produtos||[])
    .map(p=>[p.nome, [p.dose,p.unidade].filter(Boolean).join(" ")].filter(Boolean).join(" "))
    .filter(Boolean).join(" + ");
}
/* Rótulos disponíveis para a coluna Aplicação: os que o ensaio definiu, mais as
   combinações de duas (AB, BC…) — é comum um adjuvante entrar em mais de uma. */
function rotulosAplicacao(e){
  const base = (e.aplicacoes||[]).map(a=>a.rotulo).filter(Boolean);
  const combos = [];
  for(let i=0;i<base.length;i++)
    for(let j=i+1;j<base.length;j++) combos.push(base[i]+base[j]);
  return base.concat(combos);
}
/* Testemunha não recebe produto nem aplicação: não faz sentido preencher nela
   a unidade ou a letra que vale para os tratados. */
function ehProdutoTestemunha(p){ return /testemunha/i.test((p && p.nome) || ""); }
/* Com uma aplicação só no ensaio, não há o que escolher: todo produto sem
   aplicação recebe ela. Poupa marcar "A" em linha por linha. */
function preencherAplicacaoUnica(e){
  const base = (e.aplicacoes||[]).map(a=>a.rotulo).filter(Boolean);
  if(base.length !== 1) return 0;
  let n = 0;
  (e.tratamentos||[]).forEach(t=>(t.produtos||[]).forEach(p=>{
    if(!p.aplicacao && !ehProdutoTestemunha(p)){ p.aplicacao = base[0]; n++; }
  }));
  return n;
}
function aplicacoesTexto(e){
  return (e.aplicacoes||[])
    .filter(a=>a.rotulo)
    .map(a=>a.rotulo + (a.estadio ? " em "+a.estadio : "")
                     + (a.data ? " ("+dataBr(a.data)+")" : ""))
    .join(" · ");
}
/* Etiqueta da foto: montada na hora a partir do que o usuário mandou aparecer.
   Guardar só as chaves — e não o texto pronto — faz a etiqueta acompanhar as
   correções: renomeou o tratamento ou trocou a dose, a etiqueta segue certa. */
const ETIQ_PARTES = [
  ["aval", "Avaliação"], ["trat", "Tratamento"], ["prod", "Produtos"], ["data", "Data"]
];
function etiquetaTexto(e, f){
  const q = f.etiq || {};
  const t = e.tratamentos.find(x=>x.id===f.tratId);
  const s = (e.sessoesFoto||[]).find(x=>x.id===f.sessaoId);
  const partes = [];
  if(q.aval && s && s.titulo) partes.push(s.titulo);
  if(q.trat && t) partes.push("T"+t.num+(t.nome?" — "+t.nome:"")+(f.bloco?" · Bloco "+f.bloco:""));
  if(q.prod && t && doseTexto(t)) partes.push(doseTexto(t));
  if(q.data && f.data) partes.push(dataBr(f.data));
  if(q.texto) partes.push(q.texto);
  return partes.join(" · ");
}
function fatorTexto(e, t){
  return (e.fatores||[]).map(f=>{
    const n = (f.niveis||[]).find(x=>x.id===t.niveis[f.id]);
    return n ? n.nome : null;
  }).filter(Boolean).join(" × ");
}
/* Um ensaio só é analisado como fatorial quando os tratamentos cobrem
   exatamente todas as combinações dos níveis, uma vez cada. */
/* Reconhece o fatorial, com ou sem tratamento adicional (3×3+1, 2×4+1…).
   Adicional é o tratamento SEM nível nenhum — tipicamente a testemunha. Ele
   fica fora do fatorial e entra na análise como um contraste próprio.
   Até a versão 14, um tratamento a mais fazia esta função devolver null e o app
   analisava tudo como tratamentos simples, sem avisar: o ensaio de glifosato
   3×3+1 saiu sem o desdobramento dose × volume, que era a pergunta dele. */
function ehFatorial(e){
  const f = (e.fatores||[]).filter(x=>(x.niveis||[]).length>=2);
  if(f.length < 2) return null;
  const combos = f.reduce((a,x)=>a*x.niveis.length, 1);
  const vistos = new Set(), adicionais = [];
  for(let i=0;i<e.tratamentos.length;i++){
    const t = e.tratamentos[i];
    const niv = f.map(x=>(t.niveis||{})[x.id]||"");
    if(niv.every(v=>!v)){ adicionais.push(i); continue; }   // sem nível: adicional
    if(niv.some(v=>!v)) return null;                        // nível pela metade: ambíguo
    const chave = niv.join("|");
    if(vistos.has(chave)) return null;                      // combinação repetida
    vistos.add(chave);
  }
  if(vistos.size !== combos) return null;                   // falta combinação
  // parcela subdividida pressupõe o fatorial puro: com adicional, não se aplica
  if(adicionais.length && e.delineamento === "SPLIT") return null;
  const r = f.slice();
  r.adicionais = adicionais;
  return r;
}
/* "3 × 3" ou "3 × 3 + 1" */
function arranjoTexto(fat){
  return fat.map(f=>f.niveis.length).join(" × ")
    + ((fat.adicionais||[]).length ? " + " + fat.adicionais.length : "");
}

/* ============================ ESTATÍSTICA ============================ */
// distribuição F -> p-valor, via função beta incompleta regularizada
function lnGama(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
           12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x)) - lnGama(1-x);
  x-=1; let a=0.99999999999980993, t=x+7.5;
  for(let i=0;i<8;i++) a+=g[i]/(x+i+1);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function betaCF(a,b,x){
  const FP=1e-300, EPS=3e-14; let qab=a+b, qap=a+1, qam=a-1;
  let c=1, d=1-qab*x/qap; if(Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for(let m=1;m<=300;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betaInc(a,b,x){
  if(x<=0) return 0; if(x>=1) return 1;
  const bt = Math.exp(lnGama(a+b)-lnGama(a)-lnGama(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betaCF(a,b,x)/a : 1-bt*betaCF(b,a,1-x)/b;
}
function pValorF(f, gl1, gl2){
  if(!Number.isFinite(f)||f<=0||gl1<=0||gl2<=0) return null;
  return Math.max(0, Math.min(1, betaInc(gl2/2, gl1/2, gl2/(gl2+gl1*f))));
}
// t de Student: valor crítico bicaudal, para a DMS de Fisher
function tCDF(t, gl){
  const p = 0.5*betaInc(gl/2, 0.5, gl/(gl+t*t));
  return t>0 ? 1-p : p;
}
function tCrit(alfa, gl){
  let lo=0, hi=200;
  for(let i=0;i<160;i++){
    const m=(lo+hi)/2;
    if(2*(1-tCDF(m,gl)) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
// gama incompleta regularizada, para o qui-quadrado do Scott-Knott
function gamaInc(s, x){
  if(x<=0 || s<=0) return 0;
  if(x < s+1){
    let soma=1/s, termo=soma;
    for(let n=1;n<300;n++){
      termo *= x/(s+n); soma += termo;
      if(Math.abs(termo) < Math.abs(soma)*1e-15) break;
    }
    return soma*Math.exp(-x + s*Math.log(x) - lnGama(s));
  }
  let b=x+1-s, c=1e300, d=1/b, h=d;
  for(let i=1;i<300;i++){
    const an=-i*(i-s);
    b+=2; d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
    c=b+an/c;      if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<1e-15) break;
  }
  return 1 - Math.exp(-x + s*Math.log(x) - lnGama(s))*h;
}
function quiCrit(alfa, gl){
  let lo=0, hi=2000;
  for(let i=0;i<200;i++){
    const m=(lo+hi)/2;
    if(1-gamaInc(gl/2, m/2) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}

/* Médias dos níveis de um fator, comparadas com um erro específico. Em parcelas
   subdivididas cada fator tem o seu: o da parcela é testado contra o Erro(a) e o
   da subparcela contra o Erro(b) — usar um só para os dois falseia as letras. */
function mediasDoFator(f, trats, somaT, nRep, qmErro, glErro, nObs, teste, alfa){
  alfa = alfa||0.05;
  const soma={}, n={};
  f.niveis.forEach(nv=>{ soma[nv.id]=0; n[nv.id]=0; });
  trats.forEach((t,i)=>{
    const nv=t.niveis[f.id];
    if(soma[nv]===undefined) return;
    soma[nv]+=somaT[i]; n[nv]+=nRep;
  });
  const lst = f.niveis.map((nv,k)=>({i:k, nome:nv.nome, media: n[nv.id] ? soma[nv.id]/n[nv.id] : null}))
                      .filter(x=>x.media!=null).sort((a,b)=>b.media-a.media);
  const rep = nObs || n[f.niveis[0].id] || nRep;
  const r = letrasDoTeste(lst, teste, qmErro, glErro, rep, alfa);
  lst.forEach((x,k)=>{ x.letra = r.letras[k]; });
  return {fator:f.nome||"Fator", dms:r.dms, teste:r.nome, linhas:lst, soma, n};
}

/* ---- Distribuição da amplitude estudentizada, calculada por quadratura ----
   Tabelas impressas limitam o app ao que couber nelas (12 tratamentos, 5%).
   Integrando a distribuição, qualquer número de tratamentos e qualquer nível
   de significância saem do mesmo código. Conferido em 29/09/2026 contra as
   tabelas clássicas a 5% (Tukey k=2…12 e Duncan p=2…10, GL 2…120): diferença
   máxima de 0,14%, o arredondamento da própria tabela. As tabelas, que
   ficavam aqui sem uso, saíram na v20. */
function phi(z){                                   // densidade normal padrão
  return 0.3989422804014327*Math.exp(-z*z/2);
}
function Phi(z){                                   // CDF normal (erro < 7.5e-8)
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = phi(z);
  const p = d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937
            + t*(-1.821255978 + t*1.330274429))));
  return z > 0 ? 1-p : p;
}
/* P(amplitude de k normais padrão ≤ w) */
function pAmplitude(w, k){
  if(w <= 0) return 0;
  const lo=-8, hi=8, n=72, h=(hi-lo)/n;
  let s = 0;
  for(let i=0;i<=n;i++){
    const z = lo + i*h;
    const dif = Phi(z) - Phi(z-w);
    const f = phi(z) * Math.pow(dif>0?dif:0, k-1);
    s += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, k*s*h/3);
}
/* P(amplitude estudentizada ≤ q) com `gl` graus de liberdade no resíduo */
function pTukeyDist(q, k, gl){
  if(q <= 0) return 0;
  if(!(gl > 0)) return pAmplitude(q, k);
  if(gl > 25000) return pAmplitude(q, k);
  // integra sobre s = sqrt(qui²/gl), cuja densidade se concentra perto de 1
  const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
  // com 1 ou 2 graus de liberdade a cauda é longuíssima e precisa de mais alcance
  const larg = (gl<3 ? 40 : 12)/Math.sqrt(gl);
  const lo = Math.max(1e-7, 1-larg), hi = 1+larg;
  // e a malha acompanha a largura, senão o passo fica grosso demais
  const n = 2*Math.ceil(Math.max(28, (hi-lo)*16)), h = (hi-lo)/n;
  let acc = 0;
  for(let i=0;i<=n;i++){
    const s = lo + i*h;
    const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
    const f = dens * pAmplitude(q*s, k);
    acc += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, acc*h/3);
}
/* q crítico: valor com P(Q ≤ q) = 1-alfa */
const _cacheQ = {};
function qCrit(alfa, k, gl){
  if(k < 2) return null;
  const chave = alfa+"|"+k+"|"+Math.round(gl);
  if(_cacheQ[chave] != null) return _cacheQ[chave];
  let lo = 0.1, hi = 200;
  for(let i=0;i<32;i++){
    const m = (lo+hi)/2;
    if(pTukeyDist(m, k, gl) < 1-alfa) lo = m; else hi = m;
  }
  return _cacheQ[chave] = (lo+hi)/2;
}
/* Duncan: amplitude estudentizada num nível protegido, alfa_p = 1−(1−alfa)^(p−1).
   Com poucos graus de liberdade a integral passa a DECRESCER com p — exigir menos
   para comparar médias mais distantes, o que não faz sentido. A tabela clássica
   satura nesse ponto; o máximo acumulado reproduz esse comportamento. */
const _cacheDun = {};
function rDuncan(alfa, p, gl){
  if(p < 2) return null;
  const chave = alfa+"|"+p+"|"+Math.round(gl);
  if(_cacheDun[chave] != null) return _cacheDun[chave];
  let mx = 0;
  for(let j=2;j<=p;j++){
    const v = qCrit(1-Math.pow(1-alfa, j-1), j, gl);
    if(v > mx) mx = v;
  }
  return _cacheDun[chave] = mx;
}

/* Dunnett: todos os tratamentos contra UMA testemunha. As m comparações
   dividem o mesmo controle, o que as correlaciona (ρ = ½); ignorar isso e
   usar o t comum daria mais diferenças significativas do que existem. */
const _cacheD = {};
function dDunnett(alfa, m, gl, bilateral){
  if(m < 1) return null;
  const chave = alfa+"|"+m+"|"+Math.round(gl)+"|"+(bilateral?"2":"1");
  if(_cacheD[chave] != null) return _cacheD[chave];
  const R2 = Math.SQRT2;
  const prob = d => {                       // P(max|T| ≤ d)
    const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
    const larg = 12/Math.sqrt(gl);
    const slo = Math.max(1e-7, 1-larg), shi = 1+larg, ns = 48, hs = (shi-slo)/ns;
    let out = 0;
    for(let i=0;i<=ns;i++){
      const s = slo + i*hs;
      const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
      // ∫ φ(u) [Φ(u+√2·d·s) − Φ(u−√2·d·s)]^m du   (bilateral)
      const lo=-8, hi=8, nu=64, hu=(hi-lo)/nu;
      let inner = 0;
      for(let j=0;j<=nu;j++){
        const u = lo + j*hu;
        const w = R2*d*s;
        const dif = bilateral ? (Phi(u+w) - Phi(u-w)) : Phi(u+w);
        const f = phi(u) * Math.pow(dif>0?dif:0, m);
        inner += (j===0||j===nu ? 1 : (j%2 ? 4 : 2)) * f;
      }
      out += (i===0||i===ns ? 1 : (i%2 ? 4 : 2)) * dens * (inner*hu/3);
    }
    return Math.min(1, out*hs/3);
  };
  let lo = 0.1, hi = 60;
  for(let i=0;i<30;i++){
    const md = (lo+hi)/2;
    if(prob(md) < 1-alfa) lo = md; else hi = md;
  }
  return _cacheD[chave] = (lo+hi)/2;
}

/* Letras quando o valor crítico DEPENDE de quantas médias a comparação abrange
   (Duncan). Como as médias estão ordenadas, o par mais distante de um grupo é
   o par das pontas: basta testá-lo para saber se o grupo se sustenta. */
function letrasPorAmplitude(ord, critDeP){
  const n = ord.length, grupos = [];
  const difere = (i,j) => (ord[i].media - ord[j].media) > critDeP(j-i+1);
  for(let i=0;i<n;i++){
    let j=i;
    while(j+1<n && !difere(i,j+1)) j++;
    if(!grupos.length || j>grupos[grupos.length-1][1]) grupos.push([i,j]);
  }
  const letras = new Array(n).fill("");
  grupos.forEach((g,gi)=>{
    const L=String.fromCharCode(97+gi);
    for(let k=g[0];k<=g[1];k++) letras[k]+=L;
  });
  return letras;
}

/* Letras a partir de grupos contíguos sobre médias ordenadas — a mesma regra
   serve para Tukey e para a DMS de Fisher, mudando só o valor da diferença. */
function letrasPorDMS(ord, dms){
  const grupos=[];
  for(let i=0;i<ord.length;i++){
    let j=i;
    while(j+1<ord.length && (ord[i].media-ord[j+1].media)<=dms) j++;
    if(!grupos.length || j>grupos[grupos.length-1][1]) grupos.push([i,j]);
  }
  const letras = new Array(ord.length).fill("");
  grupos.forEach((g,gi)=>{
    const L=String.fromCharCode(97+gi);
    for(let k=g[0];k<=g[1];k++) letras[k]+=L;
  });
  return letras;
}

/* Scott-Knott: parte o conjunto de médias em dois grupos pela divisão que
   maximiza a soma de quadrados entre grupos, testa a divisão por razão de
   verossimilhança e repete em cada metade. Ao contrário de Tukey e Fisher,
   não produz grupos sobrepostos — cada média cai em exatamente um grupo. */
function scottKnott(medias, qmRes, nRep, glRes, alfa){
  const grupos = [];
  (function partir(lista){
    if(lista.length === 1){ grupos.push(lista); return; }
    const k = lista.length;
    const total = lista.reduce((a,x)=>a+x.media,0);
    /* Variância das médias estimada DENTRO do grupo que se está partindo, como
       no método original (Scott & Knott, 1974) e no SISVAR. Até a v19 usava a
       do conjunto inteiro em todas as etapas: nos subgrupos ela saía inflada,
       e o teste deixava de separar médias que diferiam. */
    const mG = total/k;
    const ssG = lista.reduce((a,x)=>a+(x.media-mG)*(x.media-mG), 0);
    const sigma2 = (ssG + glRes*(qmRes/nRep)) / (k + glRes);
    let melhor=-Infinity, corte=-1, s1=0;
    for(let i=0;i<k-1;i++){
      s1 += lista[i].media;
      const n1=i+1, n2=k-n1, s2=total-s1;
      const B0 = s1*s1/n1 + s2*s2/n2 - total*total/k;
      if(B0 > melhor){ melhor=B0; corte=i; }
    }
    const lambda = sigma2>0 ? (Math.PI/(2*(Math.PI-2))) * (melhor/sigma2) : 0;
    const glL = k/(Math.PI-2);
    if(lambda > quiCrit(alfa, glL)){
      partir(lista.slice(0,corte+1));
      partir(lista.slice(corte+1));
    } else grupos.push(lista);
  })(medias.slice().sort((a,b)=>b.media-a.media));

  const letras = {};
  grupos.sort((a,b)=>b[0].media-a[0].media).forEach((g,gi)=>{
    const L = String.fromCharCode(97+gi);
    g.forEach(x=>{ letras[x.i] = L; });
  });
  return letras;
}

/* Letras de um conjunto de médias, JÁ ORDENADAS da maior para a menor, pelo
   teste escolhido. Uma regra só para tratamentos, médias de cada fator e
   parcela subdividida. Até a v19 havia três cópias, e duas procuravam o teste
   pelo nome antigo ("fisher"): quem escolhia t (DMS) via as médias dos fatores
   comparadas por Tukey, sem aviso — e o Duncan também caía no Tukey ali.
   Dunnett não se aplica entre níveis de um fator (não há testemunha entre
   eles): nesse caso vale Tukey, e `nome` diz isso na tabela. */
function letrasDoTeste(ord, teste, qmErro, glErro, rep, alfa){
  const gl = Math.round(glErro);
  const ep = qmErro>=0 ? Math.sqrt(qmErro/rep) : null;
  const n = ord.length;
  let letras = new Array(n).fill("a"), dms = null, nome, critNome = "", critValor = null;
  if(teste === "sk"){
    nome = TESTES.sk.nome;
    const L = scottKnott(ord, qmErro, rep, glErro, alfa);
    letras = ord.map(x=>L[x.i] || "a");
  } else if(teste === "duncan"){
    nome = TESTES.duncan.nome;
    dms = ep!=null ? rDuncan(alfa, 2, gl)*ep : null;            // p=2 separa vizinhos
    critNome = "r(2…"+n+", "+gl+")"; critValor = rDuncan(alfa, n, gl);
    if(ep!=null) letras = letrasPorAmplitude(ord, p => rDuncan(alfa, p, gl)*ep);
  } else if(teste === "t"){
    nome = TESTES.t.nome;
    const t = tCrit(alfa, glErro);
    dms = qmErro>=0 ? t*Math.sqrt(2*qmErro/rep) : null;
    critNome = "t("+gl+")"; critValor = t;
    if(dms!=null) letras = letrasPorDMS(ord, dms);
  } else if(teste === "snk"){
    /* SNK (como no SISVAR): a amplitude estudentizada ao MESMO alfa, mas com p =
       quantas médias o par abrange. Vizinhos exigem menos que os extremos. */
    nome = TESTES.snk.nome;
    dms = ep!=null ? qCrit(alfa, 2, gl)*ep : null;
    critNome = "q(2…"+n+", "+gl+")"; critValor = qCrit(alfa, n, gl);
    if(ep!=null) letras = letrasPorAmplitude(ord, p => qCrit(alfa, p, gl)*ep);
  } else if(teste === "bonferroni"){
    // t com o alfa repartido entre as n(n−1)/2 comparações — o "t protegido" do SISVAR
    nome = TESTES.bonferroni.nome;
    const aB = alfa / Math.max(1, n*(n-1)/2);
    const t = tCrit(aB, glErro);
    dms = qmErro>=0 ? t*Math.sqrt(2*qmErro/rep) : null;
    critNome = "t("+gl+"; α/"+(n*(n-1)/2)+")"; critValor = t;
    if(dms!=null) letras = letrasPorDMS(ord, dms);
  } else if(teste === "scheffe"){
    // Scheffé (SASM-Agri): vale para qualquer contraste; é o mais exigente de todos
    nome = TESTES.scheffe.nome;
    const F = fCrit(alfa, n-1, glErro);
    dms = (F!=null && qmErro>=0) ? Math.sqrt((n-1)*F*2*qmErro/rep) : null;
    critNome = "F("+(n-1)+", "+gl+")"; critValor = F;
    if(dms!=null) letras = letrasPorDMS(ord, dms);
  } else {
    nome = TESTES.tukey.nome;
    const q = qCrit(alfa, n, gl);
    dms = (q!=null && ep!=null) ? q*ep : null;
    critNome = "q("+n+", "+gl+")"; critValor = q;
    if(dms!=null) letras = letrasPorDMS(ord, dms);
  }
  return {letras, dms, nome, critNome, critValor};
}

/* F crítico: o valor com P(F > f) = alfa, por bisseção sobre o p-valor. */
const _cacheF = {};
function fCrit(alfa, gl1, gl2){
  if(!(gl1>0) || !(gl2>0)) return null;
  const chave = alfa+"|"+gl1+"|"+Math.round(gl2*100);
  if(_cacheF[chave] != null) return _cacheF[chave];
  let lo = 1e-6, hi = 1e4;
  for(let i=0;i<80;i++){
    const m = (lo+hi)/2;
    if(pValorF(m, gl1, gl2) > alfa) lo = m; else hi = m;
  }
  return _cacheF[chave] = (lo+hi)/2;
}

/* ============ PRESSUPOSTOS DA ANÁLISE ============
   A ANOVA supõe resíduos normais e variâncias iguais entre tratamentos. O app
   testa as duas coisas em toda avaliação e avisa quando falham — é quando se
   pensa numa transformação (o botão "Recomendar" do SASM-Agri, logo abaixo). */

/* Inversa da normal padrão (Acklam), erro relativo < 1,2e-9. */
function normInv(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425;
  if(p<pl){ const q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ const q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  const q=p-0.5, r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
/* Shapiro-Wilk, pelo algoritmo de Royston (1995) — o mesmo do R. Serve de 3 a
   5000 valores. Devolve W e o p-valor; p pequeno = resíduos não normais. */
function shapiroWilk(xs){
  const x = xs.filter(Number.isFinite).slice().sort((a,b)=>a-b);
  const n = x.length;
  if(n < 3) return null;
  const media = x.reduce((a,b)=>a+b,0)/n;
  const ss = x.reduce((a,v)=>a+(v-media)*(v-media),0);
  if(!(ss > 1e-12*Math.max(1, media*media)*n)) return null;   // tudo igual: não há o que testar
  const pol = (c, u) => c.reduce((a,ci,i)=>a+ci*Math.pow(u,i),0);
  let a = new Array(n).fill(0);
  if(n === 3){ a[0] = -Math.SQRT1_2; a[2] = Math.SQRT1_2; }
  else{
    const m = x.map((_,i)=>normInv((i+1-0.375)/(n+0.25)));
    const mm = m.reduce((s,v)=>s+v*v,0);
    const u = 1/Math.sqrt(n);
    const an = m[n-1]/Math.sqrt(mm) + pol([0,0.221157,-0.147981,-2.071190,4.434685,-2.706056], u);
    if(n > 5){
      const an1 = m[n-2]/Math.sqrt(mm) + pol([0,0.042981,-0.293762,-1.752461,5.682633,-3.582633], u);
      const fi = (mm - 2*m[n-1]*m[n-1] - 2*m[n-2]*m[n-2]) / (1 - 2*an*an - 2*an1*an1);
      for(let i=2;i<n-2;i++) a[i] = m[i]/Math.sqrt(fi);
      a[n-1] = an; a[n-2] = an1; a[0] = -an; a[1] = -an1;
    } else {
      const fi = (mm - 2*m[n-1]*m[n-1]) / (1 - 2*an*an);
      for(let i=1;i<n-1;i++) a[i] = m[i]/Math.sqrt(fi);
      a[n-1] = an; a[0] = -an;
    }
  }
  const W = Math.min(1, Math.pow(a.reduce((s,ai,i)=>s+ai*x[i],0), 2) / ss);
  let p;
  if(n === 3){
    p = Math.max(0, Math.min(1, (6/Math.PI)*(Math.asin(Math.sqrt(W)) - Math.asin(Math.sqrt(0.75)))));
  } else if(n <= 11){
    const g = -2.273 + 0.459*n;
    const mu = 0.5440 - 0.39978*n + 0.025054*n*n - 0.0006714*n*n*n;
    const sg = Math.exp(1.3822 - 0.77857*n + 0.062767*n*n - 0.0020322*n*n*n);
    const w1 = -Math.log(g - Math.log(1-W));
    p = 1 - Phi((w1 - mu)/sg);
  } else {
    const L = Math.log(n);
    const mu = -1.5861 - 0.31082*L - 0.083751*L*L + 0.0038915*L*L*L;
    const sg = Math.exp(-0.4803 - 0.082676*L + 0.0030302*L*L);
    p = 1 - Phi((Math.log(1-W) - mu)/sg);
  }
  return {W, p: Math.max(0, Math.min(1, p)), n};
}
/* Bartlett: as variâncias dos tratamentos são iguais? Qui-quadrado com k−1 GL. */
function bartlett(grupos){
  const g = grupos.filter(x=>x.n>1);
  const k = g.length; if(k < 2) return null;
  const N = g.reduce((a,x)=>a+x.n,0);
  const sp = g.reduce((a,x)=>a+(x.n-1)*x.s2,0)/(N-k);
  if(!(sp > 0) || g.some(x=>!(x.s2 > 0))) return null;
  const num = (N-k)*Math.log(sp) - g.reduce((a,x)=>a+(x.n-1)*Math.log(x.s2),0);
  const cor = 1 + (g.reduce((a,x)=>a+1/(x.n-1),0) - 1/(N-k)) / (3*(k-1));
  const chi = num/cor, gl = k-1;
  return {chi, gl, p: Math.max(0, Math.min(1, 1 - gamaInc(gl/2, chi/2)))};
}

/* ============ TRANSFORMAÇÕES ============
   As do SISVAR e do SASM-Agri que servem a dado de campo. A análise (F, letras,
   CV) é feita nos dados transformados; as médias mostradas são as ORIGINAIS,
   na unidade da avaliação — como sai num relatório. Arco-seno em graus. */
const TRANSF = {
  "":      {nome:"Nenhuma",            f:x=>x},
  raiz:    {nome:"√x",                 f:x=>x>=0 ? Math.sqrt(x) : NaN,          regra:"valores ≥ 0"},
  raiz05:  {nome:"√(x + 0,5)",         f:x=>x>=-0.5 ? Math.sqrt(x+0.5) : NaN,   regra:"valores ≥ −0,5"},
  raiz1:   {nome:"√(x + 1)",           f:x=>x>=-1 ? Math.sqrt(x+1) : NaN,       regra:"valores ≥ −1"},
  log10:   {nome:"log₁₀(x)",           f:x=>x>0 ? Math.log10(x) : NaN,          regra:"valores > 0"},
  log10p1: {nome:"log₁₀(x + 1)",       f:x=>x>-1 ? Math.log10(x+1) : NaN,       regra:"valores > −1"},
  ln:      {nome:"ln(x)",              f:x=>x>0 ? Math.log(x) : NaN,            regra:"valores > 0"},
  arcsen:  {nome:"arcsen √(x/100)",    f:x=>(x>=0 && x<=100) ? Math.asin(Math.sqrt(x/100))*180/Math.PI : NaN,
            regra:"porcentagens de 0 a 100"}
};
/* SQ do resíduo do modelo do delineamento — o que o Box-Cox precisa, sem letras. */
function sqResModelo(dados, delin, col){
  const nT = dados.length, nR = dados[0].length;
  const sT = new Array(nT).fill(0), sB = new Array(nR).fill(0);
  let s=0, s2=0, N=0;
  for(let t=0;t<nT;t++) for(let b=0;b<nR;b++){ const v=dados[t][b]; s+=v; s2+=v*v; N++; sT[t]+=v; sB[b]+=v; }
  const C = s*s/N;
  let sq = s2 - C - (sT.reduce((a,x)=>a+x*x,0)/nR - C);
  if(delin !== "DIC") sq -= sB.reduce((a,x)=>a+x*x,0)/nT - C;
  if(delin === "DQL" && col){
    const sC = new Array(nT).fill(0);
    for(let t=0;t<nT;t++) for(let b=0;b<nR;b++) sC[col[t][b]] += dados[t][b];
    sq -= sC.reduce((a,x)=>a+x*x,0)/nT - C;
  }
  return sq;
}
/* "Recomendar" do SASM-Agri: Box-Cox (1964). Procura o λ que torna o modelo
   mais normal e homogêneo, e traduz no que existe na lista: λ≈1 nenhuma,
   λ≈½ raiz, λ≈0 log. Porcentagem com muitos valores perto de 0 ou 100 ganha a
   angular. Devolve a chave da transformação e o porquê, em português. */
function recomendarTransf(dados, delin, col, unidade){
  const vals = dados.flat().filter(v=>v!=null);
  if(!vals.length || vals.some(v=>!Number.isFinite(v))) return null;
  const min = Math.min(...vals), max = Math.max(...vals);
  const temZero = min <= 0;
  const desloc = temZero ? 1 - min : 0;
  const N = vals.length;
  const slog = vals.reduce((a,v)=>a+Math.log(v+desloc),0);
  let melhor = {lam:1, ll:-Infinity};
  const curva = [];
  for(let lam=-2; lam<=2.0001; lam+=0.05){
    const tr = dados.map(l=>l.map(v=>{ const y=v+desloc; return Math.abs(lam)<1e-9 ? Math.log(y) : (Math.pow(y,lam)-1)/lam; }));
    const sq = sqResModelo(tr, delin, col);
    if(!(sq > 0)) continue;
    const ll = -N/2*Math.log(sq/N) + (lam-1)*slog;
    curva.push({lam, ll});
    if(ll > melhor.ll) melhor = {lam, ll};
  }
  if(!Number.isFinite(melhor.ll)) return null;
  // intervalo de 95%: λ com log-verossimilhança até 1,92 abaixo do máximo
  const ic = curva.filter(c=>c.ll >= melhor.ll - 1.92).map(c=>c.lam);
  const ini = Math.min(...ic), fim = Math.max(...ic);
  const pct = /%/.test(unidade||"") && min >= 0 && max <= 100;
  const extremos = pct && vals.filter(v=>v<=20 || v>=80).length >= vals.length/2;
  const lamTxt = melhor.lam.toFixed(2).replace(".",",");
  if(ini <= 1 && fim >= 1){
    return {chave:"", porque:"Box-Cox: λ = "+lamTxt+"; o intervalo de 95% inclui 1 — os dados não pedem transformação."};
  }
  if(extremos) return {chave:"arcsen", porque:"Porcentagem com muitos valores perto de 0 ou de 100: a transformação angular é a indicada (Box-Cox: λ = "+lamTxt+")."};
  if(melhor.lam >= 0.25) return {chave: temZero ? "raiz05" : "raiz",
    porque:"Box-Cox: λ = "+lamTxt+", mais perto de ½ — raiz quadrada"+(temZero?" (com +0,5, porque há zeros)":"")+"."};
  return {chave: temZero ? "log10p1" : "log10",
    porque:"Box-Cox: λ = "+lamTxt+(melhor.lam < -0.25 ? " (abaixo de 0; o log é a mais forte da lista)" : ", perto de 0")
      +" — logaritmo"+(temZero?" (com +1, porque há zeros)":"")+"."};
}

/* ============ FATOR QUANTITATIVO: REGRESSÃO ============
   Dose, taxa de aplicação, época em dias: níveis que são NÚMEROS. Aí a pergunta
   não é "qual dose difere de qual", é "como a resposta muda com a dose" — e o
   SISVAR responde com regressão. O número sai do próprio nome do nível:
   "0,5 L/ha" → 0,5; "150 L/ha" → 150. */
function valorNivel(nome){
  const m = /-?\d+(?:[.,]\d+)?/.exec(String(nome||""));
  return m ? Number(m[0].replace(",", ".")) : null;
}
function fatorQuantitativo(f){
  const v = (f.niveis||[]).map(n=>valorNivel(n.nome));
  return v.length >= 2 && v.every(x=>x!=null) && new Set(v).size === v.length;
}
function polinomio(b, x){ return b.reduce((a,bi,i)=>a+bi*Math.pow(x,i),0); }
/* Mínimos quadrados de grau g, com x reescalado para não perder precisão com
   doses grandes (150³ já passa de 3 milhões); os coeficientes voltam para x. */
function ajustarPolinomio(xs, ys, g){
  const s = Math.max(...xs.map(Math.abs)) || 1;
  const u = xs.map(x=>x/s), m = g+1;
  const A = Array.from({length:m}, (_,i)=>Array.from({length:m}, (_,j)=>u.reduce((a,v)=>a+Math.pow(v,i+j),0)));
  const B = Array.from({length:m}, (_,i)=>u.reduce((a,v,k)=>a+Math.pow(v,i)*ys[k],0));
  for(let c=0;c<m;c++){                                  // Gauss com pivô parcial
    let p=c; for(let r=c+1;r<m;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [B[c],B[p]]=[B[p],B[c]];
    for(let r=0;r<m;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<m;k++) A[r][k]-=f*A[c][k]; B[r]-=f*B[c]; }
  }
  return B.map((v,i)=>v/A[i][i]/Math.pow(s,i));
}
/* Regressão sobre as médias dos níveis (cada uma com r observações). Cada grau
   entra em sequência — linear, quadrático, cúbico — com a SQ que acrescenta,
   como no SISVAR; o que sobra da SQ do fator é o desvio da regressão. O modelo
   indicado é o de maior grau significativo. Na quadrática, se o ponto de máximo
   (ou mínimo) cai dentro das doses testadas, ele é dado: é a dose de máxima
   eficiência técnica. */
function regressaoPolinomial(xs, ys, r, qmErr, glErr, sqFator, alfa){
  const k = xs.length;
  if(k < 2 || xs.some(x=>x==null) || new Set(xs).size !== k) return null;
  const gmax = Math.min(3, k-1);
  const ybar = ys.reduce((a,b)=>a+b,0)/k;
  const comps = []; let sqAcum = 0;
  for(let g=1; g<=gmax; g++){
    const b = ajustarPolinomio(xs, ys, g);
    const sqReg = r*xs.reduce((a,x)=>{ const d=polinomio(b,x)-ybar; return a+d*d; },0);
    const sq = Math.max(0, sqReg - sqAcum); sqAcum = sqReg;
    const F = qmErr>0 ? sq/qmErr : null;
    comps.push({grau:g, nome:["Linear","Quadrática","Cúbica"][g-1], gl:1, sq, qm:sq, f:F,
                p:pValorF(F,1,glErr), coef:b, r2: sqFator>0 ? Math.min(1, sqReg/sqFator) : null});
  }
  const glDesv = (k-1) - gmax;
  let desvio = null;
  if(glDesv > 0){
    const sq = Math.max(0, sqFator - sqAcum), qm = sq/glDesv, F = qmErr>0 ? qm/qmErr : null;
    desvio = {gl:glDesv, sq, qm, f:F, p:pValorF(F, glDesv, glErr)};
  }
  let escolhido = null;
  for(let g=gmax; g>=1; g--){ const c = comps[g-1]; if(c.p!=null && c.p < alfa){ escolhido = c; break; } }
  let otimo = null;
  if(escolhido && escolhido.grau === 2){
    const b = escolhido.coef, x = -b[1]/(2*b[2]);
    if(x >= Math.min(...xs) && x <= Math.max(...xs))
      otimo = {x, y: polinomio(b, x), tipo: b[2] < 0 ? "máximo" : "mínimo"};
  }
  return {xs, ys, comps, desvio, escolhido, otimo};
}
function equacaoTexto(coef){
  const f = v => fmt(Math.abs(v), Math.abs(v)>=100 ? 2 : Math.abs(v)>=1 ? 4 : 6);
  return "ŷ = " + coef.map((b,i)=>{
    const sinal = i===0 ? (b<0?"−":"") : (b<0?" − ":" + ");
    return sinal + f(b) + (i===0 ? "" : i===1 ? "x" : "x" + (i===2?"²":"³"));
  }).join("");
}

/* ============ DESDOBRAMENTO DA INTERAÇÃO ============
   Como no SISVAR: cada fator é estudado DENTRO de cada nível (ou combinação de
   níveis) dos outros — primeiro a ANOVA do desdobramento, depois as letras ou a
   regressão. Com dois fatores sai a tabela de dupla entrada do relatório:
   minúscula compara na coluna, maiúscula compara na linha.
   `erroDe(i)` diz contra qual erro o fator i é testado: o resíduo, ou — na
   parcela subdividida — o Erro(b) para o fator da subparcela e a variância
   complexa (Satterthwaite) para o da parcela. */
function desdobramento(fat, trats, somaT, somaO, nRep, erroDe, teste, alfa, tipos){
  const tst = teste === "dunnett" ? "tukey" : teste;   // entre níveis de um fator não há testemunha
  return fat.map((f, fi)=>{
    const outros = fat.filter((_,j)=>j!==fi);
    const grupos = {}, ordem = [];
    trats.forEach((t,i)=>{
      const k = outros.map(g=>t.niveis[g.id]).join("|");
      if(!grupos[k]){
        grupos[k] = {rot: outros.map(g=>(g.niveis.find(n=>n.id===t.niveis[g.id])||{}).nome||"?").join(" · "),
                     ids: outros.map(g=>t.niveis[g.id]), cel:{}};
        ordem.push(k);
      }
      grupos[k].cel[t.niveis[f.id]] = {soma: somaT[i], somaO: somaO ? somaO[i] : somaT[i]};
    });
    const err = erroDe(fi);
    const quant = tipos && tipos[f.id] === "quant" && fatorQuantitativo(f);
    const blocos = ordem.map(k=>{
      const g = grupos[k];
      const lst = f.niveis.map((nv,li)=>({i:li, id:nv.id, nome:nv.nome,
        media: g.cel[nv.id].soma/nRep, mo: g.cel[nv.id].somaO/nRep}));
      const tot = lst.reduce((a,x)=>a+x.media*nRep, 0);
      const sq = lst.reduce((a,x)=>a+Math.pow(x.media*nRep,2), 0)/nRep - tot*tot/(nRep*lst.length);
      const gl = lst.length-1, qm = sq/gl;
      const F = err.qm>0 ? qm/err.qm : null;
      const bloco = {chave:k, ids:g.ids, rot:g.rot, gl, sq, qm, f:F, p:pValorF(F, gl, err.gl), niveis:lst};
      if(quant){
        bloco.reg = regressaoPolinomial(f.niveis.map(nv=>valorNivel(nv.nome)), lst.map(x=>x.media), nRep, err.qm, err.gl, sq, alfa);
      } else {
        const ord = lst.slice().sort((a,b)=>b.media-a.media);
        const r = letrasDoTeste(ord, tst, err.qm, err.gl, nRep, alfa);
        ord.forEach((x,j)=>{ x.letra = r.letras[j]; });
        bloco.dms = r.dms; bloco.teste = r.nome;
      }
      return bloco;
    });
    return {fi, fator:f.nome||"Fator", fid:f.id, dentroDe: outros.map(g=>g.nome||"Fator").join(" × "),
            erro:err, blocos, quant};
  });
}

/* A descrição diz o que cada teste FAZ com os resultados, não como ele se chama
   na literatura: quem escolhe aqui quer saber quantas letras vai ver e o quanto
   pode confiar nelas. "Conservador" e "rigoroso" são a mesma ideia — exigir uma
   diferença maior antes de dizer que dois tratamentos diferem. */
const TESTES = {
  tukey:   {nome:"Tukey",
            desc:"exige diferença grande para separar duas médias: erra pouco para mais, "
               + "mas deixa passar diferença pequena que é real. É o padrão em publicação."},
  duncan:  {nome:"Duncan",
            desc:"exige menos que o Tukey e separa mais tratamentos — encontra diferença "
               + "pequena, ao custo de mais risco de apontar diferença que não existe."},
  snk:     {nome:"SNK",
            desc:"Student-Newman-Keuls: fica entre o Tukey e o Duncan — exige menos para "
               + "médias vizinhas e o mesmo que o Tukey para as dos extremos. Está no SISVAR."},
  t:       {nome:"t (DMS)",
            desc:"o menos exigente de todos: separa o máximo, e é o que mais aponta "
               + "diferença que não existe. Bom para explorar, arriscado para concluir."},
  bonferroni: {nome:"t de Bonferroni",
            desc:"o teste t com a significância dividida pelo número de comparações. "
               + "Costuma exigir um pouco mais que o Tukey. Está no SISVAR."},
  scheffe: {nome:"Scheffé",
            desc:"o mais exigente de todos: só separa diferenças grandes. Serve para qualquer "
               + "contraste, não só pares. Está no SASM-Agri."},
  dunnett: {nome:"Dunnett",
            desc:"compara cada tratamento só com a testemunha, e não os tratamentos "
               + "entre si. É o teste de quem quer saber “funcionou ou não?”."},
  sk:      {nome:"Scott-Knott",
            desc:"forma grupos que não se sobrepõem: cada média cai em um grupo só, "
               + "sem aquele “ab” que não deixa concluir nada."}
};
const ALFAS = {"0.01":"1%", "0.05":"5%", "0.10":"10%"};
function alfaDe(e){
  const a = Number(e && e.alfa);
  return (a===0.01 || a===0.05 || a===0.10) ? a : 0.05;
}
function alfaTexto(a){ return ALFAS[String(a)] || (a*100)+"%"; }

/**
 * ANOVA para delineamento em blocos casualizados (DBC) e inteiramente
 * casualizado (DIC), com teste de Tukey a 5%.
 * dados: matriz [tratamento][bloco] com null onde falta valor.
 */
/**
 * Decompõe a soma de quadrados de tratamentos em efeitos principais e interação.
 * `fat` são os fatores validados por ehFatorial; `trats` traz os níveis de cada
 * tratamento. Retorna as linhas extras do quadro, ou null se não for fatorial.
 */
/* Fatorial com adicional: o desdobramento é feito SÓ com os tratamentos do
   fatorial (correção e SQ próprias), e o que sobra da SQ de tratamentos vira o
   contraste "testemunha vs. fatorial". O resíduo é o do ensaio inteiro — é o
   mesmo arranjo que SASM-Agri e SISVAR usam para fatorial com tratamento
   adicional. Soma: SQ Trat = SQ fatorial + SQ contraste (+ SQ entre adicionais). */
function decompor(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa, opc){
  opc = opc || {};
  if(!fat) return null;
  const adic = fat.adicionais || [];
  const erroRes = ()=>({qm:qmRes, gl:glRes, nome:"Resíduo"});
  if(!adic.length){
    const d = decomporFatorial(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa, opc);
    d.desd = desdobramento(fat, trats, somaT, opc.somaO, nRep, erroRes, teste, alfa, opc.tipos);
    return d;
  }

  const idxF = trats.map((_,i)=>i).filter(i=>adic.indexOf(i) < 0);
  const tratsF = idxF.map(i=>trats[i]), somaF = idxF.map(i=>somaT[i]);
  const totF = somaF.reduce((a,s)=>a+s, 0);
  const CF  = totF*totF/(idxF.length*nRep);
  const sqF = somaF.reduce((a,s)=>a+s*s, 0)/nRep - CF;
  const somaOF = opc.somaO ? idxF.map(i=>opc.somaO[i]) : null;
  const dec = decomporFatorial(fat, tratsF, somaF, nRep, CF, sqF, glRes, qmRes, teste, alfa, Object.assign({}, opc, {somaO:somaOF}));
  // o desdobramento também é só do fatorial: a testemunha não tem nível para entrar nele
  dec.desd = desdobramento(fat, tratsF, somaF, somaOF, nRep, erroRes, teste, alfa, opc.tipos);

  const somaA = adic.map(i=>somaT[i]);
  const totA = somaA.reduce((a,s)=>a+s, 0);
  const sqEntre = adic.length > 1 ? somaA.reduce((a,s)=>a+s*s, 0)/nRep - totA*totA/(adic.length*nRep) : 0;
  const sqContraste = sqTrat - sqF - sqEntre;
  const linha = (nome, gl, sq) => {
    const qm = sq/gl, F = qmRes>0 ? qm/qmRes : null;
    return {nome, gl, sq, qm, f:F, p:pValorF(F, gl, glRes), nivel:1, adicional:true};
  };
  // o contraste vem antes: é a primeira pergunta — o fatorial fez diferença?
  dec.linhas.unshift(linha(adic.length > 1 ? "Adicionais vs. fatorial" : "Testemunha vs. fatorial", 1, sqContraste));
  if(adic.length > 1) dec.linhas.splice(1, 0, linha("Entre adicionais", adic.length-1, sqEntre));
  dec.adicionais = adic.map(i=>({nome: trats[i].nome, num: trats[i].num, media: somaT[i]/nRep,
                               mo: (opc.somaO ? opc.somaO[i] : somaT[i])/nRep}));
  dec.mediaFatorialO = (somaOF ? somaOF.reduce((a,x)=>a+x,0) : totF)/(idxF.length*nRep);
  dec.mediaFatorial = totF/(idxF.length*nRep);
  return dec;
}
function decomporFatorial(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa, opc){
  alfa = alfa||0.05; opc = opc || {};
  const somaO = opc.somaO || somaT;
  if(!fat) return null;
  const linhas = [], medias = [];
  let sqEfeitos = 0, glEfeitos = 0;
  const sqEfeito = {};              // SQ de cada efeito, pela chave dos índices: "0", "1", "0,1"…
  fat.forEach((f, fi)=>{
    const soma = {}, n = {}, sO = {};
    f.niveis.forEach(nv=>{ soma[nv.id]=0; n[nv.id]=0; sO[nv.id]=0; });
    trats.forEach((t,i)=>{
      const nv = t.niveis[f.id];
      if(soma[nv]===undefined) return;
      soma[nv] += somaT[i]; n[nv] += nRep; sO[nv] += somaO[i];
    });
    const sq = f.niveis.reduce((a,nv)=> a + (n[nv.id] ? soma[nv.id]*soma[nv.id]/n[nv.id] : 0), 0) - C;
    const gl = f.niveis.length - 1;
    sqEfeitos += sq; glEfeitos += gl;
    sqEfeito[String(fi)] = sq;
    const qm = sq/gl, F = qmRes>0 ? qm/qmRes : null;
    linhas.push({nome:f.nome||"Fator", gl, sq, qm, f:F, p:pValorF(F,gl,glRes), nivel:1});

    // médias de cada nível, comparadas pelo mesmo teste escolhido no ensaio
    const rep = n[f.niveis[0].id] || nRep;
    const lst = f.niveis.map((nv,k)=>({i:k, nome:nv.nome, media: n[nv.id] ? soma[nv.id]/n[nv.id] : null,
                                       mo: n[nv.id] ? sO[nv.id]/n[nv.id] : null}))
                        .filter(x=>x.media!=null).sort((a,b)=>b.media-a.media);
    const r = letrasDoTeste(lst, teste, qmRes, glRes, rep, alfa);
    lst.forEach((x,k)=>{ x.letra = r.letras[k]; });
    const entrada = {fator:f.nome||"Fator", fid:f.id, dms:r.dms, teste:r.nome, linhas:lst};
    // fator quantitativo: a regressão sobre as médias dos níveis responde melhor que letras
    if(opc.tipos && opc.tipos[f.id] === "quant" && fatorQuantitativo(f)){
      const noOrdem = f.niveis.map(nv=>lst.find(x=>x.nome===nv.nome)).filter(Boolean);
      entrada.reg = regressaoPolinomial(noOrdem.map(x=>valorNivel(x.nome)), noOrdem.map(x=>x.media), rep, qmRes, glRes, sq, alfa);
    }
    medias.push(entrada);
  });

  /* Interações: TODAS as combinações de dois ou mais fatores. A SQ de cada uma
     é a da tabela marginal daquele conjunto de fatores menos os efeitos de
     todos os seus subconjuntos. Com dois fatores dá exatamente o que dava antes
     (o que sobra da SQ de tratamentos). Com três, separa A×B, A×C, B×C e A×B×C —
     até a versão 14 vinha tudo numa linha só, chamada A×B×C, com o GL da
     interação tripla: a SQ somava certo, mas o F e o p-valor saíam errados. */
  const nF = fat.length;
  const conjuntos = [];
  for(let m = 1; m < (1 << nF); m++){
    const idx = [];
    for(let j = 0; j < nF; j++) if(m & (1 << j)) idx.push(j);
    if(idx.length >= 2) conjuntos.push(idx);
  }
  conjuntos.sort((a,b)=>a.length - b.length);     // subconjuntos antes: é deles que se subtrai
  let glInt = 0, pInt = null;
  conjuntos.forEach(idx=>{
    const tot = {}, cont = {};
    trats.forEach((t,i)=>{
      const k = idx.map(j=>t.niveis[fat[j].id]).join("|");
      tot[k] = (tot[k]||0) + somaT[i];
      cont[k] = (cont[k]||0) + nRep;
    });
    let sq = -C;
    Object.keys(tot).forEach(k=>{ sq += tot[k]*tot[k]/cont[k]; });
    for(let m = 1; m < (1 << idx.length) - 1; m++){
      const sub = [];
      for(let j = 0; j < idx.length; j++) if(m & (1 << j)) sub.push(idx[j]);
      sq -= sqEfeito[sub.join(",")] || 0;
    }
    sqEfeito[idx.join(",")] = sq;
    const gl = idx.reduce((a,j)=>a*(fat[j].niveis.length - 1), 1);
    if(gl <= 0) return;
    const qm = sq/gl, F = qmRes>0 ? qm/qmRes : null, p = pValorF(F, gl, glRes);
    linhas.push({nome: idx.map(j=>fat[j].nome||"Fator").join(" × "), gl, sq, qm, f:F, p, nivel:1, interacao:true});
    glInt += gl;
    // "interação significativa" quando QUALQUER uma for: guarda o menor p
    if(p != null && (pInt == null || p < pInt)) pInt = p;
  });
  return {linhas, medias, glInt, pInt: qmRes>0 ? pInt : null};
}

/* `opc`: {tipos: {idDoFator: "quant"|"qual"}, somaO: somas ORIGINAIS por tratamento
   quando os dados vêm transformados — para as médias mostradas}. */
function anova(dados, nTrat, nRep, delin, fat, trats, tst, col, alfa, ctrl, opc){
  alfa = (alfa===0.01||alfa===0.05||alfa===0.10) ? alfa : 0.05;
  opc = opc || {};
  const obs=[], somaT=new Array(nTrat).fill(0), nT=new Array(nTrat).fill(0);
  const somaB=new Array(nRep).fill(0), nB=new Array(nRep).fill(0);
  let soma=0, somaQ=0, N=0;
  for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
    const v = dados[t] && dados[t][b];
    if(v==null) continue;
    obs.push(v); soma+=v; somaQ+=v*v; N++;
    somaT[t]+=v; nT[t]++; somaB[b]+=v; nB[b]++;
  }
  const total = nTrat*nRep;
  if(N<total) return {erro:"faltam", faltando:total-N, preenchidos:N, total:total};
  if(nTrat<2) return {erro:"poucos_trat"};
  if(nRep<2) return {erro:"poucas_rep"};

  const comBloco = delin==="DBC" || delin==="DQL" || delin==="SPLIT";
  const C = soma*soma/N;
  const sqTotal = somaQ - C;
  const sqTrat = somaT.reduce((a,s)=>a+s*s,0)/nRep - C;
  const sqBloco = comBloco ? somaB.reduce((a,s)=>a+s*s,0)/nTrat - C : 0;

  /* Quadrado latino: além das linhas (os blocos), uma segunda restrição de
     casualização — as colunas — sai do resíduo. A coluna de cada parcela vem
     do croqui; sem ele o delineamento não pode ser analisado. */
  let sqColuna = 0, glColuna = 0, somaCol = null;
  if(delin==="DQL"){
    if(nTrat !== nRep) return {erro:"dql_desbalanceado", nTrat, nRep};
    if(!col) return {erro:"dql_sem_croqui"};
    const somaC = new Array(nTrat).fill(0), nC = new Array(nTrat).fill(0);
    // visto[t][c]: o tratamento t já apareceu na coluna c?
    const visto = Array.from({length:nTrat}, ()=>new Array(nTrat).fill(0));
    for(let t=0;t<nTrat;t++){
      const colsDoTrat = new Set();
      for(let b=0;b<nRep;b++){
        const v = dados[t] && dados[t][b]; if(v==null) continue;
        const c = col[t] && col[t][b];
        if(c==null || !Number.isFinite(c) || c<0 || c>=nTrat) return {erro:"dql_croqui_incompleto"};
        if(colsDoTrat.has(c)) return {erro:"dql_croqui_invalido"};  // repetiu coluna na mesma linha
        colsDoTrat.add(c);
        visto[t][c]++; somaC[c]+=v; nC[c]++;
      }
    }
    // cada tratamento uma vez em cada coluna
    for(let t=0;t<nTrat;t++) for(let c=0;c<nTrat;c++)
      if(visto[t][c] !== 1) return {erro:"dql_croqui_invalido"};
    // e cada célula (linha, coluna) ocupada por exatamente um tratamento
    const celula = Array.from({length:nRep}, ()=>new Array(nTrat).fill(0));
    for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
      const c = col[t][b];
      if(++celula[b][c] > 1) return {erro:"dql_croqui_invalido"};
    }
    if(nC.some(x=>x!==nTrat)) return {erro:"dql_croqui_invalido"};
    sqColuna = somaC.reduce((a,s)=>a+s*s,0)/nTrat - C;
    somaCol = somaC;
    glColuna = nTrat-1;
  }

  const glTrat = nTrat-1;
  const glBloco = comBloco ? nRep-1 : 0;
  const sqRes = sqTotal - sqTrat - sqBloco - sqColuna;
  const glRes = delin==="DQL" ? (nTrat-1)*(nTrat-2)
              : comBloco     ? glTrat*glBloco
              :                N-nTrat;
  const glTotal = N-1;
  if(glRes<1) return {erro:"sem_gl"};

  const qmTrat=sqTrat/glTrat, qmRes=sqRes/glRes;
  const qmBloco = glBloco>0 ? sqBloco/glBloco : null;
  const fTrat = qmRes>0 ? qmTrat/qmRes : null;
  const fBloco = (qmBloco!=null && qmRes>0) ? qmBloco/qmRes : null;
  const media = soma/N;
  const cv = media!==0 && qmRes>=0 ? 100*Math.sqrt(qmRes)/Math.abs(media) : null;

  const medias = somaT.map((s,i)=>({i, media:s/nRep}));
  const teste = TESTES[tst] ? tst : "tukey";
  const glR = Math.round(glRes);
  const ord = medias.slice().sort((a,b)=>b.media-a.media);
  const letras = new Array(nTrat).fill("");
  let dms = null, critNome = "", critValor = null, testeNome = TESTES[teste].nome;
  if(teste === "dunnett"){
    const d = dDunnett(alfa, Math.max(1,nTrat-1), glRes, true);
    dms = qmRes>=0 ? d*Math.sqrt(2*qmRes/nRep) : null;
    critNome = "d("+(nTrat-1)+", "+glR+")"; critValor = d;
  } else {
    const r = letrasDoTeste(ord, teste, qmRes, glRes, nRep, alfa);
    dms = r.dms; critNome = r.critNome; critValor = r.critValor; testeNome = r.nome;
    ord.forEach((o,k)=>{ letras[o.i] = r.letras[k]; });
  }
  let dunnett = null;
  if(teste === "dunnett"){
    /* Dunnett não agrupa: compara cada tratamento com a testemunha. O índice do
       controle vem do ensaio; sem escolha, o tratamento 1. */
    const iCtrl = (ctrl!=null && ctrl>=0 && ctrl<nTrat) ? ctrl : 0;
    const mCtrl = medias[iCtrl].media;
    dunnett = {iCtrl, dms, linhas: medias.map(m=>({
      i:m.i, media:m.media, dif:m.media-mCtrl,
      difere: m.i!==iCtrl && dms!=null && Math.abs(m.media-mCtrl) > dms
    }))};
    medias.forEach(m=>{
      letras[m.i] = m.i===iCtrl ? "—"
        : (dms!=null && Math.abs(m.media-mCtrl)>dms ? "*" : "ns");
    });
  }
  /* Resíduos do modelo do delineamento, para os pressupostos. Na subdividida o
     modelo tem o efeito bloco × fator da parcela (o Erro a), que sai também. */
  const g0 = soma/N, res = [], resT = somaT.map(()=>[]);
  let mBA = null;
  if(delin === "SPLIT" && fat && fat.length === 2){
    mBA = {}; const cBA = {}, mA = {}, cA = {};
    for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
      const k = b+"|"+trats[t].niveis[fat[0].id], a = trats[t].niveis[fat[0].id];
      mBA[k] = (mBA[k]||0) + dados[t][b]; cBA[k] = (cBA[k]||0) + 1;
      mA[a] = (mA[a]||0) + dados[t][b]; cA[a] = (cA[a]||0) + 1;
    }
    Object.keys(mBA).forEach(k=>{ mBA[k] /= cBA[k]; }); Object.keys(mA).forEach(k=>{ mA[k] /= cA[k]; });
    mBA.__A = mA;
  }
  for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
    let ajuste = somaT[t]/nRep;
    if(mBA){ const a = trats[t].niveis[fat[0].id]; ajuste += mBA[b+"|"+a] - mBA.__A[a]; }
    else if(comBloco) ajuste += somaB[b]/nTrat - g0;
    if(delin === "DQL" && somaCol) ajuste += somaCol[col[t][b]]/nTrat - g0;
    const e = dados[t][b] - ajuste; res.push(e); resT[t].push(e);
  }
  const pressupostos = {
    normal: shapiroWilk(res),
    homog: bartlett(resT.map(x=>({n:x.length, s2: x.reduce((a,v)=>a+v*v,0)/Math.max(1, x.length-1)})))
  };

  /* Parcelas subdivididas: o fator da parcela é testado contra o Erro(a)
     — a variação entre parcelas dentro de bloco — e não contra o resíduo
     geral. Testar tudo contra o mesmo denominador infla a significância
     do fator da parcela, que é o erro clássico neste delineamento. */
  let split = null;
  if(delin === "SPLIT" && fat && fat.length === 2){
    const [fA, fB] = fat;
    const a = fA.niveis.length, b = fB.niveis.length;
    const sBA = {};                                   // somas por (bloco, nível de A)
    for(let t=0;t<nTrat;t++) for(let bl=0;bl<nRep;bl++){
      const v = dados[t][bl]; if(v==null) continue;
      const k = bl+"|"+trats[t].niveis[fA.id];
      sBA[k] = (sBA[k]||0) + v;
    }
    const sqBA = Object.values(sBA).reduce((s,x)=>s+x*x,0)/b - C;
    const somaA = {};
    trats.forEach((t,i)=>{ const nv=t.niveis[fA.id]; somaA[nv]=(somaA[nv]||0)+somaT[i]; });
    const sqA = Object.values(somaA).reduce((s,x)=>s+x*x,0)/(nRep*b) - C;
    const sqErroA = sqBA - sqBloco - sqA;
    const glA = a-1, glErroA = (nRep-1)*(a-1);
    const glErroB = a*(nRep-1)*(b-1);
    const sqErroB = sqTotal - sqBloco - sqA - sqErroA - (sqTrat - sqA);
    const qmErroA = glErroA>0 ? sqErroA/glErroA : null;
    const qmErroB = glErroB>0 ? sqErroB/glErroB : null;
    split = {fA, fB, a, b, sqA, glA, sqErroA, glErroA, qmErroA,
             sqErroB, glErroB, qmErroB, sqBA};
  }

  const dec = decompor(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa, opc);

  if(split){
    const F = (qm,gl,qme,gle) => qme>0 ? {f:qm/qme, p:pValorF(qm/qme, gl, gle)} : {f:null,p:null};
    const qmA = split.sqA/split.glA;
    const sqB = dec ? (dec.linhas.find(l=>l.nome===(split.fB.nome||"Fator"))||{}).sq : null;
    const sqInt = sqTrat - split.sqA - (sqB||0);
    const glB = split.b-1, glInt = (split.a-1)*(split.b-1);
    const rA = F(qmA, split.glA, split.qmErroA, split.glErroA);
    const rB = F(sqB/glB, glB, split.qmErroB, split.glErroB);
    const rI = F(sqInt/glInt, glInt, split.qmErroB, split.glErroB);

    // cada fator comparado com o seu próprio erro
    const mA = mediasDoFator(split.fA, trats, somaT, nRep, split.qmErroA, split.glErroA,
                             nRep*split.b, teste, alfa);
    const mB = mediasDoFator(split.fB, trats, somaT, nRep, split.qmErroB, split.glErroB,
                             nRep*split.a, teste, alfa);
    // médias originais (dados transformados) e regressão do fator quantitativo, como no fatorial comum
    const somaO = opc.somaO || somaT;
    [[mA, split.fA, split.qmErroA, split.glErroA, nRep*split.b, split.sqA],
     [mB, split.fB, split.qmErroB, split.glErroB, nRep*split.a, sqB]].forEach(([m, f, qe, ge, rr, sqf])=>{
      m.fid = f.id;
      m.linhas.forEach(x=>{
        const nv = f.niveis.find(n=>n.nome===x.nome);
        let so = 0; trats.forEach((t,i)=>{ if(nv && t.niveis[f.id]===nv.id) so += somaO[i]; });
