    }
    s += '</div></summary><div class="sanfona-corpo">';

    // transformação desta avaliação (SASM-Agri e SISVAR), com a recomendação por Box-Cox
    if(!so){
      const tf = TRANSF[av.transf] ? (av.transf||"") : "";
      s += '<div class="linha" style="gap:8px;margin-bottom:10px;align-items:flex-end">'
        + '<div class="campo" style="min-width:200px"><label>Transformação dos dados</label>'
        + '<select data-acao="set-transf" data-av="'+av.id+'" '+sel+'>'
        + Object.keys(TRANSF).map(k=>'<option value="'+k+'"'+(tf===k?" selected":"")+'>'+TRANSF[k].nome+'</option>').join("")
        + '</select></div>'
        + '<button class="b b-s" data-acao="recomendar-transf" data-id="'+av.id+'" style="margin-bottom:2px">Recomendar</button>'
        + (TELA.recomTransf && TELA.recomTransf.av===av.id
            ? '<span style="font-size:.8rem;color:var(--ink-2);flex:1;min-width:220px;margin-bottom:6px">'+esc(TELA.recomTransf.txt)
              + (TELA.recomTransf.chave!=null ? ' <button class="b b-s b-p" data-acao="aplicar-transf" data-id="'+av.id
                  + '" data-chave="'+TELA.recomTransf.chave+'" style="margin-left:6px">Usar '+esc(TRANSF[TELA.recomTransf.chave].nome)+'</button>' : '')
              + '</span>' : '')
        + '</div>';
    }

    // testemunha dentro ou fora da análise desta avaliação
    if(!so && podeTirarTestemunha(e)){
      const tT = e.tratamentos[controleDe(e)];
      const nomeT = esc(tT.num+". "+tT.nome);
      s += '<div class="linha" style="gap:8px;margin-bottom:10px;align-items:flex-end">'
        + '<div class="campo" style="min-width:240px"><label>Testemunha ('+nomeT+')</label>'
        + '<select data-acao="set-semtest" data-av="'+av.id+'" '+sel+'>'
        + '<option value="dentro"'+(!av.semTest?" selected":"")+'>Entra na análise</option>'
        + '<option value="fora"'+(av.semTest?" selected":"")+'>Fica fora — só como referência</option>'
        + '</select></div></div>';
      if(!av.semTest && testemunhaConstante(e, av)){
        s += '<div class="aviso aviso-w" style="margin-bottom:10px"><span>&#9888;</span><div>'
          + 'A testemunha tem o <b>mesmo valor em todas as parcelas</b> — típico de “% de controle”, em que ela '
          + 'vale 0 por definição. Sem variação, ela infla o F e quebra a homogeneidade; o usual é deixá-la fora '
          + 'da análise e mostrá-la só como referência.'
          + '<button class="b b-s b-p" data-acao="tirar-testemunha" data-id="'+av.id+'" style="margin-top:8px">'
          + 'Tirar a testemunha desta análise</button></div></div>';
      }
    }

    if(!r.ok){
      const msg = r.erro==="transf"
        ? 'A transformação <b>'+esc(TRANSF[r.transf].nome)+'</b> só se aplica a '+esc(TRANSF[r.transf].regra)
          + ', e esta avaliação tem <b>'+r.ruins+'</b> valor(es) fora disso. Escolha outra, ou volte para Nenhuma.'
        : r.erro==="split_adicional"
        ? 'Parcela subdividida não tem análise com testemunha adicional: ela não pertence a nenhuma parcela '
          + 'do fator principal. Deixe a testemunha <b>fora da análise</b> (logo acima) — o fatorial vira puro e a '
          + 'subdividida roda, com a testemunha como referência.'
        : r.erro==="faltam"
        ? 'Faltam <b>'+r.faltando+'</b> de '+r.total+' parcelas. Complete a malha para a análise rodar.'
        : r.erro==="poucos_trat" ? 'São necessários ao menos 2 tratamentos.'
        : r.erro==="poucas_rep"  ? 'São necessárias ao menos 2 repetições.'
        : r.erro==="dql_desbalanceado"
          ? 'No quadrado latino o número de tratamentos precisa ser igual ao de linhas. '
            + 'Aqui são <b>'+r.nTrat+'</b> tratamentos e <b>'+r.nRep+'</b> repetições — ajuste na ficha do ensaio.'
        : r.erro==="dql_sem_croqui"
          ? 'Falta o croqui: no quadrado latino é preciso informar a <b>coluna</b> de cada parcela, '
            + 'porque essa é a segunda restrição de casualização. Preencha na aba Avaliações.'
        : r.erro==="dql_croqui_incompleto" ? 'O croqui está incompleto — informe a coluna de todas as parcelas.'
        : r.erro==="dql_croqui_invalido"
          ? 'O croqui não fecha: cada coluna precisa conter cada tratamento exatamente uma vez.'
        : 'Não há graus de liberdade suficientes para estimar o resíduo.';
      s += '<div class="aviso aviso-w"><span>&#9888;</span><div>'+msg+'</div></div></div>';
      s += '</details>';
      return;
    }

    s += htmlQuadroAnova(r.fonte);
    const nmT = r.testeNome || (TESTES[r.teste]||TESTES.tukey).nome;
    s += '<div class="linha" style="font-size:.76rem;color:var(--muted);gap:14px">'
      + '<span>Média geral: <b class="mono">'+fmt(r.transf ? r.mediaO : r.media)+'</b>'
      + (r.transf ? ' (transformada: '+fmt(r.media,4)+')' : '')+'</span>'
      + '<span>CV'+(r.cvA!=null?' (subparcela)':'')+': <b class="mono">'+fmt(r.cv,2)+'%</b></span>'
      + (r.cvA!=null ? '<span>CV (parcela): <b class="mono">'+fmt(r.cvA,2)+'%</b></span>' : '')
      + (r.dms!=null ? '<span>DMS '+esc(nmT)+' '+alfaTexto(r.alfa)+(r.transf?' (escala transformada)':'')+': <b class="mono">'+fmt(r.dms)+'</b></span>' : '')
      + (r.critNome ? '<span>'+esc(r.critNome)+': <b class="mono">'+fmt(r.critValor,3)+'</b></span>' : '')
      + (r.teste==="sk" ? '<span>agrupamento por razão de verossimilhança</span>' : '')
      + '<span>** p&lt;0,01 · * p&lt;0,05 · ns não significativo</span></div>';
    if(r.transf){
      s += '<p style="font-size:.76rem;color:var(--muted);margin-top:4px">Análise feita com os dados transformados em <b>'
        + esc(TRANSF[r.transf].nome)+'</b>. As médias abaixo são as originais, na unidade da avaliação; as letras vêm da análise transformada.</p>';
    }
    s += htmlPressupostos(r.pressupostos, alfa);

    if(r.fatorial) s += htmlFatorial(e, r, av);

    // Dunnett tem tabela própria: diferença para a testemunha, não letras
    if(r.dunnett){
      const ctrlT = e.tratamentos[r.dunnett.iCtrl];
      const nDif = r.dunnett.linhas.filter(x=>x.difere).length;
      s += '<div class="aviso aviso-i" style="margin-top:12px"><span>&#8505;</span><div>'
        + 'Cada tratamento é comparado com a testemunha <b>'+esc(ctrlT.num+". "+ctrlT.nome)+'</b>. '
        + '<b>'+nDif+'</b> de '+(e.tratamentos.length-1)+' diferem dela a '+alfaTexto(r.alfa)+'. '
        + 'Dunnett não compara os tratamentos entre si.</div></div>';
      const ordD = TELA.ordem === "media"
        ? r.dunnett.linhas.slice().sort((a,b)=>b.media-a.media)
        : r.dunnett.linhas.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num);
      const mC = mostra(r.dunnett.linhas.find(x=>x.i===r.dunnett.iCtrl));
      s += '<div class="tab-box" style="margin-top:12px"><table class="dados"><thead><tr>'
        + '<th>Tratamento</th><th style="text-align:left">Dose</th><th>Média</th>'
        + '<th>Dif. p/ testemunha</th><th>Dunnett</th></tr></thead><tbody>';
      ordD.forEach(x=>{
        const t = e.tratamentos[x.i], ctrl = x.i===r.dunnett.iCtrl, dif = mostra(x) - mC;
        s += '<tr'+(ctrl?' style="background:var(--surface-3)"':'')+'>'
          + '<td'+(ctrl?' style="font-weight:600"':'')+'>'+esc(t.num+". "+t.nome)
          + (ctrl?' <span class="pill" style="margin-left:6px">testemunha</span>':'')+'</td>'
          + '<td style="text-align:left;color:var(--muted)">'+(esc(doseTexto(t))||"—")+'</td>'
          + '<td>'+fmt(mostra(x))+'</td>'
          + '<td>'+(ctrl?"—":(dif>0?"+":"")+fmt(dif))+'</td>'
          + '<td><b class="letra">'+(ctrl?"—":(x.difere?"*":"ns"))+'</b></td></tr>';
      });
      s += '</tbody></table></div>'
        + '<p style="font-size:.76rem;color:var(--muted)">* difere da testemunha · '
        + 'ns não difere · DMS de Dunnett '+alfaTexto(r.alfa)+': <b class="mono">'+fmt(r.dms)+'</b></p>'
        + '</div>';
      s += '</details>';
      return;
    }

    // médias com letras — na ordem do protocolo por padrão, como sai no relatório
    const ord = TELA.ordem === "media"
      ? r.medias.slice().sort((a,b)=>b.media-a.media)
      : r.medias.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num);
    // testemunha fora da análise: volta à tabela como referência, sem letra
    const linhasT = ord.slice();
    if(r.fora){
      const lf = {i:r.fora.i, mo:r.fora.mo, media:r.fora.mo, fora:true};
      if(TELA.ordem === "media") linhasT.push(lf);
      else { const p = linhasT.findIndex(m=>e.tratamentos[m.i].num > e.tratamentos[lf.i].num); linhasT.splice(p<0?linhasT.length:p, 0, lf); }
    }
    const vs = r.vsTest;
    const mx = Math.max(...linhasT.map(m=>mostra(m)));
    s += '<div class="tab-box" style="margin-top:12px"><table class="dados"><thead><tr>'
      + '<th>Tratamento</th><th style="text-align:left">Dose</th><th>Média</th><th>'+esc(nmT)+'</th>'
      + (vs ? '<th title="Diferença para a testemunha, em %, e o teste de Dunnett">vs. testemunha</th>' : '')
      + '<th style="width:28%">Comparação</th></tr></thead><tbody>';
    linhasT.forEach(m=>{
      const t = e.tratamentos[m.i];
      const pc = mx>0 ? Math.max(2, 100*mostra(m)/mx) : 0;
      const v = vs && vs.linhas.find(x=>x.i===m.i);
      const ehT = vs && m.i === vs.iCtrl;
      s += '<tr'+(m.fora||ehT?' style="background:var(--surface-3)"':'')+'><td>'+esc(t.num+". "+t.nome)
        + (m.fora ? ' <span class="pill" style="margin-left:6px">fora da análise</span>' : ehT ? ' <span class="pill" style="margin-left:6px">testemunha</span>' : '')+'</td>'
        + '<td style="text-align:left;color:var(--muted)">'+(esc(doseTexto(t))||"—")+'</td>'
        + '<td>'+fmt(mostra(m))+'</td>'
        + '<td><span class="letra">'+(m.fora ? '—' : esc(m.letra||"a"))+'</span></td>'
        + (vs ? '<td>'+(ehT || !v ? '—' : (v.rel!=null ? (v.rel>0?'+':'')+fmt(v.rel,1)+'% ' : '')
                 + '<b class="letra">'+(v.difere?'*':'ns')+'</b>')+'</td>' : '')
        + '<td><div class="barra"><i style="width:'+pc.toFixed(1)+'%"></i></div></td></tr>';
    });
    s += '</tbody></table></div>'
      + (vs ? '<p style="font-size:.76rem;color:var(--muted)">vs. testemunha: diferença em % da média da testemunha; '
              + '* difere dela e ns não difere pelo teste de Dunnett a '+alfaTexto(r.alfa)
              + ' (DMS '+fmt(vs.dms)+(r.transf?', escala transformada':'')+').</p>' : '')
      + (r.fora ? '<p style="font-size:.76rem;color:var(--muted)">A testemunha ficou fora da análise estatística desta avaliação; '
                + 'o valor dela aparece só como referência.</p>' : '')
      + '</div>';
    s += '</details>';
  });
  return s;
}

/* Quadro de ANOVA: o mesmo desenho para a análise e para o desdobramento. */
function htmlQuadroAnova(linhas){
  let s = '<div class="tab-box"><table class="dados"><thead><tr>'
    + '<th>Fonte de variação</th><th>GL</th><th>SQ</th><th>QM</th><th>F</th><th>p-valor</th>'
    + '</tr></thead><tbody>';
  linhas.forEach(f=>{
    const sg = f.p!=null ? (f.p<0.01?"**":f.p<0.05?"*":"ns") : "";
    const rec = f.nivel===1 ? 'padding-left:28px;color:var(--ink-2)' : '';
    const gl = Number.isInteger(f.gl) ? f.gl : fmt(f.gl,1);
    s += '<tr'+(f.destaque?' style="background:var(--surface-3)"':'')+'>'
      + '<td style="'+(f.destaque?'font-weight:600':'')+rec+';white-space:normal">'
      + (f.nivel===1?'<span style="color:var(--muted);margin-right:6px">└</span>':'')+esc(f.nome)+'</td>'
      + '<td>'+gl+'</td><td>'+(f.sq!=null?fmt(f.sq,4):"—")+'</td>'
      + '<td>'+(f.qm!=null?fmt(f.qm,4):"—")+'</td>'
      + '<td>'+(f.f!=null?fmt(f.f,3):"—")+'</td>'
      + '<td>'+(f.p!=null?(f.p<0.0001?"&lt;0,0001":fmt(f.p,4))+' <b class="letra">'+sg+'</b>':"—")+'</td></tr>';
  });
  return s + '</tbody></table></div>';
}

/* Pressupostos em uma linha: normalidade dos resíduos e homogeneidade das
   variâncias. Falhou algum, o texto diz o que fazer — e o que fazer é quase
   sempre o botão Recomendar logo acima. */
function htmlPressupostos(p, alfa){
  if(!p || (!p.normal && !p.homog)) return '';
  const item = (nome, teste, x) => {
    if(!x) return '';
    const ok = x.p >= 0.05;
    return '<span class="pill '+(ok?'pill-a':'pill-w')+'" title="'+esc(teste)+'">'+(ok?'&#10003; ':'&#9888; ')
      + nome+' · p = '+(x.p<0.001?'&lt;0,001':fmt(x.p,3))+'</span>';
  };
  const falhou = (p.normal && p.normal.p < 0.05) || (p.homog && p.homog.p < 0.05);
  return '<div class="linha" style="gap:6px;margin-top:8px;align-items:center">'
    + '<span style="font-size:.74rem;color:var(--muted)">Pressupostos:</span>'
    + item("resíduos normais", "Shapiro-Wilk (W = "+(p.normal?fmt(p.normal.W,4):"—")+")", p.normal)
    + item("variâncias homogêneas", "Bartlett (χ² = "+(p.homog?fmt(p.homog.chi,3):"—")+")", p.homog)
    + '</div>'
    + (falhou ? '<p style="font-size:.76rem;color:var(--alerta);margin-top:4px;max-width:72ch">'
        + 'Um pressuposto da ANOVA falhou a 5% (Shapiro-Wilk para normalidade, Bartlett para homogeneidade). '
        + 'As letras podem não ser confiáveis — experimente uma transformação: o botão <b>Recomendar</b> indica qual.</p>' : '');
}

/* O bloco do fatorial: interação, testemunha, e depois ou os efeitos
   principais ou o desdobramento — conforme a opção e o resultado. */
function htmlFatorial(e, r, av){
  const F = r.fatorial, op = opcoesFatorial(e), alfa = r.alfa;
  const inter = F.pInt!=null && F.pInt < alfa;
  const temDesd = F.desd && F.desd.length >= 2;
  const desdobra = temDesd && (op.desdobrar === "sempre" || (op.desdobrar === "auto" && inter));
  const principais = !desdobra || op.desdobrar === "sempre";
  let s = '<div class="aviso '+(inter?'aviso-w':'aviso-i')+'" style="margin-top:12px"><span>'
    + (inter?'&#9888;':'&#8505;')+'</span><div>'
    + (inter
        ? '<b>A interação foi significativa.</b> Os fatores não agem de forma independente'
          + (desdobra ? ' — por isso, abaixo, o <b>desdobramento</b>: cada fator dentro de cada nível do outro.'
                      : '. Com o desdobramento desligado, interprete pelas combinações na tabela de tratamentos.')
        : 'Interação não significativa — os fatores podem ser interpretados separadamente, '
          + 'pelos efeitos principais abaixo.' + (desdobra ? ' O desdobramento vem em seguida, como pedido.' : ''))
    + '</div></div>';
  // fatorial com testemunha: o contraste diz se tratar fez diferença, antes de comparar doses
  if(F.adicionais && F.adicionais.length){
    const ct = r.fonte.find(l=>l.adicional && /vs\. fatorial/.test(l.nome));
    const sig = ct && ct.p!=null && ct.p < alfa;
    s += '<div class="aviso '+(sig?'aviso-i':'aviso-w')+'" style="margin-top:12px"><span>&#8505;</span><div>'
      + F.adicionais.map(a=>'<b>'+esc(a.nome||("T"+a.num))+'</b> (testemunha): média '+fmt(mostra(a))).join(" · ")
      + ' · fatorial: média '+fmt(F.mediaFatorialO!=null ? F.mediaFatorialO : F.mediaFatorial)+'. '
      + (sig ? 'A diferença entre testemunha e fatorial é significativa.'
             : 'A testemunha não difere do conjunto do fatorial.')
      + '</div></div>';
  }
  if(principais){
    F.medias.forEach(fm=>{
      if(fm.reg){
        s += htmlRegressao(fm.reg, fm.fator, av, 'Efeito de '+fm.fator+' (média dos demais fatores)');
        return;
      }
      s += '<div class="tab-box" style="margin-top:12px"><table class="dados"><thead><tr>'
        + '<th>'+esc(fm.fator)+'</th><th>Média</th><th>'+esc(fm.teste||r.testeNome||"")+'</th></tr></thead><tbody>';
      fm.linhas.forEach(x=>{
        s += '<tr><td>'+esc(x.nome||"(sem nome)")+'</td><td>'+fmt(mostra(x))+'</td>'
          + '<td><span class="letra">'+esc(x.letra||"a")+'</span></td></tr>';
      });
      s += '</tbody></table></div>';
    });
  }
  if(desdobra) s += htmlDesdobramento(F.desd, r, av);
  return s;
}

function htmlDesdobramento(desd, r, av){
  const alfa = r.alfa;
  let s = '<div class="eyebrow" style="margin-top:18px">Desdobramento da interação</div>';
  // ANOVA do desdobramento, como o SISVAR mostra antes do teste
  const linhas = [];
  const erros = [];
  desd.forEach(d=>{
    d.blocos.forEach(b=>linhas.push({nome:d.fator+" d. "+b.rot, gl:b.gl, sq:b.sq, qm:b.qm, f:b.f, p:b.p}));
    if(!erros.some(x=>x.nome===d.erro.nome)) erros.push(d.erro);
  });
  // a variância complexa não tem SQ própria: é uma combinação de dois quadrados médios
  erros.forEach(x=>linhas.push({nome:x.nome, gl:x.gl, qm:x.qm, sq: /Satterthwaite/.test(x.nome) ? null : x.qm*x.gl}));
  s += htmlQuadroAnova(linhas);
  const nome2 = desd.find(d=>!d.quant && d.blocos[0] && d.blocos[0].teste);
  const nomeTeste = nome2 ? nome2.blocos[0].teste : (r.testeNome||"");

  /* Dois fatores de categorias: a tabela de dupla entrada do relatório.
     Linhas = níveis do 1º fator, colunas = níveis do 2º. Minúscula compara na
     coluna (1º fator dentro de cada nível do 2º); maiúscula, na linha. */
  if(desd.length === 2 && !desd[0].quant && !desd[1].quant){
    const A = desd[0], B = desd[1];
    const nivA = A.blocos[0].niveis.map(x=>x.id), nivB = B.blocos[0].niveis.map(x=>x.id);
    const nomeA = A.blocos[0].niveis.map(x=>x.nome), nomeB = B.blocos[0].niveis.map(x=>x.nome);
    s += '<div class="tab-box" style="margin-top:12px"><table class="dados tab-final"><thead><tr>'
      + '<th>'+esc(A.fator)+' \\ '+esc(B.fator)+'</th>'+nomeB.map(n=>'<th>'+esc(n)+'</th>').join("")+'</tr></thead><tbody>';
    nivA.forEach((ai, i)=>{
      s += '<tr><td>'+esc(nomeA[i])+'</td>';
      nivB.forEach((bj, j)=>{
        const colB = A.blocos.find(b=>b.ids[0]===bj);         // A dentro de B = bj
        const linA = B.blocos.find(b=>b.ids[0]===ai);         // B dentro de A = ai
        const cel = colB && colB.niveis.find(x=>x.id===ai);
        const up = linA && linA.niveis.find(x=>x.id===bj);
        s += '<td>'+(cel ? fmt(mostra(cel)) + ' <span class="letra">'+esc(cel.letra||"")
               + '</span><span class="letra">'+esc((up&&up.letra||"").toUpperCase())+'</span>' : '—')+'</td>';
      });
      s += '</tr>';
    });
    s += '</tbody></table></div>'
      + '<p style="font-size:.76rem;color:var(--muted);max-width:80ch">Médias seguidas pela mesma letra '
      + '<b>minúscula na coluna</b> (compara '+esc(A.fator)+') e <b>maiúscula na linha</b> (compara '+esc(B.fator)
      + ') não diferem entre si pelo teste de '+esc(nomeTeste)+' a '+alfaTexto(alfa)+'.'
      + (desd.some(d=>/Satterthwaite/.test(d.erro.nome)) ? ' Na parcela subdividida, '+esc(A.fator)
          + ' dentro de cada '+esc(B.fator)+' é testado pela variância complexa, com GL de Satterthwaite.' : '')
      + '</p>';
    return s;
  }

  // demais casos: fator quantitativo (regressão em cada nível do outro) ou 3+ fatores
  desd.forEach(d=>{
    if(d.quant){
      d.blocos.forEach(b=>{ s += htmlRegressao(b.reg, d.fator, av, d.fator+' dentro de '+b.rot); });
      return;
    }
    const nomes = d.blocos[0].niveis.map(x=>x.nome);
    s += '<div class="tab-box" style="margin-top:12px"><table class="dados tab-final"><thead><tr>'
      + '<th>'+esc(d.fator)+' dentro de '+esc(d.dentroDe)+'</th>'+nomes.map(n=>'<th>'+esc(n)+'</th>').join("")
      + '</tr></thead><tbody>';
    d.blocos.forEach(b=>{
      s += '<tr><td>'+esc(b.rot)+'</td>'+b.niveis.map(x=>'<td>'+fmt(mostra(x))
        + ' <span class="letra">'+esc(x.letra||"")+'</span></td>').join("")+'</tr>';
    });
    s += '</tbody></table></div>'
      + '<p style="font-size:.76rem;color:var(--muted)">Em cada linha, médias de '+esc(d.fator)
      + ' seguidas da mesma letra não diferem pelo teste de '+esc(d.blocos[0].teste||nomeTeste)+' a '+alfaTexto(alfa)+'.</p>';
  });
  return s;
}

/* Regressão: quadro dos graus, equação indicada, R², ponto de máximo e o
   gráfico — pontos das médias e a curva ajustada. */
function htmlRegressao(reg, nomeFator, av, titulo){
  let s = '<div class="card card-p" style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">'
    + 'Regressão · '+esc(titulo)+'</div>';
  if(!reg){
    return s + '<p style="font-size:.83rem;color:var(--muted)">Não deu para ajustar: os níveis precisam ser números diferentes entre si.</p></div>';
  }
  const linhas = reg.comps.map(c=>({nome:c.nome, gl:1, sq:c.sq, qm:c.qm, f:c.f, p:c.p}));
  if(reg.desvio) linhas.push({nome:"Desvios da regressão", gl:reg.desvio.gl, sq:reg.desvio.sq, qm:reg.desvio.qm, f:reg.desvio.f, p:reg.desvio.p});
  s += htmlQuadroAnova(linhas);
  const esc1 = reg.escolhido;
  s += '<div class="linha" style="gap:14px;align-items:flex-start;margin-top:10px">';
  s += '<div style="flex:1;min-width:240px;font-size:.88rem">';
  if(esc1){
    s += '<div><b>Modelo indicado: '+esc(esc1.nome.toLowerCase())+'</b></div>'
      + '<div class="mono" style="margin:4px 0">'+esc(equacaoTexto(esc1.coef))+'</div>'
      + '<div>R² = '+fmt(esc1.r2*100,1)+'%</div>'
      + (reg.otimo ? '<div style="margin-top:4px">Ponto de '+reg.otimo.tipo+': <b>'+esc(nomeFator)+' = '+fmt(reg.otimo.x,2)
          + '</b> → '+fmt(reg.otimo.y,2)+'</div>' : '')
      + (reg.desvio && reg.desvio.p < 0.05 ? '<div style="color:var(--alerta);margin-top:4px">Os desvios da regressão são significativos: o polinômio não descreve bem todos os níveis.</div>' : '');
  } else {
    s += '<div><b>Nenhum grau da regressão foi significativo.</b></div>'
      + '<div style="color:var(--muted)">A resposta não muda de forma consistente com '+esc(nomeFator)+' — a média geral descreve o efeito.</div>';
  }
  s += '<div style="font-size:.74rem;color:var(--muted);margin-top:6px">x = '+esc(nomeFator)+' (número lido do nome de cada nível)'
    + (av && av.transf ? '; y na escala transformada' : '')+'. O modelo indicado é o de maior grau significativo.</div>';
  s += '</div>' + svgRegressao(reg) + '</div></div>';
  return s;
}
function svgRegressao(reg){
  const W = 300, H = 170, ml = 44, mr = 10, mt = 10, mb = 26;
  const xs = reg.xs, ys = reg.ys;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const curva = [];
  if(reg.escolhido) for(let k=0;k<=40;k++){ const x = x0 + (x1-x0)*k/40; curva.push([x, polinomio(reg.escolhido.coef, x)]); }
  const todosY = ys.concat(curva.map(c=>c[1]));
  let y0 = Math.min(...todosY), y1 = Math.max(...todosY);
  if(y1 - y0 < 1e-9){ y0 -= 1; y1 += 1; }
  const pad = (y1-y0)*0.08; y0 -= pad; y1 += pad;
  const X = x => ml + (x1===x0 ? 0.5 : (x-x0)/(x1-x0))*(W-ml-mr);
  const Y = y => mt + (1-(y-y0)/(y1-y0))*(H-mt-mb);
  let g = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" style="max-width:100%;height:auto;flex:none" role="img" aria-label="Gráfico da regressão">'
    + '<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--line-2)"/>'
    + '<line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--line-2)"/>';
  [y0+pad, (y0+y1)/2, y1-pad].forEach(v=>{
    g += '<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="2 3"/>'
      + '<text x="'+(ml-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+fmt(v, Math.abs(v)>=100?0:Math.abs(v)>=10?1:2)+'</text>';
  });
  xs.forEach(x=>{ g += '<text x="'+X(x).toFixed(1)+'" y="'+(H-mb+13)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+fmt(x, Number.isInteger(x)?0:2)+'</text>'; });
  if(curva.length) g += '<path d="'+curva.map((c,k)=>(k?'L':'M')+X(c[0]).toFixed(1)+' '+Y(c[1]).toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  xs.forEach((x,k)=>{ g += '<circle cx="'+X(x).toFixed(1)+'" cy="'+Y(ys[k]).toFixed(1)+'" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>'; });
  return g + '</svg>';
}

/* Tabela final do FATORIAL de dois fatores: uma tabela de dupla entrada por
   avaliação — linhas = níveis do 1º fator, colunas = do 2º —, que é como o
   fatorial sai num relatório. Com o desdobramento (interação significativa, ou
   "sempre"), cada célula leva a letra minúscula (compara na coluna) e a
   maiúscula (compara na linha). Sem ele, as células ficam só com a média e as
   letras vão para as médias marginais de cada fator. A testemunha, se houver,
   vem numa linha à parte. Devolve null quando o ensaio não é fatorial de 2. */
function tabelaFinalFatorial(e){
  const doisFatores = (e.fatores||[]).filter(f=>(f.niveis||[]).length>=2).length === 2;
  if(!doisFatores) return null;
  const op = opcoesFatorial(e);
  const blocos = [], fora = [];
  e.avaliacoes.forEach(av=>{
    const r = analisarAv(e, av);
    const F = r.ok && r.fatorial;
    if(!F || !F.desd || F.desd.length !== 2){ fora.push(av.nome || "sem nome"); return; }
    const alfa = r.alfa;
    const inter = F.pInt != null && F.pInt < alfa;
    const desdobra = op.desdobrar === "sempre" || (op.desdobrar === "auto" && inter);
    const A = F.desd[0], B = F.desd[1];
    const nivA = A.blocos[0].niveis, nivB = B.blocos[0].niveis;
    const celula = (ai, bj) => {
      const x = (A.blocos.find(b=>b.ids[0]===bj.id)||{niveis:[]}).niveis.find(n=>n.id===ai.id);
      const up = (B.blocos.find(b=>b.ids[0]===ai.id)||{niveis:[]}).niveis.find(n=>n.id===bj.id);
      return {x, up};
    };
    // casas decimais pela grandeza, como na tabela por tratamento
    const vals = [];
    nivA.forEach(ai=>nivB.forEach(bj=>{ const c = celula(ai,bj); if(c.x) vals.push(Math.abs(mostra(c.x))); }));
    const mx = vals.length ? Math.max(...vals) : 0;
    const cd = mx>=1000 ? 0 : mx>=10 ? 1 : 2;
    const fmA = F.medias.find(m=>m.fid===A.fid), fmB = F.medias.find(m=>m.fid===B.fid);
    const marg = (fm, nome, maiuscula) => {
      const x = fm && fm.linhas.find(l=>l.nome===nome);
      if(!x) return "—";
      const L = fm.reg ? "" : (maiuscula ? (x.letra||"").toUpperCase() : (x.letra||""));
      return fmt(mostra(x), cd) + (L ? " "+L : "");
    };
    const cab = [A.fator+" \\ "+B.fator].concat(nivB.map(n=>n.nome)).concat(desdobra ? [] : ["Média"]);
    const linhas = nivA.map(ai=>{
      const cels = nivB.map(bj=>{
        const {x, up} = celula(ai, bj);
        if(!x) return "—";
        if(!desdobra) return fmt(mostra(x), cd);
        const lo = A.quant ? "" : (x.letra||"");
        const hi = B.quant ? "" : ((up && up.letra)||"").toUpperCase();
        return fmt(mostra(x), cd) + (lo||hi ? " "+lo+hi : "");
      });
      return [ai.nome].concat(cels).concat(desdobra ? [] : [marg(fmA, ai.nome, false)]);
    });
    if(!desdobra) linhas.push(["Média"].concat(nivB.map(bj=>marg(fmB, bj.nome, true))).concat([fmt(F.mediaFatorialO!=null ? F.mediaFatorialO : r.mediaO, cd)]));
    // testemunha: dentro da análise (contraste) ou fora (referência)
    const extras = [];
    if(F.adicionais && F.adicionais.length){
      const ct = r.fonte.find(l=>l.adicional && /vs\. fatorial/.test(l.nome));
      F.adicionais.forEach(a=>extras.push((a.nome||("T"+a.num))+" (testemunha): "+fmt(mostra(a), cd)
        + (ct && ct.p!=null ? " — contraste testemunha vs. fatorial "+(ct.p < alfa ? "significativo" : "não significativo") : "")));
    }
    if(r.fora){
      const t = e.tratamentos[r.fora.i];
      extras.push((t.nome||("T"+t.num))+" (testemunha): "+fmt(r.fora.mo, cd)+" — fora da análise, só como referência");
    }
    const nomeTeste = (A.blocos[0] && A.blocos[0].teste) || (B.blocos[0] && B.blocos[0].teste) || r.testeNome || "";
    const quant = [A, B].filter(d=>d.quant).map(d=>d.fator);
    let nota = desdobra
      ? "Médias seguidas pela mesma letra minúscula na coluna ("+A.fator+") e maiúscula na linha ("+B.fator
        + ") não diferem entre si pelo teste de "+nomeTeste+" a "+alfaTexto(alfa)+"."
      : (inter
          ? "A interação foi significativa, mas o desdobramento está desligado nas opções — as letras marginais não devem ser interpretadas sozinhas."
          : "Interação não significativa (p = "+fmt(F.pInt,4)+"). ")
        + "Médias marginais seguidas pela mesma letra (minúscula na coluna da direita, maiúscula na linha de baixo) não diferem entre si pelo teste de "
        + nomeTeste+" a "+alfaTexto(alfa)+".";
    if(quant.length) nota += " "+quant.join(" e ")+": fator quantitativo — ver a regressão na análise.";
    if(r.transf) nota += " Análise com os dados transformados em "+TRANSF[r.transf].nome+"; médias originais.";
    blocos.push({
      titulo: av.nome || "Avaliação",
      sub: [av.unidade ? "("+av.unidade+")" : "", diasTexto(av)].filter(Boolean).join(" · "),
      cab, linhas, extras, cv: fmt(r.cv,2), nota, desdobra
    });
  });
  return {blocos, fora};
}
function htmlGradeFatorial(b){
  return '<div style="margin-top:14px"><div style="font-weight:600;font-size:.95rem">'+esc(b.titulo)
    + (b.sub ? ' <span class="tf-sub">'+esc(b.sub)+'</span>' : '')+'</div>'

    + '</tbody></table></div>'
    + b.extras.map(x=>'<p style="font-size:.8rem;margin-top:4px">'+esc(x)+'</p>').join("")

/* Quadros recolhíveis (sanfona): quais estão abertos fica guardado na tela, para
   um redesenho — trocar o teste, digitar — não fechar o que a pessoa abriu. */
function sanfonaAberta(chave, padrao){

document.addEventListener("toggle", ev=>{

function htmlTabelaTrat(tf){

    + '</tbody></table></div>'
    + '<p style="font-size:.76rem;color:var(--muted);max-width:80ch">'+esc(tf.nota)+'</p>';

function secaoTabelaFinal(e){
  const tf = tabelaFinal(e);
  const tff = tabelaFinalFatorial(e);
  const usaFat = !!(tff && tff.blocos.length);
  let s = '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Resultados</div>'
    + '<h2>Tabela final</h2></div>'
    + (tf.cols.length || usaFat ? '<button class="b b-s" data-acao="copiar-final">Copiar tabela</button>' : '')
    + '</div>';
  if(!tf.cols.length && !usaFat){
    return s + '<p style="font-size:.83rem;color:var(--muted);max-width:66ch">'
      + 'Aparece quando pelo menos uma avaliação estiver com a malha completa.</p></div>';
  }
  if(usaFat){
    // fatorial: a tabela de dupla entrada de cada avaliação; a por tratamento fica recolhida
    s += tff.blocos.map(htmlGradeFatorial).join("");
    if(tf.cols.length){
      const k = "tf-trat";
      s += '<details class="sanfona" data-sanfona="'+k+'"'+(sanfonaAberta(k,false)?' open':'')+'>'
        + '<summary>Tabela por tratamento (todas as avaliações)</summary>'+htmlTabelaTrat(tf)+'</details>';
    }
  } else {
    s += htmlTabelaTrat(tf);
  }
  const fora = usaFat ? tff.fora : tf.fora;
  s += (fora.length ? '<p style="font-size:.76rem;color:var(--muted)">Fora da tabela por falta de dados: '
        + fora.map(esc).join(", ")+'.</p>' : '')
    + '</div>';
  return s;
}

/* Copia a tabela final em dois formatos de uma vez: colada no Word vira tabela
   de verdade (HTML), colada no Excel cai em colunas (texto com TAB). */
async function copiarTabelaFinal(e){
  const tf = tabelaFinal(e);
  const tff = tabelaFinalFatorial(e);
  const bd = 'border-top:1px solid #000;border-bottom:1px solid #000;';
  const cel = (x,tag,est) => '<'+tag+' style="padding:3px 10px;text-align:center;'+(est||'')+'">'+esc(x)+'</'+tag+'>';
  const serif = 'font-family:\'Times New Roman\',serif;';
  // uma tabela no padrão do relatório: filete em cima e embaixo do cabeçalho e na última linha
  const tabelaWord = (cab, corpo) => '<table style="border-collapse:collapse;'+serif+'font-size:11pt">'
    + '<tr>'+cab.map(x=>cel(x,"th",bd)).join("")+'</tr>'
    + corpo.map((l,i)=>'<tr>'+l.map(x=>cel(x,"td", i===corpo.length-1 ? bd : "")).join("")+'</tr>').join("")
    + '</table>';
  let html = "", tsv = "";
  if(tff && tff.blocos.length){
    // fatorial: uma tabela de dupla entrada por avaliação, com as letras maiúsculas e minúsculas
    tff.blocos.forEach(b=>{
      const corpo = b.linhas.concat([["C.V. (%)", b.cv].concat(new Array(Math.max(0, b.cab.length-2)).fill(""))]);
      html += '<p style="'+serif+'font-size:11pt;font-weight:bold;margin:12pt 0 4pt">'+esc(b.titulo)+(b.sub?' '+esc(b.sub):'')+'</p>'
        + tabelaWord(b.cab, corpo)
        + b.extras.map(x=>'<p style="'+serif+'font-size:10pt;margin:2pt 0">'+esc(x)+'</p>').join("")
        + '<p style="'+serif+'font-size:9pt">'+esc(b.nota)+'</p>';
      tsv += b.titulo+(b.sub?" "+b.sub:"")+"\n"+[b.cab].concat(corpo).map(l=>l.join("\t")).join("\n")+"\n"
        + b.extras.map(x=>x+"\n").join("") + b.nota + "\n\n";
    });
  } else {
    const cab = ["Trat."].concat(tf.cols.map(c=>c.nome + (c.unidade ? " ("+c.unidade+")" : "")));
    const corpo = tf.linhas.map(l=>[l.nome].concat(l.cels))
                    .concat([["C.V. (%)"].concat(tf.cols.map(c=>c.cv))]);
    tsv = [cab].concat(corpo).map(l=>l.join("\t")).join("\n") + "\n\n" + tf.nota;
    html = tabelaWord(cab, corpo) + '<p style="'+serif+'font-size:9pt">'+esc(tf.nota)+'</p>';
  }
  try{
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], {type:"text/html"}),
      "text/plain": new Blob([tsv], {type:"text/plain"})
    })]);
    toast("Tabela copiada — cole no Word ou no Excel");
    return;
  }catch(err){}
  try{ await navigator.clipboard.writeText(tsv); toast("Tabela copiada"); return; }catch(err){}
  abrirModal('<h2>Tabela final</h2>'
    + '<textarea id="txt-export" class="mono" readonly rows="12" style="width:100%;font-size:.75rem;'
    + 'border:1px solid var(--line-2);border-radius:8px;padding:10px">'+esc(tsv)+'</textarea>'
    + '<div class="linha" style="justify-content:flex-end;margin-top:12px">'
    + '<button class="b" data-acao="selecionar-export">Selecionar tudo</button>'
    + '<button class="b b-p" data-acao="fechar">Fechar</button></div>');
}

/* ============================ MODAIS ============================ */
function abrirModal(html){
  const d = document.createElement("div");
  d.className="modal-fundo"; d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  d.addEventListener("click", ev=>{ if(ev.target===d) fecharModal(); });
  document.body.appendChild(d);
  const p = d.querySelector("input,textarea,select"); if(p) p.focus();
  return d;
}
function fecharModal(){ const d=document.querySelector(".modal-fundo"); if(d) d.remove(); }

/* Pergunta um texto — o `prompt()` do navegador é bloqueado como o `confirm()`. */
function pedirTexto(titulo, ajuda, rotulo, sugestao){
  return new Promise(resolve=>{
    const d = document.createElement("div");
    d.className = "modal-fundo";
    d.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2>'+esc(titulo)+'</h2>'
      + (ajuda ? '<p style="font-size:.86rem;color:var(--muted);margin-bottom:14px;max-width:52ch">'
                 + esc(ajuda)+'</p>' : '')
      + '<div class="campo"><label>'+esc(rotulo)+'</label>'
      + '<input id="txt-modal" value="'+esc(sugestao||"")+'"></div>'
      + '<div class="linha" style="justify-content:flex-end;margin-top:16px">'
      + '<button class="b" data-r="0">Cancelar</button>'
      + '<button class="b b-p" data-r="1">Salvar</button></div></div>';
    const inp = () => d.querySelector("#txt-modal");
    const fim = v => { d.remove(); document.removeEventListener("keydown", tecla); resolve(v); };
    const tecla = ev => {
      if(ev.key==="Escape"){ ev.stopPropagation(); fim(null); }
      if(ev.key==="Enter" && document.activeElement===inp()){ ev.preventDefault(); fim(inp().value); }
    };
    d.addEventListener("click", ev=>{
      const b = ev.target.closest("[data-r]");
      if(b) fim(b.dataset.r==="1" ? inp().value : null);
      else if(ev.target===d) fim(null);
    });
    document.addEventListener("keydown", tecla);
    document.body.appendChild(d);
    inp().focus(); inp().select();
  });
}

/* O `confirm()` do navegador é bloqueado dentro do quadro em que o app roda:
   retorna "não" sozinho, e a exclusão era cancelada em silêncio. Este diálogo
   é do próprio app, então funciona onde o do navegador não funciona. */
function confirmar(msg, rotulo){
  return new Promise(resolve=>{
    const d = document.createElement("div");
    d.className = "modal-fundo";
    d.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true">'
      + '<h2>Confirmar</h2>'
      + '<p style="font-size:.92rem;line-height:1.55;margin-bottom:20px;max-width:52ch">'+msg+'</p>'
      + '<div class="linha" style="justify-content:flex-end">'
      + '<button class="b" data-r="0">Cancelar</button>'
      + '<button class="b b-p" data-r="1" style="background:var(--erro);border-color:var(--erro);color:#fff">'
      + esc(rotulo||"Excluir")+'</button></div></div>';
    const fim = v => { d.remove(); document.removeEventListener("keydown", tecla); resolve(v); };
    const tecla = ev => { if(ev.key==="Escape"){ ev.stopPropagation(); fim(false); } };
    d.addEventListener("click", ev=>{
      const b = ev.target.closest("[data-r]");
      if(b) fim(b.dataset.r === "1");
      else if(ev.target === d) fim(false);
    });
    document.addEventListener("keydown", tecla);
    document.body.appendChild(d);
    d.querySelector('[data-r="1"]').focus();
  });
}
function toast(t){
  const el=document.createElement("div"); el.className="toast"; el.textContent=t;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2400);
}

  document.getElementById("f-exp").addEventListener("submit", async ev=>{

    if(!d.nome || !d.nome.trim()){ toast("Dê um nome ao ensaio"); return; }
    if(e){
      const nRepNovo = Math.max(2, Number(d.nRep)||e.nRep);
      /* Menos repetições com dados lançados: os valores dos blocos que somem
         continuam guardados, mas saem da análise. Antes acontecia calado. */
      if(nRepNovo < e.nRep){
        const afetadas = e.avaliacoes.filter(av=>Object.keys(av.dados||{}).some(k=>{
          const b = Number(k.split("|")[1]); return b >= nRepNovo && av.dados[k] !== "";
        }));
        if(afetadas.length && !await confirmar("Passar de "+e.nRep+" para "+nRepNovo+" repetições? "
            + "<b>"+afetadas.length+"</b> avaliação(ões) têm dados nos blocos que saem. Eles ficam "
            + "guardados, mas deixam de entrar na tabela e na análise — voltam se você "
            + "aumentar as repetições de novo.", "Reduzir")) return;
      }
      Object.assign(e, {nome:d.nome, cultura:d.cultura, cultivar:d.cultivar, local:d.local,
        coordenadas:(d.coordenadas||"").trim(),
        safra:d.safra, grupoId:d.grupoId||"", delineamento:d.delineamento, teste:d.teste, nRep:nRepNovo,
        areaParcela:num(d.areaParcela), vazao:d.vazao, dataPlantio:d.dataPlantio,
        responsavel:d.responsavel});
      marcarSujo(); fecharModal(); render(); toast("Ficha atualizada");
    } else { fecharModal(); novoExperimento(d); }
  });
}
/* De onde se contam os dias: emergência, aplicação ou semeadura. Ensaio de
   herbicida pós-emergente conta da aplicação (DAA); o app só oferecia DAE, e
   o relatório saía dizendo "10 DAE" com a metodologia dizendo DAA. */
const REFS_DIAS = ["DAE","DAA","DAS"];
function refDias(av){ return (av && REFS_DIAS.indexOf(av.ref) >= 0) ? av.ref : "DAE"; }
function diasTexto(av){ return (av && av.dae) ? av.dae + " " + refDias(av) : ""; }
function seletorRef(atual, extra){
  return '<select '+(extra||'')+'>'
    + REFS_DIAS.map(r=>'<option'+(r===atual?' selected':'')+'>'+r+'</option>').join("")
    + '</select>';
}

/* Fecha a foto em tela cheia e solta a versão ampliada da MEMÓRIA — ela
   continua na gaveta do aparelho e volta de lá na próxima vez. Sem isto cada
   foto aberta ficava presa na memória até fechar o app: centenas numa tarde de
   conferência bastavam para o Android derrubar o app num celular mais simples. */
function fecharFoto(){
  const lb = document.querySelector(".lightbox"); if(!lb) return;
  const e = exp(), f = e && (e.fotos||[]).find(x=>x.id===lb.dataset.foto);
  if(f && f.local && f.media) delete f.media;
  lb.remove();
}
function verFoto(e, id){
  const x = e.fotos.find(f=>f.id===id); if(!x) return;
  const t = e.tratamentos.find(y=>y.id===x.tratId);
  const q = (e.sessoesFoto||[]).find(y=>y.id===x.sessaoId);
  const etq = etiquetaTexto(e, x);
  const d = document.createElement("div");
  d.className="lightbox";
  const chip = 'background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)';
  d.innerHTML = '<div class="linha" style="justify-content:space-between">'
    + '<span class="pill" style="'+chip+'">'+dataBr(x.data)+'</span>'
    + '<button class="b b-s" data-acao="fechar-foto" style="'+chip+'">Fechar</button></div>'
    /* Foto que ainda não desceu abre com um pixel transparente em vez de um
       ícone de imagem quebrada; imagemComEtiqueta troca assim que ela chega. */
    + '<img src="'+(x.media||x.thumb
        ||"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7")
    + '" alt="'+esc(etq||"Foto do ensaio")+'">'
    + '<div class="lightbox-info">'
    + (t?'<span class="pill" style="'+chip+'">T'+t.num+' — '+esc(t.nome)+(x.bloco?' · Bloco '+esc(x.bloco):'')+'</span>':'')
    + (q?'<span class="pill" style="'+chip+'">'+esc(q.titulo||"Quadro")+'</span>':'')
    + (etq?'<div style="flex-basis:100%;font-size:.95rem;font-family:Calibri,Carlito,'
          + '\'Segoe UI\',Roboto,sans-serif">'+esc(etq)+'</div>':'')
    /* Só endereço web vira link: um "javascript:" colado ali rodaria código
       dentro do app de quem tocasse. */
    + (/^https?:\/\//i.test(x.link||"") ? '<a href="'+esc(x.link)+'" target="_blank" rel="noopener" style="color:#95C061;font-size:.85rem">Abrir arquivo original &#8599;</a>':'')
    + '<button class="b b-s" data-acao="salvar-foto" data-id="'+x.id+'" style="'+chip+'">'
    + '&#11015; Salvar no celular</button>'
    + '<div style="flex-basis:100%;font-size:.76rem;color:#8E9880">A etiqueta sai impressa '
    + 'junto. Segurar a foto também funciona.</div>'
    + (PERSIST.leitura?'':'<button class="b b-s b-perigo" data-acao="del-foto" data-id="'+x.id+'" style="margin-left:auto;background:transparent">Excluir foto</button>')
    + '</div>';
  d.dataset.foto = x.id;
  d.addEventListener("click", ev=>{ if(ev.target===d) fecharFoto(); });
  document.body.appendChild(d);
  /* Troca pela versão com a etiqueta queimada assim que ela fica pronta: a foto
     limpa aparece na hora e o usuário não espera o canvas para ver o que abriu. */
  const alvo = d.querySelector("img");
  imagemComEtiqueta(e, x).then(u=>{ if(alvo.isConnected) alvo.src = u; }).catch(()=>{});
}

    if(!ids.length){ toast("Marque ao menos uma avaliação"); return; }

async function exportarPlanilha(e, ids){
  const avs = e.avaliacoes.filter(a=>ids.includes(a.id));
  const cab = ["Tratamento","Bloco"]
    .concat(avs.map(a=>a.nome + (a.unidade ? " ("+a.unidade+")" : "")));
  const linhas = [];
  e.tratamentos.forEach(t=>{
    for(let b=0;b<e.nRep;b++){
      const l = [String(t.num), String.fromCharCode(97+b)];
      avs.forEach(a=>{
        const v = a.dados[t.id+"|"+b];
        // vírgula decimal: é o que o Excel em português entende como número
        l.push(v==null || v==="" ? "" : String(v).replace(".",","));
      });
      linhas.push(l);
    }
  });
  const tudo = [cab].concat(linhas);
  /* ';' e BOM porque é assim que o Excel em português abre o arquivo já em
     colunas; sem o BOM os acentos chegam quebrados. */
  const csv = "﻿" + tudo.map(l=>l.map(c=>
    /[;"\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c).join(";")).join("\r\n");
  const tsv = tudo.map(l=>l.join("\t")).join("\n");
  const nome = (e.nome.replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").toLowerCase()
                || "ensaio")+".csv";
  try{
    const arq = new File([csv], nome, {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq]});
      return;
    }
  }catch(err){ if(err && err.name === "AbortError") return; }
  try{
    // colado no Excel, o TAB já separa as colunas sem passar por importação
    await navigator.clipboard.writeText(tsv);
    toast(linhas.length+" linhas copiadas — cole direto no Excel");
    return;
  }catch(err){}
  abrirModal('<h2>Dados para a planilha</h2>'
    + '<p style="font-size:.85rem;color:var(--muted);margin-bottom:10px">'
    + 'Toque em <b>Selecionar tudo</b>, copie e cole no Excel — as colunas se separam sozinhas.</p>'
    + '<textarea id="txt-export" class="mono" readonly rows="14" style="width:100%;font-size:.75rem;'
    + 'border:1px solid var(--line-2);border-radius:8px;padding:10px">'+esc(tsv)+'</textarea>'
    + '<div class="linha" style="justify-content:flex-end;margin-top:12px">'
    + '<button class="b" data-acao="selecionar-export">Selecionar tudo</button>'
    + '<button class="b b-p" data-acao="fechar">Fechar</button></div>');
}

/* --------- EXPORTAR --------- */
/* Texto do quadro de ANOVA, colunas separadas por TAB (cola em colunas no Excel). */
function textoQuadro(linhas){
  let t = "FV\tGL\tSQ\tQM\tF\tp-valor\n";
  linhas.forEach(f=>{
    t += f.nome+"\t"+(Number.isInteger(f.gl) ? f.gl : fmt(f.gl,1))+"\t"+(f.sq!=null?fmt(f.sq,4):"")+"\t"
       + (f.qm!=null?fmt(f.qm,4):"")+"\t"+(f.f!=null?fmt(f.f,3):"")+"\t"+(f.p!=null?fmt(f.p,4):"")+"\n";
  });
  return t;
}
function textoRegressao(reg, titulo){
  if(!reg) return "\nRegressão — "+titulo+": não ajustada (níveis sem valor numérico)\n";
  const linhas = reg.comps.map(c=>({nome:c.nome, gl:1, sq:c.sq, qm:c.qm, f:c.f, p:c.p}));
  if(reg.desvio) linhas.push({nome:"Desvios da regressão", gl:reg.desvio.gl, sq:reg.desvio.sq, qm:reg.desvio.qm, f:reg.desvio.f, p:reg.desvio.p});
  let t = "\nRegressão — "+titulo+"\n" + textoQuadro(linhas);
  if(reg.escolhido){
    t += "Modelo indicado ("+reg.escolhido.nome.toLowerCase()+"): "+equacaoTexto(reg.escolhido.coef)
       + "   R² = "+fmt(reg.escolhido.r2*100,1)+"%\n";
    if(reg.otimo) t += "Ponto de "+reg.otimo.tipo+": x = "+fmt(reg.otimo.x,2)+" → ŷ = "+fmt(reg.otimo.y,2)+"\n";
  } else t += "Nenhum grau da regressão foi significativo.\n";
  return t;
}
/* O fatorial no relatório: segue a mesma decisão da tela (efeitos principais,
   desdobramento ou os dois). */
function textoFatorial(e, r){
  const F = r.fatorial, op = opcoesFatorial(e), alfa = r.alfa;
  const inter = F.pInt!=null && F.pInt < alfa;
  const temDesd = F.desd && F.desd.length >= 2;
  const desdobra = temDesd && (op.desdobrar === "sempre" || (op.desdobrar === "auto" && inter));
  const principais = !desdobra || op.desdobrar === "sempre";
  let t = "\nInteração "+(inter?"SIGNIFICATIVA":"não significativa")+" a "+alfaTexto(alfa)
        + (inter ? (desdobra ? " — desdobramento abaixo." : " — interpretar pelas combinações.")
                 : " — os fatores podem ser interpretados separadamente.")+"\n";
  if(F.adicionais && F.adicionais.length){
    t += F.adicionais.map(a=>(a.nome||("T"+a.num))+" (testemunha): média "+fmt(mostra(a))).join("; ")
       + "; fatorial: média "+fmt(F.mediaFatorialO!=null ? F.mediaFatorialO : F.mediaFatorial)+"\n";
  }
  if(principais){
    F.medias.forEach(fm=>{
      if(fm.reg){ t += textoRegressao(fm.reg, "efeito de "+fm.fator); return; }
      t += "\nMédias de "+fm.fator+" ("+(fm.teste||r.testeNome||"")+" "+alfaTexto(alfa)
         + (fm.dms!=null ? ", DMS "+fmt(fm.dms) : "")+"):\nNível\tMédia\tGrupo\n";
      fm.linhas.forEach(x=>{ t += (x.nome||"?")+"\t"+fmt(mostra(x))+"\t"+(x.letra||"")+"\n"; });
    });
  }
  if(desdobra){
    const linhas = [], erros = [];
    F.desd.forEach(d=>{
      d.blocos.forEach(b=>linhas.push({nome:d.fator+" d. "+b.rot, gl:b.gl, sq:b.sq, qm:b.qm, f:b.f, p:b.p}));
      if(!erros.some(x=>x.nome===d.erro.nome)) erros.push(d.erro);
    });
    erros.forEach(x=>linhas.push({nome:x.nome, gl:x.gl, qm:x.qm, sq: /Satterthwaite/.test(x.nome) ? null : x.qm*x.gl}));
    t += "\nDesdobramento da interação:\n" + textoQuadro(linhas);
    const D = F.desd;
    if(D.length === 2 && !D[0].quant && !D[1].quant){
      const A = D[0], B = D[1];
      const nivA = A.blocos[0].niveis, nivB = B.blocos[0].niveis;
      t += "\n"+A.fator+" \\ "+B.fator+"\t"+nivB.map(x=>x.nome).join("\t")+"\n";
      nivA.forEach(ai=>{
        t += ai.nome + "\t" + nivB.map(bj=>{
          const cel = (A.blocos.find(b=>b.ids[0]===bj.id)||{niveis:[]}).niveis.find(x=>x.id===ai.id);
          const up = (B.blocos.find(b=>b.ids[0]===ai.id)||{niveis:[]}).niveis.find(x=>x.id===bj.id);
          return cel ? fmt(mostra(cel))+" "+(cel.letra||"")+((up&&up.letra)||"").toUpperCase() : "—";
        }).join("\t") + "\n";
      });
      t += "Médias seguidas pela mesma letra minúscula na coluna ("+A.fator+") e maiúscula na linha ("
         + B.fator+") não diferem entre si pelo teste de "+(A.blocos[0].teste||"")+" a "+alfaTexto(alfa)+".\n";
    } else {
      D.forEach(d=>{
        if(d.quant){ d.blocos.forEach(b=>{ t += textoRegressao(b.reg, d.fator+" dentro de "+b.rot); }); return; }
        t += "\n"+d.fator+" dentro de "+d.dentroDe+" ("+(d.blocos[0].teste||"")+" "+alfaTexto(alfa)+")\n";
        d.blocos.forEach(b=>{
          t += b.rot+"\t"+b.niveis.map(x=>x.nome+": "+fmt(mostra(x))+" "+(x.letra||"")).join("\t")+"\n";
        });
      });
    }
  }
  return t;
}

async function exportar(e){
  let txt = "RELATÓRIO DE ENSAIO — "+e.nome+"\n";
  txt += "=".repeat(60)+"\n\n";
  txt += "Cultura: "+e.cultura+"\nCultivar: "+e.cultivar+"\nLocal: "+e.local+"\n"
       + (e.coordenadas ? "Coordenadas: "+e.coordenadas+"\n" : "") + "Safra: "+e.safra+"\n";
  txt += "Delineamento: "+((DELINS[e.delineamento]||{}).nome||e.delineamento)
       + " — "+e.tratamentos.length+" tratamentos × "+e.nRep+" repetições\n";
  txt += "Comparação de médias: "+((TESTES[e.teste]||TESTES.tukey).nome)
       + " a "+alfaTexto(alfaDe(e))+"\n";
  txt += "Área da parcela: "+(e.areaParcela!=null?fmt(e.areaParcela,2)+" m²":"—")+"\n";
  txt += "Taxa de aplicação: "+(e.vazao||"—")+"\n";
  txt += "Plantio: "+dataBr(e.dataPlantio)+"\nResponsável: "+e.responsavel+"\n\n";
  txt += "PROTOCOLO\n"+"-".repeat(60)+"\n";
  txt += "Objetivo:\n"+(e.protocolo.objetivo||"—")+"\n\nMetodologia:\n"+(e.protocolo.metodologia||"—")
       + "\n\nObservações:\n"+(e.protocolo.observacoes||"—")+"\n";
  (e.protocolo.anotacoes||[]).forEach(a=>{
    if(!a.titulo && !a.texto) return;
    txt += "\n"+(a.titulo||"Anotação")+":\n"+(a.texto||"—")+"\n";
  });
  txt += "\n";
  const fatExp = ehFatorial(e);
  if(e.fatores.length){
    txt += "ESQUEMA FATORIAL\n"+"-".repeat(60)+"\n";
    e.fatores.forEach(f=>{
      txt += (f.nome||"Fator")+": "+(f.niveis||[]).map(n=>n.nome||"?").join(", ")+"\n";
    });
    if(fatExp) txt += "Arranjo "+arranjoTexto(fatExp)
      + " — a análise separa os efeitos principais e a interação"
      + ((fatExp.adicionais||[]).length ? ", e compara a testemunha com o fatorial" : "") + ".\n";
    txt += "\n";
  }
  if(e.croqui && Object.keys(e.croqui).length){
    txt += "CROQUI DE CAMPO\n"+"-".repeat(60)+"\n";
    txt += "Parcela\t"
         + Array.from({length:e.nRep},(_,b)=>"Bloco "+String.fromCharCode(65+b)).join("\t")+"\n";
    for(let p=e.tratamentos.length-1;p>=0;p--){
      const linha=[];
      for(let b=0;b<e.nRep;b++){
        const v = e.croqui[b+"|"+p];
        linha.push(v ? v+String.fromCharCode(65+b) : "—");
      }
      txt += (p+1)+"\t"+linha.join("\t")+"\n";
    }
    txt += "\n";
  }
  if((e.aplicacoes||[]).length){
    txt += "APLICAÇÕES\n"+"-".repeat(60)+"\n";
    e.aplicacoes.forEach(a=>{
      if(!a.rotulo) return;
      txt += a.rotulo+"\t"+(a.estadio||"—")+"\t"+(a.data?dataBr(a.data):"—")
           + (a.obs?"\t"+a.obs:"")+"\n";
    });
    txt += "\n";
  }
  txt += "PROTOCOLO — TRATAMENTOS\n"+"-".repeat(60)+"\n";
  txt += "Nº\tTratamento\t"+(e.fatores.length?"Fatores\t":"")
       + "Produto\tDose\tUnidade\tAplicação\n";
  e.tratamentos.forEach(t=>{
    const prods = (t.produtos||[]).filter(p=>p.nome||p.dose);
    if(!prods.length){
      txt += t.num+"\t"+t.nome+"\t"+(e.fatores.length?fatorTexto(e,t)+"\t":"")+"—\t—\t—\t—\n";
      return;
    }
    prods.forEach((p,i)=>{
      txt += (i===0 ? t.num+"\t"+t.nome+"\t"+(e.fatores.length?fatorTexto(e,t)+"\t":"")
                    : "\t\t"+(e.fatores.length?"\t":""))
           + (p.nome||"—")+"\t"+(p.dose||"—")+"\t"+(p.unidade||"—")+"\t"+(p.aplicacao||"—")+"\n";
    });
  });

  if((e.obsTratamentos||"").trim()) txt += "\nObservação (todos os tratamentos): "+e.obsTratamentos.trim()+"\n";
  e.avaliacoes.forEach(av=>{
    txt += "\n\nAVALIAÇÃO: "+av.nome+"\n"+"-".repeat(60)+"\n";
    txt += "Data: "+dataBr(av.data)+(av.dae?" | "+diasTexto(av):"")+(av.unidade?" | unidade: "+av.unidade:"")+"\n\n";
    txt += "Dados por parcela:\nTratamento\t"+Array.from({length:e.nRep},(_,i)=>"Bloco "+(i+1)).join("\t")+"\tMédia\n";
    const matriz = matrizDe(e,av);
    e.tratamentos.forEach((t,ti)=>{
      const vals = matriz[ti].filter(v=>v!=null);
      const m = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      txt += t.num+". "+t.nome+"\t"+matriz[ti].map(v=>v==null?"":fmt(v)).join("\t")+"\t"+fmt(m)+"\n";
    });
    const r = analisarAv(e, av);
    if(r.ok){
      const nomeTeste = r.testeNome || (TESTES[r.teste]||TESTES.tukey).nome;
      if(r.transf) txt += "\nTransformação para a análise: "+TRANSF[r.transf].nome
        + " (médias apresentadas na escala original)\n";
      txt += "\nQuadro da análise de variância:\n" + textoQuadro(r.fonte);
      txt += "\nCV (%): "+fmt(r.cv,2)
           + (r.cvA!=null ? " (parcela: "+fmt(r.cvA,2)+")" : "")
           + "\nMédia geral: "+fmt(r.transf ? r.mediaO : r.media)+"\n"
           + (r.dms!=null ? "DMS "+nomeTeste+" "+alfaTexto(r.alfa)+(r.transf?" (escala transformada)":"")+": "+fmt(r.dms)+"\n" : "")
           + (r.critNome ? r.critNome+": "+fmt(r.critValor,3)+"\n" : "");
      const p = r.pressupostos || {};
      if(p.normal || p.homog){
        txt += "Pressupostos: "
          + (p.normal ? "normalidade dos resíduos (Shapiro-Wilk) W = "+fmt(p.normal.W,4)+", p = "+fmt(p.normal.p,4) : "")
          + (p.normal && p.homog ? "; " : "")
          + (p.homog ? "homogeneidade das variâncias (Bartlett) χ² = "+fmt(p.homog.chi,3)+", p = "+fmt(p.homog.p,4) : "")
          + "\n";
      }
      if(r.fatorial) txt += textoFatorial(e, r);
      if(r.dunnett){
        const c = e.tratamentos[r.dunnett.iCtrl];
        const mC = mostra(r.dunnett.linhas.find(x=>x.i===r.dunnett.iCtrl));
        txt += "\nTeste de Dunnett ("+alfaTexto(r.alfa)+") — testemunha: "+c.num+". "+c.nome+"\n"
             + "Tratamento\tMédia\tDif. p/ testemunha\tDunnett\n";
        const ordD = TELA.ordem === "media"
          ? r.dunnett.linhas.slice().sort((a,b)=>b.media-a.media)
          : r.dunnett.linhas.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num);
        ordD.forEach(x=>{
          const t = e.tratamentos[x.i], ctrl = x.i===r.dunnett.iCtrl, dif = mostra(x) - mC;
          txt += t.num+". "+t.nome+"\t"+fmt(mostra(x))+"\t"
               + (ctrl ? "—" : (dif>0?"+":"")+fmt(dif))+"\t"
               + (ctrl ? "(testemunha)" : (x.difere?"*":"ns"))+"\n";
        });
        txt += "\n* difere da testemunha · ns não difere. Dunnett não compara os "
             + "tratamentos entre si.\n";
        if(av.obs) txt += "\nObservações: "+av.obs+"\n";
        return;
      }
      const vs = r.vsTest;
      txt += "\nMédias e teste de "+nomeTeste+" ("+alfaTexto(r.alfa)+"):\nTratamento\tMédia\tGrupo"
           + (vs ? "\tvs. testemunha" : "") + "\n";
      const ordExp = (TELA.ordem === "media"
        ? r.medias.slice().sort((a,b)=>b.media-a.media)
        : r.medias.slice().sort((a,b)=>e.tratamentos[a.i].num - e.tratamentos[b.i].num)).slice();
      if(r.fora){
        const lf = {i:r.fora.i, mo:r.fora.mo, fora:true};
        const p = ordExp.findIndex(m=>e.tratamentos[m.i].num > e.tratamentos[lf.i].num);
        if(TELA.ordem === "media") ordExp.push(lf); else ordExp.splice(p<0?ordExp.length:p, 0, lf);
      }
      ordExp.forEach(m=>{
        const v = vs && vs.linhas.find(x=>x.i===m.i);
        txt += e.tratamentos[m.i].num+". "+e.tratamentos[m.i].nome+"\t"+fmt(mostra(m))+"\t"
             + (m.fora ? "(fora da análise)" : m.letra)
             + (vs ? "\t"+(m.i===vs.iCtrl || !v ? "(testemunha)" : (v.rel!=null ? (v.rel>0?"+":"")+fmt(v.rel,1)+"% " : "")+(v.difere?"*":"ns")) : "")
             + "\n";
      });
      txt += "\nMédias seguidas da mesma letra não diferem entre si pelo teste de "
           + nomeTeste+" a "+alfaTexto(r.alfa)+".\n";
      if(vs) txt += "vs. testemunha: diferença em % da testemunha; * difere e ns não difere pelo teste de Dunnett a "
                  + alfaTexto(r.alfa)+" (DMS "+fmt(vs.dms)+").\n";
      if(r.fora) txt += "A testemunha ficou fora da análise estatística desta avaliação; valor apenas como referência.\n";
    } else if(r.erro === "transf"){
      txt += "\n[análise não realizada: a transformação "+TRANSF[r.transf].nome+" não se aplica a estes dados]\n";
    } else if(r.erro === "split_adicional"){
      txt += "\n[análise não realizada: parcela subdividida com testemunha adicional — deixe a testemunha fora da análise]\n";
    } else {
      txt += "\n[análise não realizada: malha de dados incompleta]\n";
    }
    if(av.obs) txt += "\nObservações: "+av.obs+"\n";
  });
  const tff = tabelaFinalFatorial(e);
  if(tff && tff.blocos.length){
    txt += "\n\nTABELA FINAL — FATORIAL (dupla entrada)\n"+"-".repeat(60)+"\n";
    tff.blocos.forEach(b=>{
      txt += "\n"+b.titulo+(b.sub?" "+b.sub:"")+"\n"+b.cab.join("\t")+"\n"
           + b.linhas.map(l=>l.join("\t")).join("\n")+"\nC.V. (%)\t"+b.cv+"\n"
           + b.extras.map(x=>x+"\n").join("") + b.nota+"\n";
    });
  }
  const tf = tabelaFinal(e);
  if(tf.cols.length){
    txt += "\n\nTABELA FINAL — RESULTADOS"+(tff && tff.blocos.length ? " POR TRATAMENTO" : "")+"\n"+"-".repeat(60)+"\n";
    txt += "Trat.\t"+tf.cols.map(c=>c.nome+(c.unidade?" ("+c.unidade+")":"")+(c.dias?" "+c.dias:"")).join("\t")+"\n";
    tf.linhas.forEach(l=>{ txt += l.nome+"\t"+l.cels.join("\t")+"\n"; });
    txt += "C.V. (%)\t"+tf.cols.map(c=>c.cv).join("\t")+"\n"+tf.nota+"\n";
  }
  if(e.fotos.length){
    /* Agrupado por quadro e tratamento — a mesma ordem em que as fotos serão
       montadas na prancha do relatório. A etiqueta vai pronta, como legenda. */
    txt += "\n\nREGISTRO FOTOGRÁFICO ("+e.fotos.length+" fotos)\n"+"-".repeat(60)+"\n";
    const quadros = (e.sessoesFoto||[]).concat([{id:"", titulo:"Sem quadro", data:""}]);
    quadros.forEach(q=>{
      const fs = e.fotos.filter(x=>(x.sessaoId||"")===q.id);
      if(!fs.length) return;
      txt += "\n"+(q.titulo||"Sem título")+(q.data?" — "+dataBr(q.data):"")
           + " ("+fs.length+" foto"+(fs.length===1?"":"s")+")\n";
      const ordem = e.tratamentos.map(t=>t.id).concat([""]);
      ordem.forEach(tid=>{
        const doTrat = fs.filter(x=>(x.tratId||"")===tid
          || (!tid && x.tratId && !e.tratamentos.some(t=>t.id===x.tratId)));
        if(!doTrat.length) return;
        const t = e.tratamentos.find(y=>y.id===tid);
        txt += "  "+(t ? t.num+". "+t.nome : "sem tratamento")+"\n";
        doTrat.forEach((x,i)=>{
          txt += "    "+(i+1)+". "+(etiquetaTexto(e,x)||dataBr(x.data))
               + (x.link?" | "+x.link:"")+(x.soMini?" [só miniatura]":"")+"\n";
        });
      });
    });
  }

  const nomeArq = e.nome.replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").toLowerCase()+".txt";
  let dl = null;
  /* O download de arquivo está desligado de propósito: enquanto o app o oferece,
     a plataforma proíbe compartilhar o link — e a equipe precisa mais do acesso
     do que do .txt. Fica a tentativa: se um dia voltar, o botão volta sozinho. */
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(err){}
  if(dl){
    try{
      await dl.save({filename:nomeArq, data:txt});
      toast("Arquivo gerado"); return;
    }catch(err){ /* recusado ou indisponível: cai para a cópia */ }
  }
  try{
    await navigator.clipboard.writeText(txt);
    toast("Copiado — é só colar no chat com o Claude");
  }catch(err){
    /* Sem área de transferência (acontece em alguns navegadores de celular):
       mostra o texto com um botão que seleciona tudo, porque selecionar à mão
       num campo de 16 linhas no telefone é inviável. */
    abrirModal('<h2>Dados do ensaio</h2><p style="font-size:.85rem;color:var(--muted);margin-bottom:10px">'
      + 'Toque em <b>Selecionar tudo</b> e depois em Copiar.</p>'
      + '<textarea id="txt-export" class="mono" readonly rows="16" style="width:100%;font-size:.75rem;'
      + 'border:1px solid var(--line-2);border-radius:8px;padding:10px">'+esc(txt)+'</textarea>'
      + '<div class="linha" style="justify-content:flex-end;margin-top:12px">'
      + '<button class="b" data-acao="selecionar-export">Selecionar tudo</button>'
      + '<button class="b b-p" data-acao="fechar">Fechar</button></div>');
  }
}

/* ============================ EVENTOS ============================ */
document.addEventListener("click", async ev=>{
  const el = ev.target.closest("[data-acao]");
  if(!el) return;
  const a = el.dataset.acao, id = el.dataset.id, e = exp();

  if(a==="home"){ TELA={nome:"home",expId:null,aba:"protocolo",avId:null}; render(); }
  else if(a==="tela-sync"){ TELA={nome:"sync"}; render(); }
  else if(a==="sincronizar"){ sincronizar(false); }
  else if(a==="backup-dados"){
    if(PERSIST.pend) await salvar();      // o backup leva o que já está gravado
    await fazerBackup(false);
  }
  else if(a==="backup-completo"){
    if(PERSIST.pend) await salvar();
    await fazerBackup(true);
  }
  else if(a==="restaurar"){
    const ent = document.createElement("input");
    ent.type = "file"; ent.accept = ".zip,application/zip";
    ent.addEventListener("change", async ()=>{
      const arq = (ent.files||[])[0];
      if(arq) await restaurarBackup(arq);
    });
    ent.click();
  }
  /* Grava o que estiver pendente antes de recarregar: a atualização troca o
     programa, e não pode levar junto o que ainda não foi para o disco. */
  else if(a==="buscar-atualizacao"){
    if(!navigator.onLine){ toast("Precisa de internet para buscar"); return; }
    if(PERSIST.pend) await salvar();
    toast("Procurando versão nova…");
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }catch(err){}
    location.reload();
  }
  else if(a==="instalar"){
    if(!CONVITE_INSTALAR){ toast("Use o menu do navegador: Instalar app"); return; }
    CONVITE_INSTALAR.prompt();
    const r = await CONVITE_INSTALAR.userChoice.catch(()=>null);
    CONVITE_INSTALAR = null; render();
    if(r && r.outcome === "accepted") toast("Instalado — abra pelo ícone daqui em diante");
  }
  else if(a==="carregar-pdf"){ carregarPdf(e); }
  else if(a==="editar-pdf"){ TELA.editarPdf = e.id; render(); }
  else if(a==="fim-editar-pdf"){ TELA.editarPdf = null; render(); }
  else if(a==="ver-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    if(r) abrirPdf(e, r);
  }
  else if(a==="baixar-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    if(r) baixarPdf(r);
  }
  else if(a==="compartilhar-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    if(r) compartilharPdf(r);
  }
  else if(a==="trocar-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    if(r) carregarPdf(e, r);
  }
  else if(a==="del-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    if(!r) return;
    if(!await confirmar("Remover <b>"+esc(r.nome)+"</b> deste ensaio? O arquivo sai deste aparelho"
        + (r.remota ? " e da equipe." : "."))) return;
    e.relatorios = e.relatorios.filter(x=>x.id!==id);
    apagarPdfs([id]);
    if(r.remota) enfileirarExclusaoPdf(id);
    if(!e.relatorios.length) TELA.editarPdf = null;
    marcarSujo(); render(); toast("PDF removido");
  }
  else if(a==="mover-pdf"){
    const r = (e.relatorios||[]).find(x=>x.id===id);
    const sel = document.getElementById("mover-"+id);
    const dest = sel && ST.experimentos.find(x=>x.id===sel.value);
    if(!r) return;
    if(!dest){ toast("Escolha para qual ensaio mover"); return; }
    if(!await confirmar("Mover <b>"+esc(r.nome)+"</b> para o ensaio <b>"+esc(dest.nome)+"</b>?")) return;
    e.relatorios = e.relatorios.filter(x=>x.id!==id);
    if(!Array.isArray(dest.relatorios)) dest.relatorios = [];
    dest.relatorios.push(r);
    // os dois ensaios mudaram: os dois precisam de carimbo novo para a sincronização
    if(!e.relatorios.length) TELA.editarPdf = null;
    marcarSujo(dest); render(); toast("Movido para "+dest.nome);
  }
  else if(a==="pegar-gps"){
    const inp = document.getElementById("in-coord");
    if(!navigator.geolocation){ toast("Este aparelho não informa a posição"); return; }
    toast("Buscando a posição…");
    navigator.geolocation.getCurrentPosition(p=>{
      if(inp) inp.value = p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6);
      toast("Posição capturada — precisão de uns "+Math.round(p.coords.accuracy)+" m");
    }, err=>{
      toast(err && err.code===1 ? "O app não tem permissão para usar a localização"
                                : "Não consegui a posição — tente a céu aberto");
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  }
  else if(a==="travar-fatores"){
    // nome em branco não vira texto travado: na análise ele sairia como "o fator"
    const semNome = e.fatores.some(f=>!(f.nome||"").trim() || (f.niveis||[]).some(n=>!(n.nome||"").trim()));
    if(semNome){ toast("Dê nome a todos os fatores e níveis antes de salvar"); return; }
    e.fatoresTravado = true; marcarSujo(); render(); toast("Fatores salvos");
  }
  else if(a==="destravar-fatores"){
    e.fatoresTravado = false; marcarSujo(); render();
  }
  else if(a==="travar-obstrat"){
    e.obsTratTravado = true; marcarSujo(); render(); toast("Observação salva");
  }
  else if(a==="destravar-obstrat"){
    e.obsTratTravado = false; marcarSujo(); render();
    const t = document.querySelector('[data-k="obstrat"]'); if(t) t.focus();
  }
  else if(a==="travar-protocolo"){
    e.protocoloTravado = true; marcarSujo(); render(); toast("Protocolo salvo");
  }
  else if(a==="destravar-protocolo"){
    e.protocoloTravado = false; marcarSujo(); render();
    const t = document.querySelector('[data-k="protocolo.objetivo"]');
    if(t) t.focus();
  }
  else if(a==="editar-obs"){
    TELA.editObs = id; render();
    const t = document.querySelector('[data-k="obs.'+id+'"]');
    if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
  else if(a==="obs-pronto"){ TELA.editObs = null; render(); }
  else if(a==="marcar-etq"){
    const alvo = ST.experimentos.find(x=>x.id===id);
    if(alvo) modalEtiquetas(alvo);
  }
  else if(a==="editar-etqs"){ modalEditarEtiquetas(); }
  else if(a==="ver-etq"){ TELA.etq = (TELA.etq===id ? "" : id); render(); }
  else if(a==="outro-projeto"){ TELA.outroProjeto = !TELA.outroProjeto; render(); }
  else if(a==="trocar-conta"){ TELA.trocarConta = !TELA.trocarConta; render(); }
  else if(a==="sync-entrar"){
    /* Os campos de endereço e chave só existem quando "outro projeto" está
       aberto; fora disso valem os embutidos. */
    const cu = document.getElementById("sync-url");
    const cc = document.getElementById("sync-chave");
    const url = ((cu && cu.value) || SUPA_URL).trim();
    const chave = ((cc && cc.value) || SUPA_CHAVE).trim();
    const email = (document.getElementById("sync-email").value||"").trim();
    const senha = document.getElementById("sync-senha").value||"";
    if(!email || !senha){ toast("Preencha o e-mail e a senha"); return; }
    if(!url || !chave){ toast("Falta o endereço ou a chave do projeto"); return; }
    if(!navigator.onLine){ toast("Precisa de internet para entrar na primeira vez"); return; }
    el.disabled = true; toast("Entrando…");
    try{
      await syncEntrar(url, chave, email, senha);
      marcarSujo(); await salvar();
      SYNC.erro = null;
      TELA.trocarConta = false; TELA.outroProjeto = false;
      render();
      await sincronizar(false);
    }catch(err){
      SYNC.erro = String((err && err.message) || err).slice(0,140);
      render(); toast(SYNC.erro);
    }
  }
  else if(a==="sync-sair"){
    if(!await confirmar("Desconectar deste aparelho? Os ensaios continuam gravados aqui — "
      + "só param de ir e vir da equipe.", "Desconectar")) return;
    delete ST.sync; SYNC = {rodando:false, quando:null, erro:null};
    marcarSujo(); render();
  }
  else if(a==="abrir-exp"){
    /* Ensaio finalizado abre no relatório: é o que se procura nele depois de
       pronto. Vale a etiqueta padrão ou qualquer uma com "finaliz" no nome. */
    const alvo = ST.experimentos.find(x=>x.id===id);
    const finalizado = alvo && (alvo.etiquetas||[]).some(eid=>{
      const t = ST.etiquetas.find(x=>x.id===eid);
      return eid === "et-finalizado" || (t && /finaliz/i.test(t.nome||""));
    });
    TELA={nome:"exp",expId:id,aba: finalizado ? "relatorio" : "protocolo",avId:null}; render();
  }
  else if(a==="aba"){ TELA.aba=el.dataset.aba; render(); }
  else if(a==="novo-exp"){ modalExperimento(null); }
  else if(a==="editar-exp"){ modalExperimento(e); }
  else if(a==="fechar"){ fecharModal(); }
  else if(a==="selecionar-export"){
    const t = document.getElementById("txt-export");
    if(t){ t.focus(); t.select(); t.setSelectionRange(0, t.value.length); }
  }
  else if(a==="fechar-foto"){ fecharFoto(); }
  else if(a==="del-exp"){
