<!doctype html>
<title>Caderneta de Campo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7B3C">
<meta name="description" content="Ensaios agronômicos: protocolo, croqui, avaliações, fotos por tratamento e análise estatística. Funciona sem internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --ground:#EFF1EA; --surface:#FFFFFF; --surface-2:#E4E8DB; --surface-3:#F6F8F2;
  --ink:#191E12; --ink-2:#3E4634; --muted:#6C7460; --line:#D3D9C6; --line-2:#C0C8B0;
  --accent:#4A7328; --accent-ink:#FFFFFF; --accent-soft:#DFEBCF; --accent-line:#A8C486;
  --alerta:#9A6410; --alerta-soft:#F7E9CE; --erro:#9E3626; --erro-soft:#F7DCD6;
  --shadow:0 1px 2px rgba(25,30,18,.06),0 4px 14px rgba(25,30,18,.05);
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em; line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.serif{font-family:"Source Serif 4",Georgia,serif}

/* ---------- estrutura ---------- */
.topo{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:12px; min-height:56px;
}
.topo-tit{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.topo-tit b{font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topo-tit span{font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wrap{max-width:1080px; margin:0 auto; padding:18px 16px 96px}
.abas{
  position:sticky; top:56px; z-index:35; background:var(--ground);
  border-bottom:1px solid var(--line); display:flex; gap:2px;
  overflow-x:auto; scrollbar-width:none; padding:0 8px;
}
.abas::-webkit-scrollbar{display:none}
.aba{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 13px; font-size:.83rem; font-weight:500; color:var(--muted);
  white-space:nowrap; letter-spacing:.01em;
}
.aba[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

/* ---------- botões ---------- */
.b{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:9px 14px; border-radius:var(--r-sm); font-size:.85rem; font-weight:500;
  cursor:pointer; min-height:40px; transition:background .12s,border-color .12s;
}
.b:hover{background:var(--surface-2)}
.b:disabled{opacity:.45; cursor:not-allowed}
.b-p{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.b-p:hover{background:var(--accent); filter:brightness(1.08)}
.b-g{padding:12px 20px; min-height:48px; font-size:.92rem}
.b-s{padding:6px 10px; min-height:32px; font-size:.78rem}
.b-perigo{color:var(--erro); border-color:var(--erro)}
.b-perigo:hover{background:var(--erro-soft)}
/* Excluir precisa parecer um botão: o × sem contorno passava despercebido. */
.b-x{
  flex:none; width:36px; min-width:36px; height:36px; min-height:36px; padding:0;
  font-size:1.15rem; line-height:1; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--muted);
}
.b-x:hover{background:var(--erro-soft); border-color:var(--erro); color:var(--erro)}
.b-ghost{border-color:transparent; background:none}
.b-ghost:hover{background:var(--surface-2)}

/* seletor de duas vias: mostra as duas opções e qual está valendo */
.seg{
  display:inline-flex; gap:2px; padding:2px; flex:none;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-sm);
}
.seg-b{
  border:0; background:none; color:var(--muted); font:inherit; font-size:.83rem;
  font-weight:600; padding:7px 15px; min-height:36px; border-radius:5px; cursor:pointer;
}
.seg-b:hover{color:var(--ink-2)}
.seg-b.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow)}
.seg-b:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- cartões / campos ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-p{padding:16px}
.grid{display:grid; gap:12px}
.linha{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.campo{display:flex; flex-direction:column; gap:5px}
.campo>label{font-size:.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.campo input,.campo select,.campo textarea{
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:10px 11px; font-size:.92rem; width:100%; min-height:42px;
}
.campo textarea{min-height:110px; resize:vertical; line-height:1.6}
.campo .dica{font-size:.72rem; color:var(--muted)}

.eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.vazio{text-align:center; padding:44px 22px; color:var(--muted)}
.vazio h2{color:var(--ink); margin-bottom:8px}
.vazio p{max-width:44ch; margin:0 auto 18px; font-size:.9rem}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:.72rem; font-weight:600; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line); white-space:nowrap;
}
.pill-a{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.pill-w{background:var(--alerta-soft); color:var(--alerta); border-color:var(--alerta)}
.pill-e{background:var(--erro-soft); color:var(--erro); border-color:var(--erro)}

/* ---------- lista de experimentos ---------- */
.exp-lista{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

/* --- grupos lado a lado, como as listas do Trello --- */
.quadros{
  display:flex; gap:12px; overflow-x:auto; overflow-y:visible;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  padding-bottom:10px; scrollbar-width:thin
}
.quadros::-webkit-scrollbar{height:7px}
.quadros::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px}
.quadro{
  /* 84% no celular deixa a coluna seguinte espiando — é o que ensina que dá
     para deslizar, sem precisar de seta nem instrução. */
  flex:0 0 min(84%, 300px); scroll-snap-align:start;
  display:flex; flex-direction:column; gap:9px
}
.quadro-cab{
  display:flex; align-items:center; gap:8px; padding:0 3px 7px;
  border-bottom:2px solid var(--line-2); position:sticky; top:0;
  background:var(--ground); z-index:1
}
.quadro-nome{
  font-family:Archivo,system-ui,sans-serif; font-weight:600; font-size:.9rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1
}
.quadro-n{
  font-size:.72rem; font-weight:600; color:var(--muted); background:var(--surface-2);
  border:1px solid var(--line); border-radius:99px; padding:1px 8px; flex:none
}
.quadro[data-solto] .quadro-nome{color:var(--muted); font-style:italic}
.quadro-corpo{display:flex; flex-direction:column; gap:10px}
.quadro-vazio{
  border:1px dashed var(--line-2); border-radius:var(--r); padding:18px 12px;
  text-align:center; font-size:.82rem; color:var(--muted)
}
.dica-quadros{font-size:.76rem; color:var(--muted); margin:2px 0 0; text-align:center}
@media (min-width:760px){
  .quadro{flex:0 0 300px}
  .dica-quadros{display:none}
}
.exp-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:10px; transition:border-color .12s,transform .12s;
}
.exp-card:hover{border-color:var(--accent-line)}
.exp-card h3{font-size:1rem}
/* a área de cima do cartão é o que abre o ensaio; o rodapé fica para o seletor */
.exp-abrir{cursor:pointer; display:flex; flex-direction:column; gap:2px; flex:1}
.exp-abrir:hover h3{color:var(--accent)}
.exp-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
.exp-meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
/* Cartão curto: duas linhas, sem o rodapé de contagens. */
.exp-card.exp-curto{gap:8px; padding:13px 14px}
.exp-card.exp-curto h3{font-size:.97rem; line-height:1.3}
/* O seletor de grupo é a própria etiqueta: edita no lugar, sem parecer
   formulário e sem custar uma linha inteira do cartão. */
.chip-grupo{
  appearance:none; -webkit-appearance:none;
  padding:3px 22px 3px 9px; border-radius:99px;
  font:600 .72rem/1.5 inherit; font-family:inherit;
  background:var(--surface-2) no-repeat right 7px center;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-size:4px 4px,4px 4px;
  background-position:calc(100% - 11px) calc(50% + 1px),calc(100% - 7px) calc(50% + 1px);
  color:var(--muted); border:1px solid var(--line); max-width:52%;
  text-overflow:ellipsis; white-space:nowrap; cursor:pointer
}
.chip-grupo.tem{background-color:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.chip-grupo:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* --- etiquetas de estado --- */
.etq-barras{display:flex; gap:4px; margin-bottom:2px}
.etq-barra{height:6px; flex:1; max-width:44px; border-radius:99px}
.chip-etq{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2);
  font:600 .72rem/1.5 inherit; cursor:pointer; max-width:100%
}
.chip-etq:hover{border-color:var(--accent-line)}
.etq-ponto{width:8px; height:8px; border-radius:99px; flex:none}
.etq-nome{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* a etiqueta cheia, usada na lista de escolha e na tela de edição */
.etq-cheia{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:6px;
  color:#fff; font-weight:600; font-size:.85rem; border:0; cursor:pointer;
  width:100%; text-align:left; min-height:38px
}
.etq-lista{display:flex; flex-direction:column; gap:7px; margin:4px 0 2px}
.etq-linha{display:flex; align-items:center; gap:8px}
.etq-check{flex:none; width:18px; font-size:1rem; text-align:center}
input[type="color"]{
  width:42px; height:38px; padding:2px; border:1px solid var(--line-2);
  border-radius:var(--r-sm); background:var(--surface); cursor:pointer; flex:none
}
.exp-num{display:flex; gap:16px; border-top:1px solid var(--line); padding-top:10px; margin-top:auto}
.exp-num div{display:flex; flex-direction:column}
.exp-num b{font-family:"IBM Plex Mono",monospace; font-size:1.05rem; font-weight:600; line-height:1}
.exp-num span{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px}

/* ---------- malha blocos x tratamentos ---------- */
.malha-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.malha{border-collapse:collapse; width:100%; min-width:max-content}
table.malha th,table.malha td{border:1px solid var(--line); padding:0; text-align:center}
table.malha thead th{
  background:var(--surface-2); font-size:.72rem; font-weight:600; padding:8px 10px;
  color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0;
}
table.malha tbody th{
  background:var(--surface-3); text-align:left; padding:8px 11px; font-size:.82rem;
  font-weight:500; position:sticky; left:0; z-index:2; min-width:150px; max-width:220px;
}
table.malha tbody th small{display:block; color:var(--muted); font-size:.7rem; font-weight:400}
table.malha td input{
  border:0; background:none; width:100%; min-width:74px; padding:11px 6px; text-align:center;
  font-family:"IBM Plex Mono",monospace; font-size:.92rem; font-variant-numeric:tabular-nums;
  min-height:44px;
}
table.malha td input:focus{background:var(--accent-soft); outline:2px solid var(--accent); outline-offset:-2px}
table.malha td.media{background:var(--surface-3); font-family:"IBM Plex Mono",monospace; font-size:.88rem; font-weight:600; padding:9px 11px}
table.malha tr.rodape th,table.malha tr.rodape td{background:var(--surface-2); font-size:.82rem; padding:8px 10px; font-family:"IBM Plex Mono",monospace}
/* No croqui a coluna "Parcela" é só um número de ordem: fica estreita, e o
   espaço que sobra vai para as colunas dos blocos, que é onde se lê o mapa. */
table.malha.croqui th:first-child{width:52px; min-width:52px; max-width:52px}
table.malha.croqui td input{min-width:0}

/* ---------- tabelas de resultado ---------- */
.tab-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.dados{border-collapse:collapse; width:100%; font-size:.85rem}
table.dados th,table.dados td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
table.dados th:first-child,table.dados td:first-child{text-align:left}
table.dados thead th{
  background:var(--surface-2); font-size:.7rem; text-transform:uppercase; letter-spacing:.05em;
  font-weight:600; color:var(--ink-2);
}
table.dados td{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
table.dados td:first-child{font-family:Archivo,sans-serif}
table.dados tbody tr:last-child td{border-bottom:0}
.letra{font-weight:700; color:var(--accent); margin-left:2px}
/* Protocolo impresso: listras alternadas por tratamento, como na caderneta.
   Tudo centralizado — é um quadro de conferência, não um texto corrido, e o
   olho desce coluna por coluna procurando o valor. */
table.protocolo-tab th,table.protocolo-tab td,
table.protocolo-tab th:first-child,table.protocolo-tab td:first-child{text-align:center}
table.protocolo-tab tbody tr.par td{background:var(--surface-3)}
table.protocolo-tab td{border-bottom:1px solid var(--line)}
table.protocolo-tab tbody tr:last-child td{border-bottom:0}

/* ---------- fotos ---------- */
.galeria{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.foto-item{
  position:relative; aspect-ratio:1; border-radius:var(--r-sm); overflow:hidden;
  border:1px solid var(--line); background:var(--surface-2); cursor:pointer; padding:0;
}
.foto-item img{width:100%; height:100%; object-fit:cover; display:block}
.foto-tag{
  position:absolute; left:0; right:0; bottom:0; padding:14px 6px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.78)); color:#fff;
  font-size:.66rem; font-weight:600; text-align:left; line-height:1.25;
  font-family:"IBM Plex Mono",monospace;
}
/* Foto com etiqueta embaixo: a etiqueta é o produto final que vai para o
   relatório, então ela ocupa espaço de verdade e não é um rodapé sobre a imagem. */
/* Linha do tratamento: a linha inteira abre e fecha, porque no campo se toca
   com o polegar e uma seta de 12px não é alvo. */
.trat-abrir{
  display:flex; align-items:center; gap:9px; flex:1; min-width:0; cursor:pointer;
  padding:4px 2px; border-radius:var(--r-sm);
}
.trat-abrir:hover h3{color:var(--accent)}
.trat-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.trat-seta{color:var(--muted); flex:none; font-size:.9rem; transition:transform .15s}
.trat-seta.on{transform:rotate(90deg); color:var(--accent)}
@media(prefers-reduced-motion:reduce){ .trat-seta{transition:none} }

.foto-grade{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.foto-cartao{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column;
}
.foto-face{
  border:0; padding:0; background:var(--surface-2); cursor:pointer; display:block;
  width:100%; aspect-ratio:4/3;
}
.foto-face img{width:100%; height:100%; object-fit:cover; display:block}
/* O lugar da foto que ainda está no servidor: ocupa o mesmo espaço da imagem,
   para a grade não pular quando ela chegar. */
.foto-nuvem{display:flex; align-items:center; justify-content:center;
  width:100%; height:100%; background:var(--surface-3); color:var(--muted);
  font-size:1.1rem; letter-spacing:.05em}
.foto-face:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
/* A etiqueta usa a mesma fonte na tela e na imagem exportada, para o que se vê
   aqui ser o que sai no arquivo. */
.foto-etiq{
  padding:8px; font-size:.78rem; line-height:1.35; color:var(--ink-2);
  font-family:Calibri,Carlito,"Segoe UI",Roboto,sans-serif; word-break:break-word;
}
.lightbox{
  position:fixed; inset:0; z-index:100; background:rgba(10,12,8,.94);
  display:flex; flex-direction:column; padding:12px;
}
.lightbox img{flex:1; min-height:0; object-fit:contain; width:100%}
.lightbox-info{color:#E9EDDF; padding:12px 4px; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}

/* ---------- diversos ---------- */
.barra{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.barra i.w{background:var(--alerta)} .barra i.e{background:var(--erro)}

.salvo{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--muted); white-space:nowrap}
.ponto{width:7px; height:7px; border-radius:99px; background:var(--muted); flex:none}
.ponto.ok{background:var(--accent)} .ponto.pend{background:var(--alerta)} .ponto.err{background:var(--erro)}

.modal-fundo{position:fixed; inset:0; z-index:90; background:rgba(10,12,8,.55); display:flex; align-items:flex-end; justify-content:center; padding:0}
.modal{background:var(--surface); border-radius:var(--r) var(--r) 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:600px){
  .modal-fundo{align-items:center; padding:20px}
  .modal{border-radius:var(--r)}
}
.modal h2{margin-bottom:16px}

.aviso{padding:11px 13px; border-radius:var(--r-sm); font-size:.82rem; display:flex; gap:9px; align-items:flex-start; line-height:1.45}

<script>
"use strict";

/* ============================ ESTADO ============================ */
let ST = {experimentos:[], versao:1};
let TELA = {nome:"home", expId:null, aba:"protocolo", avId:null};
/* `leitura` fica falso para sempre: no app instalado quem abre é dono do caderno
   do próprio aparelho. O campo continua existindo porque a interface o consulta. */
let PERSIST = {pend:false, salvando:false, erro:null, leitura:false, ultimo:null};
let SYNC = {rodando:false, quando:null, erro:null};
let TIMER = null;
/* Para onde vai a próxima foto — preenchido antes de abrir a câmera, lido quando
   o arquivo volta. É o que liga o toque no tratamento à imagem que chega depois. */
let FOTO_ALVO = null;
/* Enquanto a câmera do celular está na frente, esta página fica em segundo plano.
   Salvar aí republica o documento e RECARREGA a view — e a foto volta para uma
   página nova, que não sabe mais de onde veio: perdia-se a primeira de cada duas.
   Com a câmera aberta, todo salvamento espera. */
let CAMERA_ABERTA = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function hoje(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dataBr(s){ if(!s) return "—"; const p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return Number.isFinite(n)?n:null; }
function fmt(n,d){ if(n==null||!Number.isFinite(n)) return "—"; return n.toLocaleString("pt-BR",{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}); }
function exp(){ return ST.experimentos.find(e=>e.id===TELA.expId) || null; }

/* Normaliza ensaios gravados por versões anteriores: um tratamento passou a ter
   vários produtos, o ensaio ganhou fatores, vazão e anotações livres. Roda na
   abertura, sem apagar nada do que já estava lá. */
/* As etiquetas dizem o ESTADO do ensaio, e é o que se quer enxergar de manhã:
   o que está atrasado, o que falta relatório, o que já colheu. Um ensaio pode
   ter mais de uma — "colheita próxima" e "relatório pendente" convivem — por
   isso é lista, e não um campo único.
   Estas seis são as que a equipe já usava no Trello, com as mesmas cores. */
const ETIQUETAS_PADRAO = [
  {id:"et-finalizado", nome:"Finalizado",         cor:"#1F845A"},
  {id:"et-andamento",  nome:"Em andamento",       cor:"#946F00"},
  {id:"et-colheita",   nome:"Colheita próxima",   cor:"#B65C02"},
  {id:"et-relatorio",  nome:"Relatório pendente", cor:"#C9372C"},
  {id:"et-perdido",    nome:"Ensaio perdido",     cor:"#803FA5"},
  {id:"et-inicio",     nome:"Pendente de início", cor:"#1D66C9"}
];
function migrar(){
  if(!Array.isArray(ST.modelos)) ST.modelos = [];   // croquis reutilizáveis
  if(!Array.isArray(ST.grupos))  ST.grupos  = [];   // pastas por safra, cliente, cultura…
  /* Só na primeira vez. Depois disso quem manda é o que o usuário editou —
     inclusive apagar todas, se for o caso. */
  if(!Array.isArray(ST.etiquetas)) ST.etiquetas = JSON.parse(JSON.stringify(ETIQUETAS_PADRAO));
  (ST.experimentos||[]).forEach(e=>{
    if(typeof e.grupoId !== "string") e.grupoId = "";
    if(!Array.isArray(e.etiquetas)) e.etiquetas = [];
    // etiqueta apagada não pode deixar referência solta no ensaio
    e.etiquetas = e.etiquetas.filter(id=>ST.etiquetas.some(x=>x.id===id));
    /* Carimbo de quando este ensaio mudou pela última vez: é por ele que a
       sincronização decide, ensaio a ensaio, qual versão é a boa. */
    if(typeof e.atualizado !== "string") e.atualizado = e.criado || "1970-01-01T00:00:00.000Z";
    if(typeof e.croquiTravado !== "boolean") e.croquiTravado = false;
    /* Aplicações: A, B, C… cada uma com o estádio em que foi feita. É o que liga
       a coluna "Aplicação" de cada produto ao momento real da pulverização. */
    if(!Array.isArray(e.aplicacoes)) e.aplicacoes = [];
    if(typeof e.aplicTravado !== "boolean") e.aplicTravado = false;
    /* Quadros de foto: cada um é uma saída a campo ("Altura de plantas — 45 DAE"),
       e dentro dele as fotos ficam agrupadas por tratamento. */
    if(!Array.isArray(e.sessoesFoto)) e.sessoesFoto = [];
    (e.fotos||[]).forEach(f=>{
      if(typeof f.sessaoId !== "string") f.sessaoId = "";
      if(!f.etiq || typeof f.etiq !== "object"){
        /* A legenda antiga vira o texto livre da etiqueta; o resto é montado
           a partir do tratamento e do quadro, e o usuário liga o que quiser. */
        f.etiq = {trat:true, prod:false, aval:true, data:true, texto:f.legenda||""};
        delete f.legenda;
      }
    });
    /* Esquema declarado pelo usuário. Em ensaios antigos ele é deduzido: quem já
       tinha fator estava em fatorial, o resto em simples. */
    if(e.esquema !== "simples" && e.esquema !== "fatorial")
      e.esquema = (e.fatores||[]).length ? "fatorial" : "simples";
    (e.avaliacoes||[]).forEach(av=>{
      if(typeof av.travada !== "boolean") av.travada = false;
    });
    if(e.vazao === undefined) e.vazao = "";
    if(e.teste === "fisher") e.teste = "t";          // renomeado
    if(!TESTES[e.teste]) e.teste = "tukey";
    if(!(e.alfa===0.01 || e.alfa===0.05 || e.alfa===0.10)) e.alfa = 0.05;
    if(typeof e.controle !== "number") e.controle = 0;
    if(typeof e.travado !== "boolean") e.travado = false;
    if(!Array.isArray(e.fatores)) e.fatores = [];
    if(!e.protocolo) e.protocolo = {objetivo:"", metodologia:"", observacoes:""};
    if(!Array.isArray(e.protocolo.anotacoes)) e.protocolo.anotacoes = [];
    (e.tratamentos||[]).forEach(t=>{
      if(!Array.isArray(t.produtos)){
        t.produtos = (t.produto || t.dose)
          ? [{id:uid(), nome:t.produto||"", dose:t.dose||"", unidade:"", aplicacao:""}]
          : [{id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}];
        delete t.produto; delete t.dose; delete t.unidade;
      }
      t.produtos.forEach(p=>{
        if(typeof p.unidade   !== "string") p.unidade   = "";
        if(typeof p.aplicacao !== "string") p.aplicacao = "";
      });
      if(!t.niveis || typeof t.niveis !== "object") t.niveis = {};
    });
  });
}
/* Texto de uma linha só com todos os produtos do tratamento, para as tabelas
   e para a exportação. */
function doseTexto(t){
  return (t.produtos||[])
    .map(p=>[p.nome, [p.dose,p.unidade].filter(Boolean).join(" ")].filter(Boolean).join(" "))
    .filter(Boolean).join(" + ");
}
/* Rótulos disponíveis para a coluna Aplicação: os que o ensaio definiu, mais as
   combinações de duas (AB, BC…) — é comum um adjuvante entrar em mais de uma. */
function rotulosAplicacao(e){
  const base = (e.aplicacoes||[]).map(a=>a.rotulo).filter(Boolean);
  const combos = [];
  for(let i=0;i<base.length;i++)
    for(let j=i+1;j<base.length;j++) combos.push(base[i]+base[j]);
  return base.concat(combos);
}
function aplicacoesTexto(e){
  return (e.aplicacoes||[])
    .filter(a=>a.rotulo)
    .map(a=>a.rotulo + (a.estadio ? " em "+a.estadio : "")
                     + (a.data ? " ("+dataBr(a.data)+")" : ""))
    .join(" · ");
}
/* Etiqueta da foto: montada na hora a partir do que o usuário mandou aparecer.
   Guardar só as chaves — e não o texto pronto — faz a etiqueta acompanhar as
   correções: renomeou o tratamento ou trocou a dose, a etiqueta segue certa. */
const ETIQ_PARTES = [
  ["aval", "Avaliação"], ["trat", "Tratamento"], ["prod", "Produtos"], ["data", "Data"]
];
function etiquetaTexto(e, f){
  const q = f.etiq || {};
  const t = e.tratamentos.find(x=>x.id===f.tratId);
  const s = (e.sessoesFoto||[]).find(x=>x.id===f.sessaoId);
  const partes = [];
  if(q.aval && s && s.titulo) partes.push(s.titulo);
  if(q.trat && t) partes.push("T"+t.num+(t.nome?" — "+t.nome:"")+(f.bloco?" · Bloco "+f.bloco:""));
  if(q.prod && t && doseTexto(t)) partes.push(doseTexto(t));
  if(q.data && f.data) partes.push(dataBr(f.data));
  if(q.texto) partes.push(q.texto);
  return partes.join(" · ");
}
function fatorTexto(e, t){
  return (e.fatores||[]).map(f=>{
    const n = (f.niveis||[]).find(x=>x.id===t.niveis[f.id]);
    return n ? n.nome : null;
  }).filter(Boolean).join(" × ");
}
/* Um ensaio só é analisado como fatorial quando os tratamentos cobrem
   exatamente todas as combinações dos níveis, uma vez cada. */
function ehFatorial(e){
  const f = (e.fatores||[]).filter(x=>(x.niveis||[]).length>=2);
  if(f.length < 2) return null;
  const combos = f.reduce((a,x)=>a*x.niveis.length, 1);
  if(combos !== e.tratamentos.length) return null;
  const vistos = new Set();
  for(const t of e.tratamentos){
    const chave = f.map(x=>t.niveis[x.id]||"").join("|");
    if(chave.split("|").some(v=>!v)) return null;   // tratamento sem nível definido
    if(vistos.has(chave)) return null;              // combinação repetida
    vistos.add(chave);
  }
  return f;
}

/* ============================ ESTATÍSTICA ============================ */
// Tabela q de Tukey, alfa = 0,05. Linhas: GL do resíduo. Colunas: nº de tratamentos (2..12).
const QTAB = {
  1:[17.97,26.98,32.82,37.08,40.41,43.12,45.40,47.36,49.07,50.59,51.96],
  2:[6.08,8.33,9.80,10.88,11.74,12.44,13.03,13.54,13.99,14.39,14.75],
  3:[4.50,5.91,6.82,7.50,8.04,8.48,8.85,9.18,9.46,9.72,9.95],
  4:[3.93,5.04,5.76,6.29,6.71,7.05,7.35,7.60,7.83,8.03,8.21],
  5:[3.64,4.60,5.22,5.67,6.03,6.33,6.58,6.80,6.99,7.17,7.32],
  6:[3.46,4.34,4.90,5.30,5.63,5.90,6.12,6.32,6.49,6.65,6.79],
  7:[3.34,4.16,4.68,5.06,5.36,5.61,5.82,6.00,6.16,6.30,6.43],
  8:[3.26,4.04,4.53,4.89,5.17,5.40,5.60,5.77,5.92,6.05,6.18],
  9:[3.20,3.95,4.41,4.76,5.02,5.24,5.43,5.59,5.74,5.87,5.98],
  10:[3.15,3.88,4.33,4.65,4.91,5.12,5.30,5.46,5.60,5.72,5.83],
  11:[3.11,3.82,4.26,4.57,4.82,5.03,5.20,5.35,5.49,5.61,5.71],
  12:[3.08,3.77,4.20,4.51,4.75,4.95,5.12,5.27,5.39,5.51,5.61],
  13:[3.06,3.73,4.15,4.45,4.69,4.88,5.05,5.19,5.32,5.43,5.53],
  14:[3.03,3.70,4.11,4.41,4.64,4.83,4.99,5.13,5.25,5.36,5.46],
  15:[3.01,3.67,4.08,4.37,4.59,4.78,4.94,5.08,5.20,5.31,5.40],
  16:[3.00,3.65,4.05,4.33,4.56,4.74,4.90,5.03,5.15,5.26,5.35],
  17:[2.98,3.63,4.02,4.30,4.52,4.70,4.86,4.99,5.11,5.21,5.31],
  18:[2.97,3.61,4.00,4.28,4.49,4.67,4.82,4.96,5.07,5.17,5.27],
  19:[2.96,3.59,3.98,4.25,4.47,4.65,4.79,4.92,5.04,5.14,5.23],
  20:[2.95,3.58,3.96,4.23,4.45,4.62,4.77,4.90,5.01,5.11,5.20],
  24:[2.92,3.53,3.90,4.17,4.37,4.54,4.68,4.81,4.92,5.01,5.10],
  30:[2.89,3.49,3.85,4.10,4.30,4.46,4.60,4.72,4.82,4.92,5.00],
  40:[2.86,3.44,3.79,4.04,4.23,4.39,4.52,4.63,4.73,4.82,4.90],
  60:[2.83,3.40,3.74,3.98,4.16,4.31,4.44,4.55,4.65,4.73,4.81],
  120:[2.80,3.36,3.68,3.92,4.10,4.24,4.36,4.47,4.56,4.64,4.71],
  1e9:[2.77,3.31,3.63,3.86,4.03,4.17,4.29,4.39,4.47,4.55,4.62]
};
function qTukey(k, gl){
  if(k<2) return null;
  const col = Math.min(k,12) - 2;
  const gls = Object.keys(QTAB).map(Number).sort((a,b)=>a-b);
  if(gl<=1) return QTAB[1][col];
  let lo=gls[0], hi=gls[gls.length-1];
  for(let i=0;i<gls.length;i++){ if(gls[i]<=gl) lo=gls[i]; if(gls[i]>=gl){ hi=gls[i]; break; } }
  if(lo===hi) return QTAB[lo][col];
  const t = (gl-lo)/(hi-lo);
  return QTAB[lo][col] + t*(QTAB[hi][col]-QTAB[lo][col]);
}
// distribuição F -> p-valor, via função beta incompleta regularizada
function lnGama(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
           12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x)) - lnGama(1-x);
  x-=1; let a=0.99999999999980993, t=x+7.5;
  for(let i=0;i<8;i++) a+=g[i]/(x+i+1);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function betaCF(a,b,x){
  const FP=1e-300, EPS=3e-14; let qab=a+b, qap=a+1, qam=a-1;
  let c=1, d=1-qab*x/qap; if(Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for(let m=1;m<=300;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betaInc(a,b,x){
  if(x<=0) return 0; if(x>=1) return 1;
  const bt = Math.exp(lnGama(a+b)-lnGama(a)-lnGama(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betaCF(a,b,x)/a : 1-bt*betaCF(b,a,1-x)/b;
}
function pValorF(f, gl1, gl2){
  if(!Number.isFinite(f)||f<=0||gl1<=0||gl2<=0) return null;
  return Math.max(0, Math.min(1, betaInc(gl2/2, gl1/2, gl2/(gl2+gl1*f))));
}
// t de Student: valor crítico bicaudal, para a DMS de Fisher
function tCDF(t, gl){
  const p = 0.5*betaInc(gl/2, 0.5, gl/(gl+t*t));
  return t>0 ? 1-p : p;
}
function tCrit(alfa, gl){
  let lo=0, hi=200;
  for(let i=0;i<160;i++){
    const m=(lo+hi)/2;
    if(2*(1-tCDF(m,gl)) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
// gama incompleta regularizada, para o qui-quadrado do Scott-Knott
function gamaInc(s, x){
  if(x<=0 || s<=0) return 0;
  if(x < s+1){
    let soma=1/s, termo=soma;
    for(let n=1;n<300;n++){
      termo *= x/(s+n); soma += termo;
      if(Math.abs(termo) < Math.abs(soma)*1e-15) break;
    }
    return soma*Math.exp(-x + s*Math.log(x) - lnGama(s));
  }
  let b=x+1-s, c=1e300, d=1/b, h=d;
  for(let i=1;i<300;i++){
    const an=-i*(i-s);
    b+=2; d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
    c=b+an/c;      if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<1e-15) break;
  }
  return 1 - Math.exp(-x + s*Math.log(x) - lnGama(s))*h;
}
function quiCrit(alfa, gl){
  let lo=0, hi=2000;
  for(let i=0;i<200;i++){
    const m=(lo+hi)/2;
    if(1-gamaInc(gl/2, m/2) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}

/* Médias dos níveis de um fator, comparadas com um erro específico. Em parcelas
   subdivididas cada fator tem o seu: o da parcela é testado contra o Erro(a) e o
   da subparcela contra o Erro(b) — usar um só para os dois falseia as letras. */
function mediasDoFator(f, trats, somaT, nRep, qmErro, glErro, nObs, teste, alfa){
  alfa = alfa||0.05;
  const soma={}, n={};
  f.niveis.forEach(nv=>{ soma[nv.id]=0; n[nv.id]=0; });
  trats.forEach((t,i)=>{
    const nv=t.niveis[f.id];
    if(soma[nv]===undefined) return;
    soma[nv]+=somaT[i]; n[nv]+=nRep;
  });
  const lst = f.niveis.map((nv,k)=>({i:k, nome:nv.nome, media: n[nv.id] ? soma[nv.id]/n[nv.id] : null}))
                      .filter(x=>x.media!=null).sort((a,b)=>b.media-a.media);
  const rep = nObs || n[f.niveis[0].id] || nRep;
  const ep = qmErro>=0 ? Math.sqrt(qmErro/rep) : null;
  let dms=null;
  if(teste==="fisher")      dms = qmErro>=0 ? tCrit(alfa,glErro)*Math.sqrt(2*qmErro/rep) : null;
  else if(teste==="duncan") dms = ep!=null ? rDuncan(alfa, 2, Math.round(glErro))*ep : null;
  else if(teste!=="sk"){
    const q = qCrit(alfa, f.niveis.length, Math.round(glErro));
    dms = (q!=null && ep!=null) ? q*ep : null;
  }
  if(teste==="sk"){
    const L = scottKnott(lst, qmErro, rep, glErro, alfa);
    lst.forEach(x=>{ x.letra = L[x.i] || "a"; });
  } else if(teste==="duncan" && ep!=null){
    const ls = letrasPorAmplitude(lst, p => rDuncan(alfa, p, Math.round(glErro))*ep);
    lst.forEach((x,k)=>{ x.letra = ls[k]; });
  } else if(dms!=null){
    const ls = letrasPorDMS(lst, dms);
    lst.forEach((x,k)=>{ x.letra = ls[k]; });
  }
  return {fator:f.nome||"Fator", dms, linhas:lst, soma, n};
}

/* ---- Distribuição da amplitude estudentizada, calculada por quadratura ----
   Tabelas impressas limitam o app ao que couber nelas (12 tratamentos, 5%).
   Integrando a distribuição, qualquer número de tratamentos e qualquer nível
   de significância saem do mesmo código — e o resultado é conferido contra a
   tabela clássica em `autoTeste()`. */
function phi(z){                                   // densidade normal padrão
  return 0.3989422804014327*Math.exp(-z*z/2);
}
function Phi(z){                                   // CDF normal (erro < 7.5e-8)
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = phi(z);
  const p = d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937
            + t*(-1.821255978 + t*1.330274429))));
  return z > 0 ? 1-p : p;
}
/* P(amplitude de k normais padrão ≤ w) */
function pAmplitude(w, k){
  if(w <= 0) return 0;
  const lo=-8, hi=8, n=72, h=(hi-lo)/n;
  let s = 0;
  for(let i=0;i<=n;i++){
    const z = lo + i*h;
    const dif = Phi(z) - Phi(z-w);
    const f = phi(z) * Math.pow(dif>0?dif:0, k-1);
    s += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, k*s*h/3);
}
/* P(amplitude estudentizada ≤ q) com `gl` graus de liberdade no resíduo */
function pTukeyDist(q, k, gl){
  if(q <= 0) return 0;
  if(!(gl > 0)) return pAmplitude(q, k);
  if(gl > 25000) return pAmplitude(q, k);
  // integra sobre s = sqrt(qui²/gl), cuja densidade se concentra perto de 1
  const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
  // com 1 ou 2 graus de liberdade a cauda é longuíssima e precisa de mais alcance
  const larg = (gl<3 ? 40 : 12)/Math.sqrt(gl);
  const lo = Math.max(1e-7, 1-larg), hi = 1+larg;
  // e a malha acompanha a largura, senão o passo fica grosso demais
  const n = 2*Math.ceil(Math.max(28, (hi-lo)*16)), h = (hi-lo)/n;
  let acc = 0;
  for(let i=0;i<=n;i++){
    const s = lo + i*h;
    const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
    const f = dens * pAmplitude(q*s, k);
    acc += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, acc*h/3);
}
/* q crítico: valor com P(Q ≤ q) = 1-alfa */
const _cacheQ = {};
function qCrit(alfa, k, gl){
  if(k < 2) return null;
  const chave = alfa+"|"+k+"|"+Math.round(gl);
  if(_cacheQ[chave] != null) return _cacheQ[chave];
  let lo = 0.1, hi = 200;
  for(let i=0;i<32;i++){
    const m = (lo+hi)/2;
    if(pTukeyDist(m, k, gl) < 1-alfa) lo = m; else hi = m;
  }
  return _cacheQ[chave] = (lo+hi)/2;
}
/* Duncan: amplitude estudentizada num nível protegido, alfa_p = 1−(1−alfa)^(p−1).
   Com poucos graus de liberdade a integral passa a DECRESCER com p — exigir menos
   para comparar médias mais distantes, o que não faz sentido. A tabela clássica
   satura nesse ponto; o máximo acumulado reproduz esse comportamento. */
const _cacheDun = {};
function rDuncan(alfa, p, gl){
  if(p < 2) return null;
  const chave = alfa+"|"+p+"|"+Math.round(gl);
  if(_cacheDun[chave] != null) return _cacheDun[chave];
  let mx = 0;
  for(let j=2;j<=p;j++){
    const v = qCrit(1-Math.pow(1-alfa, j-1), j, gl);
    if(v > mx) mx = v;
  }
  return _cacheDun[chave] = mx;
}

/* Dunnett: todos os tratamentos contra UMA testemunha. As m comparações
   dividem o mesmo controle, o que as correlaciona (ρ = ½); ignorar isso e
   usar o t comum daria mais diferenças significativas do que existem. */
const _cacheD = {};
function dDunnett(alfa, m, gl, bilateral){
  if(m < 1) return null;
  const chave = alfa+"|"+m+"|"+Math.round(gl)+"|"+(bilateral?"2":"1");
  if(_cacheD[chave] != null) return _cacheD[chave];
  const R2 = Math.SQRT2;
  const prob = d => {                       // P(max|T| ≤ d)
    const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
    const larg = 12/Math.sqrt(gl);
    const slo = Math.max(1e-7, 1-larg), shi = 1+larg, ns = 48, hs = (shi-slo)/ns;
    let out = 0;
    for(let i=0;i<=ns;i++){
      const s = slo + i*hs;
      const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
      // ∫ φ(u) [Φ(u+√2·d·s) − Φ(u−√2·d·s)]^m du   (bilateral)
      const lo=-8, hi=8, nu=64, hu=(hi-lo)/nu;
      let inner = 0;
      for(let j=0;j<=nu;j++){
        const u = lo + j*hu;
        const w = R2*d*s;
        const dif = bilateral ? (Phi(u+w) - Phi(u-w)) : Phi(u+w);
        const f = phi(u) * Math.pow(dif>0?dif:0, m);
        inner += (j===0||j===nu ? 1 : (j%2 ? 4 : 2)) * f;
      }
      out += (i===0||i===ns ? 1 : (i%2 ? 4 : 2)) * dens * (inner*hu/3);
    }
    return Math.min(1, out*hs/3);
  };
  let lo = 0.1, hi = 60;
  for(let i=0;i<30;i++){
    const md = (lo+hi)/2;
    if(prob(md) < 1-alfa) lo = md; else hi = md;
  }
  return _cacheD[chave] = (lo+hi)/2;
}

/* Amplitudes significativas de Duncan a 5% (r_p). Linhas: GL do resíduo.
