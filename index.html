  const casa = e => {
    if(!busca) return true;
    const alvo = [e.nome, e.cultura, e.cultivar, e.local, e.safra, e.responsavel,
                  (DELINS[e.delineamento]||{}).curto,
                  ...(e.tratamentos||[]).map(t=>t.nome),
                  ...(e.tratamentos||[]).flatMap(t=>(t.produtos||[]).map(p=>p.nome)),
                  ...(e.avaliacoes||[]).map(a=>a.nome)
                 ].filter(Boolean).join(" ").toLowerCase();
    return busca.split(/\s+/).every(termo => alvo.includes(termo));
  };
  const noGrupo = e => busca ? true : (grupoAberto ? e.grupoId===grupoAberto : true);
  /* O filtro por estado atravessa o grupo: "o que está com relatório pendente"
     é uma pergunta que não respeita safra nem pasta. */
  const etqAberta = TELA.etq || "";
  const naEtq = e => etqAberta ? (e.etiquetas||[]).indexOf(etqAberta) >= 0 : true;
  /* Com as colunas na tela, a fila de botões de grupo diz a mesma coisa duas
     vezes e ainda empurra os ensaios para baixo. */
  const emColunas = !busca && !grupoAberto && !etqAberta && ST.grupos.length > 0;
  const lista = ST.experimentos.filter(e=>casa(e) && noGrupo(e) && naEtq(e));

  s += '<div class="sec-cab" style="margin-bottom:14px">'
    + '<div><div class="eyebrow">Experimentos</div><h1>'
    + (busca ? 'Busca'
             : grupoAberto ? esc((ST.grupos.find(g=>g.id===grupoAberto)||{}).nome||"Grupo")
                           : 'Seus ensaios')
    + '</h1></div>'
    + '<div class="linha" style="gap:8px">'
    + (so?'':'<button class="b b-s" data-acao="editar-etqs">Etiquetas</button>')
    + (so?'':'<button class="b b-s" data-acao="novo-grupo">+ Grupo</button>')
    + '<button class="b b-p" data-acao="novo-exp">+ Novo experimento</button></div></div>';

  // busca
  s += '<div class="linha" style="gap:8px;margin-bottom:14px">'
    + '<div style="flex:1;min-width:200px;position:relative">'
    + '<input data-k="busca" data-campo="busca" value="'+esc(TELA.busca||"")+'" '
    + 'placeholder="Buscar por nome, cultivar, local, produto…" '
    + 'style="background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);'
    + 'padding:10px 34px 10px 12px;font-size:.9rem;width:100%;min-height:42px">'
    + (busca ? '<button class="b b-ghost b-s" data-acao="limpar-busca" aria-label="Limpar busca" '
             + 'style="position:absolute;right:3px;top:50%;transform:translateY(-50%);'
             + 'min-height:32px;width:30px;padding:0">&times;</button>' : '')
    + '</div>'
    + (busca ? '<span style="font-size:.8rem;color:var(--muted)">'+lista.length
             + ' encontrado'+(lista.length===1?'':'s')+'</span>' : '')
    + '</div>';

  // grupos (escondidos durante a busca, que varre tudo)
  if(!busca && !emColunas && ST.grupos.length){
    s += '<div class="linha" style="gap:8px;margin-bottom:16px">'
      + '<button class="b b-s'+(!grupoAberto?' b-p':'')+'" data-acao="ver-grupo" data-id="">'
      + 'Todos <span style="opacity:.7">'+ST.experimentos.length+'</span></button>';
    ST.grupos.forEach(g=>{
      const n = ST.experimentos.filter(e=>e.grupoId===g.id).length;
      s += '<span class="pill'+(grupoAberto===g.id?' pill-a':'')+'" style="padding:4px 5px 4px 10px;gap:7px">'
        + '<button class="b b-ghost b-s" data-acao="ver-grupo" data-id="'+g.id+'" '
        + 'style="min-height:24px;padding:0;font-weight:600;color:inherit">'
        + esc(g.nome)+' <span style="opacity:.7;font-weight:400">'+n+'</span></button>'
        + (so?'':'<button class="b b-s" data-acao="del-grupo" data-id="'+g.id+'" '
             + 'style="min-height:22px;padding:0 6px;font-size:.72rem;color:var(--erro);'
             + 'border-color:transparent;background:none" aria-label="Apagar grupo">&times;</button>')
        + '</span>';
    });
    const semGrupo = ST.experimentos.filter(e=>!e.grupoId || !ST.grupos.some(g=>g.id===e.grupoId)).length;
    if(semGrupo){
      s += '<button class="b b-s'+(grupoAberto==="__sem"?' b-p':'')+'" data-acao="ver-grupo" data-id="__sem">'
        + 'Sem grupo <span style="opacity:.7">'+semGrupo+'</span></button>';
    }
    s += '</div>';
  }

  /* Filtro por estado. Fica separado do filtro de grupo porque responde outra
     pergunta: grupo é "de qual safra", estado é "o que precisa de mim hoje". */
  if(!busca && ST.etiquetas.length){
    const usadas = ST.etiquetas.map(t=>({
      t, n: ST.experimentos.filter(e=>(e.etiquetas||[]).indexOf(t.id)>=0).length
    })).filter(x=>x.n > 0 || TELA.etq === x.t.id);
    if(usadas.length){
      s += '<div class="linha" style="gap:7px;margin-bottom:16px;flex-wrap:wrap">'
        + usadas.map(({t,n})=>{
            const on = TELA.etq === t.id;
            return '<button class="chip-etq" data-acao="ver-etq" data-id="'+t.id+'" '
              + 'style="'+(on ? 'background:'+esc(t.cor)+';color:#fff;border-color:'+esc(t.cor) : '')+'">'
              + '<span class="etq-ponto" style="background:'+(on?'#fff':esc(t.cor))+'"></span>'
              + '<span class="etq-nome">'+esc(t.nome)+'</span>'
              + '<span style="opacity:.7;font-weight:400">'+n+'</span></button>';
          }).join("")
        + (TELA.etq ? '<button class="b b-ghost b-s" data-acao="ver-etq" data-id="'+TELA.etq+'" '
                    + 'style="min-height:28px">limpar</button>' : '')
        + '</div>';
    }
  }

  const listaFinal = grupoAberto==="__sem" && !busca
    ? ST.experimentos.filter(e=>!e.grupoId || !ST.grupos.some(g=>g.id===e.grupoId)) : lista;

  if(ST.experimentos.length===0){
    s += '<div class="card vazio"><h2>Nenhum ensaio cadastrado</h2>'
      + '<p>Comece criando o experimento: cultura, cultivar, delineamento, número de tratamentos '
      + 'e repetições. Depois vêm o protocolo, as avaliações e as fotos.</p>'
      + '<button class="b b-p b-g" data-acao="novo-exp">Criar o primeiro experimento</button></div>';
  } else if(!listaFinal.length){
    s += '<div class="card vazio"><h2>'+(busca?'Nada encontrado':'Grupo vazio')+'</h2>'
      + '<p>'+(busca ? 'Nenhum ensaio combina com “'+esc(TELA.busca)+'”. Tente outro termo.'
                     : 'Nenhum ensaio neste grupo ainda. Você pode mover um ensaio pelo campo '
                       + '<b>Grupo</b> na ficha dele.')+'</p></div>';
  } else {
    /* O cartão deixou de ser um <button> para caber o seletor de grupo dentro
       dele — um <select> não pode viver dentro de um botão. A área de cima
       continua sendo o que abre o ensaio. */
    /* Grupos lado a lado, como as listas do Trello: cada coluna é uma safra,
       e passar o dedo para o lado troca de grupo. Vale a pena porque a pergunta
       "o que tem nesta safra" é a mais frequente, e antes exigia voltar ao topo
       e tocar num filtro. Só entra quando há grupos e nenhum filtro estreitando
       a lista — buscando ou filtrando, o resultado é um só e coluna atrapalha. */
    if(emColunas){
      const colunas = ST.grupos.map(g=>({
        nome: g.nome,
        itens: listaFinal.filter(e=>e.grupoId===g.id)
      }));
      const soltos = listaFinal.filter(e=>!e.grupoId || !ST.grupos.some(g=>g.id===e.grupoId));
      if(soltos.length) colunas.push({nome:"Sem grupo", itens:soltos, solto:true});

      s += '<div class="quadros">';
      colunas.forEach(col=>{
        s += '<section class="quadro"'+(col.solto?' data-solto="1"':'')+'>'
          + '<div class="quadro-cab"><span class="quadro-nome">'+esc(col.nome)+'</span>'
          + '<span class="quadro-n">'+col.itens.length+'</span></div>'
          + '<div class="quadro-corpo">'
          + (col.itens.length
              ? col.itens.map(e=>cartaoExperimento(e, so)).join("")
              : '<div class="quadro-vazio">Nenhum ensaio aqui</div>')
          + '</div></section>';
      });
      s += '</div>';
      s += '<p class="dica-quadros">Deslize para o lado para ver os outros grupos.</p>';
    }
    else {
      s += '<div class="exp-lista">';
      listaFinal.forEach(e=>{ s += cartaoExperimento(e, so); });
      s += '</div>';
    }
  }

  const totFotos = ST.experimentos.reduce((a,e)=>a+e.fotos.length,0);
  const lib = bytesLiberaveis(), cabem = fotosQueAindaCabem();
  s += '<div class="card card-p" style="margin-top:26px">'
    + '<div class="sec-cab"><div class="eyebrow">Armazenamento</div>'
    + '<span class="pill '+(cls==="e"?"pill-e":cls==="w"?"pill-w":"")+'">'+mb(b)+' de '+mb(lim)+'</span></div>'
    + '<div class="barra" style="margin:10px 0 8px"><i class="'+cls+'" style="width:'+pc.toFixed(1)+'%"></i></div>'
    + '<p style="font-size:.8rem;color:var(--muted);max-width:64ch">'
    + (totFotos ? '<b>'+totFotos+' foto'+(totFotos===1?'':'s')+'</b> guardada'+(totFotos===1?'':'s')+'. ' : '')
    + (cabem.total===0
        ? '<b>Espaço do aparelho esgotado.</b> Libere as versões ampliadas abaixo, ou apague arquivos do celular.'
        : 'Ainda cabem cerca de <b>'+cabem.total.toLocaleString("pt-BR")+'</b> fotos neste aparelho.')
    + '</p>'
    + (lib > 512*1024
        ? '<div class="linha" style="margin-top:12px"><button class="b b-s" data-acao="liberar">'
          + 'Liberar '+mb(lib)+'</button><span style="font-size:.76rem;color:var(--muted);flex:1;min-width:180px">'
          + 'Descarta a versão ampliada das fotos e mantém as miniaturas e todas as etiquetas.</span></div>'
        : '')
    + '</div>';

  return s + '</div>';
}

/* O cartão do ensaio, usado tanto na lista corrida quanto dentro das colunas. */
function cartaoExperimento(e, so){
      let s = "";
      const g = ST.grupos.find(x=>x.id===e.grupoId);
      /* Cartão curto: nome, grupo e tratamentos. O resto — cultura, delineamento,
         repetições, contagens — está tudo lá dentro, a um toque. Numa lista de
         50 ensaios, cartão alto vira rolagem, e rolagem esconde o que importa.
         O grupo continua editável aqui mesmo: o seletor é a própria etiqueta. */
      const ets = (e.etiquetas||[]).map(id=>ST.etiquetas.find(x=>x.id===id)).filter(Boolean);
      s += '<div class="exp-card exp-curto">'
        /* Barras de cor no topo, como no Trello: o estado se lê antes do nome,
           que é o ponto — abrir o app e ver o que está pendente sem ler nada. */
        + (ets.length
            ? '<div class="etq-barras">'
              + ets.map(t=>'<span class="etq-barra" style="background:'+esc(t.cor)+'" '
                  + 'title="'+esc(t.nome)+'"></span>').join("")
              + '</div>'
            : '')
        + '<div class="exp-abrir" data-acao="abrir-exp" data-id="'+e.id+'" role="button" tabindex="0">'
        + '<h3>'+esc(e.nome)+'</h3></div>'
        + '<div class="exp-meta">'
        + (so ? '' : '<button class="chip-etq" data-acao="marcar-etq" data-id="'+e.id+'" '
              + 'aria-label="Estado do ensaio">'
              + (ets.length
                  ? ets.map(t=>'<span class="etq-ponto" style="background:'+esc(t.cor)+'"></span>').join("")
                    + '<span class="etq-nome">'+esc(ets[0].nome)+(ets.length>1?" +"+(ets.length-1):"")+'</span>'
                  : '<span class="etq-nome" style="opacity:.7">sem estado</span>')
              + '</button>')
        + (so
            ? (g?'<span class="pill pill-a">'+esc(g.nome)+'</span>':'')
            : '<select class="chip-grupo'+(e.grupoId?' tem':'')+'" data-acao="mover-grupo" data-id="'+e.id+'" '
              + 'aria-label="Grupo do ensaio">'
              + '<option value=""'+(!e.grupoId?" selected":"")+'>sem grupo</option>'
              + ST.grupos.map(x=>'<option value="'+x.id+'"'+(e.grupoId===x.id?" selected":"")+'>'
                  + esc(x.nome)+'</option>').join("")
              + '</select>')
        + '<span class="pill">'+e.tratamentos.length+' trat.</span>'
        + '</div>'
        + '</div>';
  return s;
}

/* --------- EXPERIMENTO --------- */
function telaExperimento(e){
  const abas = [["protocolo","Protocolo"],["tratamentos","Tratamentos"],["avaliacoes","Avaliações"],["fotos","Fotos"],["analise","Análise"],["relatorio","Relatório"]];
  let s = barraTopo({t:e.nome, s:[e.cultura,e.cultivar,e.local].filter(Boolean).join(" · ")||"Experimento"}, true);
  s += '<div class="abas" role="tablist">';
  abas.forEach(a=>{
    s += '<button class="aba" role="tab" aria-selected="'+(TELA.aba===a[0])+'" data-acao="aba" data-aba="'+a[0]+'">'+a[1]
      + (a[0]==="fotos" && e.fotos.length ? ' <span style="opacity:.6">'+e.fotos.length+'</span>' : '')
      + (a[0]==="avaliacoes" && e.avaliacoes.length ? ' <span style="opacity:.6">'+e.avaliacoes.length+'</span>' : '')
      + (a[0]==="relatorio" && (e.relatorios||[]).length ? ' <span style="opacity:.6">'+e.relatorios.length+'</span>' : '')
      + '</button>';
  });
  s += '</div><div class="wrap">';
  if(TELA.aba==="protocolo")   s += abaProtocolo(e);
  if(TELA.aba==="tratamentos") s += abaTratamentos(e);
  if(TELA.aba==="avaliacoes")  s += abaAvaliacoes(e);
  if(TELA.aba==="fotos")       s += abaFotos(e);
  if(TELA.aba==="analise")     s += abaAnalise(e);
  if(TELA.aba==="relatorio")   s += abaRelatorio(e);
  return s + '</div>';
}

/* Escolhe o arquivo e devolve só se for PDF e couber no servidor. */
function escolherPdf(){
  return new Promise(ok=>{
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/pdf,.pdf";
    inp.addEventListener("change", ()=>{
      const f = inp.files && inp.files[0];
      if(!f){ ok(null); return; }
      if(!/\.pdf$/i.test(f.name) && f.type !== "application/pdf"){ toast("Escolha um arquivo PDF"); ok(null); return; }
      if(f.size > PDF_MAX){ toast("Esse PDF tem "+mb(f.size)+" — o limite é 50 MB por arquivo"); ok(null); return; }
      ok(f);
    });
    inp.click();
  });
}
async function carregarPdf(e, substituir){
  const f = await escolherPdf();
  if(!f) return;
  const r = {id:uid(), nome:f.name, tamanho:f.size, enviado:new Date().toISOString()};
  try{ await gravarPdf(r.id, new Blob([f], {type:"application/pdf"})); }
  catch(err){ toast("Não consegui guardar o PDF neste aparelho — falta espaço?"); return; }
  r.local = true;
  if(substituir){
    // arquivo novo com id novo: quem já tinha baixado o antigo não fica com ele por engano
    const i = e.relatorios.findIndex(x=>x.id===substituir.id);
    if(substituir.remota) enfileirarExclusaoPdf(substituir.id);
    apagarPdfs([substituir.id]);
    if(i>=0) e.relatorios[i] = r; else e.relatorios.push(r);
  } else {
    e.relatorios.push(r);
  }
  marcarSujo(); render(); agendarSync();
  toast(substituir ? "PDF trocado" : "PDF guardado no ensaio");
}

/* --- leitura do PDF ---
   No PC o Chrome/Edge tem leitor próprio e o PDF abre num quadro. No Android
   não: dentro de um quadro ele só oferece baixar. Lá quem desenha as páginas
   é o pdf.js, carregado só na primeira leitura e guardado para abrir sem sinal. */
const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/";
let PDFJS = null, PDF_URL = null;
function leitorNativo(){ return navigator.pdfViewerEnabled === true; }
async function carregarPdfJs(){
  if(PDFJS) return PDFJS;
  const lib = await import(PDFJS_BASE + "pdf.min.mjs");
  /* O worker vem de outro endereço; como Blob daqui ele passa a ser "da casa"
     e o navegador aceita criá-lo — e o fetch passa pelo service worker, que o
     guarda para a próxima vez sem sinal. */
  const cod = await (await fetch(PDFJS_BASE + "pdf.worker.min.mjs")).text();
  lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([cod], {type:"text/javascript"}));
  PDFJS = lib;
  return lib;
}
let LEITOR_PREPARADO = false;
function prepararLeitorPdf(){
  if(LEITOR_PREPARADO || leitorNativo() || !navigator.onLine) return;
  LEITOR_PREPARADO = true;
  // só busca: o service worker guarda; nada roda agora
  fetch(PDFJS_BASE + "pdf.min.mjs").catch(()=>{ LEITOR_PREPARADO = false; });
  fetch(PDFJS_BASE + "pdf.worker.min.mjs").catch(()=>{ LEITOR_PREPARADO = false; });
}
async function abrirPdf(e, r){
  toast("Abrindo o PDF…");
  const blob = await garantirPdf(r);
  if(!blob){
    toast(r.remota ? "Sem sinal para buscar este PDF — ele ainda não está neste aparelho"
                   : "O arquivo deste PDF não está neste aparelho");
    return;
  }
  if(PDF_URL) URL.revokeObjectURL(PDF_URL);
  PDF_URL = URL.createObjectURL(blob);
  const podeCompartilhar = (()=>{ try{
    return !!(navigator.canShare && navigator.canShare({files:[new File([blob], r.nome||"relatorio.pdf", {type:"application/pdf"})]}));
  }catch(err){ return false; } })();
  const d = abrirModal('<div class="pdf-topo"><b class="pdf-nome" style="flex:1;min-width:0">'+esc(r.nome||"relatorio.pdf")+'</b>'
    + '<button class="b b-s b-p" data-acao="baixar-pdf" data-id="'+r.id+'">&#11015; Baixar PDF</button>'
    + (podeCompartilhar ? '<button class="b b-s" data-acao="compartilhar-pdf" data-id="'+r.id+'">Compartilhar</button>' : '')
    + '<button class="b b-s" data-acao="fechar" aria-label="Fechar">&times;</button></div>'
    + '<div class="pdf-corpo" id="pdf-corpo"></div>');
  d.querySelector(".modal").classList.add("modal-pdf");
  const corpo = d.querySelector("#pdf-corpo");
  if(leitorNativo()){
    corpo.innerHTML = '<iframe src="'+PDF_URL+'#view=FitH" title="'+esc(r.nome||"PDF")+'"></iframe>';
    return;
  }
  corpo.innerHTML = '<p class="pdf-aviso">Carregando páginas…</p>';
  try{
    const lib = await carregarPdfJs();
    const doc = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
    if(!corpo.isConnected) return;
    corpo.innerHTML = '';
    const larg = Math.max(280, corpo.clientWidth - 16);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // uma página de cada vez: um relatório de 40 páginas não trava o celular
    for(let n = 1; n <= doc.numPages; n++){
      if(!corpo.isConnected) break;
      const pg = await doc.getPage(n);
      const v1 = pg.getViewport({scale:1});
      const vp = pg.getViewport({scale: larg / v1.width * dpr});
      const cv = document.createElement("canvas");
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      cv.style.width = larg + "px"; cv.style.height = Math.floor(vp.height / dpr) + "px";
      corpo.appendChild(cv);
      await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    }
  }catch(err){
    if(corpo.isConnected){
      corpo.innerHTML = '<p class="pdf-aviso">Não deu para mostrar a prévia aqui'
        + (navigator.onLine ? '' : ' — o leitor precisa de internet na primeira vez')
        + '. Use <b>Baixar PDF</b> para abrir no leitor do aparelho.</p>';
    }
  }
}
function baixarPdf(r){
  if(!PDF_URL) return;
  const a = document.createElement("a");
  a.href = PDF_URL; a.download = r.nome || "relatorio.pdf";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Baixando para a pasta de downloads");
}
async function compartilharPdf(r){
  const b = await garantirPdf(r); if(!b) return;
  try{ await navigator.share({files:[new File([b], r.nome||"relatorio.pdf", {type:"application/pdf"})], title:r.nome}); }
  catch(err){ /* desistiu */ }
}

/* Confere o croqui: cada bloco deve conter cada tratamento uma vez. Avisa em vez
   de impedir — o croqui é um mapa do que existe no campo, não uma trava. */
function conferirCroqui(e){
  const c = e.croqui;
  if(!c || !Object.keys(c).length) return {vazio:true};
  const nT = e.tratamentos.length, nums = e.tratamentos.map(t=>String(t.num));
  const problemas = [];
  let preenchidas = 0;
  for(let b=0;b<e.nRep;b++){
    const vistos = {}, faltando = [];
    for(let p=0;p<nT;p++){
      const v = c[b+"|"+p];
      if(v==null || v==="") continue;
      preenchidas++;
      if(!nums.includes(String(v))) problemas.push("Bloco "+String.fromCharCode(65+b)
        +": não existe tratamento "+v);
      vistos[v] = (vistos[v]||0)+1;
    }
    Object.keys(vistos).forEach(v=>{
      if(vistos[v]>1) problemas.push("Bloco "+String.fromCharCode(65+b)
        +": tratamento "+v+" aparece "+vistos[v]+"×");
    });
  }
  const total = nT*e.nRep;
  if(preenchidas && preenchidas<total)
    problemas.push("faltam "+(total-preenchidas)+" de "+total+" parcelas");
  return {
    vazio:false, preenchidas, total,
    aviso: problemas.length ? esc(problemas.slice(0,4).join(" · ")) : null
  };
}
/* Lê "lat, lng" do jeito que as pessoas escrevem: ponto decimal com vírgula
   separando, ou vírgula decimal com espaço separando. Devolve null se não der
   para ter certeza — aí a ficha mostra o texto, sem link de mapa. */
function coordsDe(txt){
  const s = String(txt||"").trim();
  // graus, minutos e segundos, como o GPS de mão mostra: 17°47'49"S 50°55'41"O
  const g = s.match(/^(\d{1,3})\s*°\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:["″]|'')?\s*([NSns])[\s,;]+(\d{1,3})\s*°\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:["″]|'')?\s*([LOWElowe])$/);
  if(g){
    const dec = (d,mi,se)=>Number(d) + Number(mi)/60 + Number(se.replace(",", "."))/3600;
    const lat = dec(g[1],g[2],g[3]) * (/[sS]/.test(g[4]) ? -1 : 1);
    const lng = dec(g[5],g[6],g[7]) * (/[oOwW]/.test(g[8]) ? -1 : 1);
    if(Math.abs(lat)<=90 && Math.abs(lng)<=180) return {lat:+lat.toFixed(6), lng:+lng.toFixed(6)};
  }
  let m = s.match(/^(-?\d{1,3}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)$/)
       || s.match(/^(-?\d{1,3}(?:[.,]\d+)?)\s*;?\s+(-?\d{1,3}(?:[.,]\d+)?)$/)
       || s.match(/^(-?\d{1,3}(?:[.,]\d+)?)\s*;\s*(-?\d{1,3}(?:[.,]\d+)?)$/);
  if(!m) return null;
  const lat = Number(m[1].replace(",", ".")), lng = Number(m[2].replace(",", "."));
  if(!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180) return null;
  return {lat, lng};
}
function fichaCoords(txt){
  const c = coordsDe(txt);
  return '<div><div class="eyebrow" style="margin-bottom:2px">Coordenadas</div>'
    + '<div style="font-size:.92rem;font-weight:500">'+(esc(txt)||'—')
    + (c ? ' <a href="https://www.google.com/maps?q='+c.lat+','+c.lng+'" target="_blank" rel="noopener" '
         + 'style="font-size:.8rem;color:var(--accent);white-space:nowrap">abrir no mapa</a>' : '')
    + '</div></div>';
}
function ficha(rot,val){

    s += '</tbody></table></div>'

  s += '<div class="grid" style="gap:8px">';

    s += '<div class="card card-p" style="padding:12px">'
      + '<div class="linha" style="gap:10px;flex-wrap:wrap;align-items:center">'
      + (so ? '<span class="pill pill-a" style="font-size:.9rem;padding:6px 12px">'+esc(a.rotulo)+'</span>'
            : '<input data-k="'+ch+'.rotulo" data-campo="'+ch+'.rotulo" value="'+esc(a.rotulo)+'" '
              + 'maxlength="3" aria-label="Letra da aplicação" style="flex:none;width:52px;'
              + 'border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);'
              + 'border-radius:var(--r-sm);padding:9px 4px;min-height:42px;font-size:1rem;'
              + 'font-weight:700;text-align:center">')
      + '<div style="flex:1 1 150px;min-width:0">'
      + (so ? '<div style="font-size:.95rem">'+(esc(a.estadio)||'—')+'</div>'
            : '<input data-k="'+ch+'.estadio" data-campo="'+ch+'.estadio" value="'+esc(a.estadio)+'" '
              + 'placeholder="Estádio — ex.: V4" style="border:1px solid var(--line-2);'
              + 'background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;width:100%;'
              + 'min-height:42px;font-size:.95rem">')
      + '</div>'
      + '<div style="flex:1 0 140px;max-width:170px">'
      + (so ? '<div style="font-size:.85rem;color:var(--muted)">'+(a.data?dataBr(a.data):'—')+'</div>'
            : '<input type="date" data-k="'+ch+'.data" data-campo="'+ch+'.data" value="'+esc(a.data)+'" '
              + 'style="border:1px solid var(--line-2);background:var(--surface);'
              + 'border-radius:var(--r-sm);padding:9px 8px;width:100%;min-height:42px;font-size:.85rem">')
      + '</div>'
      + (so ? ''
          : '<button class="b b-x" data-acao="del-aplicacao" data-id="'+a.id
            + '" aria-label="Remover aplicação '+esc(a.rotulo)+'">&times;</button>')
      + '</div>'
      + (so && !a.obs ? ''
         : '<div style="margin-top:8px">'
           + (so ? '<div style="font-size:.85rem;color:var(--muted)">'+esc(a.obs)+'</div>'
                 : '<input data-k="'+ch+'.obs" data-campo="'+ch+'.obs" value="'+esc(a.obs)+'" '
                   + 'placeholder="Observação: condições, equipamento, volume de calda" '
                   + 'style="border:1px solid var(--line-2);background:var(--surface);'
                   + 'border-radius:5px;padding:8px 10px;width:100%;min-height:38px;font-size:.85rem">')
           + '</div>')
      + '</div>';
  });
  s += '</div>'
    + '<button class="b b-s" data-acao="add-aplicacao">+ Adicionar aplicação</button>';
  if(aplicacoesTexto(e)){
    s += '<p style="font-size:.85rem;color:var(--accent);font-weight:500">'
      + esc(aplicacoesTexto(e))+'</p>';
  }
  return s + '</div>';
}

/* Observação que vale para TODOS os tratamentos: o adjuvante e a dose, o volume
   de calda, o bico. Fica logo abaixo da tabela, trava depois de salva (como o
   protocolo) e entra no relatório exportado. */
function secaoObsTrat(e){
  const so = PERSIST.leitura;
  const trav = so || e.obsTratTravado;
  return '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Para todos os tratamentos</div>'
    + '<h2>Observação</h2></div>'
    + (so ? '' : trav ? '<button class="b b-s" data-acao="destravar-obstrat">Editar</button>'
                      : '<button class="b b-s b-p" data-acao="travar-obstrat">Salvar</button>')
    + '</div><div class="card card-p">'
    + (trav
        ? '<div class="protocolo" style="font-size:.95rem;white-space:pre-wrap">'
          + (esc(e.obsTratamentos) || '<i style="color:var(--muted)">Nada anotado. Use <b>Editar</b> para escrever, por exemplo, '
             + 'o adjuvante e a dose usados em todos os tratamentos.</i>')+'</div>'
        : '<textarea class="serif" data-k="obstrat" data-campo="obstrat" rows="3" '
          + 'placeholder="Ex.: Adjuvante Assist 0,5% v/v em todos os tratamentos, exceto a testemunha.">'
          + esc(e.obsTratamentos||"")+'</textarea>')
    + '</div></div>';
}
function abaTratamentos(e){
  const so = PERSIST.leitura;
  const fat = ehFatorial(e);
  const inp = (chave,val,ph,extra) => so ? (esc(val)||'<span style="color:var(--muted)">—</span>')
    : '<input data-k="'+chave+'" data-campo="'+chave+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" '
      + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
      + 'padding:8px 9px;width:100%;min-height:38px;font-size:.86rem;'+(extra||'')+'">';

  /* As seções são montadas separadas e juntadas no fim, na ordem de uso:
     tratamentos, observação, aplicações, esquema fatorial. */
  const secApl = secaoAplicacoes(e);
  let s = '';

  /* ---- esquema: simples ou fatorial ---- */
  /* A escolha é declarada, não deduzida da presença de fatores: quem abre a aba
     precisa ver qual dos dois o ensaio é antes de procurar onde mudar. */
  const esq = e.esquema === "fatorial" ? "fatorial" : "simples";
  /* Fatores travam como o protocolo: salvos, viram texto e só mudam pelo Editar.
     Travado, some também a troca Simples/Fatorial, que apagaria os fatores. */
  const fatTrav = so || (esq==="fatorial" && e.fatoresTravado);
  s += '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Esquema</div>'
    + '<h2>'+(esq==="fatorial" ? 'Ensaio fatorial' : 'Tratamentos simples')+'</h2></div>'
    + (so ? '' : fatTrav
        ? '<button class="b b-s" data-acao="destravar-fatores">Editar</button>'
        : '<div class="linha" style="gap:8px">'
          + '<div class="seg" role="group" aria-label="Esquema do ensaio">'
          + '<button class="seg-b'+(esq==="simples"?' on':'')+'" data-acao="set-esquema" '
          + 'data-modo="simples" aria-pressed="'+(esq==="simples")+'">Simples</button>'
          + '<button class="seg-b'+(esq==="fatorial"?' on':'')+'" data-acao="set-esquema" '
          + 'data-modo="fatorial" aria-pressed="'+(esq==="fatorial")+'">Fatorial</button></div>'
          + (esq==="fatorial" && e.fatores.length
              ? '<button class="b b-s b-p" data-acao="travar-fatores">Salvar</button>' : '')
          + '</div>')
    + '</div>';

  if(esq === "simples"){
    s += '<p style="font-size:.83rem;color:var(--muted);max-width:66ch">'
      + 'Cada tratamento é uma entrada independente — produto, dose, aplicação. '
      + 'É o caso da maioria dos ensaios de produto.'
      + (so?'':' Se este ensaio cruza dois conjuntos de variáveis — vazões × adubações, '
             + 'doses × cultivares — mude para <b>Fatorial</b> e o app monta as combinações '
             + 'e separa os efeitos na análise.')
      + '</p>';
  } else {
    s += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">';
    e.fatores.forEach((f,fi)=>{
      if(fatTrav){
        s += '<div class="card card-p"><div class="linha" style="gap:8px;margin-bottom:10px">'
          + '<span class="pill pill-a">Fator '+String.fromCharCode(65+fi)+'</span>'
          + '<b style="font-size:.95rem">'+(esc(f.nome)||'<i style="color:var(--muted)">sem nome</i>')+'</b></div>'
          + '<div class="linha" style="gap:6px">'
          + ((f.niveis||[]).length
              ? f.niveis.map(nv=>'<span class="pill">'+(esc(nv.nome)||'—')+'</span>').join("")
              : '<span style="font-size:.83rem;color:var(--muted)">sem níveis</span>')
          + '</div></div>';
        return;
      }
      s += '<div class="card card-p"><div class="linha" style="gap:8px;margin-bottom:10px">'
        + '<span class="pill pill-a">Fator '+String.fromCharCode(65+fi)+'</span>'
        + '<div style="flex:1">'+inp("fator."+f.id+".nome", f.nome, "Ex.: Taxa de aplicação")+'</div>'
        + (so?'':'<button class="b b-x" data-acao="del-fator" data-id="'+f.id+'" aria-label="Remover fator">&times;</button>')
        + '</div><div class="grid" style="gap:6px">';
      (f.niveis||[]).forEach(nv=>{
        s += '<div class="linha" style="gap:6px;flex-wrap:nowrap">'
          + '<div style="flex:1">'+inp("nivel."+f.id+"."+nv.id, nv.nome, "Ex.: 150 L/ha")+'</div>'
          + (so?'':'<button class="b b-x" data-acao="del-nivel" data-id="'+f.id+'" data-nivel="'+nv.id+'" aria-label="Remover nível">&times;</button>')
          + '</div>';
      });
      s += '</div>'+(so?'':'<button class="b b-s b-ghost" data-acao="add-nivel" data-id="'+f.id+'" '
        + 'style="margin-top:8px">+ Nível</button>')+'</div>';
    });
    s += '</div>';
    if(!e.fatores.length){
      s += '<p style="font-size:.83rem;color:var(--muted);max-width:66ch">'
        + 'Nenhum fator ainda. Crie o primeiro — <b>Taxa de aplicação</b>, <b>Adubação</b> — '
        + 'e liste os níveis de cada um.</p>';
    }
    if(!fatTrav) s += '<button class="b b-s" data-acao="add-fator" style="margin-top:10px">+ Fator</button>';

    const combos = e.fatores.filter(f=>(f.niveis||[]).length>=2)
                            .reduce((a,f)=>a*f.niveis.length, 1);
    const validos = e.fatores.filter(f=>(f.niveis||[]).length>=2).length;
    if(validos>=2 && !fat){
      s += '<div class="aviso aviso-w" style="margin-top:12px"><span>&#9888;</span><div>'
        + 'Para a análise separar os efeitos, os tratamentos precisam ser as <b>'+combos+'</b> '
        + 'combinações dos níveis, uma cada — mais a testemunha, se houver, sem nível nenhum. '
        + 'Hoje são '+e.tratamentos.length+' tratamentos e o arranjo não fecha.'
        + (so?'':'<div class="linha" style="margin-top:8px;gap:8px;flex-wrap:wrap">'
            + '<button class="b b-s" data-acao="gerar-trat" data-com="1">Gerar '+combos+' + testemunha</button>'
            + '<button class="b b-s" data-acao="gerar-trat">Gerar só as '+combos+'</button></div>')
        + '</div></div>';
    } else if(fat){
      const ad = (fat.adicionais||[]).map(i=>e.tratamentos[i]);
      s += '<div class="aviso aviso-i" style="margin-top:12px"><span>&#10003;</span><div>'
        + 'Esquema fatorial <b>'+arranjoTexto(fat)+'</b> reconhecido. '
        + 'A análise vai separar '+fat.map(f=>f.nome||"o fator").join(', ')+' e a interação entre eles'
        + (ad.length
            ? ', e comparar '+(ad.length===1 ? 'a testemunha (<b>'+esc(ad[0].nome||("T"+ad[0].num))+'</b>)'
                                             : 'os '+ad.length+' tratamentos adicionais')
              + ' com o fatorial num contraste próprio.'
            : '.')
        + '</div></div>';
    }
  }
  s += '</div>';

  const secEsq = s; s = '';
  /* ---- tratamentos ---- */
  /* A tabela vem primeiro: é o que se procura ao abrir a aba. Logo abaixo, a
     observação que vale para todos (adjuvante, volume); depois as aplicações e
     o esquema fatorial, que se configuram uma vez e raramente se reabrem. */
  const travado = so || e.travado;
  s += '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Tratamentos</div>'
    + '<h2>'+e.tratamentos.length+' × '+e.nRep+' repetições = '+(e.tratamentos.length*e.nRep)+' parcelas</h2></div>'
    + (so ? '' : (e.travado
        ? '<button class="b b-s" data-acao="destravar-trat">Editar</button>'
        : '<div class="linha" style="gap:8px">'
          + '<button class="b b-s" data-acao="add-trat">+ Tratamento</button>'
          + '<button class="b b-s b-p" data-acao="travar-trat">Salvar tabela</button></div>'))
    + '</div>';

  /* Depois de salvo, vira uma tabela estática: um toque acidental na tela não
     altera mais dose nem produto, que são informação de protocolo. */
  if(e.travado){
    /* Formato do protocolo de campo: uma linha por produto, o tratamento
       agrupado à esquerda, e listras alternadas para o olho não pular de linha. */
    s += '<div class="tab-box"><table class="dados protocolo-tab"><thead><tr>'
      /* Larguras em porcentagem: a tabela ocupa a linha inteira e a folga toda vai
         para Produto, que é a coluna de texto mais longo. O tratamento fica
         estreito porque o nome dele já costuma ser curto (T1, T2…). */
      + (e.fatores.length
          ? '<th style="width:10%">Tratamento</th><th style="width:14%">Fatores</th>'
            + '<th style="width:33%">Produto</th><th style="width:12%">Dose</th>'
            + '<th style="width:16%">Unidade</th><th style="width:15%">Aplicação</th>'
          : '<th style="width:10%">Tratamento</th><th style="width:42%">Produto</th>'
            + '<th style="width:14%">Dose</th><th style="width:17%">Unidade</th>'
            + '<th style="width:17%">Aplicação</th>')
      + '</tr></thead><tbody>';
    e.tratamentos.forEach((t,ti)=>{
      const prods = (t.produtos||[]).filter(p=>p.nome||p.dose);
      const linhas = Math.max(1, prods.length);
      const zebra = ti%2 ? ' class="par"' : '';
      for(let i=0;i<linhas;i++){
        const p = prods[i];
        s += '<tr'+zebra+(i===0?' style="border-top:2px solid var(--line-2)"':'')+'>'
          + (i===0 ? '<td rowspan="'+linhas+'" style="vertical-align:middle;'
                     + 'font-weight:600;white-space:normal">'+esc(t.nome)+'</td>'
                   + (e.fatores.length ? '<td rowspan="'+linhas+'" style="color:var(--muted);'
                       + 'vertical-align:middle;white-space:normal">'
                       + (esc(fatorTexto(e,t))||"—")+'</td>' : '')
             : '')
          + '<td style="white-space:normal">'+(p ? esc(p.nome)||"—" : "—")+'</td>'
          + '<td>'+(p ? (esc(p.dose)||"—") : "—")+'</td>'
          + '<td style="color:var(--muted)">'+(p ? (esc(p.unidade)||"—") : "—")+'</td>'
          + '<td><b>'+(p ? (esc(p.aplicacao)||"—") : "—")+'</b></td>'
          + '</tr>';
      }
    });
    s += '</tbody></table></div>';
    if(e.aplicacoes.length){
      s += '<p style="font-size:.8rem;color:var(--muted);margin-top:8px">'
        + '<b>Aplicações:</b> '+esc(aplicacoesTexto(e))+'</p>';
    }
    s += '<p style="font-size:.78rem;color:var(--muted)">Tabela salva — não muda ao toque. '
      + 'Use <b>Editar</b> para alterar.</p>';
    if(e.tratamentos.length>20){
      s += '<div class="aviso aviso-i" style="margin-top:10px"><span>&#8505;</span><div>'
        + e.tratamentos.length+' tratamentos: os valores críticos são calculados na hora, '
        + 'sem limite de tabela.</div></div>';
    }
    return s+'</div>' + secaoObsTrat(e) + secApl + secEsq;
  }

  s += '<div class="grid" style="gap:10px">';
  e.tratamentos.forEach(t=>{
    s += '<div class="card card-p"><div class="linha" style="gap:10px;align-items:flex-start">'
      + '<span class="pill" style="margin-top:8px">'+t.num+'</span>'
      + '<div style="flex:1;min-width:160px">'+inp("trat."+t.id+".nome", t.nome, "Descrição do tratamento", "font-weight:500")+'</div>'
      + (so?'':'<button class="b b-x" data-acao="del-trat" data-id="'+t.id+'" aria-label="Remover tratamento '+t.num+'">&times;</button>')
      + '</div>';

    // níveis dos fatores
    if(e.fatores.length){
      s += '<div class="linha" style="gap:8px;margin-top:10px">';
      e.fatores.forEach(f=>{
        if(!(f.niveis||[]).length) return;
        s += '<div class="campo" style="flex:1;min-width:140px"><label>'+(esc(f.nome)||"Fator")+'</label>'
          + (so
              ? '<div style="font-size:.86rem">'+esc((f.niveis.find(n=>n.id===t.niveis[f.id])||{}).nome||"—")+'</div>'
              : '<select data-acao="set-nivel" data-id="'+t.id+'" data-fator="'+f.id+'" '
                + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;padding:8px;min-height:38px;font-size:.86rem">'
                + '<option value="">—</option>'
                + f.niveis.map(n=>'<option value="'+n.id+'"'+(t.niveis[f.id]===n.id?" selected":"")+'>'+esc(n.nome||"(sem nome)")+'</option>').join("")
                + '</select>')
          + '</div>';
      });
      s += '</div>';
    }

    // produtos: um tratamento pode ter vários
    s += '<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">Produtos e doses</div>'
      + '<div class="grid" style="gap:6px">';
    (t.produtos||[]).forEach((p,pi)=>{
      /* Quebra em duas linhas no celular: nome e dose em cima, unidade e
         aplicação embaixo. Numa linha só ela pedia ~400 px e empurrava a
         página para o lado. No PC cabe tudo numa linha, como antes. */
      s += '<div class="linha" style="gap:6px;flex-wrap:wrap;align-items:center">'
        + (pi>0?'<span style="color:var(--muted);font-size:.85rem;flex:none;width:14px">+</span>'
              :'<span style="flex:none;width:14px"></span>')
        + '<div style="flex:2 1 140px;min-width:0">'+inp("prod."+t.id+"."+p.id+".nome", p.nome, "Produto")+'</div>'
        + '<div style="flex:1 1 64px;min-width:0">'+inp("prod."+t.id+"."+p.id+".dose", p.dose, "Dose")+'</div>'
        + '<div style="flex:none;width:96px">'
        + '<select data-acao="set-unidade" data-id="'+t.id+'" data-prod="'+p.id+'" '
        + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
        + 'padding:8px 4px;min-height:38px;font-size:.82rem;width:100%">'
        + (()=>{
            const us = ["","L/ha","mL/ha","kg/ha","g/ha","% v/v","L/100L","mL/100L","g/100L",
                        "kg/100kg","mL/kg semente","g/kg semente","dose/ha"];
            // unidade fora da lista (ensaio antigo, outro aparelho) aparece como está, em vez de "unid."
            if(p.unidade && us.indexOf(p.unidade) < 0) us.push(p.unidade);
            return us.map(u=>'<option value="'+esc(u)+'"'+((p.unidade||"")===u?" selected":"")+'>'+(esc(u)||"unid.")+'</option>').join("");
          })()
        + '</select></div>'
        + '<div style="flex:none;width:66px">'
        + '<select data-acao="set-aplicacao" data-id="'+t.id+'" data-prod="'+p.id+'" '
        + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
        + 'padding:8px 4px;min-height:38px;font-size:.82rem;width:100%">'
        + ['<option value=""'+(!p.aplicacao?" selected":"")+'>—</option>']
            .concat(rotulosAplicacao(e).map(r=>'<option value="'+esc(r)+'"'
              +(p.aplicacao===r?" selected":"")+'>'+esc(r)+'</option>'))
            .concat(p.aplicacao && !rotulosAplicacao(e).includes(p.aplicacao)
              ? ['<option value="'+esc(p.aplicacao)+'" selected>'+esc(p.aplicacao)+'</option>'] : [])
            .join("")
        + '</select></div>'
        + (so?'':'<button class="b b-x" data-acao="del-prod" data-id="'+t.id+'" data-prod="'+p.id+'" aria-label="Remover produto">&times;</button>')
        + '</div>';
    });
    s += '</div>'
      + (so?'':'<button class="b b-s b-ghost" data-acao="add-prod" data-id="'+t.id+'" style="margin-top:6px">+ Produto</button>')
      + '</div></div>';
  });
  s += '</div>';

  if(e.tratamentos.length>12){
    s += '<div class="aviso aviso-i" style="margin-top:12px"><span>&#8505;</span><div>'
      + e.tratamentos.length+' tratamentos: os valores críticos dos testes são calculados '
      + 'na hora, sem limite de tabela.</div></div>';
  }
  return s+'</div>' + secaoObsTrat(e) + secApl + secEsq;
}

/* --------- AVALIAÇÕES --------- */
function abaAvaliacoes(e){
  const so = PERSIST.leitura;
  if(e.avaliacoes.length===0){
    return '<div class="card vazio"><h2>Nenhuma avaliação ainda</h2>'
      + '<p>Uma avaliação é uma data de coleta: estande inicial, altura de plantas, severidade '
      + 'de doença, produtividade. Os valores são lançados por parcela, na malha de blocos.</p>'
      + (so?'':'<button class="b b-p b-g" data-acao="nova-av">Criar avaliação</button>')+'</div>';
  }
  const av = e.avaliacoes.find(a=>a.id===TELA.avId) || e.avaliacoes[0];
  TELA.avId = av.id;
  let s = '<div class="sec"><div class="sec-cab">'
    + '<div class="linha" style="gap:8px">';
  e.avaliacoes.forEach(a=>{
    s += '<button class="b b-s'+(a.id===av.id?" b-p":"")+'" data-acao="sel-av" data-id="'+a.id+'">'
      + esc(a.nome)+' <span style="opacity:.7;font-weight:400">'+dataBr(a.data)+'</span></button>';
  });
  s += '</div><div class="linha" style="gap:8px">'
    + '<button class="b b-s" data-acao="exportar-planilha">&#128202; Excel</button>'
    + (so?'':'<button class="b b-s" data-acao="nova-av">+ Avaliação</button>')
    + '</div></div></div>';

  const matriz = matrizDe(e, av);
  let preench=0; matriz.forEach(l=>l.forEach(v=>{ if(v!=null) preench++; }));
  const total = e.tratamentos.length*e.nRep;

  /* Travada, a avaliação mostra nome e unidade como texto. Destravada pelo
     Editar, eles viram campos junto com a tabela — é o mesmo gesto, e antes
     não havia jeito de corrigir um nome ou uma unidade digitados errado. */
  const editandoAv = !so && !av.travada;
  const campoAv = (rot, chave, val, extra) =>
    '<label style="display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);'
    + 'text-transform:uppercase;letter-spacing:.06em">'+rot
    + '<input data-campo="av.'+chave+'.'+av.id+'" data-k="av.'+chave+'.'+av.id+'" value="'+esc(val||"")+'" '
    + (extra||'')+' style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
    + 'padding:7px 9px;min-height:36px;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink)"></label>';
  // editando, os campos tomam a linha inteira e os botões descem — no celular
  // ficavam espremidos em meia largura, com os botões por cima da data
  s += '<div class="sec"><div class="sec-cab"'+(editandoAv ? ' style="flex-wrap:wrap;gap:12px"' : '')+'>'
    + '<div style="'+(editandoAv ? 'flex:1 1 100%' : 'flex:1')+';min-width:0">'
    + (editandoAv
        ? '<div class="grid" style="gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));max-width:640px">'
          + '<div style="grid-column:1/-1">'+campoAv("Nome da avaliação","nome",av.nome,'placeholder="Ex.: % de controle"')+'</div>'
          + campoAv("Data","data",av.data,'type="date"')
          + '<label style="display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);'
            + 'text-transform:uppercase;letter-spacing:.06em">Dias após'
            + '<div class="linha" style="gap:6px;flex-wrap:nowrap">'
            + '<input data-campo="av.dae.'+av.id+'" data-k="av.dae.'+av.id+'" value="'+esc(av.dae||"")+'" inputmode="numeric" '
            + 'placeholder="14" style="flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);'
            + 'border-radius:5px;padding:7px 9px;min-height:36px;font-size:.9rem">'
            + seletorRef(refDias(av), 'data-campo="av.ref.'+av.id+'" style="flex:none;width:76px;border:1px solid '
                + 'var(--line-2);background:var(--surface);border-radius:5px;padding:7px 4px;min-height:36px;font-size:.88rem"')
            + '</div></label>'
          + campoAv("Unidade","unidade",av.unidade,'placeholder="%, cm, kg/ha"')
          + '</div>'
        : '<div class="eyebrow">'+esc(av.tipo||"Avaliação")+(av.dae?' · '+esc(diasTexto(av)):'')+'</div>'
          + '<h2>'+(esc(av.nome)||'<i style="color:var(--muted)">sem nome</i>')+'</h2>'
          + '<div style="font-size:.82rem;color:var(--muted);margin-top:2px">'+dataBr(av.data)
          + (av.unidade?' · unidade: '+esc(av.unidade):'')+'</div>')
    + '</div>'
    + '<div class="linha">'
    + '<span class="pill '+(preench===total?"pill-a":"pill-w")+'">'+preench+' / '+total+' parcelas</span>'
    + (so ? '' : (av.travada
        ? '<button class="b b-s" data-acao="destravar-av" data-id="'+av.id+'">Editar</button>'
        : '<button class="b b-s b-p" data-acao="travar-av" data-id="'+av.id+'">Salvar dados</button>'))
    + (so?'':'<button class="b b-s b-perigo b-ghost" data-acao="del-av" data-id="'+av.id+'">Excluir</button>')
    + '</div></div>';
  const fixaAv = so || av.travada;

  s += '<div class="malha-box"><table class="malha"><thead><tr><th>Tratamento</th>';
  for(let b=0;b<e.nRep;b++) s += '<th>Bloco '+(b+1)+'</th>';
  s += '<th>Média</th></tr></thead><tbody>';
  e.tratamentos.forEach((t,ti)=>{
    const vals = matriz[ti].filter(v=>v!=null);
    const m = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    s += '<tr><th>'+esc(t.num+". "+t.nome)+(doseTexto(t)?'<small>'+esc(doseTexto(t))+'</small>':'')+'</th>';
    for(let b=0;b<e.nRep;b++){
      const chave = "dado."+av.id+"."+t.id+"|"+b;
      const v = av.dados[t.id+"|"+b];
      s += '<td>'+(fixaAv
        ? '<div style="padding:11px 6px;font-family:\'IBM Plex Mono\',monospace;font-weight:600">'+(v!=null&&v!==""?esc(v):"—")+'</div>'
        /* valor que não é número fica em vermelho: a análise o conta como parcela
           vazia, e sem a marca não havia como achar qual célula era */
        : '<input inputmode="decimal" data-k="'+chave+'" data-campo="'+chave+'" value="'+esc(v==null?"":v)+'"'
          + (v!=null && v!=="" && num(v)==null ? ' class="invalido" title="Não é um número"' : '')+'>')
        + '</td>';
    }
    s += '<td class="media">'+fmt(m)+'</td></tr>';
  });
  // rodapé: médias por bloco
  s += '<tr class="rodape"><th style="font-family:Archivo,sans-serif">Média do bloco</th>';
  for(let b=0;b<e.nRep;b++){
    const col = matriz.map(l=>l[b]).filter(v=>v!=null);
    s += '<td>'+(col.length?fmt(col.reduce((a,x)=>a+x,0)/col.length):"—")+'</td>';
  }
  const todos = matriz.flat().filter(v=>v!=null);
  s += '<td>'+(todos.length?fmt(todos.reduce((a,x)=>a+x,0)/todos.length):"—")+'</td></tr>';
  s += '</tbody></table></div>';

  // croqui do quadrado latino: a coluna de cada parcela
  if(e.delineamento === "DQL"){
    const preenchidas = av.croqui ? Object.keys(av.croqui).filter(k=>av.croqui[k]!=="").length : 0;
    s += '<div class="sec" style="margin-top:20px"><div class="sec-cab"><div>'
      + '<div class="eyebrow">Croqui</div><h3>Coluna de cada parcela</h3></div>'
      + '<span class="pill '+(preenchidas===total?"pill-a":"pill-w")+'">'+preenchidas+' / '+total+'</span></div>'
      + '<p style="font-size:.82rem;color:var(--muted);max-width:66ch">No quadrado latino cada '
      + 'tratamento aparece uma vez em cada linha <b>e</b> uma vez em cada coluna. Informe a coluna '
      + 'de cada parcela para a análise separar esse efeito do resíduo.</p>'
      + '<div class="malha-box"><table class="malha"><thead><tr><th>Tratamento</th>';
    for(let b=0;b<e.nRep;b++) s += '<th>Linha '+(b+1)+'</th>';
    s += '</tr></thead><tbody>';
    e.tratamentos.forEach(t=>{
      s += '<tr><th>'+esc(t.num+". "+t.nome)+'</th>';
      for(let b=0;b<e.nRep;b++){
        const k = t.id+"|"+b, v = av.croqui ? av.croqui[k] : "";
        s += '<td>'+(fixaAv
          ? '<div style="padding:11px 6px">'+(v!=null&&v!==""?"Col "+(Number(v)+1):"—")+'</div>'
          : '<select data-acao="set-coluna" data-av="'+av.id+'" data-k="'+k+'" '
            + 'style="border:0;background:none;min-height:44px;font-size:.86rem;width:100%;text-align:center">'
            + '<option value="">—</option>'
            + Array.from({length:e.nRep},(_,c)=>'<option value="'+c+'"'+(String(v)===String(c)?" selected":"")
                + '>Col '+(c+1)+'</option>').join("")
            + '</select>')
          + '</td>';
      }
      s += '</tr>';
    });
    s += '</tbody></table></div></div>';
  }

  /* A anotação é a única parte da avaliação que se escreve DEPOIS: "choveu na
     madrugada", "a parcela 12 foi pisada". Travar os dados e travar o texto
     junto obrigava a destravar a tabela inteira só para corrigir uma frase —
     e tabela destravada no campo é dado alterado sem querer. Por isso a
     anotação tem o próprio botão, independente da trava dos números. */
  const editandoObs = TELA.editObs === av.id;
  s += '<div class="campo" style="margin-top:16px">'
    + '<div class="linha" style="justify-content:space-between;align-items:center;gap:8px">'
    + '<label style="margin:0">Observações desta avaliação</label>'
    + (so ? '' :
        editandoObs
          ? '<button class="b b-s b-p" data-acao="obs-pronto" style="min-height:30px;padding:0 12px">Pronto</button>'
          : '<button class="b b-s" data-acao="editar-obs" data-id="'+av.id+'" '
            + 'style="min-height:30px;padding:0 12px">'+(av.obs?"Editar":"+ Anotar")+'</button>')
    + '</div>'
    + ((fixaAv && !editandoObs)
        ? '<div class="protocolo" style="font-size:.95rem">'+(esc(av.obs)||'<i style="color:var(--muted)">—</i>')+'</div>'
        : '<textarea class="serif" data-k="obs.'+av.id+'" data-campo="obs.'+av.id+'" rows="3" '
          + 'placeholder="Condições no dia, ocorrências, notas sobre parcelas específicas.">'+esc(av.obs)+'</textarea>')
    + '</div>';
  return s+'</div>';
}

/* --------- FOTOS --------- */
/* Fotografar no campo é uma sequência, não uma busca: chega-se na área, escolhe-se
   a avaliação do dia e percorre-se tratamento por tratamento. A aba segue essa
   ordem — quadro, tratamento, câmera — em vez de pedir que se etiquete cada foto
   depois de tirada, quando já não se lembra qual parcela era qual. */
function abaFotos(e){
  if(!TELA.quadro) return telaQuadros(e);
  if(TELA.quadro === "__todas") return telaTodasFotos(e);
  const q = e.sessoesFoto.find(x=>x.id===TELA.quadro);
  if(!q){ TELA.quadro = null; return telaQuadros(e); }
  return telaQuadro(e, q);
}

/* --- nível 1: os quadros --- */
function telaQuadros(e){
  const so = PERSIST.leitura;
  let s = '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Registro fotográfico</div>'
    + '<h2>Quadros de fotos</h2></div>'
    + (so?'':'<button class="b b-p" data-acao="novo-quadro">+ Novo quadro</button>')+'</div>'
    + '<p style="font-size:.83rem;color:var(--muted);max-width:66ch">'
    + 'Um quadro é uma ida a campo — <b>“Avaliação de altura — 45 DAE”</b>. Dentro dele, '
    + 'você toca no tratamento e a câmera abre; a foto entra já no lugar certo.</p>';

  if(!e.sessoesFoto.length && !e.fotos.length){
    return s + '<div class="card vazio"><h2>Nenhum quadro ainda</h2>'
      + '<p>Crie o primeiro com o nome da avaliação que vai fotografar. '
      + 'Depois é só percorrer os tratamentos, um toque por foto.</p>'
      + (so?'':'<button class="b b-p b-g" data-acao="novo-quadro">Criar o primeiro quadro</button>')
      + '</div></div>';
  }

  s += '<div class="exp-lista">';
  e.sessoesFoto.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")).forEach(q=>{
    const fs = e.fotos.filter(f=>f.sessaoId===q.id);
    const trats = new Set(fs.map(f=>f.tratId).filter(Boolean));
    const capa = fs[fs.length-1];
    s += '<div class="exp-card">'
      + '<div class="exp-abrir" data-acao="abrir-quadro" data-id="'+q.id+'" role="button" tabindex="0">'
      /* A capa também vem da gaveta sob demanda: com as imagens fora do
         caderno, na primeira pintura ela ainda não está na memória. O lugar
         dela já ocupa a altura certa, para a lista não pular quando chegar. */
      + (capa
          ? (capa.thumb
              ? '<img src="'+capa.thumb+'" alt="" loading="lazy" style="width:100%;height:104px;'
                + 'object-fit:cover;border-radius:var(--r-sm);margin-bottom:9px">'
              : '<span class="foto-nuvem" data-foto-baixar="'+capa.id+'" data-alt="" '
                + 'data-estilo="width:100%;height:104px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:9px" '
                + 'style="display:flex;height:104px;border-radius:var(--r-sm);margin-bottom:9px"></span>')
          : '')
      + '<h3>'+(esc(q.titulo)||'<i style="color:var(--muted)">Sem título</i>')+'</h3>'
      + '<div style="font-size:.8rem;color:var(--muted);margin-top:3px">'+dataBr(q.data)+'</div>'
      + '<div class="exp-num" style="margin-top:10px">'
      + '<div><b>'+fs.length+'</b><span>fotos</span></div>'
      + '<div><b>'+trats.size+'</b><span>de '+e.tratamentos.length+' trat.</span></div>'
      + '</div></div>'
      + (so?'':'<div class="linha" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">'
          + '<button class="b b-s b-perigo b-ghost" data-acao="del-quadro" data-id="'+q.id+'">Excluir quadro</button>'
          + '</div>')
      + '</div>';
  });
  if(e.fotos.length){
    s += '<div class="exp-card"><div class="exp-abrir" data-acao="abrir-quadro" data-id="__todas" '
      + 'role="button" tabindex="0"><h3>Todas as fotos</h3>'
      + '<div style="font-size:.8rem;color:var(--muted);margin-top:3px">'
      + 'Galeria única, com filtro por avaliação, tratamento e data</div>'
      + '<div class="exp-num" style="margin-top:10px">'
      + '<div><b>'+e.fotos.length+'</b><span>no ensaio</span></div>'
      + '<div><b>'+e.fotos.filter(f=>!f.sessaoId).length+'</b><span>sem quadro</span></div>'
      + '</div></div></div>';
  }
  return s + '</div></div>';
}

/* --- nível 2: um quadro, tratamento por tratamento --- */
function telaQuadro(e, q){
  const so = PERSIST.leitura;
  const fs = e.fotos.filter(f=>f.sessaoId===q.id);
  let s = '<div class="sec"><div class="linha" style="gap:8px">'
    + '<button class="b b-s b-ghost" data-acao="voltar-quadros">&#8592; Quadros</button>'
    + '<span style="font-size:.78rem;color:var(--muted)">'+fs.length+' foto'+(fs.length===1?'':'s')
    + ' neste quadro</span></div>'
    + '<div class="card card-p grid" style="gap:12px;grid-template-columns:2fr 1fr">'
    + '<div class="campo"><label>Título do quadro</label>'
    + (so ? '<div style="font-size:1rem;font-weight:600">'+(esc(q.titulo)||'—')+'</div>'
          : '<input data-k="quadro.'+q.id+'.titulo" data-campo="quadro.'+q.id+'.titulo" '
            + 'value="'+esc(q.titulo)+'" placeholder="Ex.: Avaliação de altura — 45 DAE">')
    + '</div>'
    + '<div class="campo"><label>Data</label>'
    + (so ? '<div style="font-size:.95rem">'+dataBr(q.data)+'</div>'
          : '<input type="date" data-k="quadro.'+q.id+'.data" data-campo="quadro.'+q.id+'.data" '
            + 'value="'+esc(q.data)+'">')
    + '</div></div></div>';

  /* Um bloco por tratamento, na ordem do protocolo — que é a ordem em que se
     caminha no campo. O bloco extra do fim recolhe o que ficou sem tratamento. */
  const blocos = e.tratamentos.map(t=>({
    id:t.id, rot:t.num+". "+t.nome, sub:doseTexto(t),
    fotos: fs.filter(f=>f.tratId===t.id)
  }));
  /* O bloco extra existe sempre, mesmo vazio: é onde entra o que não pertence a
     nenhuma parcela — panorama da área, uma ocorrência, uma curiosidade. */
  const soltas = fs.filter(f=>!f.tratId || !e.tratamentos.some(t=>t.id===f.tratId));
  blocos.push({id:"__extra", rot:"Fotos extras", extra:true,
               sub:"Panorama da área, ocorrências, curiosidades", fotos:soltas});

  if(!e.tratamentos.length){
    return s + '<div class="card vazio"><h2>Cadastre os tratamentos primeiro</h2>'
      + '<p>Os tratamentos são as portas de entrada das fotos — sem eles não há onde guardar.</p>'
      + '<button class="b b-p b-g" data-acao="aba" data-aba="tratamentos">Ir para Tratamentos</button></div></div>';
  }

  /* Fechados por padrão: com 20 tratamentos × várias fotos, a página vira uma
     rolagem interminável. Abre-se só o tratamento que se quer olhar. */
  s += '<div class="grid" style="gap:8px">';
  blocos.forEach(b=>{
    const aberto = TELA.tratAberto === b.id;
    s += '<div class="card card-p" style="padding:12px">'
      + '<div class="linha" style="gap:10px;flex-wrap:nowrap">'
      + '<div class="trat-abrir" data-acao="abrir-trat" data-id="'+b.id+'" role="button" '
      + 'tabindex="0" aria-expanded="'+aberto+'">'
      + '<span class="trat-seta'+(aberto?' on':'')+'">&#9656;</span>'
      + '<div style="min-width:0"><h3>'+esc(b.rot)+'</h3>'
      + (b.sub ? '<div style="font-size:.76rem;color:var(--muted);margin-top:2px;'
               + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(b.sub)+'</div>' : '')
      + '</div>'
      + '<span class="pill'+(b.fotos.length>=FOTOS_POR_TRAT ? ' pill-w'
          : b.fotos.length ? ' pill-a' : '')+'" style="margin-left:auto;flex:none">'
      + b.fotos.length+'/'+FOTOS_POR_TRAT+'</span></div>'
      /* Câmera primeiro: no campo é o gesto de sempre, e fica sob o polegar. */
      + (so ? '' :
          '<button class="b b-s b-p" data-acao="foto-trat" data-id="'+b.id+'" '
          + 'style="flex:none" aria-label="Tirar foto"'
          + (b.fotos.length>=FOTOS_POR_TRAT?' disabled':'')+'>&#128247;</button>'
          + '<button class="b b-s" data-acao="galeria-trat" data-id="'+b.id+'" '
          + 'style="flex:none" aria-label="Escolher da galeria"'
          + (b.fotos.length>=FOTOS_POR_TRAT?' disabled':'')+'>&#128444;</button>')
      + '</div>';
    if(aberto){
      s += b.fotos.length
        ? '<div class="foto-grade" style="margin-top:12px">'
          + b.fotos.map(f=>cartaoFoto(e, f, so)).join("") + '</div>'
        : '<p style="font-size:.8rem;color:var(--muted);margin-top:10px">Nenhuma foto aqui ainda'
          + (so?'.':' — &#128247; tira a foto, &#128444; busca na galeria do celular.')+'</p>';
      if(b.fotos.length >= FOTOS_POR_TRAT && !so){
        s += '<p style="font-size:.78rem;color:var(--alerta);margin-top:8px">'
          + 'Limite de '+FOTOS_POR_TRAT+' fotos atingido aqui. Apague alguma, ou abra '
          + 'outro quadro para a próxima ida a campo.</p>';
      }
    }
    s += '</div>';
  });
  return s + '</div></div>';
}

/* Cada foto com a etiqueta embaixo, e as chaves do que a etiqueta mostra. */
function cartaoFoto(e, f, so){
  const aberta = TELA.etiqueta === f.id;
  const txt = etiquetaTexto(e, f);
  let s = '<div class="foto-cartao">'
    + '<button class="foto-face" data-acao="ver-foto" data-id="'+f.id+'">'
    /* Sem miniatura aqui é foto de outro aparelho: mostra o lugar dela e o
       carregador busca em seguida. Nunca um <img> quebrado. */
    + (f.thumb
        ? '<img src="'+f.thumb+'" alt="'+esc(txt||"Foto do ensaio")+'" loading="lazy">'
        : '<span class="foto-nuvem" data-foto-baixar="'+f.id+'" data-alt="'
          + esc(txt||"Foto do ensaio")+'">'+((f.remota && !f.local)?'&#8681;':'')+'</span>')
    + '</button>'
    + '<div class="foto-etiq">'+(esc(txt)||'<i style="color:var(--muted)">sem etiqueta</i>')+'</div>';
  /* Foto extra não tem tratamento para se nomear sozinha: a caixa de texto fica
     à vista, porque escrever nela é o único jeito de a etiqueta dizer algo. */
  if(!so && !f.tratId){
    s += '<div style="padding:0 8px 8px">'
      + '<input data-k="etiq.'+f.id+'.texto" data-campo="etiq.'+f.id+'.texto" '
      + 'value="'+esc((f.etiq||{}).texto||"")+'" placeholder="Escreva a etiqueta desta foto" '
      + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
      + 'padding:8px 9px;width:100%;min-height:38px;font-size:.83rem;'
      + 'font-family:Calibri,Carlito,\'Segoe UI\',Roboto,sans-serif"></div>';
  }
  if(!so){
    s += '<div class="linha" style="gap:4px;padding:0 6px 8px;flex-wrap:nowrap">'
      + '<button class="b b-s b-ghost" data-acao="editar-etiqueta" data-id="'+f.id+'" '
      + 'style="padding:6px 8px">'+(aberta?'Pronto':'Etiqueta')+'</button>'
      + '<button class="b b-s b-ghost" data-acao="salvar-foto" data-id="'+f.id+'" '
      + 'style="padding:6px 8px">&#11015; Salvar</button>'
      + '<button class="b b-x" data-acao="del-foto" data-id="'+f.id+'" '
      + 'style="margin-left:auto;width:30px;min-width:30px;height:30px;min-height:30px;'
      + 'font-size:1rem" aria-label="Excluir foto">&times;</button></div>';
    if(aberta){
      s += '<div class="grid" style="gap:7px;padding:0 8px 10px">'
        + '<div class="linha" style="gap:5px">'
        + ETIQ_PARTES.map(p=>'<button class="pill'+((f.etiq||{})[p[0]]?' pill-a':'')+'" '
            + 'data-acao="etiq-parte" data-id="'+f.id+'" data-parte="'+p[0]+'" '
            + 'aria-pressed="'+(!!(f.etiq||{})[p[0]])+'" style="cursor:pointer">'
            + ((f.etiq||{})[p[0]]?'&#10003; ':'')+p[1]+'</button>').join("")
        + '</div>'
        // a foto extra já mostra este campo acima; repeti-lo criaria dois iguais
        + (f.tratId ? '<input data-k="etiq.'+f.id+'.texto" data-campo="etiq.'+f.id+'.texto" '
            + 'value="'+esc((f.etiq||{}).texto||"")+'" placeholder="Texto livre — o que a foto mostra" '
            + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
            + 'padding:8px 9px;width:100%;min-height:38px;font-size:.83rem;'
            + 'font-family:Calibri,Carlito,\'Segoe UI\',Roboto,sans-serif">' : '')
        + '<input data-k="foto.'+f.id+'.link" data-campo="foto.'+f.id+'.link" inputmode="url" '
        + 'value="'+esc(f.link||"")+'" placeholder="Link do original em resolução cheia" '
        + 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:5px;'
        + 'padding:8px 9px;width:100%;min-height:38px;font-size:.78rem">'
        + '</div>';
    }
  }
  return s + '</div>';
}

/* --- galeria única, com os filtros de sempre --- */
function telaTodasFotos(e){
  const f = TELA.filtro || {};
  let fotos = e.fotos.slice().sort((a,b)=> (b.quando||"").localeCompare(a.quando||""));
  if(f.quadroId) fotos = fotos.filter(x=>(x.sessaoId||"") === (f.quadroId==="__sem"?"":f.quadroId));
  if(f.tratId)   fotos = fotos.filter(x=>x.tratId===f.tratId);
  if(f.data)     fotos = fotos.filter(x=>x.data===f.data);

  let s = '<div class="sec"><div class="linha" style="gap:8px">'
    + '<button class="b b-s b-ghost" data-acao="voltar-quadros">&#8592; Quadros</button>'
    + '<h2 style="font-size:1rem">Todas as fotos</h2></div>';

  const datas = [...new Set(e.fotos.map(x=>x.data).filter(Boolean))].sort().reverse();
  s += '<div class="linha" style="gap:8px">'
    + '<select class="b b-s" data-acao="filtro" data-campo="quadroId"><option value="">Todos os quadros</option>'
    + e.sessoesFoto.map(q=>'<option value="'+q.id+'"'+(f.quadroId===q.id?" selected":"")+'>'
        + esc(q.titulo||"Sem título")+'</option>').join("")
    + '<option value="__sem"'+(f.quadroId==="__sem"?" selected":"")+'>Sem quadro</option></select>'
    + '<select class="b b-s" data-acao="filtro" data-campo="tratId"><option value="">Todos os tratamentos</option>'
    + e.tratamentos.map(t=>'<option value="'+t.id+'"'+(f.tratId===t.id?" selected":"")+'>'+esc(t.num+". "+t.nome)+'</option>').join("")
    + '</select>'
    + '<select class="b b-s" data-acao="filtro" data-campo="data"><option value="">Todas as datas</option>'
    + datas.map(d=>'<option value="'+d+'"'+(f.data===d?" selected":"")+'>'+dataBr(d)+'</option>').join("")
    + '</select>'
    + ((f.quadroId||f.tratId||f.data)?'<button class="b b-s b-ghost" data-acao="limpar-filtro">Limpar</button>':'')
    + '<span style="font-size:.78rem;color:var(--muted);margin-left:auto">'+fotos.length
    + ' exibida'+(fotos.length===1?"":"s")+'</span></div>';

  if(!fotos.length){
    return s + '<div class="card vazio"><h2>Nada com esse filtro</h2>'
      + '<p>Nenhuma foto combina com o que está selecionado acima.</p></div></div>';
  }
  s += '<div class="foto-grade">';
  fotos.forEach(x=>{ s += cartaoFoto(e, x, PERSIST.leitura); });
  return s + '</div></div>';
}

/* --------- ANÁLISE --------- */
/* Tabela final: uma coluna por avaliação, uma linha por tratamento, média e
   letra em cada célula e o CV embaixo — o formato da tabela de resultados do
   relatório. Tela, cópia e exportação usam esta mesma montagem. Avaliação sem
   malha completa fica de fora, e a lista `fora` diz quais. */
/* Uma avaliação analisada do jeito que o ensaio pede: transformação da própria
   avaliação e opções do fatorial. Tela, tabela final e relatório passam todos
   por aqui — assim nunca mostram análises diferentes da mesma coisa. */
function opcoesFatorial(e){
  const o = e.fatOpc || {};
  return {desdobrar: ["auto","sempre","nao"].indexOf(o.desdobrar) >= 0 ? o.desdobrar : "auto",
          tipos: o.tipos || {}};
}
/* Quem é a testemunha. Se alguém escolheu na aba Análise, vale a escolha;
   senão o app reconhece: o tratamento adicional do fatorial, ou o que tem
   "testemunha" no nome ou no produto. Sem nenhum desses: null. */
function controleDe(e){
  const n = e.tratamentos.length;
  if(e.controleDef){
    if(e.controle === -1) return null;                    // "nenhuma", escolhido de propósito
    if(Number.isInteger(e.controle) && e.controle >= 0 && e.controle < n) return e.controle;
  }
  const fat = ehFatorial(e);
  if(fat && fat.adicionais && fat.adicionais.length) return fat.adicionais[0];
  const i = e.tratamentos.findIndex(t=>/testemunha/i.test(t.nome||"") || (t.produtos||[]).some(ehProdutoTestemunha));
  return i >= 0 ? i : null;
}
/* A testemunha pode ficar FORA da análise de uma avaliação. É o caso clássico
   da "% de controle": ela vale 0 em todas as parcelas por definição, não tem
   variação, e na ANOVA só infla o F e quebra a homogeneidade. Fora, ela
   continua na tabela como referência, sem letra. Quadrado latino não permite
   (a casualização exige todos os tratamentos), e o Dunnett precisa dela. */
function podeTirarTestemunha(e){
  return controleDe(e) != null && e.delineamento !== "DQL" && e.tratamentos.length > 2 && e.teste !== "dunnett";
}
function testemunhaConstante(e, av){
  const i = controleDe(e); if(i == null) return false;
  const vals = matrizDe(e, av)[i].filter(v=>v!=null);
  return vals.length === e.nRep && vals.every(v=>v === vals[0]);
}
function analisarAv(e, av){
  const orig = matrizDe(e, av);
  const nR = e.nRep;
  const iT = controleDe(e);
  // quais tratamentos entram: todos, ou todos menos a testemunha
  const tirar = !!av.semTest && podeTirarTestemunha(e);
  const idx = e.tratamentos.map((_,i)=>i).filter(i=>!(tirar && i===iT));
  const trats = idx.map(i=>e.tratamentos[i]);
  const origS = idx.map(i=>orig[i]);
  const tf = TRANSF[av.transf] ? (av.transf || "") : "";
  let dados = origS;
  if(tf){
    dados = origS.map(l=>l.map(v=>v==null ? null : TRANSF[tf].f(v)));
    const ruins = dados.flat().filter(v=>v!=null && !Number.isFinite(v)).length;
    if(ruins) return {erro:"transf", transf:tf, ruins};
  }
  const somaO = orig.map(l=>l.reduce((a,v)=>a+(v==null?0:v),0));
  const somaS = idx.map(i=>somaO[i]);
  // sem a testemunha, o fatorial "3×3+1" vira o fatorial puro "3×3"
  const fat = tirar ? ehFatorial({fatores:e.fatores, tratamentos:trats, delineamento:e.delineamento}) : ehFatorial(e);
  /* Subdividida com tratamento adicional não tem análise definida: a testemunha
     não pertence a nenhuma parcela de A. Antes o app analisava calado como
     blocos comuns; agora avisa — tirando a testemunha, a subdividida roda. */
  if(e.delineamento === "SPLIT" && !fat
     && ehFatorial({fatores:e.fatores, tratamentos:e.tratamentos, delineamento:"DBC"}))
    return {erro:"split_adicional"};
  const ctrlS = iT != null && idx.indexOf(iT) >= 0 ? idx.indexOf(iT) : 0;
  const r = anova(dados, idx.length, nR, e.delineamento, fat, trats,
                  e.teste, tirar ? null : croquiDe(e,av), alfaDe(e), ctrlS, {tipos: opcoesFatorial(e).tipos, somaO: somaS});
  if(!r.ok) return r;
  r.transf = tf;
  // os índices voltam a ser os do ensaio: a tela e a tabela final usam e.tratamentos[i]
  r.medias.forEach(m=>{ m.mo = somaS[m.i]/nR; m.i = idx[m.i]; });
  r.mediaO = somaS.reduce((a,x)=>a+x,0)/(idx.length*nR);
  if(r.dunnett){
    r.dunnett.linhas.forEach(x=>{ x.mo = somaS[x.i]/nR; x.i = idx[x.i]; });
    r.dunnett.iCtrl = idx[r.dunnett.iCtrl];
  }
  if(tirar) r.fora = {i:iT, mo: somaO[iT]/nR};
  /* Letras do teste escolhido E, ao lado, cada tratamento contra a testemunha
     (Dunnett, com o mesmo resíduo) e quanto ele difere dela em %. */
  if(e.compTest && !tirar && iT != null && !r.dunnett && !r.split){
    const res = r.fonte.find(l=>l.nome==="Resíduo");
    const d = dDunnett(r.alfa, Math.max(1, idx.length-1), r.glRes, true);
    const dms = res && res.qm >= 0 ? d*Math.sqrt(2*res.qm/nR) : null;
    const mT = r.medias.find(m=>m.i===iT);
    if(mT){
      r.vsTest = {iCtrl:iT, dms, linhas: r.medias.map(m=>({
        i:m.i,
        difere: m.i!==iT && dms!=null && Math.abs(m.media-mT.media) > dms,
        rel: mostra(mT) !== 0 ? 100*(mostra(m)-mostra(mT))/Math.abs(mostra(mT)) : null
      }))};
    }
  }
  return r;
}
/* Média para MOSTRAR: a original quando os dados foram transformados. */
function mostra(x){ return x.mo != null ? x.mo : x.media; }

function tabelaFinal(e){
  const cols = [], fora = [];
  e.avaliacoes.forEach(av=>{
    const r = analisarAv(e, av);
    if(!r.ok){ fora.push(av.nome || "sem nome"); return; }
    /* Casas decimais pela grandeza, como se escreve à mão: produtividade em
       5.845, altura em 24,2, nota pequena em 1,25. */
    const mx = Math.max(...r.medias.map(m=>Math.abs(mostra(m))));
    const cd = mx>=1000 ? 0 : mx>=10 ? 1 : 2;
    const cel = {};
    if(r.dunnett){
      r.dunnett.linhas.forEach(x=>{
        cel[x.i] = fmt(mostra(x),cd) + (x.i===r.dunnett.iCtrl ? "" : " "+(x.difere?"*":"ns"));
      });
    } else {
      r.medias.forEach(m=>{ cel[m.i] = fmt(mostra(m),cd)+" "+(m.letra||"a"); });
    }
    // testemunha fora da análise: o valor aparece, sem letra (nota no rodapé)
    if(r.fora) cel[r.fora.i] = fmt(r.fora.mo, cd);
    cols.push({ nome: av.nome || "Avaliação", unidade: av.unidade || "", dias: diasTexto(av),
                cel, cv: fmt(r.cv,2), dunnett: !!r.dunnett, transf: r.transf, fora: !!r.fora });
  });
  const nomeT = (TESTES[e.teste]||TESTES.tukey).nome;
  // avaliação transformada: a nota diz qual e que as médias são as originais (como no SASM-Agri)
  const transfs = [...new Set(cols.filter(c=>c.transf).map(c=>TRANSF[c.transf].nome))];
  const notaTransf = transfs.length
    ? " Para a análise, os dados de "+cols.filter(c=>c.transf).map(c=>c.nome).join(", ")
      + " foram transformados em "+transfs.join(" / ")+"; as médias apresentadas são as originais."
    : "";
  const nota = cols.some(c=>c.dunnett)
    ? "* difere da testemunha e ns não difere pelo teste de Dunnett a "+alfaTexto(alfaDe(e))
      + " de probabilidade de erro. C.V. = coeficiente de variação."
    : "Médias seguidas da mesma letra na coluna não apresentam diferença estatística significativa "
      + "pelo teste de "+nomeT+" a "+alfaTexto(alfaDe(e))+" de probabilidade de erro. "
      + "C.V. = coeficiente de variação.";
  const linhas = e.tratamentos.map((t,i)=>({ t, nome: t.nome || ("T"+t.num), cels: cols.map(c=>c.cel[i] || "—") }))
                              .sort((a,b)=>a.t.num - b.t.num);
  const iT = controleDe(e);
  const notaFora = cols.some(c=>c.fora) && iT != null
    ? " A testemunha ("+(e.tratamentos[iT].nome||("T"+e.tratamentos[iT].num))+") não entrou na análise estatística de "
      + cols.filter(c=>c.fora).map(c=>c.nome).join(", ")+"; seu valor é apresentado como referência."
    : "";
  return { cols, linhas, fora, nota: nota + notaTransf + notaFora };
}

function abaAnalise(e){
  if(e.avaliacoes.length===0){
    return '<div class="card vazio"><h2>Sem dados para analisar</h2>'
      + '<p>Crie uma avaliação e lance os valores por parcela. A análise de variância e o teste '
      + 'de Tukey aparecem aqui automaticamente, assim que a malha estiver completa.</p>'
      + '<button class="b b-p b-g" data-acao="aba" data-aba="avaliacoes">Ir para avaliações</button></div>';
  }
  const tst = TESTES[e.teste] ? e.teste : "tukey";
  const so = PERSIST.leitura;
  const sel = 'style="border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);'
            + 'padding:9px 10px;min-height:40px;font-size:.86rem;max-width:100%"';
  let s = '<div class="sec"><div class="sec-cab"><div><div class="eyebrow">Análise estatística</div>'
    + '<h2>ANOVA e '+esc(TESTES[tst].nome)+' a '+alfaTexto(alfaDe(e))+'</h2></div>'
    + '<div class="linha" style="gap:8px">'
    + '<button class="b b-s" data-acao="exportar-planilha">&#128202; Avaliações p/ Excel</button>'
    + '<button class="b b-s" data-acao="exportar">Exportar para o relatório</button></div></div>'
    + '<p style="font-size:.83rem;color:var(--muted);max-width:66ch">'
    + esc((DELINS[e.delineamento]||{}).nome||e.delineamento)
    + ', '+e.tratamentos.length+' tratamentos e '+e.nRep+' repetições. Cada avaliação é analisada '
    + 'separadamente; médias seguidas da mesma letra não diferem entre si.</p></div>'
    /* A tabela final vem primeiro e aberta: é o resultado que se procura.
       Opções e cada avaliação ficam recolhidas, e abrem com um toque. */
    + secaoTabelaFinal(e)
    + '<details class="sanfona" data-sanfona="opcoes"'+(sanfonaAberta("opcoes",false)?' open':'')+'>'
    + '<summary><div class="sanfona-cab"><div><h3>Opções da análise</h3><div class="sanfona-resumo">'
    + esc(TESTES[tst].nome)+' · '+alfaTexto(alfaDe(e))
    + (ehFatorial(e) ? ' · desdobramento '+({auto:"automático",sempre:"sempre",nao:"desligado"})[opcoesFatorial(e).desdobrar] : '')
    + (controleDe(e)!=null ? ' · testemunha '+esc(e.tratamentos[controleDe(e)].nome||"") : '')
    + '</div></div></div></summary><div class="sanfona-corpo">'
    + '<div class="linha" style="gap:10px">'
    + (so ? '' : '<div class="campo" style="min-width:210px"><label>Comparação de médias</label>'
        + '<select data-acao="set-teste" '+sel+'>'
        + Object.keys(TESTES).map(k=>'<option value="'+k+'"'+(tst===k?" selected":"")+'>'
            + TESTES[k].nome+'</option>').join("")
        + '</select></div>')
    + (so ? '' : '<div class="campo" style="min-width:120px"><label>Significância</label>'
        + '<select data-acao="set-alfa" '+sel+'>'
        + Object.keys(ALFAS).map(a=>'<option value="'+a+'"'+(alfaDe(e)===Number(a)?" selected":"")+'>'
            + ALFAS[a]+'</option>').join("")
        + '</select></div>')
    /* A testemunha fica sempre à vista: o app a reconhece sozinho (adicional do
       fatorial, ou "testemunha" no nome/produto) e aqui dá para corrigir. */
    + (so ? '' : (()=>{
        const iT = controleDe(e);
        return '<div class="campo" style="min-width:190px"><label>Testemunha</label>'
          + '<select data-acao="set-controle" '+sel+'>'
          + '<option value="-1"'+(iT==null?" selected":"")+'>— nenhuma —</option>'
          + e.tratamentos.map((t,i)=>'<option value="'+i+'"'+(iT===i?" selected":"")+'>'
              + esc(t.num+". "+t.nome)+'</option>').join("")
          + '</select></div>';
      })())
    + '<div class="campo" style="min-width:190px"><label>Ordem das médias</label>'
        + '<select data-acao="set-ordem" '+sel+'>'
        + '<option value="num"'+((TELA.ordem||"num")==="num"?" selected":"")+'>Número do tratamento</option>'
        + '<option value="media"'+(TELA.ordem==="media"?" selected":"")+'>Da maior para a menor</option>'
        + '</select></div>'
    + '<span style="font-size:.78rem;color:var(--muted);flex:1;min-width:200px;align-self:flex-end;padding-bottom:10px">'
    + esc(TESTES[tst].desc)+'</span></div>'
    /* As letras do teste escolhido e, junto, cada tratamento contra a
       testemunha — o que se pergunta primeiro num ensaio de produto. */
    + (so || tst==="dunnett" || controleDe(e)==null ? '' :
        '<label class="linha" style="gap:8px;margin-top:8px;cursor:pointer;font-size:.86rem;align-items:center">'
        + '<input type="checkbox" data-acao="set-comptest"'+(e.compTest?' checked':'')
        + ' style="width:18px;height:18px;accent-color:var(--accent)">'
        + 'Comparar também cada tratamento com a testemunha (Dunnett e diferença em %)</label>');

  /* Opções do fatorial, no espírito do SISVAR: como tratar a interação e, para
     cada fator, se os níveis são categorias (comparar médias) ou números
     (regressão). Ficam no ensaio e valem para todas as avaliações. */
  const fatE = ehFatorial(e);
  if(fatE && !so){
    const op = opcoesFatorial(e);
    s += '<div class="card card-p" style="margin-top:12px"><div class="eyebrow" style="margin-bottom:8px">'
      + 'Fatorial '+arranjoTexto(fatE)+' — como analisar</div>'
      + '<div class="linha" style="gap:10px;align-items:flex-start">'
      + '<div class="campo" style="min-width:230px;flex:1"><label>Desdobramento da interação</label>'
      + '<select data-acao="set-desdobrar" '+sel+'>'
      + [["auto","Quando a interação for significativa"],["sempre","Sempre"],["nao","Não desdobrar"]]
          .map(([v,t])=>'<option value="'+v+'"'+(op.desdobrar===v?" selected":"")+'>'+t+'</option>').join("")
      + '</select><span class="dica">Estuda cada fator dentro de cada nível do outro, com a ANOVA do desdobramento e o teste — como no SISVAR.</span></div>';
    fatE.forEach(f=>{
      const podeQuant = fatorQuantitativo(f);
      const tipo = op.tipos[f.id] === "quant" && podeQuant ? "quant" : "qual";
      s += '<div class="campo" style="min-width:230px;flex:1"><label>Níveis de '+esc(f.nome||"fator")+'</label>'
        + '<select data-acao="set-tipo-fator" data-id="'+f.id+'" '+sel+'>'
        + '<option value="qual"'+(tipo==="qual"?" selected":"")+'>Categorias — comparar médias</option>'
        + '<option value="quant"'+(tipo==="quant"?" selected":"")+(podeQuant?'':' disabled')+'>Números — regressão</option>'
        + '</select><span class="dica">'+(podeQuant
            ? 'Dose, taxa, época: a regressão mostra como a resposta muda ('+esc(f.niveis.map(n=>fmt(valorNivel(n.nome), null).replace(/,00$/,"")).join(" · "))+').'
            : 'Para regressão, o nome de cada nível precisa começar com o número — ex.: “0,5 L/ha”.')
        + '</span></div>';
    });
    s += '</div></div>';
  }
  s += '</div></details>';

  e.avaliacoes.forEach(av=>{
    const r = analisarAv(e, av);
    const alfa = alfaDe(e);
    const kS = "av-"+av.id;
    s += '<details class="sanfona" data-sanfona="'+kS+'"'+(sanfonaAberta(kS,false)?' open':'')+'>'
      + '<summary><div class="sanfona-cab"><div><h3>'+esc(av.nome)+'</h3>'
      + '<div style="font-size:.78rem;color:var(--muted)">'+dataBr(av.data)+(av.unidade?' · '+esc(av.unidade):'')
      + (av.dae ? ' · '+esc(diasTexto(av)) : '')+'</div></div>';
    if(r.ok){
      const cvc = classeCV(r.cv);
      const sig = r.p!=null && r.p<alfa;
      s += '<div class="linha">'
        + '<span class="pill '+(sig?"pill-a":"")+'">'+(sig?"significativo":"não significativo")+'</span>'
        + '<span class="pill '+cvc.c+'">CV '+fmt(r.cv,2)+'% · '+cvc.t+'</span></div>';
