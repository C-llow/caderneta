<!doctype html>
<title>Caderneta de Campo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7B3C">
<meta name="description" content="Ensaios agronômicos: protocolo, croqui, avaliações, fotos por tratamento e análise estatística. Funciona sem internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --ground:#EFF1EA; --surface:#FFFFFF; --surface-2:#E4E8DB; --surface-3:#F6F8F2;
  --ink:#191E12; --ink-2:#3E4634; --muted:#6C7460; --line:#D3D9C6; --line-2:#C0C8B0;
  --accent:#4A7328; --accent-ink:#FFFFFF; --accent-soft:#DFEBCF; --accent-line:#A8C486;
  --alerta:#9A6410; --alerta-soft:#F7E9CE; --erro:#9E3626; --erro-soft:#F7DCD6;
  --shadow:0 1px 2px rgba(25,30,18,.06),0 4px 14px rgba(25,30,18,.05);
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#12160D; --surface:#1B2114; --surface-2:#252D1B; --surface-3:#1F2617;
  --ink:#E9EDDF; --ink-2:#C2CBB0; --muted:#8E9880; --line:#333D25; --line-2:#44502F;
  --accent:#95C061; --accent-ink:#12160D; --accent-soft:#2A3719; --accent-line:#4E6532;
  --alerta:#DCA544; --alerta-soft:#332813; --erro:#E08472; --erro-soft:#381D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em; line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.serif{font-family:"Source Serif 4",Georgia,serif}

/* ---------- estrutura ---------- */
.topo{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:12px; min-height:56px;
}
.topo-tit{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.topo-tit b{font-size:.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topo-tit span{font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wrap{max-width:1080px; margin:0 auto; padding:18px 16px 96px}
.abas{
  position:sticky; top:56px; z-index:35; background:var(--ground);
  border-bottom:1px solid var(--line); display:flex; gap:2px;
  overflow-x:auto; scrollbar-width:none; padding:0 8px;
}
.abas::-webkit-scrollbar{display:none}
.aba{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 13px; font-size:.83rem; font-weight:500; color:var(--muted);
  white-space:nowrap; letter-spacing:.01em;
}
.aba[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}

/* ---------- botões ---------- */
.b{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:9px 14px; border-radius:var(--r-sm); font-size:.85rem; font-weight:500;
  cursor:pointer; min-height:40px; transition:background .12s,border-color .12s;
}
.b:hover{background:var(--surface-2)}
.b:disabled{opacity:.45; cursor:not-allowed}
.b-p{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.b-p:hover{background:var(--accent); filter:brightness(1.08)}
.b-g{padding:12px 20px; min-height:48px; font-size:.92rem}
.b-s{padding:6px 10px; min-height:32px; font-size:.78rem}
.b-perigo{color:var(--erro); border-color:var(--erro)}
.b-perigo:hover{background:var(--erro-soft)}
/* Excluir precisa parecer um botão: o × sem contorno passava despercebido. */
.b-x{
  flex:none; width:36px; min-width:36px; height:36px; min-height:36px; padding:0;
  font-size:1.15rem; line-height:1; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--muted);
}
.b-x:hover{background:var(--erro-soft); border-color:var(--erro); color:var(--erro)}
.b-ghost{border-color:transparent; background:none}
.b-ghost:hover{background:var(--surface-2)}

/* seletor de duas vias: mostra as duas opções e qual está valendo */
.seg{
  display:inline-flex; gap:2px; padding:2px; flex:none;
  background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-sm);
}
.seg-b{
  border:0; background:none; color:var(--muted); font:inherit; font-size:.83rem;
  font-weight:600; padding:7px 15px; min-height:36px; border-radius:5px; cursor:pointer;
}
.seg-b:hover{color:var(--ink-2)}
.seg-b.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow)}
.seg-b:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- cartões / campos ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-p{padding:16px}
.grid{display:grid; gap:12px}
.linha{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.campo{display:flex; flex-direction:column; gap:5px}
.campo>label{font-size:.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.campo input,.campo select,.campo textarea{
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:10px 11px; font-size:.92rem; width:100%; min-height:42px;
}
.campo textarea{min-height:110px; resize:vertical; line-height:1.6}
.campo .dica{font-size:.72rem; color:var(--muted)}

.eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.vazio{text-align:center; padding:44px 22px; color:var(--muted)}
.vazio h2{color:var(--ink); margin-bottom:8px}
.vazio p{max-width:44ch; margin:0 auto 18px; font-size:.9rem}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:.72rem; font-weight:600; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line); white-space:nowrap;
}
.pill-a{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
.pill-w{background:var(--alerta-soft); color:var(--alerta); border-color:var(--alerta)}
.pill-e{background:var(--erro-soft); color:var(--erro); border-color:var(--erro)}

/* ---------- lista de experimentos ---------- */
.exp-lista{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.exp-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:10px; transition:border-color .12s,transform .12s;
}
.exp-card:hover{border-color:var(--accent-line)}
.exp-card h3{font-size:1rem}
/* a área de cima do cartão é o que abre o ensaio; o rodapé fica para o seletor */
.exp-abrir{cursor:pointer; display:flex; flex-direction:column; gap:2px; flex:1}
.exp-abrir:hover h3{color:var(--accent)}
.exp-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
.exp-meta{display:flex; gap:6px; flex-wrap:wrap}
.exp-num{display:flex; gap:16px; border-top:1px solid var(--line); padding-top:10px; margin-top:auto}
.exp-num div{display:flex; flex-direction:column}
.exp-num b{font-family:"IBM Plex Mono",monospace; font-size:1.05rem; font-weight:600; line-height:1}
.exp-num span{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:3px}

/* ---------- malha blocos x tratamentos ---------- */
.malha-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.malha{border-collapse:collapse; width:100%; min-width:max-content}
table.malha th,table.malha td{border:1px solid var(--line); padding:0; text-align:center}
table.malha thead th{
  background:var(--surface-2); font-size:.72rem; font-weight:600; padding:8px 10px;
  color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0;
}
table.malha tbody th{
  background:var(--surface-3); text-align:left; padding:8px 11px; font-size:.82rem;
  font-weight:500; position:sticky; left:0; z-index:2; min-width:150px; max-width:220px;
}
table.malha tbody th small{display:block; color:var(--muted); font-size:.7rem; font-weight:400}
table.malha td input{
  border:0; background:none; width:100%; min-width:74px; padding:11px 6px; text-align:center;
  font-family:"IBM Plex Mono",monospace; font-size:.92rem; font-variant-numeric:tabular-nums;
  min-height:44px;
}
table.malha td input:focus{background:var(--accent-soft); outline:2px solid var(--accent); outline-offset:-2px}
table.malha td.media{background:var(--surface-3); font-family:"IBM Plex Mono",monospace; font-size:.88rem; font-weight:600; padding:9px 11px}
table.malha tr.rodape th,table.malha tr.rodape td{background:var(--surface-2); font-size:.82rem; padding:8px 10px; font-family:"IBM Plex Mono",monospace}
/* No croqui a coluna "Parcela" é só um número de ordem: fica estreita, e o
   espaço que sobra vai para as colunas dos blocos, que é onde se lê o mapa. */
table.malha.croqui th:first-child{width:52px; min-width:52px; max-width:52px}
table.malha.croqui td input{min-width:0}

/* ---------- tabelas de resultado ---------- */
.tab-box{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.dados{border-collapse:collapse; width:100%; font-size:.85rem}
table.dados th,table.dados td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
table.dados th:first-child,table.dados td:first-child{text-align:left}
table.dados thead th{
  background:var(--surface-2); font-size:.7rem; text-transform:uppercase; letter-spacing:.05em;
  font-weight:600; color:var(--ink-2);
}
table.dados td{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
table.dados td:first-child{font-family:Archivo,sans-serif}
table.dados tbody tr:last-child td{border-bottom:0}
.letra{font-weight:700; color:var(--accent); margin-left:2px}
/* Protocolo impresso: listras alternadas por tratamento, como na caderneta.
   Tudo centralizado — é um quadro de conferência, não um texto corrido, e o
   olho desce coluna por coluna procurando o valor. */
table.protocolo-tab th,table.protocolo-tab td,
table.protocolo-tab th:first-child,table.protocolo-tab td:first-child{text-align:center}
table.protocolo-tab tbody tr.par td{background:var(--surface-3)}
table.protocolo-tab td{border-bottom:1px solid var(--line)}
table.protocolo-tab tbody tr:last-child td{border-bottom:0}

/* ---------- fotos ---------- */
.galeria{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.foto-item{
  position:relative; aspect-ratio:1; border-radius:var(--r-sm); overflow:hidden;
  border:1px solid var(--line); background:var(--surface-2); cursor:pointer; padding:0;
}
.foto-item img{width:100%; height:100%; object-fit:cover; display:block}
.foto-tag{
  position:absolute; left:0; right:0; bottom:0; padding:14px 6px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.78)); color:#fff;
  font-size:.66rem; font-weight:600; text-align:left; line-height:1.25;
  font-family:"IBM Plex Mono",monospace;
}
/* Foto com etiqueta embaixo: a etiqueta é o produto final que vai para o
   relatório, então ela ocupa espaço de verdade e não é um rodapé sobre a imagem. */
/* Linha do tratamento: a linha inteira abre e fecha, porque no campo se toca
   com o polegar e uma seta de 12px não é alvo. */
.trat-abrir{
  display:flex; align-items:center; gap:9px; flex:1; min-width:0; cursor:pointer;
  padding:4px 2px; border-radius:var(--r-sm);
}
.trat-abrir:hover h3{color:var(--accent)}
.trat-abrir:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.trat-seta{color:var(--muted); flex:none; font-size:.9rem; transition:transform .15s}
.trat-seta.on{transform:rotate(90deg); color:var(--accent)}
@media(prefers-reduced-motion:reduce){ .trat-seta{transition:none} }

.foto-grade{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.foto-cartao{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column;
}
.foto-face{
  border:0; padding:0; background:var(--surface-2); cursor:pointer; display:block;
  width:100%; aspect-ratio:4/3;
}
.foto-face img{width:100%; height:100%; object-fit:cover; display:block}
/* O lugar da foto que ainda está no servidor: ocupa o mesmo espaço da imagem,
   para a grade não pular quando ela chegar. */
.foto-nuvem{display:flex; align-items:center; justify-content:center;
  width:100%; height:100%; background:var(--surface-3); color:var(--muted);
  font-size:1.1rem; letter-spacing:.05em}
.foto-face:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
/* A etiqueta usa a mesma fonte na tela e na imagem exportada, para o que se vê
   aqui ser o que sai no arquivo. */
.foto-etiq{
  padding:8px; font-size:.78rem; line-height:1.35; color:var(--ink-2);
  font-family:Calibri,Carlito,"Segoe UI",Roboto,sans-serif; word-break:break-word;
}
.lightbox{
  position:fixed; inset:0; z-index:100; background:rgba(10,12,8,.94);
  display:flex; flex-direction:column; padding:12px;
}
.lightbox img{flex:1; min-height:0; object-fit:contain; width:100%}
.lightbox-info{color:#E9EDDF; padding:12px 4px; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}

/* ---------- diversos ---------- */
.barra{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.barra i.w{background:var(--alerta)} .barra i.e{background:var(--erro)}

.salvo{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--muted); white-space:nowrap}
.ponto{width:7px; height:7px; border-radius:99px; background:var(--muted); flex:none}
.ponto.ok{background:var(--accent)} .ponto.pend{background:var(--alerta)} .ponto.err{background:var(--erro)}

.modal-fundo{position:fixed; inset:0; z-index:90; background:rgba(10,12,8,.55); display:flex; align-items:flex-end; justify-content:center; padding:0}
.modal{background:var(--surface); border-radius:var(--r) var(--r) 0 0; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:600px){
  .modal-fundo{align-items:center; padding:20px}
  .modal{border-radius:var(--r)}
}
.modal h2{margin-bottom:16px}

.aviso{padding:11px 13px; border-radius:var(--r-sm); font-size:.82rem; display:flex; gap:9px; align-items:flex-start; line-height:1.45}
.aviso-w{background:var(--alerta-soft); color:var(--alerta); border:1px solid var(--alerta)}
.aviso-i{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line)}
.aviso-e{background:var(--erro-soft); color:var(--erro); border:1px solid var(--erro)}

.protocolo{font-family:"Source Serif 4",Georgia,serif; font-size:1.02rem; line-height:1.65; max-width:66ch; white-space:pre-wrap}
.sec{display:flex; flex-direction:column; gap:12px; margin-bottom:26px}
.sec-cab{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:200; background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:99px;
  font-size:.85rem; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.3); max-width:90vw; text-align:center;
}
@media(prefers-reduced-motion:no-preference){
  .toast{animation:sobe .22s ease-out}
  @keyframes sobe{from{opacity:0; transform:translate(-50%,10px)}}
}
.fab{
  position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:50;
  border-radius:99px; box-shadow:0 4px 18px rgba(0,0,0,.22); padding:14px 22px; min-height:52px;
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media(max-width:520px){ .wrap{padding:14px 12px 96px} h1{font-size:1.3rem} }

<script>
"use strict";

/* ============================ ESTADO ============================ */
let ST = {experimentos:[], versao:1};
let TELA = {nome:"home", expId:null, aba:"protocolo", avId:null};
/* `leitura` fica falso para sempre: no app instalado quem abre é dono do caderno
   do próprio aparelho. O campo continua existindo porque a interface o consulta. */
let PERSIST = {pend:false, salvando:false, erro:null, leitura:false, ultimo:null};
let SYNC = {rodando:false, quando:null, erro:null};
let TIMER = null;
/* Para onde vai a próxima foto — preenchido antes de abrir a câmera, lido quando
   o arquivo volta. É o que liga o toque no tratamento à imagem que chega depois. */
let FOTO_ALVO = null;
/* Enquanto a câmera do celular está na frente, esta página fica em segundo plano.
   Salvar aí republica o documento e RECARREGA a view — e a foto volta para uma
   página nova, que não sabe mais de onde veio: perdia-se a primeira de cada duas.
   Com a câmera aberta, todo salvamento espera. */
let CAMERA_ABERTA = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function hoje(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dataBr(s){ if(!s) return "—"; const p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return Number.isFinite(n)?n:null; }
function fmt(n,d){ if(n==null||!Number.isFinite(n)) return "—"; return n.toLocaleString("pt-BR",{minimumFractionDigits:d==null?2:d, maximumFractionDigits:d==null?2:d}); }
function exp(){ return ST.experimentos.find(e=>e.id===TELA.expId) || null; }

/* Normaliza ensaios gravados por versões anteriores: um tratamento passou a ter
   vários produtos, o ensaio ganhou fatores, vazão e anotações livres. Roda na
   abertura, sem apagar nada do que já estava lá. */
function migrar(){
  if(!Array.isArray(ST.modelos)) ST.modelos = [];   // croquis reutilizáveis
  if(!Array.isArray(ST.grupos))  ST.grupos  = [];   // pastas por safra, cliente, cultura…
  (ST.experimentos||[]).forEach(e=>{
    if(typeof e.grupoId !== "string") e.grupoId = "";
    /* Carimbo de quando este ensaio mudou pela última vez: é por ele que a
       sincronização decide, ensaio a ensaio, qual versão é a boa. */
    if(typeof e.atualizado !== "string") e.atualizado = e.criado || "1970-01-01T00:00:00.000Z";
    if(typeof e.croquiTravado !== "boolean") e.croquiTravado = false;
    /* Aplicações: A, B, C… cada uma com o estádio em que foi feita. É o que liga
       a coluna "Aplicação" de cada produto ao momento real da pulverização. */
    if(!Array.isArray(e.aplicacoes)) e.aplicacoes = [];
    if(typeof e.aplicTravado !== "boolean") e.aplicTravado = false;
    /* Quadros de foto: cada um é uma saída a campo ("Altura de plantas — 45 DAE"),
       e dentro dele as fotos ficam agrupadas por tratamento. */
    if(!Array.isArray(e.sessoesFoto)) e.sessoesFoto = [];
    (e.fotos||[]).forEach(f=>{
      if(typeof f.sessaoId !== "string") f.sessaoId = "";
      if(!f.etiq || typeof f.etiq !== "object"){
        /* A legenda antiga vira o texto livre da etiqueta; o resto é montado
           a partir do tratamento e do quadro, e o usuário liga o que quiser. */
        f.etiq = {trat:true, prod:false, aval:true, data:true, texto:f.legenda||""};
        delete f.legenda;
      }
    });
    /* Esquema declarado pelo usuário. Em ensaios antigos ele é deduzido: quem já
       tinha fator estava em fatorial, o resto em simples. */
    if(e.esquema !== "simples" && e.esquema !== "fatorial")
      e.esquema = (e.fatores||[]).length ? "fatorial" : "simples";
    (e.avaliacoes||[]).forEach(av=>{
      if(typeof av.travada !== "boolean") av.travada = false;
    });
    if(e.vazao === undefined) e.vazao = "";
    if(e.teste === "fisher") e.teste = "t";          // renomeado
    if(!TESTES[e.teste]) e.teste = "tukey";
    if(!(e.alfa===0.01 || e.alfa===0.05 || e.alfa===0.10)) e.alfa = 0.05;
    if(typeof e.controle !== "number") e.controle = 0;
    if(typeof e.travado !== "boolean") e.travado = false;
    if(!Array.isArray(e.fatores)) e.fatores = [];
    if(!e.protocolo) e.protocolo = {objetivo:"", metodologia:"", observacoes:""};
    if(!Array.isArray(e.protocolo.anotacoes)) e.protocolo.anotacoes = [];
    (e.tratamentos||[]).forEach(t=>{
      if(!Array.isArray(t.produtos)){

          : [{id:uid(), nome:"", dose:"", unidade:"", aplicacao:""}];
        delete t.produto; delete t.dose; delete t.unidade;
      }
      t.produtos.forEach(p=>{
        if(typeof p.unidade   !== "string") p.unidade   = "";
        if(typeof p.aplicacao !== "string") p.aplicacao = "";
      });

    });

/* Texto de uma linha só com todos os produtos do tratamento, para as tabelas
   e para a exportação. */
function doseTexto(t){
  return (t.produtos||[])
    .map(p=>[p.nome, [p.dose,p.unidade].filter(Boolean).join(" ")].filter(Boolean).join(" "))
    .filter(Boolean).join(" + ");
}
/* Rótulos disponíveis para a coluna Aplicação: os que o ensaio definiu, mais as
   combinações de duas (AB, BC…) — é comum um adjuvante entrar em mais de uma. */
function rotulosAplicacao(e){
  const base = (e.aplicacoes||[]).map(a=>a.rotulo).filter(Boolean);
  const combos = [];
  for(let i=0;i<base.length;i++)
    for(let j=i+1;j<base.length;j++) combos.push(base[i]+base[j]);
  return base.concat(combos);
}
function aplicacoesTexto(e){
  return (e.aplicacoes||[])
    .filter(a=>a.rotulo)
    .map(a=>a.rotulo + (a.estadio ? " em "+a.estadio : "")
                     + (a.data ? " ("+dataBr(a.data)+")" : ""))
    .join(" · ");
}
/* Etiqueta da foto: montada na hora a partir do que o usuário mandou aparecer.
   Guardar só as chaves — e não o texto pronto — faz a etiqueta acompanhar as
   correções: renomeou o tratamento ou trocou a dose, a etiqueta segue certa. */
const ETIQ_PARTES = [
  ["aval", "Avaliação"], ["trat", "Tratamento"], ["prod", "Produtos"], ["data", "Data"]
];
function etiquetaTexto(e, f){
  const q = f.etiq || {};
  const t = e.tratamentos.find(x=>x.id===f.tratId);
  const s = (e.sessoesFoto||[]).find(x=>x.id===f.sessaoId);
  const partes = [];
  if(q.aval && s && s.titulo) partes.push(s.titulo);
  if(q.trat && t) partes.push("T"+t.num+(t.nome?" — "+t.nome:"")+(f.bloco?" · Bloco "+f.bloco:""));
  if(q.prod && t && doseTexto(t)) partes.push(doseTexto(t));
  if(q.data && f.data) partes.push(dataBr(f.data));
  if(q.texto) partes.push(q.texto);
  return partes.join(" · ");
}
function fatorTexto(e, t){
  return (e.fatores||[]).map(f=>{
    const n = (f.niveis||[]).find(x=>x.id===t.niveis[f.id]);
    return n ? n.nome : null;
  }).filter(Boolean).join(" × ");
}
/* Um ensaio só é analisado como fatorial quando os tratamentos cobrem
   exatamente todas as combinações dos níveis, uma vez cada. */
function ehFatorial(e){
  const f = (e.fatores||[]).filter(x=>(x.niveis||[]).length>=2);
  if(f.length < 2) return null;
  const combos = f.reduce((a,x)=>a*x.niveis.length, 1);
  if(combos !== e.tratamentos.length) return null;
  const vistos = new Set();
  for(const t of e.tratamentos){
    const chave = f.map(x=>t.niveis[x.id]||"").join("|");
    if(chave.split("|").some(v=>!v)) return null;   // tratamento sem nível definido
    if(vistos.has(chave)) return null;              // combinação repetida
    vistos.add(chave);
  }
  return f;
}

function qTukey(k, gl){
  if(k<2) return null;
  const col = Math.min(k,12) - 2;
  const gls = Object.keys(QTAB).map(Number).sort((a,b)=>a-b);
  if(gl<=1) return QTAB[1][col];
  let lo=gls[0], hi=gls[gls.length-1];
  for(let i=0;i<gls.length;i++){ if(gls[i]<=gl) lo=gls[i]; if(gls[i]>=gl){ hi=gls[i]; break; } }
  if(lo===hi) return QTAB[lo][col];
  const t = (gl-lo)/(hi-lo);
  return QTAB[lo][col] + t*(QTAB[hi][col]-QTAB[lo][col]);
}
// distribuição F -> p-valor, via função beta incompleta regularizada
function lnGama(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
           12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x)) - lnGama(1-x);
  x-=1; let a=0.99999999999980993, t=x+7.5;
  for(let i=0;i<8;i++) a+=g[i]/(x+i+1);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function betaCF(a,b,x){
  const FP=1e-300, EPS=3e-14; let qab=a+b, qap=a+1, qam=a-1;
  let c=1, d=1-qab*x/qap; if(Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for(let m=1;m<=300;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP) d=FP; c=1+aa/c; if(Math.abs(c)<FP) c=FP;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betaInc(a,b,x){
  if(x<=0) return 0; if(x>=1) return 1;
  const bt = Math.exp(lnGama(a+b)-lnGama(a)-lnGama(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betaCF(a,b,x)/a : 1-bt*betaCF(b,a,1-x)/b;
}
function pValorF(f, gl1, gl2){
  if(!Number.isFinite(f)||f<=0||gl1<=0||gl2<=0) return null;
  return Math.max(0, Math.min(1, betaInc(gl2/2, gl1/2, gl2/(gl2+gl1*f))));
}
// t de Student: valor crítico bicaudal, para a DMS de Fisher
function tCDF(t, gl){
  const p = 0.5*betaInc(gl/2, 0.5, gl/(gl+t*t));
  return t>0 ? 1-p : p;
}
function tCrit(alfa, gl){
  let lo=0, hi=200;
  for(let i=0;i<160;i++){
    const m=(lo+hi)/2;
    if(2*(1-tCDF(m,gl)) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
// gama incompleta regularizada, para o qui-quadrado do Scott-Knott
function gamaInc(s, x){
  if(x<=0 || s<=0) return 0;
  if(x < s+1){
    let soma=1/s, termo=soma;
    for(let n=1;n<300;n++){
      termo *= x/(s+n); soma += termo;
      if(Math.abs(termo) < Math.abs(soma)*1e-15) break;
    }
    return soma*Math.exp(-x + s*Math.log(x) - lnGama(s));
  }
  let b=x+1-s, c=1e300, d=1/b, h=d;
  for(let i=1;i<300;i++){
    const an=-i*(i-s);
    b+=2; d=an*d+b; if(Math.abs(d)<1e-300) d=1e-300;
    c=b+an/c;      if(Math.abs(c)<1e-300) c=1e-300;
    d=1/d; const del=d*c; h*=del;
    if(Math.abs(del-1)<1e-15) break;
  }
  return 1 - Math.exp(-x + s*Math.log(x) - lnGama(s))*h;
}
function quiCrit(alfa, gl){
  let lo=0, hi=2000;
  for(let i=0;i<200;i++){
    const m=(lo+hi)/2;
    if(1-gamaInc(gl/2, m/2) > alfa) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}

/* Médias dos níveis de um fator, comparadas com um erro específico. Em parcelas
   subdivididas cada fator tem o seu: o da parcela é testado contra o Erro(a) e o
   da subparcela contra o Erro(b) — usar um só para os dois falseia as letras. */
function mediasDoFator(f, trats, somaT, nRep, qmErro, glErro, nObs, teste, alfa){
  alfa = alfa||0.05;
  const soma={}, n={};
  f.niveis.forEach(nv=>{ soma[nv.id]=0; n[nv.id]=0; });
  trats.forEach((t,i)=>{
    const nv=t.niveis[f.id];
    if(soma[nv]===undefined) return;
    soma[nv]+=somaT[i]; n[nv]+=nRep;
  });
  const lst = f.niveis.map((nv,k)=>({i:k, nome:nv.nome, media: n[nv.id] ? soma[nv.id]/n[nv.id] : null}))
                      .filter(x=>x.media!=null).sort((a,b)=>b.media-a.media);
  const rep = nObs || n[f.niveis[0].id] || nRep;
  const ep = qmErro>=0 ? Math.sqrt(qmErro/rep) : null;
  let dms=null;
  if(teste==="fisher")      dms = qmErro>=0 ? tCrit(alfa,glErro)*Math.sqrt(2*qmErro/rep) : null;
  else if(teste==="duncan") dms = ep!=null ? rDuncan(alfa, 2, Math.round(glErro))*ep : null;
  else if(teste!=="sk"){
    const q = qCrit(alfa, f.niveis.length, Math.round(glErro));
    dms = (q!=null && ep!=null) ? q*ep : null;
  }
  if(teste==="sk"){
    const L = scottKnott(lst, qmErro, rep, glErro, alfa);
    lst.forEach(x=>{ x.letra = L[x.i] || "a"; });
  } else if(teste==="duncan" && ep!=null){
    const ls = letrasPorAmplitude(lst, p => rDuncan(alfa, p, Math.round(glErro))*ep);
    lst.forEach((x,k)=>{ x.letra = ls[k]; });
  } else if(dms!=null){
    const ls = letrasPorDMS(lst, dms);
    lst.forEach((x,k)=>{ x.letra = ls[k]; });
  }
  return {fator:f.nome||"Fator", dms, linhas:lst, soma, n};
}

/* ---- Distribuição da amplitude estudentizada, calculada por quadratura ----
   Tabelas impressas limitam o app ao que couber nelas (12 tratamentos, 5%).
   Integrando a distribuição, qualquer número de tratamentos e qualquer nível
   de significância saem do mesmo código — e o resultado é conferido contra a
   tabela clássica em `autoTeste()`. */
function phi(z){                                   // densidade normal padrão
  return 0.3989422804014327*Math.exp(-z*z/2);
}
function Phi(z){                                   // CDF normal (erro < 7.5e-8)
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = phi(z);
  const p = d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937
            + t*(-1.821255978 + t*1.330274429))));
  return z > 0 ? 1-p : p;
}
/* P(amplitude de k normais padrão ≤ w) */
function pAmplitude(w, k){
  if(w <= 0) return 0;
  const lo=-8, hi=8, n=72, h=(hi-lo)/n;
  let s = 0;
  for(let i=0;i<=n;i++){
    const z = lo + i*h;
    const dif = Phi(z) - Phi(z-w);
    const f = phi(z) * Math.pow(dif>0?dif:0, k-1);
    s += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, k*s*h/3);
}
/* P(amplitude estudentizada ≤ q) com `gl` graus de liberdade no resíduo */
function pTukeyDist(q, k, gl){
  if(q <= 0) return 0;
  if(!(gl > 0)) return pAmplitude(q, k);
  if(gl > 25000) return pAmplitude(q, k);
  // integra sobre s = sqrt(qui²/gl), cuja densidade se concentra perto de 1
  const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
  // com 1 ou 2 graus de liberdade a cauda é longuíssima e precisa de mais alcance
  const larg = (gl<3 ? 40 : 12)/Math.sqrt(gl);
  const lo = Math.max(1e-7, 1-larg), hi = 1+larg;
  // e a malha acompanha a largura, senão o passo fica grosso demais
  const n = 2*Math.ceil(Math.max(28, (hi-lo)*16)), h = (hi-lo)/n;
  let acc = 0;
  for(let i=0;i<=n;i++){
    const s = lo + i*h;
    const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
    const f = dens * pAmplitude(q*s, k);
    acc += (i===0||i===n ? 1 : (i%2 ? 4 : 2)) * f;
  }
  return Math.min(1, acc*h/3);
}
/* q crítico: valor com P(Q ≤ q) = 1-alfa */
const _cacheQ = {};
function qCrit(alfa, k, gl){
  if(k < 2) return null;
  const chave = alfa+"|"+k+"|"+Math.round(gl);
  if(_cacheQ[chave] != null) return _cacheQ[chave];
  let lo = 0.1, hi = 200;
  for(let i=0;i<32;i++){
    const m = (lo+hi)/2;
    if(pTukeyDist(m, k, gl) < 1-alfa) lo = m; else hi = m;
  }
  return _cacheQ[chave] = (lo+hi)/2;
}
/* Duncan: amplitude estudentizada num nível protegido, alfa_p = 1−(1−alfa)^(p−1).
   Com poucos graus de liberdade a integral passa a DECRESCER com p — exigir menos
   para comparar médias mais distantes, o que não faz sentido. A tabela clássica
   satura nesse ponto; o máximo acumulado reproduz esse comportamento. */
const _cacheDun = {};
function rDuncan(alfa, p, gl){
  if(p < 2) return null;
  const chave = alfa+"|"+p+"|"+Math.round(gl);
  if(_cacheDun[chave] != null) return _cacheDun[chave];
  let mx = 0;
  for(let j=2;j<=p;j++){
    const v = qCrit(1-Math.pow(1-alfa, j-1), j, gl);
    if(v > mx) mx = v;
  }
  return _cacheDun[chave] = mx;
}

/* Dunnett: todos os tratamentos contra UMA testemunha. As m comparações
   dividem o mesmo controle, o que as correlaciona (ρ = ½); ignorar isso e
   usar o t comum daria mais diferenças significativas do que existem. */
const _cacheD = {};
function dDunnett(alfa, m, gl, bilateral){
  if(m < 1) return null;
  const chave = alfa+"|"+m+"|"+Math.round(gl)+"|"+(bilateral?"2":"1");
  if(_cacheD[chave] != null) return _cacheD[chave];
  const R2 = Math.SQRT2;
  const prob = d => {                       // P(max|T| ≤ d)
    const lnC = (gl/2)*Math.log(gl) - lnGama(gl/2) - (gl/2-1)*Math.LN2;
    const larg = 12/Math.sqrt(gl);
    const slo = Math.max(1e-7, 1-larg), shi = 1+larg, ns = 48, hs = (shi-slo)/ns;
    let out = 0;
    for(let i=0;i<=ns;i++){
      const s = slo + i*hs;
      const dens = Math.exp(lnC + (gl-1)*Math.log(s) - gl*s*s/2);
      // ∫ φ(u) [Φ(u+√2·d·s) − Φ(u−√2·d·s)]^m du   (bilateral)
      const lo=-8, hi=8, nu=64, hu=(hi-lo)/nu;
      let inner = 0;
      for(let j=0;j<=nu;j++){
        const u = lo + j*hu;
        const w = R2*d*s;
        const dif = bilateral ? (Phi(u+w) - Phi(u-w)) : Phi(u+w);
        const f = phi(u) * Math.pow(dif>0?dif:0, m);
        inner += (j===0||j===nu ? 1 : (j%2 ? 4 : 2)) * f;
      }
      out += (i===0||i===ns ? 1 : (i%2 ? 4 : 2)) * dens * (inner*hu/3);
    }
    return Math.min(1, out*hs/3);
  };
  let lo = 0.1, hi = 60;
  for(let i=0;i<30;i++){
    const md = (lo+hi)/2;
    if(prob(md) < 1-alfa) lo = md; else hi = md;
  }
  return _cacheD[chave] = (lo+hi)/2;
}

function zDuncan(p, gl){
  if(p < 2) return null;
  const col = Math.min(p,10) - 2;
  const gls = Object.keys(DTAB).map(Number).sort((a,b)=>a-b);
  if(gl<=1) return DTAB[1][col];
  let lo=gls[0], hi=gls[gls.length-1];
  for(let i=0;i<gls.length;i++){ if(gls[i]<=gl) lo=gls[i]; if(gls[i]>=gl){ hi=gls[i]; break; } }
  if(lo===hi) return DTAB[lo][col];
  const t=(gl-lo)/(hi-lo);
  return DTAB[lo][col] + t*(DTAB[hi][col]-DTAB[lo][col]);
}

/* Letras quando o valor crítico DEPENDE de quantas médias a comparação abrange
   (Duncan). Como as médias estão ordenadas, o par mais distante de um grupo é
   o par das pontas: basta testá-lo para saber se o grupo se sustenta. */
function letrasPorAmplitude(ord, critDeP){
  const n = ord.length, grupos = [];
  const difere = (i,j) => (ord[i].media - ord[j].media) > critDeP(j-i+1);
  for(let i=0;i<n;i++){
    let j=i;
    while(j+1<n && !difere(i,j+1)) j++;
    if(!grupos.length || j>grupos[grupos.length-1][1]) grupos.push([i,j]);
  }
  const letras = new Array(n).fill("");
  grupos.forEach((g,gi)=>{
    const L=String.fromCharCode(97+gi);
    for(let k=g[0];k<=g[1];k++) letras[k]+=L;
  });
  return letras;
}

/* Letras a partir de grupos contíguos sobre médias ordenadas — a mesma regra
   serve para Tukey e para a DMS de Fisher, mudando só o valor da diferença. */
function letrasPorDMS(ord, dms){
  const grupos=[];
  for(let i=0;i<ord.length;i++){
    let j=i;
    while(j+1<ord.length && (ord[i].media-ord[j+1].media)<=dms) j++;
    if(!grupos.length || j>grupos[grupos.length-1][1]) grupos.push([i,j]);
  }
  const letras = new Array(ord.length).fill("");
  grupos.forEach((g,gi)=>{
    const L=String.fromCharCode(97+gi);
    for(let k=g[0];k<=g[1];k++) letras[k]+=L;
  });
  return letras;
}

/* Scott-Knott: parte o conjunto de médias em dois grupos pela divisão que
   maximiza a soma de quadrados entre grupos, testa a divisão por razão de
   verossimilhança e repete em cada metade. Ao contrário de Tukey e Fisher,
   não produz grupos sobrepostos — cada média cai em exatamente um grupo. */
function scottKnott(medias, qmRes, nRep, glRes, alfa){
  const k0 = medias.length;
  const varMedias = (()=>{
    const m = medias.reduce((a,x)=>a+x.media,0)/k0;
    return medias.reduce((a,x)=>a+(x.media-m)*(x.media-m),0);
  })();
  // estimativa combinada da variância das médias
  const sigma2 = (varMedias + glRes*(qmRes/nRep)) / (k0 + glRes);
  const grupos = [];
  (function partir(lista){
    if(lista.length === 1){ grupos.push(lista); return; }
    const k = lista.length;
    const total = lista.reduce((a,x)=>a+x.media,0);
    let melhor=-Infinity, corte=-1, s1=0;
    for(let i=0;i<k-1;i++){
      s1 += lista[i].media;
      const n1=i+1, n2=k-n1, s2=total-s1;
      const B0 = s1*s1/n1 + s2*s2/n2 - total*total/k;
      if(B0 > melhor){ melhor=B0; corte=i; }
    }
    const lambda = sigma2>0 ? (Math.PI/(2*(Math.PI-2))) * (melhor/sigma2) : 0;
    const glL = k/(Math.PI-2);
    if(lambda > quiCrit(alfa, glL)){
      partir(lista.slice(0,corte+1));
      partir(lista.slice(corte+1));
    } else grupos.push(lista);
  })(medias.slice().sort((a,b)=>b.media-a.media));

  const letras = {};
  grupos.sort((a,b)=>b[0].media-a[0].media).forEach((g,gi)=>{
    const L = String.fromCharCode(97+gi);
    g.forEach(x=>{ letras[x.i] = L; });
  });
  return letras;
}

/* A descrição diz o que cada teste FAZ com os resultados, não como ele se chama
   na literatura: quem escolhe aqui quer saber quantas letras vai ver e o quanto
   pode confiar nelas. "Conservador" e "rigoroso" são a mesma ideia — exigir uma
   diferença maior antes de dizer que dois tratamentos diferem. */
const TESTES = {
  tukey:   {nome:"Tukey",
            desc:"exige diferença grande para separar duas médias: erra pouco para mais, "
               + "mas deixa passar diferença pequena que é real. É o padrão em publicação."},
  duncan:  {nome:"Duncan",
            desc:"exige menos que o Tukey e separa mais tratamentos — encontra diferença "
               + "pequena, ao custo de mais risco de apontar diferença que não existe."},
  t:       {nome:"t (DMS)",
            desc:"o menos exigente de todos: separa o máximo, e é o que mais aponta "
               + "diferença que não existe. Bom para explorar, arriscado para concluir."},
  dunnett: {nome:"Dunnett",
            desc:"compara cada tratamento só com a testemunha, e não os tratamentos "
               + "entre si. É o teste de quem quer saber “funcionou ou não?”."},
  sk:      {nome:"Scott-Knott",
            desc:"forma grupos que não se sobrepõem: cada média cai em um grupo só, "
               + "sem aquele “ab” que não deixa concluir nada."}
};
const ALFAS = {"0.01":"1%", "0.05":"5%", "0.10":"10%"};
function alfaDe(e){
  const a = Number(e && e.alfa);
  return (a===0.01 || a===0.05 || a===0.10) ? a : 0.05;
}
function alfaTexto(a){ return ALFAS[String(a)] || (a*100)+"%"; }

/**
 * ANOVA para delineamento em blocos casualizados (DBC) e inteiramente
 * casualizado (DIC), com teste de Tukey a 5%.
 * dados: matriz [tratamento][bloco] com null onde falta valor.
 */
/**
 * Decompõe a soma de quadrados de tratamentos em efeitos principais e interação.
 * `fat` são os fatores validados por ehFatorial; `trats` traz os níveis de cada
 * tratamento. Retorna as linhas extras do quadro, ou null se não for fatorial.
 */
function decompor(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa){
  alfa = alfa||0.05;
  if(!fat) return null;
  const linhas = [], medias = [];
  let sqEfeitos = 0, glEfeitos = 0;
  fat.forEach(f=>{
    const soma = {}, n = {};
    f.niveis.forEach(nv=>{ soma[nv.id]=0; n[nv.id]=0; });
    trats.forEach((t,i)=>{
      const nv = t.niveis[f.id];
      if(soma[nv]===undefined) return;
      soma[nv] += somaT[i]; n[nv] += nRep;
    });
    const sq = f.niveis.reduce((a,nv)=> a + (n[nv.id] ? soma[nv.id]*soma[nv.id]/n[nv.id] : 0), 0) - C;
    const gl = f.niveis.length - 1;
    sqEfeitos += sq; glEfeitos += gl;
    const qm = sq/gl, F = qmRes>0 ? qm/qmRes : null;
    linhas.push({nome:f.nome||"Fator", gl, sq, qm, f:F, p:pValorF(F,gl,glRes), nivel:1});

    // médias de cada nível, comparadas pelo mesmo teste escolhido no ensaio
    const rep = n[f.niveis[0].id] || nRep;
    const lst = f.niveis.map((nv,k)=>({i:k, nome:nv.nome, media: n[nv.id] ? soma[nv.id]/n[nv.id] : null}))
                        .filter(x=>x.media!=null).sort((a,b)=>b.media-a.media);
    let dms = null;
    if(teste === "fisher")      dms = qmRes>=0 ? tCrit(alfa,glRes)*Math.sqrt(2*qmRes/rep) : null;
    else if(teste !== "sk"){
      const q = qCrit(alfa, f.niveis.length, Math.round(glRes));
      dms = (q!=null && qmRes>=0) ? q*Math.sqrt(qmRes/rep) : null;
    }
    if(teste === "sk"){
      const L = scottKnott(lst, qmRes, rep, glRes, alfa);
      lst.forEach(x=>{ x.letra = L[x.i] || "a"; });
    } else if(dms!=null){
      const ls = letrasPorDMS(lst, dms);
      lst.forEach((x,k)=>{ x.letra = ls[k]; });
    }
    medias.push({fator:f.nome||"Fator", dms, linhas:lst});
  });

  // interação: o que sobra da SQ de tratamentos depois dos efeitos principais
  const sqInt = sqTrat - sqEfeitos;
  const glInt = fat.reduce((a,f)=>a*(f.niveis.length-1), 1);
  if(glInt > 0){
    const qm = sqInt/glInt, F = qmRes>0 ? qm/qmRes : null;
    linhas.push({nome: fat.map(f=>f.nome||"Fator").join(" × "), gl:glInt, sq:sqInt, qm,
                 f:F, p:pValorF(F,glInt,glRes), nivel:1, interacao:true});
  }
  return {linhas, medias, glInt, pInt: glInt>0 && qmRes>0 ? pValorF((sqInt/glInt)/qmRes, glInt, glRes) : null};
}

function anova(dados, nTrat, nRep, delin, fat, trats, tst, col, alfa, ctrl){
  alfa = (alfa===0.01||alfa===0.05||alfa===0.10) ? alfa : 0.05;
  const obs=[], somaT=new Array(nTrat).fill(0), nT=new Array(nTrat).fill(0);
  const somaB=new Array(nRep).fill(0), nB=new Array(nRep).fill(0);
  let soma=0, somaQ=0, N=0;
  for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
    const v = dados[t] && dados[t][b];
    if(v==null) continue;
    obs.push(v); soma+=v; somaQ+=v*v; N++;
    somaT[t]+=v; nT[t]++; somaB[b]+=v; nB[b]++;
  }
  const total = nTrat*nRep;
  if(N<total) return {erro:"faltam", faltando:total-N, preenchidos:N, total:total};
  if(nTrat<2) return {erro:"poucos_trat"};
  if(nRep<2) return {erro:"poucas_rep"};

  const comBloco = delin==="DBC" || delin==="DQL" || delin==="SPLIT";
  const C = soma*soma/N;
  const sqTotal = somaQ - C;
  const sqTrat = somaT.reduce((a,s)=>a+s*s,0)/nRep - C;
  const sqBloco = comBloco ? somaB.reduce((a,s)=>a+s*s,0)/nTrat - C : 0;

  /* Quadrado latino: além das linhas (os blocos), uma segunda restrição de
     casualização — as colunas — sai do resíduo. A coluna de cada parcela vem
     do croqui; sem ele o delineamento não pode ser analisado. */
  let sqColuna = 0, glColuna = 0;
  if(delin==="DQL"){
    if(nTrat !== nRep) return {erro:"dql_desbalanceado", nTrat, nRep};
    if(!col) return {erro:"dql_sem_croqui"};
    const somaC = new Array(nTrat).fill(0), nC = new Array(nTrat).fill(0);
    // visto[t][c]: o tratamento t já apareceu na coluna c?
    const visto = Array.from({length:nTrat}, ()=>new Array(nTrat).fill(0));
    for(let t=0;t<nTrat;t++){
      const colsDoTrat = new Set();
      for(let b=0;b<nRep;b++){
        const v = dados[t] && dados[t][b]; if(v==null) continue;
        const c = col[t] && col[t][b];
        if(c==null || !Number.isFinite(c) || c<0 || c>=nTrat) return {erro:"dql_croqui_incompleto"};
        if(colsDoTrat.has(c)) return {erro:"dql_croqui_invalido"};  // repetiu coluna na mesma linha
        colsDoTrat.add(c);
        visto[t][c]++; somaC[c]+=v; nC[c]++;
      }
    }
    // cada tratamento uma vez em cada coluna
    for(let t=0;t<nTrat;t++) for(let c=0;c<nTrat;c++)
      if(visto[t][c] !== 1) return {erro:"dql_croqui_invalido"};
    // e cada célula (linha, coluna) ocupada por exatamente um tratamento
    const celula = Array.from({length:nRep}, ()=>new Array(nTrat).fill(0));
    for(let t=0;t<nTrat;t++) for(let b=0;b<nRep;b++){
      const c = col[t][b];
      if(++celula[b][c] > 1) return {erro:"dql_croqui_invalido"};
    }
    if(nC.some(x=>x!==nTrat)) return {erro:"dql_croqui_invalido"};
    sqColuna = somaC.reduce((a,s)=>a+s*s,0)/nTrat - C;
    glColuna = nTrat-1;
  }

  const glTrat = nTrat-1;
  const glBloco = comBloco ? nRep-1 : 0;
  const sqRes = sqTotal - sqTrat - sqBloco - sqColuna;
  const glRes = delin==="DQL" ? (nTrat-1)*(nTrat-2)
              : comBloco     ? glTrat*glBloco
              :                N-nTrat;
  const glTotal = N-1;
  if(glRes<1) return {erro:"sem_gl"};

  const qmTrat=sqTrat/glTrat, qmRes=sqRes/glRes;
  const qmBloco = glBloco>0 ? sqBloco/glBloco : null;
  const fTrat = qmRes>0 ? qmTrat/qmRes : null;
  const fBloco = (qmBloco!=null && qmRes>0) ? qmBloco/qmRes : null;
  const media = soma/N;
  const cv = media!==0 && qmRes>=0 ? 100*Math.sqrt(qmRes)/Math.abs(media) : null;

  const medias = somaT.map((s,i)=>({i, media:s/nRep}));
  const teste = TESTES[tst] ? tst : "tukey";
  const glR = Math.round(glRes);
  const erroPad = qmRes>=0 ? Math.sqrt(qmRes/nRep) : null;   // erro padrão da média
  const q = qCrit(alfa, nTrat, glR);
  let dms = null, critNome = "", critValor = null;
  if(teste === "tukey"){
    dms = (q!=null && erroPad!=null) ? q*erroPad : null;
    critNome = "q("+nTrat+", "+glR+")"; critValor = q;
  } else if(teste === "t"){
    const t = tCrit(alfa, glRes);
    dms = qmRes>=0 ? t*Math.sqrt(2*qmRes/nRep) : null;
    critNome = "t("+glR+")"; critValor = t;
  } else if(teste === "duncan"){
    dms = erroPad!=null ? rDuncan(alfa, 2, glR)*erroPad : null;   // p=2 separa vizinhos
    critNome = "r(2…"+nTrat+", "+glR+")"; critValor = rDuncan(alfa, nTrat, glR);
  } else if(teste === "dunnett"){
    const d = dDunnett(alfa, Math.max(1,nTrat-1), glRes, true);
    dms = qmRes>=0 ? d*Math.sqrt(2*qmRes/nRep) : null;
    critNome = "d("+(nTrat-1)+", "+glR+")"; critValor = d;
  }

  const ord = medias.slice().sort((a,b)=>b.media-a.media);
  const letras = new Array(nTrat).fill("");
  let dunnett = null;
  if(teste === "dunnett"){
    /* Dunnett não agrupa: compara cada tratamento com a testemunha. O índice do
       controle vem do ensaio; sem escolha, o tratamento 1. */
    const iCtrl = (ctrl!=null && ctrl>=0 && ctrl<nTrat) ? ctrl : 0;
    const mCtrl = medias[iCtrl].media;
    dunnett = {iCtrl, dms, linhas: medias.map(m=>({
      i:m.i, media:m.media, dif:m.media-mCtrl,
      difere: m.i!==iCtrl && dms!=null && Math.abs(m.media-mCtrl) > dms
    }))};
    medias.forEach(m=>{
      letras[m.i] = m.i===iCtrl ? "—"
        : (dms!=null && Math.abs(m.media-mCtrl)>dms ? "*" : "ns");
    });
  } else if(teste === "sk"){
    const L = scottKnott(medias, qmRes, nRep, glRes, alfa);
    medias.forEach(m=>{ letras[m.i] = L[m.i] || "a"; });
  } else if(teste === "duncan" && erroPad != null){
    const ls = letrasPorAmplitude(ord, p => rDuncan(alfa, p, glR)*erroPad);
    ord.forEach((o,k)=>{ letras[o.i] = ls[k]; });
  } else if(dms != null){
    const ls = letrasPorDMS(ord, dms);
    ord.forEach((o,k)=>{ letras[o.i] = ls[k]; });
  }
  /* Parcelas subdivididas: o fator da parcela é testado contra o Erro(a)
     — a variação entre parcelas dentro de bloco — e não contra o resíduo
     geral. Testar tudo contra o mesmo denominador infla a significância
     do fator da parcela, que é o erro clássico neste delineamento. */
  let split = null;
  if(delin === "SPLIT" && fat && fat.length === 2){
    const [fA, fB] = fat;
    const a = fA.niveis.length, b = fB.niveis.length;
    const sBA = {};                                   // somas por (bloco, nível de A)
    for(let t=0;t<nTrat;t++) for(let bl=0;bl<nRep;bl++){
      const v = dados[t][bl]; if(v==null) continue;
      const k = bl+"|"+trats[t].niveis[fA.id];
      sBA[k] = (sBA[k]||0) + v;
    }
    const sqBA = Object.values(sBA).reduce((s,x)=>s+x*x,0)/b - C;
    const somaA = {};
    trats.forEach((t,i)=>{ const nv=t.niveis[fA.id]; somaA[nv]=(somaA[nv]||0)+somaT[i]; });
    const sqA = Object.values(somaA).reduce((s,x)=>s+x*x,0)/(nRep*b) - C;
    const sqErroA = sqBA - sqBloco - sqA;
    const glA = a-1, glErroA = (nRep-1)*(a-1);
    const glErroB = a*(nRep-1)*(b-1);
    const sqErroB = sqTotal - sqBloco - sqA - sqErroA - (sqTrat - sqA);
    const qmErroA = glErroA>0 ? sqErroA/glErroA : null;
    const qmErroB = glErroB>0 ? sqErroB/glErroB : null;
    split = {fA, fB, a, b, sqA, glA, sqErroA, glErroA, qmErroA,
             sqErroB, glErroB, qmErroB, sqBA};
  }

  const dec = decompor(fat, trats, somaT, nRep, C, sqTrat, glRes, qmRes, teste, alfa);

  if(split){
    const F = (qm,gl,qme,gle) => qme>0 ? {f:qm/qme, p:pValorF(qm/qme, gl, gle)} : {f:null,p:null};
    const qmA = split.sqA/split.glA;
    const sqAB = sqTrat - split.sqA - (dec ? dec.linhas.find(l=>!l.interacao && l.nome!==(split.fA.nome||"Fator"))?.sq ?? 0 : 0);
    const sqB = dec ? (dec.linhas.find(l=>l.nome===(split.fB.nome||"Fator"))||{}).sq : null;
    const sqInt = sqTrat - split.sqA - (sqB||0);
    const glB = split.b-1, glInt = (split.a-1)*(split.b-1);
    const rA = F(qmA, split.glA, split.qmErroA, split.glErroA);
    const rB = F(sqB/glB, glB, split.qmErroB, split.glErroB);
    const rI = F(sqInt/glInt, glInt, split.qmErroB, split.glErroB);

    // cada fator comparado com o seu próprio erro
    const mA = mediasDoFator(split.fA, trats, somaT, nRep, split.qmErroA, split.glErroA,
                             nRep*split.b, teste, alfa);
    const mB = mediasDoFator(split.fB, trats, somaT, nRep, split.qmErroB, split.glErroB,
                             nRep*split.a, teste, alfa);
    // letras dos tratamentos: Erro(b), com os GL do Erro(b)
    const epS = split.qmErroB>=0 ? Math.sqrt(split.qmErroB/nRep) : null;
    let dmsS = null;
    if(teste==="fisher")      dmsS = tCrit(alfa,split.glErroB)*Math.sqrt(2*split.qmErroB/nRep);
    else if(teste==="duncan") dmsS = epS!=null ? rDuncan(alfa, 2, Math.round(split.glErroB))*epS : null;
    else if(teste!=="sk"){
      const qs = qCrit(alfa, nTrat, Math.round(split.glErroB));
      dmsS = (qs!=null && epS!=null) ? qs*epS : null;
    }
    const letrasS = new Array(nTrat).fill("");
    if(teste==="sk"){
      const L = scottKnott(medias, split.qmErroB, nRep, split.glErroB, alfa);
      medias.forEach(m=>{ letrasS[m.i] = L[m.i] || "a"; });
    } else if(teste==="duncan" && epS!=null){
      const ls = letrasPorAmplitude(ord, p => rDuncan(alfa, p, Math.round(split.glErroB))*epS);
      ord.forEach((o,k)=>{ letrasS[o.i] = ls[k]; });
    } else if(dmsS!=null){
      const ls = letrasPorDMS(ord, dmsS);
      ord.forEach((o,k)=>{ letrasS[o.i] = ls[k]; });
    }
    const critS = teste==="tukey"  ? {n:"q("+nTrat+", "+split.glErroB+")", v:qCrit(alfa, nTrat, Math.round(split.glErroB))}
                : teste==="fisher" ? {n:"t("+split.glErroB+")", v:tCrit(alfa,split.glErroB)}
                : teste==="duncan" ? {n:"r(2…"+nTrat+", "+split.glErroB+")",
                                      v:rDuncan(alfa, nTrat, Math.round(split.glErroB))}
                : {n:"", v:null};
    return {
      ok:true, delin, N, media, glRes:split.glErroB, teste,
      critNome:critS.n, critValor:critS.v,
      cv: media!==0 ? 100*Math.sqrt(split.qmErroB)/Math.abs(media) : null,
      cvA: media!==0 ? 100*Math.sqrt(split.qmErroA)/Math.abs(media) : null,
      dms: dmsS, q,
      fatorial: {linhas:[], medias:[mA,mB], glInt, pInt:rI.p},
      split:true,
      fonte:[
        {nome:"Blocos", gl:glBloco, sq:sqBloco, qm:qmBloco},
        {nome:split.fA.nome||"Fator A (parcela)", gl:split.glA, sq:split.sqA, qm:qmA,
         f:rA.f, p:rA.p, destaque:true},
        {nome:"Erro (a)", gl:split.glErroA, sq:split.sqErroA, qm:split.qmErroA},
        {nome:split.fB.nome||"Fator B (subparcela)", gl:glB, sq:sqB, qm:sqB/glB,
         f:rB.f, p:rB.p, destaque:true},
        {nome:(split.fA.nome||"A")+" × "+(split.fB.nome||"B"), gl:glInt, sq:sqInt, qm:sqInt/glInt,
         f:rI.f, p:rI.p},
        {nome:"Erro (b)", gl:split.glErroB, sq:split.sqErroB, qm:split.qmErroB},
        {nome:"Total", gl:glTotal, sq:sqTotal}
      ],
      medias: medias.map(m=>({i:m.i, media:m.media, letra:letrasS[m.i]})),
      p: rB.p
    };
  }

  return {
    ok:true, delin, N, media, cv, dms, q, glRes, fatorial: dec, teste, critNome, critValor, alfa, dunnett,
    fonte:[
      comBloco ? {nome: delin==="DQL"?"Linhas":"Blocos", gl:glBloco, sq:sqBloco, qm:qmBloco,
                  f:fBloco, p:pValorF(fBloco,glBloco,glRes)} : null,
      delin==="DQL" ? {nome:"Colunas", gl:glColuna, sq:sqColuna, qm:sqColuna/glColuna,
                       f: qmRes>0 ? (sqColuna/glColuna)/qmRes : null,
                       p: qmRes>0 ? pValorF((sqColuna/glColuna)/qmRes, glColuna, glRes) : null} : null,
      {nome:"Tratamentos", gl:glTrat, sq:sqTrat, qm:qmTrat, f:fTrat, p:pValorF(fTrat,glTrat,glRes), destaque:true},
      ...(dec ? dec.linhas : []),
      {nome:"Resíduo", gl:glRes, sq:sqRes, qm:qmRes},
      {nome:"Total", gl:glTotal, sq:sqTotal}
    ].filter(Boolean),
    medias: medias.map(m=>({i:m.i, media:m.media, letra:letras[m.i]})),
    p: pValorF(fTrat,glTrat,glRes)
  };
}
function classeCV(cv){
  if(cv==null) return {t:"—", c:""};
  if(cv<10) return {t:"baixo", c:"pill-a"};
  if(cv<20) return {t:"médio", c:""};
  if(cv<30) return {t:"alto", c:"pill-w"};
  return {t:"muito alto", c:"pill-e"};
}

/* ============================ ARMAZENAMENTO LOCAL ============================ */
/* IndexedDB, e não a página: aqui o caderno mora no aparelho. Gravar é local e
   instantâneo — não recarrega a tela, não depende de sinal, e o teto deixa de
   ser 11 MB para ser o espaço livre do celular (centenas de MB, na prática). */
/* Versão do programa, à vista na tela de sincronização. Serve para saber se os
   três aparelhos estão na mesma — sem isso, "atualizei?" vira adivinhação. */
const VERSAO_APP = "2026-09-01 · 4";

const BD_NOME = "caderneta-campo", BD_LOJA = "estado";
let BD = null;
function abrirBD(){
  return new Promise((ok, err)=>{
    const r = indexedDB.open(BD_NOME, 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore(BD_LOJA); };
    r.onsuccess = ()=>ok(r.result);
    r.onerror   = ()=>err(r.error);
  });
}
async function lerLocal(){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const p = BD.transaction(BD_LOJA, "readonly").objectStore(BD_LOJA).get("caderno");
    p.onsuccess = ()=>ok(p.result || null);
    p.onerror   = ()=>err(p.error);
  });
}
async function gravarLocal(dados){
  if(!BD) BD = await abrirBD();
  return new Promise((ok, err)=>{
    const tx = BD.transaction(BD_LOJA, "readwrite");
    tx.objectStore(BD_LOJA).put(dados, "caderno");
    tx.oncomplete = ()=>ok();
    tx.onerror    = ()=>err(tx.error);
  });
}

function tamanhoEstimado(){
  let bytes = 0;
  try{ bytes = new Blob([JSON.stringify(ST)]).size; }catch(e){ bytes = JSON.stringify(ST).length; }
  return bytes;
}
/* Quota real do aparelho, perguntada ao navegador. Enquanto a resposta não vem,
   assume-se um valor conservador para a barra não mentir para mais. */
let QUOTA = 512*1024*1024;
if(navigator.storage && navigator.storage.estimate){
  navigator.storage.estimate().then(x=>{ if(x && x.quota) QUOTA = x.quota; }).catch(()=>{});
}
function limiteBytes(){ return QUOTA; }
function mb(b){
  return b >= 1073741824 ? (b/1073741824).toFixed(1).replace(".",",")+" GB"
                         : (b/1048576).toFixed(0)+" MB";
}
const BYTES_THUMB = 16*1024, BYTES_LEITURA = 138*1024;
/* Com o espaço do aparelho não há mais por que degradar foto: todas ficam com a
   versão ampliada. A função continua existindo porque o resto do app pergunta. */
function guardarVersaoLeitura(){ return tamanhoEstimado() < 0.9*limiteBytes(); }
function fotosQueAindaCabem(){
  const livre = Math.max(0, limiteBytes() - tamanhoEstimado());
  const n = Math.floor(livre/(BYTES_THUMB+BYTES_LEITURA));
  return {ampliadas:n, miniaturas:0, total:n};
}
function bytesLiberaveis(){
  let b = 0;
  ST.experimentos.forEach(e=>e.fotos.forEach(f=>{ if(f.media) b += Math.round(f.media.length*3/4); }));
  return b;
}
function liberarEspaco(){
  let n = 0;
  ST.experimentos.forEach(e=>e.fotos.forEach(f=>{ if(f.media){ delete f.media; n++; } }));
  if(n) marcarSujo();
  return n;
}

/* ============================ GRAVAR E SINCRONIZAR ============================ */
/* Gravar é sempre local e imediato — é o que faz o app servir no meio da lavoura
   sem sinal. Sincronizar é outra coisa, que acontece quando dá, e nunca segura
   quem está digitando. */
/* Grupos e modelos de croqui não pertencem a nenhum ensaio: viajam num documento
   à parte, com o seu próprio carimbo. */
function marcarGerais(){
  ST.atualizadoGerais = new Date().toISOString();
  marcarSujo();
}
function marcarSujo(){
  PERSIST.pend = true; PERSIST.erro = null;
  const e = exp();
  if(e) e.atualizado = new Date().toISOString();   // carimbo por ensaio: é a chave da mesclagem
  atualizarStatus();
  clearTimeout(TIMER); TIMER = setTimeout(salvar, 600);
}
async function salvar(){
  clearTimeout(TIMER);
  if(PERSIST.salvando || !PERSIST.pend) return;
  PERSIST.salvando = true; atualizarStatus();
  try{
    await gravarLocal(JSON.parse(JSON.stringify(ST)));
    PERSIST.pend = false; PERSIST.erro = null; PERSIST.ultimo = new Date();
  }catch(err){
    PERSIST.erro = (err && err.name === "QuotaExceededError")
      ? "Sem espaço no aparelho. Libere as versões ampliadas das fotos."
      : "Não consegui gravar no aparelho.";
  }
  PERSIST.salvando = false; atualizarStatus();
  if(PERSIST.pendSync !== false) agendarSync();
}
window.addEventListener("beforeunload", ()=>{ if(PERSIST.pend) salvar(); });
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden" && PERSIST.pend) salvar();
});

/* ---- Supabase, pela API REST ---- */
/* Sem biblioteca externa de propósito: um app que precisa abrir offline não pode
   depender de um arquivo que vem da internet toda vez. São três chamadas HTTP. */
function syncConfig(){ return (ST.sync && ST.sync.url && ST.sync.chave) ? ST.sync : null; }
function syncPronto(){ const c = syncConfig(); return !!(c && c.token); }

async function supa(caminho, opc){
  const c = syncConfig();
  if(!c) throw new Error("sem configuração");
  const cab = {apikey:c.chave, "Content-Type":"application/json"};
  if(c.token) cab.Authorization = "Bearer "+c.token;
  const r = await fetch(c.url.replace(/\/+$/,"")+caminho,
    Object.assign({}, opc, {headers: Object.assign(cab, (opc||{}).headers||{})}));
  if(!r.ok){
    const txt = await r.text().catch(()=>"");
    const e = new Error(txt || ("HTTP "+r.status)); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}

/* ---- Fotos no Storage ----
   A foto NÃO viaja dentro do ensaio. Se viajasse, cada aparelho baixaria o
   acervo inteiro a cada sincronização — inclusive os de quem nunca abre foto.
   Aqui ela sobe uma vez para o balde `fotos` e só desce quando alguém olha.
   O aparelho que tirou continua com ela inteira, offline, como sempre. */
const BALDE = "fotos";
function caminhoFoto(expId, fotoId, tipo){
  return "/storage/v1/object/"+BALDE+"/"+expId+"/"+fotoId+(tipo==="t"?"-t":"")+".jpg";
}
function dataUrlParaBlob(u){
  const [cab, b64] = String(u).split(",");
  const tipo = (cab.match(/:(.*?);/)||[])[1] || "image/jpeg";
  const bin = atob(b64);
  const n = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) n[i] = bin.charCodeAt(i);
  return new Blob([n], {type:tipo});
}
function blobParaDataUrl(b){
  return new Promise((ok,no)=>{
    const l = new FileReader();
    l.onload = ()=>ok(l.result); l.onerror = ()=>no(l.error);
    l.readAsDataURL(b);
  });
}
async function supaSubirFoto(expId, fotoId, tipo, dataUrl){
  const c = syncConfig(); if(!c) throw new Error("sem configuração");
  const b = dataUrlParaBlob(dataUrl);
  const r = await fetch(c.url + caminhoFoto(expId, fotoId, tipo), {
    method:"POST",
    headers:{apikey:c.chave, Authorization:"Bearer "+c.token,
             "Content-Type":"image/jpeg", "x-upsert":"true"},
    body: b
  });
  /* 409 = já existe lá. Não é erro: é a foto que subiu numa tentativa anterior
     e cujo recibo não chegou a ser gravado aqui. */
  if(!r.ok && r.status !== 409){
    const t = await r.text().catch(()=>"");
    const e = new Error(t || ("HTTP "+r.status)); e.status = r.status; throw e;
  }
  return true;
}
async function supaBaixarFoto(expId, fotoId, tipo){
  const c = syncConfig(); if(!c) return null;
  const r = await fetch(c.url + caminhoFoto(expId, fotoId, tipo), {
    headers:{apikey:c.chave, Authorization:"Bearer "+c.token}
  });
  if(!r.ok) return null;
  return blobParaDataUrl(await r.blob());
}

/* Traz a foto só quando alguém vai olhar, e guarda no aparelho para não baixar
   duas vezes. NÃO chama marcarSujo de propósito: receber uma foto não é editar
   o ensaio, e carimbar aqui faria este aparelho reenviar tudo sem motivo — e
   pior, ganhar de uma edição de verdade que outra pessoa tenha feito. */
const FOTOS_BAIXANDO = new Set();
async function garantirFoto(e, f, quero, adiarGravacao){
  const campo = (quero === "media") ? "media" : "thumb";
  if(f[campo]) return f[campo];
  if(!f.remota || !syncPronto() || !navigator.onLine) return null;
  const marca = f.id + "/" + campo;
  if(FOTOS_BAIXANDO.has(marca)) return null;
  FOTOS_BAIXANDO.add(marca);
  try{
    const u = await supaBaixarFoto(e.id, f.id, campo === "thumb" ? "t" : "");
    if(u){
      f[campo] = u;
      /* Num lote de miniaturas quem grava é o carregador, uma vez no fim:
         gravar o caderno inteiro a cada foto seriam dezenas de gravações
         completas para abrir um quadro. */
      if(!adiarGravacao) await gravarLocal(JSON.parse(JSON.stringify(ST)));
      return u;
    }
  }catch(err){ /* sem sinal: a foto continua lá em cima; tenta da próxima vez */ }
  finally{ FOTOS_BAIXANDO.delete(marca); }
  return null;
}
/* Depois de desenhar a tela, preenche as miniaturas que ainda não estão aqui.
   Uma de cada vez, para não abrir vinte conexões num sinal de lavoura. */
let FILA_FOTOS = false;
async function carregarMiniaturasPendentes(){
  if(FILA_FOTOS) return;
  const e = exp(); if(!e) return;
  const alvos = [...document.querySelectorAll("[data-foto-baixar]")];
  if(!alvos.length) return;
  FILA_FOTOS = true;
  let chegaram = 0;
  try{
    for(const el of alvos){
      const f = (e.fotos||[]).find(x=>x.id === el.getAttribute("data-foto-baixar"));
      if(!f) continue;
      const u = await garantirFoto(e, f, "thumb", true);   // grava só no fim
      if(u && el.parentNode){
        chegaram++;
        const img = document.createElement("img");
        img.src = u; img.loading = "lazy";
        img.alt = el.getAttribute("data-alt") || "Foto do ensaio";
        el.parentNode.replaceChild(img, el);
      }
    }
    if(chegaram) await gravarLocal(JSON.parse(JSON.stringify(ST)));
  } finally { FILA_FOTOS = false; }
}

/* Entra com o e-mail e a senha da equipe. O que fica guardado no aparelho é o
   token de acesso e o de renovação — nunca a senha. */
async function syncEntrar(url, chave, email, senha){
  const r = await fetch(url.replace(/\/+$/,"")+"/auth/v1/token?grant_type=password", {
    method:"POST", headers:{apikey:chave, "Content-Type":"application/json"},
    body: JSON.stringify({email, password:senha})
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "Não consegui entrar");
  ST.sync = {url:url.replace(/\/+$/,""), chave, email,
             token:j.access_token, refresh:j.refresh_token,
             expira: Date.now() + (j.expires_in||3600)*1000};
  return true;
}
async function syncRenovar(){
  const c = syncConfig();
  if(!c || !c.refresh) return false;
  const r = await fetch(c.url+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{apikey:c.chave, "Content-Type":"application/json"},
    body: JSON.stringify({refresh_token: c.refresh})
  });
  if(!r.ok) return false;
  const j = await r.json();
  c.token = j.access_token; c.refresh = j.refresh_token || c.refresh;
  c.expira = Date.now() + (j.expires_in||3600)*1000;
  return true;
}

let TIMER_SYNC = null;
/* 30 segundos, não 4. Sincronizar 4 s depois de cada tecla fazia dez aparelhos
   conversarem com o servidor o dia inteiro à toa — e cada conversa custa tráfego
   do plano. Gravar continua instantâneo e local; só o envio é que espera. */
function agendarSync(){
  if(!syncPronto() || !navigator.onLine) return;
  clearTimeout(TIMER_SYNC);
  TIMER_SYNC = setTimeout(()=>sincronizar(true), 30000);
}
window.addEventListener("online", ()=>{ atualizarStatus(); agendarSync(); });
window.addEventListener("offline", ()=>{ atualizarStatus(); });

/* A mesclagem é por ensaio, e não pelo caderno inteiro: dois técnicos podem
   passar o dia offline em ensaios diferentes que nada se perde. Dentro de um
   mesmo ensaio vale o carimbo mais recente — dois editando o MESMO ensaio ao
   mesmo tempo é o único caso em que uma das versões cede. */
/* A cópia do ensaio que vai para o banco, sem os bytes das imagens. O que fica
   é a ficha da foto — tratamento, quadro, ordem, etiqueta —, que é o que os
   outros precisam para montar a tela. A imagem em si vem do Storage, e só se
   alguém abrir. Um ensaio com 24 fotos sai de 408 KB para menos de 2 KB. */
function semFotos(e){
  const c = JSON.parse(JSON.stringify(e));
  (c.fotos||[]).forEach(f=>{ delete f.media; delete f.thumb; });
  return c;
}
async function sincronizar(silencioso){
  if(SYNC.rodando) return;
  if(!syncPronto()){ if(!silencioso) toast("Configure a sincronização primeiro"); return; }
  if(!navigator.onLine){ if(!silencioso) toast("Sem internet agora"); return; }
  SYNC.rodando = true; SYNC.erro = null; atualizarStatus();
  try{
    const c = syncConfig();
    if(c.expira && Date.now() > c.expira - 60000) await syncRenovar();

    const remotos = await supa("/rest/v1/experimentos?select=id,dados,atualizado,removido");
    const porId = {}; remotos.forEach(r=>{ porId[r.id] = r; });

    // 1. o que veio de fora e está mais novo entra no lugar do local
    let baixados = 0;
    remotos.forEach(r=>{
      const i = ST.experimentos.findIndex(x=>x.id===r.id);
      const localAtual = i>=0 ? (ST.experimentos[i].atualizado||"") : "";
      if(r.removido){
        if(i>=0 && (r.atualizado||"") > localAtual){ ST.experimentos.splice(i,1); baixados++; }
        return;
      }
      if(i<0){ ST.experimentos.push(r.dados); baixados++; }
      else if((r.atualizado||"") > localAtual){
        /* A versão de fora não traz os bytes das fotos — elas moram no Storage.
           Antes de trocar, guardo as imagens que ESTE aparelho já tem e devolvo
           depois. Sem isto, sincronizar apagaria as fotos de quem as tirou. */
        const guardadas = {};
        (ST.experimentos[i].fotos||[]).forEach(f=>{
          if(f.media || f.thumb) guardadas[f.id] = {media:f.media, thumb:f.thumb};
        });
        ST.experimentos[i] = r.dados;
        (ST.experimentos[i].fotos||[]).forEach(f=>{
          const g = guardadas[f.id];
          if(g){ if(g.media) f.media = g.media; if(g.thumb) f.thumb = g.thumb; }
        });
        baixados++;
      }
    });

    // 2. o que é local e está mais novo sobe
    const subir = ST.experimentos.filter(e=>{
      const r = porId[e.id];
      return !r || (e.atualizado||"") > (r.atualizado||"");
    });
    if(subir.length){
      /* As fotos vão primeiro, e por fora do documento. Só depois de a imagem
         estar guardada lá é que o ensaio a declara como `remota` — na ordem
         inversa, outro aparelho leria a referência de uma foto inexistente. */
      let enviadas = 0;
      for(const e of subir){
        for(const f of (e.fotos||[])){
          if(f.remota || !(f.media || f.thumb)) continue;
          try{
            if(f.thumb) await supaSubirFoto(e.id, f.id, "t", f.thumb);
            if(f.media) await supaSubirFoto(e.id, f.id, "",  f.media);
            f.remota = true; enviadas++;
          }catch(err){ /* esta foto tenta na próxima; o resto do ensaio segue */ }
        }
      }
      if(enviadas) SYNC.fotosEnviadas = (SYNC.fotosEnviadas||0) + enviadas;

      await supa("/rest/v1/experimentos", {
        method:"POST", headers:{Prefer:"resolution=merge-duplicates"},
        body: JSON.stringify(subir.map(e=>({
          id:e.id, dados:semFotos(e), atualizado:e.atualizado||new Date().toISOString()
        })))
      });
    }

    // 3. grupos e modelos de croqui: um documento só, carimbo mais recente vence
    const geraisR = await supa("/rest/v1/gerais?select=id,dados,atualizado&id=eq.equipe");
    const remotoG = geraisR[0];
    const meuG = ST.atualizadoGerais || "";
    if(remotoG && (remotoG.atualizado||"") > meuG){
      ST.grupos = remotoG.dados.grupos || ST.grupos;
      ST.modelos = remotoG.dados.modelos || ST.modelos;
      ST.atualizadoGerais = remotoG.atualizado;
    } else if(!remotoG || meuG > (remotoG.atualizado||"")){
      const agora = new Date().toISOString();
      await supa("/rest/v1/gerais", {
        method:"POST", headers:{Prefer:"resolution=merge-duplicates"},
        body: JSON.stringify([{id:"equipe", dados:{grupos:ST.grupos, modelos:ST.modelos}, atualizado:agora}])
      });
      ST.atualizadoGerais = agora;
    }

    migrar();
    SYNC.quando = new Date(); SYNC.erro = null;
    PERSIST.pendSync = false;
    await gravarLocal(JSON.parse(JSON.stringify(ST)));
    PERSIST.pendSync = undefined;
    render();
    if(!silencioso || baixados || subir.length){
      const fs = SYNC.fotosEnviadas || 0; SYNC.fotosEnviadas = 0;
      toast(baixados||subir.length
        ? "Sincronizado — "+subir.length+" enviado(s), "+baixados+" recebido(s)"
          + (fs ? " · "+fs+(fs===1?" foto":" fotos") : "")
        : "Tudo em dia");
    }
  }catch(err){
    SYNC.erro = (err && err.status === 401) ? "Sessão expirada — entre de novo"
              : (err && err.message) ? String(err.message).slice(0,120)
              : "Falha ao sincronizar";
    if(!silencioso) toast(SYNC.erro);
  }
  SYNC.rodando = false; atualizarStatus();
}

/* ============================ FOTOS ============================ */
const FOTO_MAX = 1280, FOTO_Q = 0.68, THUMB_MAX = 400, THUMB_Q = 0.55;
const FOTOS_POR_TRAT = 8;      // por tratamento, em cada quadro

/* A etiqueta impressa na própria imagem — é assim que a foto sai do app e entra
   numa apresentação sem precisar de legenda à parte. Ela é queimada na hora da
   exibição, nunca gravada por cima do arquivo: corrigir o nome do tratamento
   corrige junto a imagem, e nenhuma etiqueta se acumula sobre a anterior. */
async function imagemComEtiqueta(e, f){
  const img = new Image();
  /* Foto de outro aparelho: busca a versão grande antes de queimar a etiqueta.
     Queimar sobre a miniatura sairia borrado numa apresentação. */
  if(!f.media && f.remota) await garantirFoto(e, f, "media");
  img.src = f.media || f.thumb;
  if(!img.src) throw new Error("imagem");
  await new Promise((ok,err)=>{ img.onload = ok; img.onerror = ()=>err(new Error("imagem")); });
  const w = img.naturalWidth || FOTO_MAX, h = img.naturalHeight || Math.round(w*0.75);
  const texto = etiquetaTexto(e, f);
  const corpo = Math.max(14, Math.round(w/38));
  const pad = Math.round(corpo*0.85), alturaLinha = Math.round(corpo*1.4);
  /* Calibri é a fonte do Office, onde estas fotos vão parar. Carlito tem as
     mesmas métricas e cobre Linux; o resto da pilha é o que existe no celular. */
  const fonte = "600 "+corpo+"px Calibri, Carlito, 'Segoe UI', Roboto, sans-serif";

  // mede em uma tela descartável: definir width/height depois apagaria o contexto
  const regua = document.createElement("canvas").getContext("2d");
  regua.font = fonte;
  const linhas = [];
  if(texto){
    let atual = "";
    texto.split(" ").forEach(p=>{
      const t = atual ? atual+" "+p : p;
      if(atual && regua.measureText(t).width > w - 2*pad){ linhas.push(atual); atual = p; }
      else atual = t;
    });
    if(atual) linhas.push(atual);
  }
  const faixa = linhas.length ? linhas.length*alturaLinha + 2*pad : 0;

  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h + faixa;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#12160D"; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(img, 0, 0, w, h);
  if(linhas.length){
    cx.font = fonte; cx.textBaseline = "top"; cx.fillStyle = "#EFF1EA";
    linhas.forEach((t,i)=>{ cx.fillText(t, pad, h + pad + i*alturaLinha); });
  }
  return cv.toDataURL("image/jpeg", 0.86);
}
async function comprimir(file, maxDim, q){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const escala = Math.min(1, maxDim/Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*escala)), h = Math.max(1, Math.round(bmp.height*escala));
  const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
  const cx = cv.getContext("2d"); cx.drawImage(bmp,0,0,w,h); bmp.close && bmp.close();
  return cv.toDataURL("image/jpeg", q);
}

/* Levar a foto etiquetada para fora do app. O quadro em que o app roda bloqueia
   download iniciado pela página, então o caminho é o do próprio celular: a folha
   de compartilhamento, onde "Salvar imagem" grava na galeria. Onde ela não
   existir, sobra o toque longo na foto em tela cheia — que o navegador atende. */
async function salvarNoCelular(e, f){
  let url;
  try{ url = await imagemComEtiqueta(e, f); }
  catch(err){ toast("Não consegui montar a imagem"); return; }
  const base = (etiquetaTexto(e,f) || "foto-"+dataBr(f.data))
    .replace(/[^\w\sÀ-ÿ-]/g,"").replace(/\s+/g,"-").slice(0,60).toLowerCase();
  try{
    const blob = await (await fetch(url)).blob();
    const arq = new File([blob], (base||"foto")+".jpg", {type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq]});
      return;
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // fechou a folha; nada a dizer
  }
  if(!document.querySelector(".lightbox")) verFoto(e, f.id);
  toast("Segure a foto e escolha Salvar imagem");
}

    areaParcela:num(dados.areaParcela), vazao:dados.vazao||"",

function novaAvaliacao(e, dados){
  const av = {
    id:uid(), nome:dados.nome, data:dados.data||hoje(), tipo:dados.tipo||"",
    unidade:dados.unidade||"", dae:dados.dae||"", obs:"", dados:{}
  };
  e.avaliacoes.push(av); marcarSujo();
  TELA.aba="avaliacoes"; TELA.avId=av.id; render();
}
const DELINS = {
  DIC:   {nome:"DIC — inteiramente casualizado", curto:"DIC"},
  DBC:   {nome:"DBC — blocos casualizados",      curto:"DBC"},
  DQL:   {nome:"DQL — quadrado latino",          curto:"DQL"},
  SPLIT: {nome:"Parcelas subdivididas (em blocos)", curto:"Subdivididas"}
};
/* Croqui do quadrado latino: coluna de cada parcela, indexada igual à malha. */
function croquiDe(e, av){
  if(e.delineamento !== "DQL") return null;
  if(!av.croqui) return null;
  return e.tratamentos.map(t=>{
    const linha=[];
    for(let b=0;b<e.nRep;b++){
      const v = av.croqui[t.id+"|"+b];
      linha.push(v==null || v==="" ? null : Number(v));
    }
    return linha;
  });
}
function matrizDe(e, av){
  return e.tratamentos.map(t=>{
    const linha=[];
    for(let b=0;b<e.nRep;b++) linha.push(num(av.dados[t.id+"|"+b]));
    return linha;
  });
}

const app = document.getElementById("app");

function render(){
  const foco = document.activeElement;
  const chaveFoco = foco && foco.dataset ? foco.dataset.k : null;
  const selIni = foco && foco.selectionStart;
  let html = "";
  if(TELA.nome==="sync") html = telaSync();
  else if(TELA.nome==="home") html = telaHome();
  else{
    const e = exp();
    if(!e){ TELA={nome:"home",expId:null,aba:"protocolo",avId:null}; return render(); }

  }
  app.innerHTML = html;

function barraTopo(sub, voltar){
  const b = tamanhoEstimado(), lim = limiteBytes(), pc = Math.min(100, 100*b/lim);
  return '<div class="topo">'
    + (voltar ? '<button class="b b-ghost b-s" data-acao="home" aria-label="Voltar">&#8592;</button>' : '')
    /* Sem subtítulo na tela inicial: o que havia ali era um texto que eu tinha
       inventado, e trocá-lo por uma contagem só encheu linguiça. Dentro de um
       ensaio o subtítulo diz cultura, cultivar e local — aí ele informa. */
    + '<div class="topo-tit"><b>'+esc(voltar?sub.t:"Caderneta de Campo")+'</b>'
    + (voltar ? '<span>'+esc(sub.s)+'</span>' : '')+'</div>'
    + '<div class="salvo" title="'+(PERSIST.erro?esc(PERSIST.erro):"")+'">'+statusHtml()+'</div>'
    + (voltar ? '' : '<button class="b b-s b-ghost" data-acao="tela-sync" aria-label="Sincronização">'
        + '&#9881;</button>')
    + '</div>';
}
/* Duas informações diferentes, e a ordem importa: primeiro se o dado está seguro
   no aparelho (o que importa no campo), depois se já foi para a equipe. Estar
   sem internet não é erro — é o estado normal de quem está na lavoura. */
function statusHtml(){
  if(PERSIST.erro)     return '<span class="ponto err"></span>erro ao gravar';
  if(PERSIST.pend || PERSIST.salvando) return '<span class="ponto pend"></span>gravando';
  if(!syncConfig())    return '<span class="ponto ok"></span>no aparelho';
  if(!navigator.onLine) return '<span class="ponto"></span>offline · gravado';
  if(SYNC.rodando)     return '<span class="ponto pend"></span>sincronizando';
  if(SYNC.erro)        return '<span class="ponto err"></span>falha ao sincronizar';
  if(!syncPronto())    return '<span class="ponto pend"></span>entre na equipe';
  return '<span class="ponto ok"></span>sincronizado';
}
function atualizarStatus(){
  const el = app.querySelector(".salvo");
  if(el){ el.innerHTML = statusHtml(); el.title = PERSIST.erro || SYNC.erro || ""; }
}
